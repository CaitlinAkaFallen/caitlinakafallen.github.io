<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Workout Alert</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: transparent;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    justify-content: flex-start;
    padding: 40px;
    font-family: 'Inter', sans-serif;
  }

  #alert-card {
    display: flex;
    align-items: center;
    gap: 20px;
    background: rgba(10, 10, 10, 0.616);
    border: 2px solid rgba(255, 255, 255, 0.08);
    border-left: 4px solid #a855f7;
    border-radius: 16px;
    padding: 18px 28px 18px 20px;
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    max-width: 520px;
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
  }

  #alert-card.visible {
    opacity: 1;
    transform: translateY(0);
  }

  #alert-card.hiding {
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .avatar-wrap {
    position: relative;
    flex-shrink: 0;
  }

  .avatar-ring {
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: conic-gradient(#a855f7, #6366f1, #a855f7);
    animation: spin 3s linear infinite;
    z-index: 0;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  #avatar-img {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(10, 10, 10, 0.9);
    position: relative;
    z-index: 1;
    display: block;
    background: #1a1a2e;
  }

  .avatar-fallback {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, #a855f7, #6366f1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 700;
    color: #fff;
    border: 3px solid rgba(10, 10, 10, 0.9);
    position: relative;
    z-index: 1;
    letter-spacing: -1px;
  }

  .text-block {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .label-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .pill {
    background: rgba(168, 85, 247, 0.2);
    border: 1px solid rgba(168, 85, 247, 0.4);
    color: #c084fc;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .username {
    font-size: 13px;
    font-weight: 600;
    color: rgb(24, 248, 229);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .exercise-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }

  .exercise-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    line-height: 1;
    color: #ffffff;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .reps-badge {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    line-height: 1;
    color: #a855f7;
    white-space: nowrap;
  }

  .broadcaster-row {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.35);
  }

  .broadcaster-row span {
    color: rgba(208, 182, 250, 0.979);
    font-weight: 600;
  }

  .progress-bar {
    position: absolute;
    bottom: 0;
    left: 4px;
    right: 0;
    height: 2px;
    background: rgba(255,255,255,0.06);
    border-radius: 0 0 14px 0;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 100%;
    background: #55f7ef;
    transform-origin: left;
    transform: scaleX(1);
    transition: none;
  }

  .progress-fill.draining {
    transform: scaleX(0);
    transition: transform linear;
  }

  #alert-card { position: relative; }
</style>
</head>
<body>

<div id="alert-card">
  <div class="avatar-wrap">
    <div class="avatar-ring"></div>
    <img id="avatar-img" src="" alt="avatar" onerror="this.style.display='none'; document.getElementById('avatar-fallback').style.display='flex';" />
    <div class="avatar-fallback" id="avatar-fallback" style="display:none;"></div>
  </div>

  <div class="text-block">
    <div class="label-row">
      <span class="pill">Workout</span>
      <span class="username" id="username">@user</span>
    </div>
    <div class="exercise-row">
      <span class="exercise-name" id="exercise-name">Push Ups</span>
      <span class="reps-badge" id="reps-count">x10</span>
    </div>
    <div class="broadcaster-row">for <span id="broadcaster">broadcaster</span></div>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
</div>

<script>
  const params   = new URLSearchParams(window.location.search);
  const address  = params.get("address") || "localhost";
  const port     = params.get("port")    || "8080";
  const DISPLAY_MS = parseInt(params.get("duration") || "7000", 10);

  const card     = document.getElementById("alert-card");
  const avatarImg = document.getElementById("avatar-img");
  const avatarFallback = document.getElementById("avatar-fallback");
  const elUser   = document.getElementById("username");
  const elExer   = document.getElementById("exercise-name");
  const elReps   = document.getElementById("reps-count");
  const elBroad  = document.getElementById("broadcaster");
  const progress = document.getElementById("progress-fill");

  let hideTimer    = null;
  let drainTimeout = null;

  function connectWS() {
    const ws = new WebSocket(`ws://${address}:${port}/`);

    ws.onopen = () => {
      ws.send(JSON.stringify({
        request: "Subscribe",
        events: { general: ["Custom"] },
        id: "WorkoutAlert"
      }));
    };

    ws.onmessage = (event) => {
      try {
        const response = JSON.parse(event.data);
        const d = response.data || {};
        if (d.eventName === "workout_alert") {
          showAlert(d);
        }
      } catch (e) { console.error("WS parse error:", e); }
    };

    ws.onclose = () => setTimeout(connectWS, 3000);
    ws.onerror = (e) => { console.error("WS error:", e); ws.close(); };
  }

  function showAlert(data) {
    const user        = data.user              || "User";
    const exercise    = data.exercise          || "Exercise";
    const reps        = data.repetitions       || data.reps || "?";
    const broadcaster = data.broadcaster       || data.broadcastUser || "";
    const profileUrl  = data.targetUserProfileImageUrl || data.profileImageUrl || "";

    elUser.textContent  = "@" + user;
    elExer.textContent  = exercise.toUpperCase();
    elReps.textContent  = "x" + reps;
    elBroad.textContent = broadcaster ? "@" + broadcaster : "";

    avatarFallback.textContent = user.slice(0, 2).toUpperCase();
    if (profileUrl) {
      avatarImg.src = profileUrl;
      avatarImg.style.display = "block";
      avatarFallback.style.display = "none";
    } else {
      avatarImg.style.display = "none";
      avatarFallback.style.display = "flex";
    }

    clearTimeout(hideTimer);
    clearTimeout(drainTimeout);

    card.classList.remove("hiding");
    card.classList.add("visible");

    progress.classList.remove("draining");
    progress.style.transition = "none";
    progress.style.transform  = "scaleX(1)";

    drainTimeout = setTimeout(() => {
      progress.style.transition = `transform ${DISPLAY_MS}ms linear`;
      progress.style.transform  = "scaleX(0)";
    }, 50);

    hideTimer = setTimeout(hideAlert, DISPLAY_MS);
  }

  function hideAlert() {
    card.classList.remove("visible");
    card.classList.add("hiding");
    setTimeout(() => { card.classList.remove("hiding"); }, 600);
  }

  connectWS();
</script>
</body>
</html>
