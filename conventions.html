<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conventions| Caitlin's Creative Space</title>
  <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" rel="stylesheet">
  <style>
    /* =========================
   Variables
========================= */
:root {
  --bg: #07090d;
  --accent: #00e0d4;
  --accent-2: #00a8ff;
  --magenta: #be2edd;
  --amber: #F79F1F;
  --live: #2ed573;
  --danger: #ff4d5e;
  --text: #eef1f7;
  --muted: #97a0b5;
  --glass: rgba(255, 255, 255, 0.045);
  --glass-strong: rgba(255, 255, 255, 0.08);
  --glass-border: rgba(255, 255, 255, 0.09);
  --shadow: 0 24px 50px -18px rgba(0, 0, 0, 0.7);
  --ease: cubic-bezier(.22, .9, .3, 1);
  --fa: "Font Awesome 7 Free", "Font Awesome 6 Free", sans-serif;
}

/* Reset */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

/* =========================
   Global Styles
========================= */
body {
  font-family: "Inter", system-ui, Arial, sans-serif;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Ambient glow behind everything */
body::before {
  content: "";
  position: fixed;
  inset: -20%;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(40% 35% at 85% 8%, rgba(0, 224, 212, 0.20), transparent 70%),
    radial-gradient(38% 40% at 8% 45%, rgba(190, 46, 221, 0.16), transparent 70%),
    radial-gradient(34% 32% at 70% 95%, rgba(247, 159, 31, 0.10), transparent 70%);
  animation: ambient 40s ease-in-out infinite alternate;
}

@keyframes ambient {
  to { transform: translate(-3%, 4%) scale(1.08); }
}

h1, h2, .next-name, .event-name, .countdown b {
  font-family: "Space Grotesk", "Inter", sans-serif;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

/* =========================
   Navigation Bar (floating pill)
========================= */
.horizontal-nav {
  position: fixed;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  max-width: calc(100vw - 20px);
  padding: 6px;
  background: rgba(12, 14, 20, 0.62);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  backdrop-filter: blur(22px) saturate(180%);
  border: 1px solid var(--glass-border);
  border-radius: 999px;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
  overflow-x: auto;
  scrollbar-width: none;
}

.horizontal-nav::-webkit-scrollbar { display: none; }

.nav-list {
  list-style: none;
  display: flex;
  gap: 2px;
}

.nav-list li { display: flex; }

.nav-list a {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 15px;
  border-radius: 999px;
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  color: var(--muted);
  white-space: nowrap;
  transition: color .25s, background .25s;
}

.nav-list a i {
  font-size: 15px;
  transition: color .25s;
}

.nav-list a:hover {
  color: #fff;
  background: var(--glass-strong);
}

.nav-list a:hover i { color: var(--accent); }

.nav-list a.active {
  color: #fff;
  background: linear-gradient(135deg, rgba(0, 224, 212, 0.25), rgba(0, 168, 255, 0.25));
  box-shadow: inset 0 0 0 1px rgba(0, 224, 212, 0.35);
}

.nav-list a.active i { color: var(--accent); }

.nav-list img {
  margin-right: 8px;
  width: 22px;
  height: 22px;
}

/* =========================
   Hero
========================= */
.main-content { margin-top: 0; }

.main-header {
  position: relative;
  padding: 150px 24px 70px;
  isolation: isolate;
}

.main-header::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background-image: var(--hero);
  background-size: cover;
  background-position: center;
  opacity: 0.32;
  -webkit-mask-image: linear-gradient(#000 35%, transparent);
  mask-image: linear-gradient(#000 35%, transparent);
}

.hero-grid {
  max-width: 1100px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1.15fr 1fr;
  gap: 40px;
  align-items: end;
}

.main-header h1 {
  font-size: clamp(2.6rem, 7vw, 5rem);
  font-weight: 700;
  line-height: 1.02;
  letter-spacing: -0.035em;
  color: #fff;
  max-width: 11ch;
  text-shadow: 0 4px 30px rgba(0, 0, 0, 0.55);
}

.main-header p {
  margin-top: 18px;
  font-size: 1.2rem;
  color: #d4dae8;
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
}

/* Next-up card with animated edge */
@property --angle { syntax: "<angle>"; initial-value: 0deg; inherits: false; }

.next-up {
  position: relative;
  padding: 26px 28px 28px;
  border-radius: 24px;
  background: rgba(14, 17, 24, 0.55);
  -webkit-backdrop-filter: blur(22px) saturate(150%);
  backdrop-filter: blur(22px) saturate(150%);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow);
  animation: rise .8s var(--ease) .1s backwards;
}

.next-up::after {
  content: "";
  position: absolute;
  inset: -1px;
  border-radius: inherit;
  padding: 1px;
  pointer-events: none;
  background: conic-gradient(from var(--angle), transparent 0 60%, var(--accent) 80%, var(--magenta) 92%, transparent);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  animation: spin 8s linear infinite;
}

@keyframes spin { to { --angle: 360deg; } }

.next-label {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 12px;
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--muted);
  text-shadow: none;
}

.next-up.live .next-label { color: var(--live); }

.next-up.live .next-label::before {
  content: "";
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--live);
  box-shadow: 0 0 0 0 rgba(46, 213, 115, 0.6);
  animation: pulse 1.8s infinite;
}

@keyframes pulse {
  70% { box-shadow: 0 0 0 10px rgba(46, 213, 115, 0); }
  100% { box-shadow: 0 0 0 0 rgba(46, 213, 115, 0); }
}

.next-name {
  font-size: clamp(1.5rem, 3.2vw, 2.1rem);
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.15;
}

.next-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
  margin: 10px 0 20px;
  font-size: 0.95rem;
  color: #c3cadb;
}

.next-meta span:empty { display: none; }

.next-meta #nextDate::before,
.next-meta #nextPlace::before {
  font-family: var(--fa);
  font-weight: 900;
  color: var(--accent);
  margin-right: 8px;
  font-size: 0.85em;
}

.next-meta #nextDate::before { content: "\f073"; }
.next-meta #nextPlace::before { content: "\f3c5"; }

.countdown {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.countdown div {
  padding: 14px 6px 12px;
  text-align: center;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
}

.countdown b {
  display: block;
  font-size: clamp(1.6rem, 3.4vw, 2.3rem);
  font-weight: 600;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.countdown span {
  display: block;
  margin-top: 8px;
  font-size: 0.78rem;
  color: var(--muted);
}

.next-up.no-date .countdown { display: none; }
.next-up.no-date .next-meta { margin-bottom: 0; }

/* =========================
   Convention Section
========================= */
.convention-content {
  width: 100%;
  max-width: 1000px;
  margin: 0 auto;
  padding: 30px 20px 90px;
}

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 8px 20px;
  margin-bottom: 34px;
  padding-left: 44px;
}

.convention-content h2 {
  font-size: clamp(1.6rem, 3vw, 2.1rem);
  font-weight: 600;
  letter-spacing: -0.02em;
  color: #fff;
}

.edit-hint {
  font-size: 0.85rem;
  color: var(--muted);
}

.edit-hint i { margin-right: 6px; color: var(--accent); }

/* =========================
   Convention Timeline + Cards
========================= */
.conventions-list {
  position: relative;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 22px;
}

/* the rail */
.conventions-list::before {
  content: "";
  position: absolute;
  left: 15px;
  top: 8px;
  bottom: 8px;
  width: 2px;
  border-radius: 2px;
  background: linear-gradient(180deg, var(--accent), var(--accent-2) 55%, rgba(190, 46, 221, 0.15));
  opacity: 0.55;
}

.conventions-list.is-empty::after {
  content: "No conventions listed yet. New dates will show up here.";
  margin-left: 44px;
  padding: 36px 24px;
  text-align: center;
  color: var(--muted);
  border: 1px dashed var(--glass-border);
  border-radius: 18px;
}

.conventions-list li {
  --c: var(--accent);
  --mx: -600px;
  --my: -600px;
  position: relative;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  margin-left: 44px;
  padding: 24px 66px 26px 28px;
  border-radius: 20px;
  background:
    radial-gradient(520px circle at var(--mx) var(--my), rgba(0, 224, 212, 0.11), transparent 45%),
    var(--glass);
  -webkit-backdrop-filter: blur(18px);
  backdrop-filter: blur(18px);
  border: 1px solid var(--glass-border);
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  transition: transform .35s var(--ease), border-color .3s, box-shadow .3s, opacity .22s;
  animation: rise .7s var(--ease) backwards;
}

.conventions-list li:nth-child(1) { animation-delay: .15s; }
.conventions-list li:nth-child(2) { animation-delay: .23s; }
.conventions-list li:nth-child(3) { animation-delay: .31s; }
.conventions-list li:nth-child(4) { animation-delay: .39s; }
.conventions-list li:nth-child(5) { animation-delay: .47s; }
.conventions-list li:nth-child(n+6) { animation-delay: .55s; }

@keyframes rise {
  from { opacity: 0; transform: translateY(22px); }
}

.conventions-list li:hover {
  transform: translateY(-3px);
  border-color: color-mix(in srgb, var(--c) 45%, transparent);
  box-shadow: 0 26px 50px -16px rgba(0, 0, 0, 0.75), 0 0 0 1px color-mix(in srgb, var(--c) 25%, transparent);
}

.conventions-list li.leaving {
  animation: none;
  opacity: 0;
  transform: translateX(26px) scale(0.98);
}

/* timeline node */
.conventions-list li::before {
  content: "";
  position: absolute;
  left: -36px;
  top: 30px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--bg);
  border: 3px solid var(--c);
  box-shadow: 0 0 14px color-mix(in srgb, var(--c) 70%, transparent);
}

/* status chip (text comes from data-countdown) */
.conventions-list li::after {
  content: attr(data-countdown);
  order: -1;
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--c);
  background: color-mix(in srgb, var(--c) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--c) 40%, transparent);
}

.conventions-list li:not([data-countdown])::after { display: none; }

.conventions-list li[data-status="soon"] { --c: var(--amber); }
.conventions-list li[data-status="now"] { --c: var(--live); }
.conventions-list li[data-status="tba"] { --c: #8f98b3; }

.conventions-list li[data-status="now"]::before { animation: nodePulse 1.8s infinite; }

@keyframes nodePulse {
  50% { box-shadow: 0 0 0 9px rgba(46, 213, 115, 0), 0 0 14px rgba(46, 213, 115, 0.9); }
}

/* =========================
   Event Fields
========================= */
.conventions-list li > span { min-width: 0; }

.event-name {
  order: 0;
  flex: 1 1 100%;
  font-size: clamp(1.35rem, 2.6vw, 1.7rem);
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.2;
  color: #fff;
}

.event-date,
.event-location {
  display: inline-block;
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 0.95rem;
  color: #d3d9e8;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--glass-border);
}

.event-date { order: 1; }
.event-location { order: 2; }

.event-date::before,
.event-location::before {
  font-family: var(--fa);
  font-weight: 900;
  font-size: 0.82em;
  margin-right: 9px;
  color: var(--c);
}

.event-date::before { content: "\f073"; }
.event-location::before { content: "\f3c5"; }

.event-description {
  order: 3;
  flex: 1 1 100%;
  margin-top: 2px;
  font-size: 1.02rem;
  line-height: 1.6;
  color: var(--muted);
  max-width: 62ch;
}

/* Editable affordances */
[contenteditable="true"] {
  cursor: text;
  transition: background .2s, box-shadow .2s;
}

[contenteditable="true"]:hover {
  background: rgba(255, 255, 255, 0.07);
}

[contenteditable="true"]:focus {
  outline: none;
  background: rgba(0, 224, 212, 0.1);
  box-shadow: 0 0 0 2px var(--accent);
  border-radius: 10px;
}

.event-name[contenteditable="true"]:focus,
.event-description[contenteditable="true"]:focus {
  padding: 2px 8px;
  margin: -2px -8px;
}

/* =========================
   Delete Button
========================= */
.delete-btn {
  position: absolute;
  top: 18px;
  right: 18px;
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  font-size: 0; /* hides the ❌ glyph */
  color: var(--muted);
  border-radius: 12px;
  cursor: pointer;
  opacity: 0.55;
  transition: opacity .25s, background .25s, color .25s, transform .25s var(--ease);
}

.delete-btn::before {
  content: "\f00d";
  font-family: var(--fa);
  font-weight: 900;
  font-size: 15px;
}

.conventions-list li:hover .delete-btn,
.delete-btn:focus-visible { opacity: 1; }

.delete-btn:hover {
  color: #fff;
  background: var(--danger);
  transform: rotate(90deg);
}

/* =========================
   Add Event Button
========================= */
.add-event-btn {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 34px 0 0 44px;
  width: calc(100% - 44px);
  padding: 18px 28px;
  font: 600 1rem "Inter", sans-serif;
  color: var(--accent);
  background: transparent;
  border: 1.5px dashed rgba(0, 224, 212, 0.4);
  border-radius: 20px;
  cursor: pointer;
  transition: background .3s, border-color .3s, color .3s, transform .3s var(--ease), box-shadow .3s;
}

.add-event-btn:hover {
  color: #031313;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-color: transparent;
  transform: translateY(-2px);
  box-shadow: 0 16px 36px -10px rgba(0, 224, 212, 0.55);
}

.add-event-btn:active { transform: translateY(0) scale(0.99); }

/* =========================
   Viewer mode
========================= */
body.viewer .conventions-list li { padding-right: 28px; }
body.viewer .section-head { margin-bottom: 28px; }

/* =========================
   Toasts
========================= */
#toasts {
  position: fixed;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%);
  z-index: 3000;
  display: grid;
  gap: 10px;
  justify-items: center;
}

.toast {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 14px 12px 18px;
  font-size: 0.92rem;
  background: rgba(16, 19, 27, 0.88);
  -webkit-backdrop-filter: blur(18px);
  backdrop-filter: blur(18px);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  box-shadow: 0 18px 44px rgba(0, 0, 0, 0.55);
  animation: toastIn .4s var(--ease);
}

.toast button {
  padding: 7px 14px;
  font: 600 0.85rem "Inter", sans-serif;
  color: #031313;
  background: var(--accent);
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: filter .2s;
}

.toast button:hover { filter: brightness(1.15); }
.toast.out { animation: toastOut .25s forwards; }

@keyframes toastIn { from { opacity: 0; transform: translateY(16px) scale(.96); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(10px); } }

/* =========================
   Mobile Responsive
========================= */
@media (max-width: 900px) {
  .hero-grid {
    grid-template-columns: 1fr;
    gap: 28px;
  }
  .main-header h1 { max-width: none; }
}

@media (max-width: 768px) {
  .main-header { padding: 120px 18px 50px; }
  .main-header p { font-size: 1.05rem; }

  .nav-list a:not(.active) span { display: none; }
  .nav-list a { padding: 10px 13px; }

  .section-head { padding-left: 30px; }
  .conventions-list::before { left: 7px; }
  .conventions-list li {
    margin-left: 30px;
    padding: 20px 56px 22px 20px;
  }
  .conventions-list li::before {
    left: -30px;
    top: 26px;
    width: 12px;
    height: 12px;
    border-width: 2px;
  }
  .conventions-list.is-empty::after { margin-left: 30px; }
  .add-event-btn { margin-left: 30px; width: calc(100% - 30px); }
  .delete-btn { top: 14px; right: 12px; opacity: 1; }
  body.viewer .conventions-list li { padding-right: 20px; }
}

@media (max-width: 420px) {
  .next-up { padding: 22px 18px; }
  .countdown { gap: 6px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
  </style>
</head>

  <main class="main-content">
