  <style>
/* ============================================================
   BASE STYLING & HORIZONTAL NAV (LEAVING ALONE AS REQUESTED)
   ============================================================ */

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: radial-gradient(circle at top, #1e1e1e 0%, #0f0f0f 100%);
  color: #fff;
  margin: 0;
  padding: 20px;
  text-align: center;
  line-height: 1.6;
}

.horizontal-nav {
  width: 100%;
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(12px);
  padding: 16px 0;
  display: flex;
  justify-content: center;
  align-items: center;
  position: fixed;
  top: 0;
  left: 0;
  z-index: 1000;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  overflow-x: auto;
  scrollbar-width: none;
}

.horizontal-nav::-webkit-scrollbar {
  display: none;
}

.nav-link {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 70px;
  height: 70px;
  margin: 0 10px;
  border-radius: 14px;
  color: #f0f0f0;
  font-size: 1.8rem;
  transition: color 0.3s ease, background-color 0.3s ease;
  text-decoration: none;
  position: relative;
}

.nav-link i { transition: color 0.3s ease; }

#live-indicator {
  display: none;
  margin-left: 6px;
  font-size: 0.75rem;
  font-weight: bold;
  color: #ff0000;
  text-shadow: 0 0 6px rgba(255, 0, 0, 0.8), 0 0 12px rgba(255, 0, 0, 0.6);
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0% { opacity: 1; text-shadow: 0 0 6px rgba(255,0,0,0.9); }
  50% { opacity: 0.5; text-shadow: 0 0 3px rgba(255,0,0,0.6); }
  100% { opacity: 1; text-shadow: 0 0 6px rgba(255,0,0,0.9); }
}

.twitch-link:hover { color: #9147ff; }
.youtube-link:hover { color: #cc0000; }
.stream-commands-link:hover { color: #00bfae; }

/* ============================================================
   HYPER-ADVANCED UI OVERHAUL (THE NEW LOOK)
   ============================================================ */

:root {
  --neon-red: #ff004c;
  --neon-purple: #9146ff;
  --glass: rgba(255, 255, 255, 0.03);
  --border: rgba(255, 255, 255, 0.08);
}

/* --- Cinema Header --- */
header {
  background: url("images/guitar.jpg") no-repeat center center / cover;
  height: 40vh;
  min-height: 300px;
  border-radius: 30px;
  margin: 100px auto 40px;
  max-width: 1400px;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
  border: 1px solid var(--border);
}

/* Dark Overlay with subtle noise */
header::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.8));
  backdrop-filter: blur(1px);
}

header h2 {
  z-index: 5;
  font-size: clamp(3rem, 10vw, 5.5rem);
  font-weight: 900;
  letter-spacing: -3px;
  text-transform: uppercase;
  background: linear-gradient(to right, #fff 20%, var(--neon-red), var(--neon-purple));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 20px rgba(255,0,0,0.3));
}

/* --- The Dashboard Container --- */
.stream-container {
  margin: 0 auto 30px;
  padding: 40px;
  width: 95%;
  max-width: 1350px;
  background: var(--glass);
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
  border-radius: 40px;
  border: 1px solid var(--border);
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.1), 0 30px 60px rgba(0,0,0,0.5);
}

.stream-header {
  margin-bottom: 25px;
}

.stream-header a {
  font-size: 2rem;
  font-weight: 800;
  color: white;
  text-decoration: none;
  letter-spacing: -1px;
  transition: all 0.4s ease;
}

.stream-header a i {
  color: var(--neon-red);
  margin-right: 10px;
  filter: drop-shadow(0 0 8px var(--neon-red));
}

.tagline {
  font-size: 1.1rem;
  color: #999;
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: 4px;
  margin-bottom: 40px;
}

/* --- Integrated Player/Chat Grid --- */
.youtube-stream-wrapper {
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 25px;
  width: 100%;
}

.youtube-player {
  width: 100%;
  aspect-ratio: 16 / 9;
  border-radius: 24px;
  border: 1px solid var(--border);
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  transition: transform 0.3s ease, border-color 0.3s ease;
}

.youtube-chat {
  width: 100%;
  height: 100%;
  border-radius: 24px;
  border: 1px solid var(--border);
  background: #000;
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}

.youtube-player:hover {
  transform: translateY(-5px);
  border-color: var(--neon-red);
}

/* --- Animated Glow Buttons --- */
.tab-buttons button {
  position: relative;
  background: #111;
  color: #fff;
  border: 1px solid var(--border);
  padding: 15px 40px;
  font-size: 1rem;
  font-weight: 700;
  border-radius: 15px;
  cursor: pointer;
  overflow: hidden;
  transition: 0.3s;
}

.tab-buttons button:hover {
  background: var(--neon-red);
  box-shadow: 0 0 30px rgba(255, 0, 76, 0.4);
  color: white;
  transform: translateY(-2px);
}

/* --- Responsive Polish --- */
@media (max-width: 1100px) {
  .youtube-stream-wrapper {
    grid-template-columns: 1fr;
  }
  
  .youtube-chat {
    height: 500px;
  }

  header {
    margin: 90px 15px 30px;
    height: 250px;
  }
}

/* Floating Animation for Header Text */
@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
  100% { transform: translateY(0px); }
}

header h2 {
  animation: float 4s ease-in-out infinite;
}

  </style>
</head>
<body>
