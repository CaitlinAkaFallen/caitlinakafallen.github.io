<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SW vs Pokemon Overlay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');

        :root {
            --sw-blue: #00f2ff;
            --sw-glow: rgba(0, 242, 255, 0.5);
            --panel-bg: rgba(0, 15, 20, 0.9);
        }

        body {
            margin: 0; padding: 0; overflow: hidden;
            background-color: transparent;
            font-family: 'Orbitron', sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
        }

        #alert-container {
            position: relative;
            display: flex; align-items: center;
            padding: 30px;
            background: var(--panel-bg);
            border: 2px solid var(--sw-blue);
            box-shadow: 0 0 20px var(--sw-glow), inset 0 0 15px var(--sw-glow);
            clip-path: polygon(0 0, 90% 0, 100% 20%, 100% 100%, 10% 100%, 0 80%);
            opacity: 0;
            transform: scale(0.8) rotateX(20deg);
            transition: all 0.5s cubic-bezier(0.17, 0.88, 0.32, 1.28);
        }

        #alert-container.show {
            opacity: 1; transform: scale(1) rotateX(0deg);
        }

        /* Avatar with "Targeting" ring */
        .avatar-wrap {
            position: relative;
            width: 120px; height: 120px;
            border: 2px solid var(--sw-blue);
            border-radius: 50%;
            padding: 5px;
        }

        #user-avatar {
            width: 100%; height: 100%;
            border-radius: 50%;
            background-size: cover;
        }

        .text-content {
            margin: 0 40px;
            color: white;
        }

        .scan-line {
            font-size: 12px; color: var(--sw-blue);
            letter-spacing: 2px; margin-bottom: 5px;
        }

        .user-name {
            font-size: 32px; font-weight: 900;
            text-transform: uppercase; text-shadow: 0 0 10px var(--sw-blue);
        }

        .choice-text {
            font-size: 24px; color: #fff;
            margin-top: 10px; border-top: 1px solid var(--sw-blue);
            padding-top: 5px;
        }

        /* The Character Image */
        #choice-img {
            width: 150px; height: 150px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px var(--sw-blue));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }
    </style>
</head>
<body>

<div id="alert-container">
    <div class="avatar-wrap">
        <div id="user-avatar"></div>
    </div>

    <div class="text-content">
        <div class="scan-line">SCANNING_BIO_SIGN...</div>
        <div id="username" class="user-name">USER</div>
        <div id="choice-name" class="choice-text">INITIATING...</div>
    </div>

    <img id="choice-img" src="" alt="">
</div>

<script>
    // Configuration: Images should be named Grogu.png, Pikachu.png, etc. in this folder
    const IMG_FOLDER = "images/"; 
    
    const container = document.getElementById('alert-container');
    const userAvatar = document.getElementById('user-avatar');
    const userName = document.getElementById('username');
    const choiceName = document.getElementById('choice-name');
    const choiceImg = document.getElementById('choice-img');

    const params = new URLSearchParams(window.location.search);
    const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);

    ws.onopen = () => {
        ws.send(JSON.stringify({ request: "Subscribe", events: { general: ["Custom"] }, id: "CosplayRoll" }));
    };

    ws.onmessage = (event) => {
        const response = JSON.parse(event.data);
        const d = response.data || response;

        if (d.eventName === "CosplayRoll") {
            userName.innerText = d.user;
            choiceName.innerText = d.choice;
            userAvatar.style.backgroundImage = `url('${d.avatar}')`;
            
            // Set image source (e.g., images/Grogu.png)
            choiceImg.src = `${IMG_FOLDER}${d.choice.toLowerCase()}.png`;

            // Show Alert
            container.classList.add('show');

            // Hide after 7 seconds
            setTimeout(() => {
                container.classList.remove('show');
            }, 7000);
        }
    };
</script>
</body>
</html>
