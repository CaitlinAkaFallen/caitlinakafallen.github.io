<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lo-Fi Synthwave Followage</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700;1,900&family=DM+Sans:ital,opsz,wght@0,9..40,300;1,9..40,300&display=swap');

        :root {
            --g1: #f472b6;
            --g2: #a78bfa;
            --g3: #7dd4cf;
            --glow1: rgba(244, 114, 182, 0.35);
            --glow2: rgba(167, 139, 250, 0.20);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            margin: 0;
            padding: 100px;
            background-color: transparent;
            font-family: 'DM Sans', sans-serif;
            overflow: hidden;
        }

        /* ── Wrapper ── */
        #alert-wrapper {
            display: inline-flex;
            align-items: center;
            position: relative;
            opacity: 0;
            transform: translateX(-50px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        #alert-wrapper.show {
            opacity: 1;
            transform: translateX(0);
        }

        /* ── Avatar ── */
        .avatar-wrapper {
            position: relative;
            z-index: 10;
            margin-right: -30px;
            perspective: 1000px;
        }

        /* Spinning gradient ring */
        .av-ring {
            position: relative;
            width: 90px;
            height: 90px;
        }
        .av-ring::before {
            content: '';
            position: absolute;
            inset: -2.5px;
            border-radius: 50%;
            background: conic-gradient(var(--g1), var(--g2), var(--g3), var(--g1));
            animation: spin 4s linear infinite;
            z-index: -1;
        }
        .av-ring::after {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            box-shadow:
                0 0 20px var(--glow1),
                0 0 44px var(--glow2);
            pointer-events: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .subber-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            background-color: #2a1040;
            display: block;
            position: relative;
            z-index: 1;
            transform: scale(0) rotate(-180deg);
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #alert-wrapper.show .subber-avatar {
            transform: scale(1) rotate(0deg);
        }

        /* ── Pill ── */
        #pill-container {
            display: flex;
            align-items: center;
            background: rgba(14, 7, 26, 0.84);
            -webkit-backdrop-filter: blur(28px) saturate(170%);
            backdrop-filter: blur(28px) saturate(170%);
            border-radius: 50px;
            box-shadow:
                0 0 0 1.5px rgba(244, 114, 182, 0.45),
                0 0 20px rgba(244, 114, 182, 0.18),
                0 0 44px rgba(167, 139, 250, 0.12),
                0 14px 44px rgba(0, 0, 0, 0.65);
            width: 0;
            height: 90px;
            padding: 0;
            overflow: hidden;
            transition:
                width 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                padding 0.3s ease,
                box-shadow 0.5s ease;
            position: relative;
        }

        /* Colour bloom inside pill */
        #pill-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 15% 50%, rgba(244, 114, 182, 0.10) 0%, transparent 62%);
            pointer-events: none;
            z-index: 0;
        }

        /* Shimmer sweep on expand */
        #pill-container::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50px;
            background: linear-gradient(
                105deg,
                transparent 35%,
                rgba(255, 255, 255, 0.045) 50%,
                transparent 65%
            );
            background-size: 200% 100%;
            pointer-events: none;
            z-index: 1;
        }
        #alert-wrapper.expanded #pill-container::after {
            animation: shimmerMove 2s ease-in-out 0.5s forwards;
        }
        @keyframes shimmerMove {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        #alert-wrapper.expanded #pill-container {
            width: 500px;
            padding: 0 30px 0 50px;
            box-shadow:
                0 0 0 1.5px rgba(167, 139, 250, 0.55),
                0 0 24px rgba(167, 139, 250, 0.22),
                0 0 52px rgba(244, 114, 182, 0.10),
                0 14px 44px rgba(0, 0, 0, 0.65);
        }

        /* ── Content ── */
        .content-inner {
            display: flex;
            align-items: center;
            width: 100%;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s ease 0.4s, transform 0.4s ease 0.4s;
            position: relative;
            z-index: 2;
        }
        #alert-wrapper.expanded .content-inner {
            opacity: 1;
            transform: translateY(0);
        }

        .text-group {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            gap: 3px;
        }

        .username {
            font-family: 'Playfair Display', serif;
            font-size: 1.35rem;
            font-weight: 900;
            font-style: italic;
            background: linear-gradient(90deg, var(--g1), var(--g2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
        }

        .message {
            font-family: 'DM Sans', sans-serif;
            font-size: 0.82rem;
            font-weight: 300;
            font-style: italic;
            color: rgba(60, 255, 229, 0.993);
        }
        
        /* ── Stat shard ── */
        .stat-shard {
            margin-left: 20px;
            padding-left: 20px;
            border-left: 1.5px solid rgba(167, 139, 250, 0.45);
            min-width: 100px;
        }
        #badge-value {
            display: block;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-style: italic;
            font-size: 1.15rem;
            background: linear-gradient(90deg, var(--g2), var(--g3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #badge-label {
            display: block;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.6rem;
            letter-spacing: 0.16em;
            color: rgba(255, 255, 255, 0.35);
            text-transform: uppercase;
            font-style: italic;
            margin-top: 2px;
        }

        /* ── Floating particles ── */
        .dot {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--g2);
            opacity: 0;
            pointer-events: none;
            z-index: 3;
        }
        #alert-wrapper.expanded .dot {
            animation: floatUp 2.4s ease-out forwards;
        }
        .dot:nth-child(1) { left: 18%; animation-delay: 0.2s; }
        .dot:nth-child(2) { left: 46%; animation-delay: 0.45s; }
        .dot:nth-child(3) { left: 72%; animation-delay: 0.3s; }
        @keyframes floatUp {
            0%   { opacity: 0; bottom: 0; transform: scale(0); }
            25%  { opacity: 0.75; transform: scale(1); }
            100% { opacity: 0; bottom: 82px; transform: scale(0.4); }
        }

        /* ── Roll out ── */
        .roll-out {
            animation: rollOutLeft 2.5s cubic-bezier(0.45, 0, 0.55, 1) forwards !important;
        }
        .roll-out .subber-avatar {
            animation: avatarSpinLeft 2.5s cubic-bezier(0.45, 0, 0.55, 1) forwards !important;
        }
        @keyframes rollOutLeft {
            0%   { transform: translateX(0);   opacity: 1; }
            20%  { transform: translateX(10px); opacity: 1; }
            100% { transform: translateX(-100vw); opacity: 0; }
        }
        @keyframes avatarSpinLeft {
            0%   { transform: rotate(0deg)   scale(1);   }
            20%  { transform: rotate(20deg)  scale(1.1); }
            100% { transform: rotate(-1080deg) scale(0.5); }
        }
    </style>
</head>
<body>

<div id="alert-wrapper">
    <div class="avatar-wrapper">
        <div class="av-ring">
            <div class="subber-avatar" id="avatar"></div>
        </div>
    </div>

    <div id="pill-container">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="content-inner">
            <div class="text-group">
                <div class="username" id="username"></div>
                <div id="display-message" class="message">Joined the journey!</div>
            </div>
            <div class="stat-shard">
                <span id="badge-value">1 YEAR</span>
                <span id="badge-label">Following</span>
            </div>
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);
    let hideTimer;

    ws.onopen = () => {
        ws.send(JSON.stringify({
            request: "Subscribe",
            events: { general: ["Custom"] },
            id: "Followage"
        }));
    };

    ws.onmessage = (event) => {
        const response = JSON.parse(event.data);
        if (response.data && response.data.eventName === "followage_alert") {
            updateUI(response.data);
        }
    };

    function updateUI(data) {
        const wrapper    = document.getElementById('alert-wrapper');
        const avatarElem = document.getElementById('avatar');

        // Populate content
        document.getElementById('username').innerText        = data.user    || "A Brave Soul";
        document.getElementById('display-message').innerText = data.message || "Has joined the community!";
        document.getElementById('badge-value').innerText     = data.badge   || "NEW";
        document.getElementById('badge-label').innerText     = data.label   || "Follower";

        if (data.avatar) {
            avatarElem.style.backgroundImage = `url('${data.avatar}')`;
        }

        // Reset particles
        document.querySelectorAll('.dot').forEach(d => {
            d.style.animation = 'none';
            void d.offsetWidth;
            d.style.animation = '';
        });

        // 1. Show wrapper & avatar roll-in
        clearTimeout(hideTimer);
        wrapper.classList.remove('show', 'expanded', 'roll-out');
        void wrapper.offsetWidth;
        wrapper.classList.add('show');

        // 2. Expand pill after avatar lands
        setTimeout(() => wrapper.classList.add('expanded'), 500);

        // 3. Stay for 15s then roll out
        hideTimer = setTimeout(() => {
            wrapper.classList.remove('expanded');
            setTimeout(() => wrapper.classList.add('roll-out'), 600);
            setTimeout(() => wrapper.classList.remove('show', 'roll-out'), 3200);
        }, 15000);
    }
</script>
</body>
</html>
