<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitch Viking Followage</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600&display=swap');

        body { margin: 0; padding: 40px; background-color: transparent; font-family: 'Inter', sans-serif; overflow: hidden; }

        #pill-container {
            display: inline-flex; align-items: center; position: relative;
            background: radial-gradient(circle at center, rgba(20, 55, 65, 0.98) 0%, rgba(10, 25, 30, 1) 100%);
            -webkit-backdrop-filter: blur(15px); backdrop-filter: blur(15px);
            padding: 15px 45px; clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%);
            color: white; border-left: 5px solid #00f2ff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 242, 255, 0.2);
            opacity: 0; transform: skewX(-10deg) translateX(-50px); 
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            min-width: 450px;
        }

        #pill-container.show { opacity: 1; transform: skewX(-10deg) translateX(0); }

        .avatar-wrapper { margin-right: 20px; z-index: 2; }
        .subber-avatar {
            width: 70px; height: 70px; 
            clip-path: polygon(20% 0%, 100% 0%, 80% 100%, 0% 100%);
            background-size: cover; background-position: center;
            border: 2px solid #00f2ff; box-shadow: 0 0 10px rgba(0, 242, 255, 0.3);
            background-color: #111; /* Dark placeholder while loading */
        }

        .text-group { display: flex; flex-direction: column; transform: skewX(10deg); z-index: 2; }
        .subb-name { font-family: 'Cinzel', serif; font-size: 1.4rem; font-weight: 900; color: #fff; text-shadow: 0 0 8px rgba(0, 242, 255, 0.5); margin: 0; }
        .sub-message { font-size: 1rem; color: #a0c0c8; font-style: italic; margin-top: 2px; }

        .stat-shard { margin-left: 20px; padding: 8px 15px; background: rgba(0, 242, 255, 0.15); border: 1px solid rgba(0, 242, 255, 0.4); clip-path: polygon(15% 0%, 100% 0%, 85% 100%, 0% 100%); text-align: center; transform: skewX(10deg); z-index: 2; }
        #badge-value { display: block; font-family: 'Cinzel', serif; font-weight: 900; font-size: 1.2rem; color: #00f2ff; }
        #badge-label { display: block; font-size: 0.6rem; letter-spacing: 1px; color: #fff; opacity: 0.8; }

        .pulse { animation: valhalla-pulse 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes valhalla-pulse {
            0% { transform: skewX(-10deg) scale(1); filter: brightness(1); }
            50% { transform: skewX(-10deg) scale(1.05); filter: brightness(1.4); }
            100% { transform: skewX(-10deg) scale(1); filter: brightness(1); }
        }
    </style>
</head>
<body>

<div id="pill-container">
    <div class="avatar-wrapper">
        <div class="subber-avatar" id="avatar"></div>
    </div>
    <div class="text-group">
        <div class="subb-name" id="username">New Warrior!</div>
        <div id="display-message" class="sub-message">Checking the scrolls...</div>
    </div>
    <div class="stat-shard">
        <span id="badge-value">⚔️</span>
        <span id="badge-label">LOYAL</span>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);
    let hideTimer;

    ws.onopen = () => {
        // ID set to your OBS Source: Followage
        ws.send(JSON.stringify({ request: "Subscribe", events: { general: ["Custom"] }, id: "Followage" }));
    };

    ws.onmessage = (event) => {
        const response = JSON.parse(event.data);
        if (response.data && response.data.eventName === "followage_alert") {
            updateUI(response.data);
        }
    };

    function updateUI(data) {
        const pill = document.getElementById('pill-container');
        const avatarElem = document.getElementById('avatar');
        
        document.getElementById('username').innerText = data.user; 
        document.getElementById('display-message').innerText = data.message;
        document.getElementById('badge-value').innerText = data.badge || "⚔️";
        document.getElementById('badge-label').innerText = data.label || "LOYAL";
        
        if (data.avatar) {
            // Apply image exactly like your working Lurk code
            avatarElem.style.backgroundImage = `url('${data.avatar}')`;
        }

        clearTimeout(hideTimer);
        pill.classList.remove('show', 'pulse');
        void pill.offsetWidth; 
        pill.classList.add('show', 'pulse');

        hideTimer = setTimeout(() => {
            pill.classList.remove('show');
        }, 8000);
    }
</script>
</body>
</html>
