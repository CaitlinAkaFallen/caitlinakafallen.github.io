<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sleek Horizontal Stream Feed</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
/* Modern, minimal font stack */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Share+Tech+Mono&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

body {
    background: transparent;
    font-family: 'Inter', sans-serif;
    color: #fff;
    overflow: hidden;
    padding: 20px 60px; /* Extra horizontal padding for the floating elements */
}

/* THE HORIZONTAL TRACKER */
#event-feed {
    display: flex;
    flex-direction: row; 
    justify-content: flex-start;
    align-items: center;
    gap: 65px; /* Increased gap to keep cards from crowding the floating avatars */
    width: 100vw;
    height: 100px;
}

/* THE CARD CONTAINER - SLEEK GLASSMORPHISM */
.card {
    position: relative;
    display: flex;
    align-items: center;
    padding: 8px 16px 8px 15px; /* Minimal internal padding now that avatar is pushed out */
    height: 62px;
    min-width: 240px;
    max-width: 450px;
    flex-shrink: 0;
    
    background: linear-gradient(135deg, rgba(15, 15, 20, 0.65) 0%, rgba(5, 5, 10, 0.55) 100%);
    -webkit-backdrop-filter: blur(15px) saturate(150%);
    backdrop-filter: blur(15px) saturate(150%);
    
    border-radius: 4px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    
    animation: slideInRight 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* FLOATING AVATAR - PUSHED OUT WITH A GAP */
.avatar-wrap {
    position: absolute;
    /* This -45px value creates the visible gap between the circle and the card edge */
    left: -60px; 
    width: 54px;
    height: 54px;
    background: #000;
    border-radius: 50%;
    flex-shrink: 0;
    overflow: hidden;
    border: 2px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 0 15px rgba(0,0,0,0.8);
    z-index: 5;
}

.avatar-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: contrast(1.1) brightness(1.1);
}

/* THE EVENT COLOR BAR - BOTTOM GLOW */
.card::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 5%;
    right: 5%;
    height: 3px;
    border-radius: 3px 3px 0 0;
    filter: blur(1px);
}

/* EVENT COLOR RESPECT */
.card.chat::after     { background: #2c2fff; box-shadow: 0 0 10px #2c2fff; }
.card.sub::after      { background: #da70fa; box-shadow: 0 0 10px #da70fa; }
.card.giftsub::after  { background: #da70fa; box-shadow: 0 0 10px #da70fa; }
.card.raid::after     { background: #ff2222; box-shadow: 0 0 10px #ff2222; }
.card.bits::after     { background: #9b52fc; box-shadow: 0 0 10px #9b52fc; }
.card.points::after   { background: #dff756; box-shadow: 0 0 10px #dff756; }
.card.streak::after   { background: #2c2fff; box-shadow: 0 0 10px #2c2fff; }
.card.dono::after     { background: #00ff7f; box-shadow: 0 0 10px #00ff7f; }

/* USERNAME COLORS */
.card.chat .username     { color: #7a7cff; }
.card.sub .username      { color: #e59bff; }
.card.giftsub .username  { color: #e59bff; }
.card.raid .username     { color: #ff5e5e; }
.card.bits .username     { color: #b785ff; }
.card.points .username   { color: #e9f88c; }
.card.streak .username   { color: #7a7cff; }
.card.dono .username     { color: #5effad; }

/* TEXT CONTENT */
.content { 
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0; 
}

.top-row {
    display: flex;
    align-items: center;
    gap: 10px;
    white-space: nowrap;
}

.username {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: -0.2px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}

.event-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    opacity: 0.5;
    color: #fff;
}

.event-message {
    font-size: 0.9rem;
    color: #cecece;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* ANIMATIONS */
@keyframes slideInRight {
    0% { transform: translateX(40px); opacity: 0; filter: blur(5px); }
    100% { transform: translateX(0); opacity: 1; filter: blur(0); }
}

.removing {
    animation: slideOutLeft 0.5s ease forwards;
}

@keyframes slideOutLeft {
    to { transform: scale(0.9) translateX(-30px); opacity: 0; filter: blur(10px); }
}
</style>
</head>

<body>

<div id="event-feed"></div>

<script>
// 1. Connection Logic
const params = new URLSearchParams(window.location.search);
const host = params.get("address") || "localhost";
const port = params.get("port") || "8080";
const ws = new WebSocket(`ws://${host}:${port}/`);

// 2. Themes
const THEMES = {
    CHAT:           { label: "Neural Link", cssClass: "chat" },
    SUBSCRIPTION:   { label: "Viking Re-Sub", cssClass: "sub" },
    GIFT_SUB:       { label: "Clan Gift", cssClass: "giftsub" },
    RAID:           { label: "Raid Incoming", cssClass: "raid" },
    BITS:           { label: "Power Cells", cssClass: "bits" },
    CHANNEL_POINTS: { label: "Redeem", cssClass: "points" },
    WATCH_STREAK:   { label: "Loyalty Streak", cssClass: "streak" },
    DONATION:       { label: "Credits", cssClass: "dono" }
};

const MAX_CARDS = 4; // Keeps the feed from running off the screen

ws.onopen = () => {
    ws.send(JSON.stringify({
        request: "Subscribe",
        events: { general: ["Custom"] },
        id: "HorizontalFeed"
    }));
};

ws.onmessage = (event) => {
    let payload;
    try {
        const msg = JSON.parse(event.data);
        payload = typeof msg.data === "string" ? JSON.parse(msg.data) : msg.data || msg;
    } catch (e) { return; }

    if (payload?.eventName === "StreamEvent") {
        createCard(payload);
    }
};

function createCard(data) {
    const feed = document.getElementById("event-feed");
    if (!feed) return;

    const theme = THEMES[data.type] || THEMES["CHAT"];

    const card = document.createElement("div");
    card.className = `card ${theme.cssClass}`;

    card.innerHTML = `
        <div class="avatar-wrap">
            <img src="${data.avatar || 'https://via.placeholder.com/50'}">
        </div>
        <div class="content">
            <div class="top-row">
                <span class="username">${data.user}</span>
                <span class="event-label">${theme.label}</span>
            </div>
            ${data.message ? `<div class="event-message">${data.message}</div>` : `<div class="event-message">${data.value || ''}</div>`}
        </div>
    `;

    feed.appendChild(card);

    // Manage feed length
    if (feed.children.length > MAX_CARDS) {
        const oldest = feed.firstChild;
        oldest.classList.add("removing");
        oldest.addEventListener("animationend", () => oldest.remove());
    }

    // Auto-remove after 20 seconds
    setTimeout(() => {
        if (card.parentElement) {
            card.classList.add("removing");
            card.addEventListener("animationend", () => card.remove());
        }
    }, 20000);
}
</script>

</body>
</html>
