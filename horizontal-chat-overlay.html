<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horizontal Stream Feed v2.9</title>

<script src="https://unpkg.com/@streamerbot/client/dist/streamerbot-client.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');

* { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
}

body {
    background: transparent;
    font-family: 'Inter', sans-serif;
    color: #fff;
    overflow: hidden;
    padding: 80px 20px 20px 176px; 
}

#event-feed {
    display: flex;
    flex-direction: row; 
    justify-content: flex-start;
    align-items: flex-start; 
    gap: 150px; 
    width: 100vw;
    height: 300px;
}

.card {
    position: relative;
    display: flex;
    align-items: center;
    padding: 22px 20px 10px 20px; 
    min-height: 54px;   
    height: auto;       
    width: 320px;       
    max-width: 520px;
    flex-shrink: 0;
    
    background: rgba(29, 29, 29, 0.555); 
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border-radius: 12px; 
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
    
    animation: slideInRight 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    overflow: visible; 
    transition: background 0.3s ease;
}

.card.highlightMessage {
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.4);
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
}

.avatar-wrap {
    position: absolute;
    left: -65px; 
    top: 0; 
    width: 52px;
    height: 52px;
    background: rgba(0, 0, 0, 0.774);
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    z-index: 5;
}

.avatar-wrap img {
    width: 100%;
    height: 100%;
    border-radius: 50%; 
    object-fit: cover;
}

.timestamp {
    font-size: 0.6rem;
    color: rgba(255, 255, 255, 0.8);
    background: rgba(0, 0, 0, 0.4);
    padding: 2px 6px;
    border-radius: 4px;
    position: absolute;
    right: calc(100% + 20px);
    top: 26px; 
    transform: translateY(-50%);
    white-space: nowrap;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

/* Bottom Accent Bars */
.card::after { 
    content: ''; 
    position: absolute; 
    bottom: 0; 
    left: 15px; 
    right: 15px; 
    height: 2px; 
    border-radius: 2px; 
}

.card.chat::after      { background: #a970ff; box-shadow: 0 0 8px #a970ff; }
.card.sub::after       { background: #da70fa; box-shadow: 0 0 8px #da70fa; }
.card.giftsub::after   { background: #c92df8; box-shadow: 0 0 8px #c92df8; }
.card.raid::after      { background: #ff4a4a; box-shadow: 0 0 8px #ff4a4a; }
.card.bits::after      { background: #e248f7; box-shadow: 0 0 8px #e248f7; }
.card.points::after    { background: #dff756; box-shadow: 0 0 8px #dff756; }
.card.streak::after    { background: #4afde5; box-shadow: 0 0 8px #4afde5; }
.card.dono::after      { background: #00ff7f; box-shadow: 0 0 8px #00ff7f; }

.user-header {
    position: absolute;
    top: -28px;
    left: 5px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.username { 
    font-size: 1.1rem; 
    font-weight: 700; 
    text-transform: none; 
    letter-spacing: 0.5px;
}

/* Username Colors */
.card.chat .username     { color: #b08fff; text-shadow: 0 0 5px rgba(177, 146, 250, 0.9); }
.card.sub .username      { color: #c278ff; text-shadow: 0 0 5px rgba(194, 120, 255, 0.9); }
.card.giftsub .username  { color: #e59bff; text-shadow: 0 0 5px rgba(229, 155, 255, 0.9); }
.card.raid .username     { color: #ff5e5e; text-shadow: 0 0 5px rgba(255, 94, 94, 0.9); }
.card.bits .username     { color: #e248f7; text-shadow: 0 0 5px rgba(226, 72, 247, 0.9); }
.card.points .username   { color: #e9f88c; text-shadow: 0 0 5px rgba(233, 248, 140, 0.9); }
.card.streak .username   { color: #4afde5; text-shadow: 0 0 5px rgba(74, 253, 229, 0.9); }
.card.dono .username     { color: #5effad; text-shadow: 0 0 5px rgba(94, 255, 173, 0.9); }

.event-badges {
    display: flex;
    gap: 6px; 
    align-items: center;
    margin-left: 97px;
    flex-shrink: 0;
}

.event-badges img {
    height: 24px; 
    width: 24px;
    object-fit: contain;
}

.content { 
    flex: 1; 
    display: flex; 
    flex-direction: column; 
    justify-content: flex-start;
    min-width: 0;
}

.top-row { 
    display: flex; 
    align-items: center; 
    justify-content: flex-end; 
    width: 100%; 
    position: absolute;
    right: 12px;
    top: 8px;
}

.pronouns { 
    font-size: 0.65rem; 
    color: #ffeb77; 
    background: rgba(80, 80, 80, 0.3); 
    padding: 1px 6px; 
    border-radius: 4px; 
    font-weight: 700;
    border: 1px solid rgba(251, 255, 0, 0.2);
}

.event-label {
    font-size: 0.65rem;
    color: #ffeb77;
    font-weight: bold;
    text-transform: uppercase;
    margin-bottom: 2px;
}

.event-message { 
    font-size: 0.95rem; 
    color: rgb(56, 241, 241); 
    word-break: break-word; 
    white-space: normal;    
    line-height: 1.3;
}
.emoteWrapper {
    display: inline-block;
    vertical-align: middle;
    height: 1.4em;
    margin: 0 4px;
}
.emoteWrapper img { height: 110%; width: auto; }
@keyframes slideInRight {
    0% { transform: translateX(40px); opacity: 0; filter: blur(5px); }
    100% { transform: translateX(0); opacity: 1; filter: blur(0); }
}

.removing { animation: slideOutLeft 0.5s ease forwards; }
@keyframes slideOutLeft { to { transform: scale(0.9) translateX(-30px); opacity: 0; filter: blur(10px); } }
</style>
</head>
<body>
<div id="event-feed"></div>

<script>
const params = new URLSearchParams(window.location.search);
const host = params.get("address") || "127.0.0.1";
const port = params.get("port") || "8080";
const MAX_CARDS = 4;

const avatarCache = new Map();
const pronounCache = new Map();

const THEMES = {
    CHAT:           { label: "",               cssClass: "chat"    },
    SUBSCRIPTION:   { label: "Viking Re-Sub",  cssClass: "sub"     },
    GIFT_SUB:       { label: "Clan Gift",      cssClass: "giftsub" },
    RAID:           { label: "Raid Incoming",  cssClass: "raid"    },
    BITS:           { label: "Power Cells",    cssClass: "bits"    },
    CHANNEL_POINTS: { label: "Redeem",         cssClass: "points"  },
    WATCH_STREAK:   { label: "Loyalty Streak", cssClass: "streak"  },
    DONATION:       { label: "Credits",        cssClass: "dono"    },
};

async function getPronouns(username) {
    if (!username) return "";
    const key = username.toLowerCase();
    if (pronounCache.has(key)) return pronounCache.get(key);
    try {
        const res = await fetch(`https://pronouns.alejo.io/api/users/${key}`);
        const json = await res.json();
        if (json.length > 0) {
            const result = json[0].pronoun_id.replace("hehim", "he/him").replace("sheher", "she/her").replace("theythem", "they/them");
            pronounCache.set(key, result);
            return result;
        }
    } catch (_) {}
    return "";
}

async function getAvatar(username) {
    if (!username) return null;
    const key = username.toLowerCase();
    if (avatarCache.has(key)) return avatarCache.get(key);
    try {
        const res = await fetch(`https://decapi.me/twitch/avatar/${key}`);
        if (res.ok) {
            const url = await res.text();
            avatarCache.set(key, url);
            return url;
        }
    } catch (_) {}
    return `https://decapi.me/twitch/avatar/${key}`;
}

function insertEmotes(data) {
    if (!data.parts) return data.message?.message || data.message || "";
    let output = "";
    data.parts.forEach(part => {
        if (part.type === "text") output += part.text;
        else if (part.type === "emote") output += `<div class="emoteWrapper"><img src="${part.imageUrl}"></div>`;
    });
    return output;
}

const client = new StreamerbotClient({ host, port });

// 1. BITS
client.on('Twitch.Cheer', async ({ data }) => {
    const user = data.user_name;
    const [avatar, pronouns] = await Promise.all([getAvatar(user), getPronouns(user)]);
    createCard(data, "BITS", avatar, pronouns, `Flashing ${data.bits} bits!`);
});

// 2. DONATION
client.on('Streamlabs.Donation', async ({ data }) => {
    const user = data.name;
    const avatar = await getAvatar(user);
    createCard(data, "DONATION", avatar, "", `Credits Received: ${data.formattedAmount} - ${data.message || ''}`);
});

// 3. RAID
client.on('Twitch.Raid', async ({ data }) => {
    const user = data.from_broadcaster_user_name;
    const avatar = await getAvatar(user);
    const count = data.viewers || "a bunch of";
    createCard(data, "RAID", avatar, "", `Raid Incoming with the party of ${count}!`);
});

// 4. SUBS (Handling Sub, ReSub, and Gifts)
client.on('Twitch.Sub', async ({ data }) => {
    const user = data.user_name;
    const [avatar, pronouns] = await Promise.all([getAvatar(user), getPronouns(user)]);
    createCard(data, "SUBSCRIPTION", avatar, pronouns, `Joined the Clan!`);
});

client.on('Twitch.ReSub', async ({ data }) => {
    const user = data.user_name;
    const [avatar, pronouns] = await Promise.all([getAvatar(user), getPronouns(user)]);
    createCard(data, "SUBSCRIPTION", avatar, pronouns, `Returning for month #${data.cumulativeMonths}!`);
});

client.on('Twitch.GiftSub', async ({ data }) => {
    const user = data.user_name;
    const [avatar, pronouns] = await Promise.all([getAvatar(user), getPronouns(user)]);
    createCard(data, "GIFT_SUB", avatar, pronouns, `Gifted a sub to the community!`);
});

// OTHER EVENTS
client.on('Twitch.RewardRedemption', async ({ data }) => {
    const user = data.user_name;
    const [avatar, pronouns] = await Promise.all([getAvatar(user), getPronouns(user)]);
    createCard(data, "CHANNEL_POINTS", avatar, pronouns, `Spent ${data.reward.cost} on ${data.reward.title}`);
});

client.on('Twitch.WatchStreak', async ({ data }) => {
    const user = data.user_name;
    const [avatar, pronouns] = await Promise.all([getAvatar(user), getPronouns(user)]);
    createCard(data, "WATCH_STREAK", avatar, pronouns, `Returning for stream #${data.streak}!`);
});

client.on('Twitch.ChatMessage', async ({ data }) => {
    const user = data.message.username;
    const [avatar, pronouns] = await Promise.all([getAvatar(user), getPronouns(user)]);
    createCard(data, "CHAT", avatar, pronouns);
});

// This createCard function matches your working layout exactly
function createCard(data, eventKey, avatarUrl, pronouns = "", customMsg = "") {
    const feed = document.getElementById("event-feed");
    const theme = THEMES[eventKey] || THEMES.CHAT;
    const m = data.message || data;

    const card = document.createElement("div");
    card.className = `card ${theme.cssClass}`;

    const displayName = m.displayName || m.user_name || m.name || m.from_broadcaster_user_name || "User";
    const displayText = customMsg || insertEmotes(data);
    const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    
    const badgesHtml = (m.badges) ? m.badges.map(b => `<img src="${b.imageUrl}">`).join('') : '';

    card.innerHTML = `
        <div class="avatar-wrap">
            <span class="timestamp">${timeString}</span>
            <img src="${avatarUrl}" onerror="this.src='https://ui-avatars.com/api/?name=${displayName}'">
        </div>
        <div class="user-header">
            <span class="username">${displayName}</span>
            <div class="event-badges">${badgesHtml}</div>
        </div>
        <div class="content">
            <div class="top-row">
                ${pronouns ? `<span class="pronouns">${pronouns}</span>` : ""}
            </div>
            ${theme.label ? `<div class="event-label">${theme.label}</div>` : ""}
            <div class="event-message">${displayText}</div>
        </div>
    `;

    feed.appendChild(card);
    if (feed.children.length > MAX_CARDS) removeCard(feed.firstChild);
    setTimeout(() => removeCard(card), 20000);
}

function removeCard(el) {
    if (!el || el.classList.contains("removing")) return;
    el.classList.add("removing");
    el.addEventListener("animationend", () => el.remove());
}
</script>
</body>
</html>
