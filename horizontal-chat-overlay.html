<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sleek Horizontal Stream Feed</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
/* Modern, minimal font stack */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Share+Tech+Mono&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

/* Body Padding - 200px ensures the new badge doesn't hit the screen edge */
body {
    background: transparent;
    font-family: 'Inter', sans-serif;
    color: #fff;
    overflow: hidden;
    padding: 20px 20px 20px 220px; /* reduced just a little from 200px */
}

/* THE HORIZONTAL TRACKER */
#event-feed {
    display: flex;
    flex-direction: row; 
    justify-content: flex-start;
    align-items: center;
    gap: 130px; 
    width: 100vw;
    height: 100px;
}

/* THE CARD CONTAINER */
.card {
    position: relative;
    display: flex;
    align-items: center;
    padding: 8px 16px 8px 15px; 
    height: 62px;
    min-width: 240px;
    max-width: 520px;
    flex-shrink: 0;
    
    background: linear-gradient(135deg, rgba(15, 15, 20, 0.65) 0%, rgba(5, 5, 10, 0.55) 100%);
    -webkit-backdrop-filter: blur(15px) saturate(150%);
    backdrop-filter: blur(15px) saturate(150%);
    
    border-radius: 4px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    
    animation: slideInRight 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* FLOATING AVATAR (ANCHOR POINT) */
.avatar-wrap {
    position: absolute;
    left: -62px; /* half the avatar width so it overlaps the card edge */
    width: 54px;
    height: 54px;
    background: #000;
    border-radius: 50%;
    flex-shrink: 0;
    border: 2px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 0 15px rgba(0,0,0,0.8);
    z-index: 5;
    overflow: visible;
}

/* AVATAR IMAGE */
.avatar-wrap img {
    width: 100%;
    height: 100%;
    border-radius: 50%; 
    object-fit: cover;
    filter: contrast(1.1) brightness(1.1);
}

.timestamp {
    font-size: 0.65rem;
    font-weight: 400;
    color: rgb(246, 247, 242);
    background: rgba(14, 14, 14, 0.377);
    padding: 1px 5px;
    border-radius: 3px;
    display: inline-flex;
    align-items: center;
    line-height: 1;
    white-space: nowrap;
    flex-shrink: 0;

    /* moves it outside the card */
    position: absolute;
    right: calc(90% + 14px);
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;
}


/* BOTTOM GLOW BARS */
.card::after { 
    content: ''; 
    position: absolute; 
    bottom: 0; 
    left: 5%; 
    right: 5%; 
    height: 3px; 
    border-radius: 3px 3px 0 0; 
    filter: blur(1px); 
}

.card.chat::after      { background: #7945f3; box-shadow: 0 0 10px #7945f3; }
.card.sub::after       { background: #da70fa; box-shadow: 0 0 10px #da70fa; }
.card.giftsub::after   { background: #da70fa; box-shadow: 0 0 10px #da70fa; }
.card.raid::after      { background: #ff2222; box-shadow: 0 0 10px #ff2222; }
.card.bits::after      { background: #e248f7; box-shadow: 0 0 10px #e248f7; }
.card.points::after    { background: #dff756; box-shadow: 0 0 10px #dff756; }
.card.streak::after    { background: #4afde5; box-shadow: 0 0 10px #4afde5; }
.card.dono::after      { background: #00ff7f; box-shadow: 0 0 10px #00ff7f; }

/* USERNAME NEONS */
.card.chat .username     { color: #b08fff; text-shadow: 0 0 5px rgba(177, 146, 250, 0.9); }
.card.sub .username      { color: #c278ff; text-shadow: 0 0 5px rgba(194, 120, 255, 0.9); }
.card.giftsub .username  { color: #e59bff; text-shadow: 0 0 5px rgba(229, 155, 255, 0.9); }
.card.raid .username     { color: #ff5e5e; text-shadow: 0 0 5px rgba(255, 94, 94, 0.9); }
.card.bits .username     { color: #e248f7; text-shadow: 0 0 5px rgba(226, 72, 247, 0.9); }
.card.points .username   { color: #e9f88c; text-shadow: 0 0 5px rgba(233, 248, 140, 0.9); }
.card.streak .username   { color: #4afde5; text-shadow: 0 0 5px rgba(74, 253, 229, 0.9); }
.card.dono .username     { color: #5effad; text-shadow: 0 0 5px rgba(94, 255, 173, 0.9); }

/* PRONOUNS TAG */
.pronouns {
    font-size: 0.65rem;
    font-weight: 400;
    color: #faed7b;
    background: rgba(255, 255, 255, 0.08);
    padding: 1px 5px;
    border-radius: 3px;
    vertical-align: middle;
    text-transform: lowercase;
    flex-shrink: 0;
    margin-left: auto; 
}

.content { 
    flex: 1;
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    min-width: 0; 
}

.top-row { 
    display: flex; 
    align-items: center; 
    white-space: nowrap; 
    width: 100%; 
}

.username { 
    font-size: 1.1rem; 
    font-weight: 700; 
}

.event-message { 
    font-size: 0.9rem; 
    color: #cecece; 
    overflow: hidden; 
    text-overflow: ellipsis; 
    white-space: nowrap; 
}

/* ANIMATIONS */
@keyframes slideInRight {
    0% { transform: translateX(40px); opacity: 0; filter: blur(5px); }
    100% { transform: translateX(0); opacity: 1; filter: blur(0); }
}

.removing { animation: slideOutLeft 0.5s ease forwards; }

@keyframes slideOutLeft { to { transform: scale(0.9) translateX(-30px); opacity: 0; filter: blur(10px); } }

</style>
</head>
<body>

<div id="event-feed"></div>

<script>
    const params = new URLSearchParams(window.location.search);
    const host = params.get("address") || "localhost";
    const port = params.get("port") || "8080";
    const ws = new WebSocket(`ws://${host}:${port}/`);

    const THEMES = {
        CHAT:           { label: "", cssClass: "chat" },
        SUBSCRIPTION:   { label: "Viking Re-Sub", cssClass: "sub" },
        GIFT_SUB:       { label: "Clan Gift", cssClass: "giftsub" },
        RAID:           { label: "Raid Incoming", cssClass: "raid" },
        BITS:           { label: "Power Cells", cssClass: "bits" },
        CHANNEL_POINTS: { label: "Redeem", cssClass: "points" },
        WATCH_STREAK:   { label: "Loyalty Streak", cssClass: "streak" },
        DONATION:       { label: "Credits", cssClass: "dono" },
    };

    const MAX_CARDS = 4;

    // Cache pronouns to avoid spamming the API for the same user
    const pronounCache = new Map();

    async function getPronouns(username) {
        if (pronounCache.has(username)) return pronounCache.get(username);
        
        try {
            const response = await fetch(`https://pronouns.alejo.io/api/users/${username}`);
            if (!response.ok) return "";
            const data = await response.json();
            
            // Alejo API returns an array of objects, we need the display value
            if (data && data.length > 0) {
                const p = data[0].pronoun_id; // e.g., "hehim"
                // Simple mapping for common IDs if you want them to look cleaner
                const map = { "hehim": "he/him", "sheher": "she/her", "theythem": "they/them", "hethey": "he/they", "shethey": "she/they" };
                const finalPronoun = map[p] || p;
                pronounCache.set(username, finalPronoun);
                return finalPronoun;
            }
        } catch (e) { console.error("Pronoun error:", e); }
        return "";
    }

    ws.onopen = () => {
        ws.send(JSON.stringify({ request: "Subscribe", events: { general: ["Custom"] }, id: "HorizontalFeed" }));
    };

    ws.onmessage = async (event) => {
        let payload;
        try {
            const msg = JSON.parse(event.data);
            payload = typeof msg.data === "string" ? JSON.parse(msg.data) : msg.data || msg;
        } catch (e) { return; }

        if (payload?.eventName === "StreamEvent") {
            let pronouns = "";
            if (payload.type === "CHAT") {
                pronouns = await getPronouns(payload.user);
            }
            createCard(payload, pronouns);
        }
    };

    function createCard(data, pronouns) {
        const feed = document.getElementById("event-feed");
        const theme = THEMES[data.type] || THEMES["CHAT"];
        const card = document.createElement("div");
        card.className = `card ${theme.cssClass}`;

    const pronounTag = pronouns ? `<span class="pronouns">${pronouns}</span>` : "";
    const now = new Date();
    const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });

    card.innerHTML = `
        <div class="avatar-wrap">
            <span class="timestamp">${timeString}</span>
            <img src="${data.avatar || 'https://via.placeholder.com/50'}">
        </div>
        <div class="content">
            <div class="top-row">
                <span class="username">${data.user}</span>
                ${pronounTag} 
            </div>
            <div class="event-message">${data.message || data.value || ''}</div>
        </div>
    `;

    feed.appendChild(card);

    if (feed.children.length > MAX_CARDS) {
        const oldest = feed.firstChild;
        oldest.classList.add("removing");
        oldest.addEventListener("animationend", () => oldest.remove());
    }

    setTimeout(() => {
        if (card.parentElement) {
            card.classList.add("removing");
            card.addEventListener("animationend", () => card.remove());
        }
    }, 20000);
}
</script>
</body>
</html>
