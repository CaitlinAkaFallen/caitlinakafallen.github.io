<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worm Reveal Overlay</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
        
        :root {
            --worm-pink: #ff85c2;
            --worm-dark: #d15c99;
            --bg-color: rgba(40, 20, 10, 0.9);
            --text-color: #ffe6f2;
        }

        body {
            margin: 0; 
            padding: 0;
            background: transparent;
            overflow: hidden;
            display: flex; 
            align-items: flex-end; 
            justify-content: center;
            height: 100vh;
            font-family: 'Fredoka One', cursive;
            color: var(--text-color);
        }

        #worm-hud {
            display: flex; 
            align-items: center; 
            gap: 20px;
            background: var(--bg-color);
            padding: 20px 40px;
            border-radius: 50px;
            border: 4px solid var(--worm-pink);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            margin-bottom: 40px;
            
            /* Animation Entrance */
            opacity: 0; 
            transform: translateY(100px) scale(0.9); 
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #worm-hud.show { 
            opacity: 1; 
            transform: translateY(0) scale(1); 
        }

        .avatar-frame {
            width: 100px; 
            height: 100px;
            border-radius: 50%;
            border: 4px solid var(--text-color);
            overflow: hidden;
            background-color: #000;
            box-shadow: 0 0 15px var(--worm-pink);
            flex-shrink: 0; /* Prevents avatar from squishing */
        }

        .user-avatar {
            width: 100%; 
            height: 100%;
            background-size: cover; 
            background-position: center;
            background-repeat: no-repeat;
        }

        .readout-panel {
            display: flex; 
            flex-direction: column;
            min-width: 150px;
        }

        .username {
            font-size: 26px; 
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--worm-pink);
            text-shadow: 2px 2px 0px #000;
            white-space: nowrap;
        }

        .worm-percentage {
            font-size: 60px; 
            line-height: 1;
            text-shadow: 3px 3px 0px #000;
            display: flex; 
            align-items: baseline; 
            gap: 5px;
        }

        .unit { font-size: 30px; color: var(--worm-pink); }

        /* --- ANIMATED WORM --- */
        .animated-worm {
            display: flex;
            align-items: flex-end;
            margin-left: 15px;
        }

        .worm-segment {
            width: 35px; 
            height: 35px;
            background: var(--worm-pink);
            border-radius: 50%;
            margin-left: -10px;
            border: 2px solid var(--worm-dark);
            animation: squirm 0.8s infinite alternate ease-in-out;
        }

        .worm-segment:nth-child(1) { animation-delay: 0s; z-index: 1;}
        .worm-segment:nth-child(2) { animation-delay: 0.15s; z-index: 2;}
        .worm-segment:nth-child(3) { animation-delay: 0.3s; z-index: 3;}
        
        .worm-head {
            width: 55px; 
            height: 55px;
            background: var(--worm-pink);
            border-radius: 50%;
            margin-left: -10px;
            border: 2px solid var(--worm-dark);
            position: relative;
            z-index: 4;
            animation: squirm 0.8s infinite alternate ease-in-out;
            animation-delay: 0.45s;
        }

        .worm-eye {
            width: 8px; 
            height: 12px;
            background: #000;
            border-radius: 50%;
            position: absolute;
            top: 15px;
            animation: blink 3s infinite;
        }

        .eye-left { left: 14px; }
        .eye-right { right: 14px; }

        .worm-smile {
            width: 18px; 
            height: 10px;
            border-bottom: 3px solid #000;
            border-radius: 0 0 12px 12px;
            position: absolute;
            bottom: 12px; 
            left: 18px;
        }

        @keyframes squirm {
            0% { transform: translateY(0) scaleY(1); }
            100% { transform: translateY(-20px) scaleY(1.1); }
        }

        @keyframes blink {
            0%, 96%, 100% { transform: scaleY(1); }
            98% { transform: scaleY(0); }
        }
    </style>
</head>
<body>

<div id="worm-hud">
    <div class="avatar-frame">
        <div id="avatar-div" class="user-avatar"></div>
    </div>

    <div class="readout-panel">
        <div id="username" class="username">---</div>
        <div class="worm-percentage">
            <span id="worm-level">0</span><span class="unit">%</span>
        </div>
    </div>

    <div class="animated-worm">
        <div class="worm-segment"></div>
        <div class="worm-segment"></div>
        <div class="worm-segment"></div>
        <div class="worm-head">
            <div class="worm-eye eye-left"></div>
            <div class="worm-eye eye-right"></div>
            <div class="worm-smile"></div>
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const address = params.get("address") || "localhost";
    const port = params.get("port") || "8080";
    const ws = new WebSocket(`ws://${address}:${port}/`);
    let hideTimer = null;

    ws.onopen = () => {
        ws.send(JSON.stringify({
            request: "Subscribe",
            events: { general: ["Custom"] },
            id: "wormreveal" 
        }));
        console.log("Worm Overlay Connected!");
    };

    function animateValue(obj, start, end, duration) {
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            obj.innerHTML = Math.floor(progress * (end - start) + start);
            if (progress < 1) {
                window.requestAnimationFrame(step);
            }
        };
        window.requestAnimationFrame(step);
    }

    ws.onmessage = (event) => {
        const response = JSON.parse(event.data);
        const data = response.data;

        // Verify the event matches our ID
        if (data && data.eventName === "wormreveal") {
            const container = document.getElementById('worm-hud');
            const wormText = document.getElementById('worm-level');
            const pwr = parseInt(data.randomNumber);
            
            // Set User Info
            document.getElementById('username').innerText = data.user;
            
            // Handle Platform Avatars (Twitch, YT, or Kick)
            if (data.avatar) {
                document.getElementById('avatar-div').style.backgroundImage = `url('${data.avatar}')`;
            } else {
                document.getElementById('avatar-div').style.backgroundImage = `url('https://i.imgur.com/6omY69X.png')`;
            }

            if (hideTimer) clearTimeout(hideTimer);
            
            container.classList.remove('show'); 
            void container.offsetWidth; // Trigger reflow
            
            container.classList.add('show');
            animateValue(wormText, 0, pwr, 1200);

            hideTimer = setTimeout(() => {
                container.classList.remove('show');
            }, 8000);
        }
    };
</script>

</body>
</html>
