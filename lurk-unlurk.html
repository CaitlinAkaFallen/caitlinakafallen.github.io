<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek Glassmorphism Lurk and Unlurk Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;1,9..40,300&family=Syne:wght@800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-solid: #c8a2ff;
            --accent: rgba(200, 162, 255, 0.22);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: transparent;
            overflow: hidden;
            padding: 32px;
            font-family: 'DM Sans', sans-serif;
        }

        #alert-wrapper {
            display: inline-flex;
            opacity: 0;
            transform: translateY(20px) scale(0.96);
            transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                        transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
        }

        #alert-wrapper.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        #alert-wrapper.hide {
            opacity: 0;
            transform: translateY(-12px) scale(0.96);
        }

        #card {
            position: relative;
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 18px 28px 18px 18px;
            border-radius: 20px;
            background: rgba(20, 15, 30, 0.5);
            -webkit-backdrop-filter: blur(28px) saturate(160%);
            backdrop-filter: blur(28px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.5),
                0 1px 0 rgba(255, 255, 255, 0.05) inset;
            min-width: 320px;
            overflow: hidden;
        }

        #card::before {
            content: '';
            position: absolute;
            inset: -40px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            transition: background 0.4s ease;
        }

        .avatar-ring {
            position: relative;
            flex-shrink: 0;
            z-index: 1;
        }

        .avatar-ring::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            background: conic-gradient(
                var(--accent-solid),
                rgba(255,255,255,0.1),
                var(--accent-solid)
            );
            z-index: -1;
            animation: spin 4s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #avatar {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            background-color: rgba(255,255,255,0.05);
            display: block;
            position: relative;
        }

        .text-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
            z-index: 1;
            min-width: 0;
        }

        .label {
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--accent-solid);
            opacity: 0.95;
            transition: color 0.4s ease;
        }

           #username {
            font-family: 'Syne', sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            color: #6affff;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        #extra {
            font-size: 0.82rem;
            color: rgb(67, 249, 255);
            font-weight: 300;
            font-style: italic;
            max-width: 240px;
            min-height: 1em;
        }
        
        .accent-bar {
            position: absolute;
            left: 0; top: 20px; bottom: 20px;
            width: 3px;
            border-radius: 0 4px 4px 0;
            background: var(--accent-solid);
            box-shadow: 0 0 15px var(--accent-solid);
            transition: background 0.4s ease, box-shadow 0.4s ease;
        }

        .dot {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--accent-solid);
            opacity: 0;
        }

        #alert-wrapper.show .dot {
            animation: floatDot 2.8s ease-in-out forwards;
        }

        .dot:nth-child(1) { left: 20%; animation-delay: 0.1s; }
        .dot:nth-child(2) { left: 45%; animation-delay: 0.4s; }
        .dot:nth-child(3) { left: 70%; animation-delay: 0.2s; }

        @keyframes floatDot {
            0%   { opacity: 0; bottom: 0; transform: scale(0); }
            30%  { opacity: 0.8; transform: scale(1); }
            100% { opacity: 0; bottom: 70px; transform: scale(0.4); }
        }
    </style>
</head>
<body>

<div id="alert-wrapper">
    <div id="card">
        <div class="accent-bar"></div>
        <div class="particles">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div class="avatar-ring">
            <div id="avatar"></div>
        </div>

        <div class="text-group">
            <span class="label" id="status-label">HEADING TO THE SHADOWS...</span>
            <div id="username">FallenOneArt</div>
            <div id="extra"></div>
        </div>
    </div>
</div>

<script>
    // ─── THEME COLORS ────────────────────────────────────
    // Lurk   → light purple  #c8a2ff
    // Unlurk → soft cyan     #7de8c8
    // d.color from the WebSocket is intentionally ignored
    // ─────────────────────────────────────────────────────
    const LURK_THEME   = { solid: '#c8a2ff', bloom: 'rgba(200, 162, 255, 0.22)' };
    const UNLURK_THEME = { solid: '#7de8c8', bloom: 'rgba(125, 232, 200, 0.22)' };

    const params = new URLSearchParams(window.location.search);
    const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);
    let hideTimeout;

    ws.onopen = () => {
        ws.send(JSON.stringify({ request: "Subscribe", events: { general: ["Custom"] }, id: "LurkComboOverlay" }));
    };

    ws.onmessage = (event) => {
        const response = JSON.parse(event.data);
        if (response.data && response.data.eventName === "lurkCombo") {
            const d = response.data;
            const wrapper = document.getElementById('alert-wrapper');

            if (wrapper.classList.contains('show')) {
                wrapper.classList.remove('show');
                clearTimeout(hideTimeout);
                setTimeout(() => triggerAlert(d), 400);
            } else {
                triggerAlert(d);
            }
        }
    };

    function triggerAlert(d) {
        const wrapper = document.getElementById('alert-wrapper');
        const card    = document.getElementById('card');

        document.getElementById('username').innerText     = d.user   || 'FallenOneArt';
        document.getElementById('status-label').innerText = d.status || 'HEADING TO THE SHADOWS...';
        document.getElementById('extra').innerText        = d.input  ? `"${d.input}"` : '';
        document.getElementById('avatar').style.backgroundImage = d.avatar ? `url('${d.avatar}')` : '';

        // Pick theme based on status — d.color is ignored
        const statusLower = (d.status || '').toLowerCase();
        const isUnlurk = statusLower.includes('unlurk') ||
                         statusLower.includes('back')   ||
                         statusLower.includes('return');
        const theme = isUnlurk ? UNLURK_THEME : LURK_THEME;

        card.style.setProperty('--accent-solid', theme.solid);
        card.style.setProperty('--accent',       theme.bloom);

        wrapper.classList.remove('hide');
        wrapper.classList.add('show');

        hideTimeout = setTimeout(() => {
            wrapper.classList.remove('show');
            wrapper.classList.add('hide');
        }, 7000);
    }
</script>
</body>
</html>
