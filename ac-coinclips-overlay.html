<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Odyssey Coin Flip Duel</title>
    <style>
        /* Importing classical, epic Greek-style fonts */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Marcellus&display=swap');

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            padding: 40px;
            background: transparent;
            font-family: 'Marcellus', serif;
            overflow: hidden;
        }

        /* ═══════════════════════════════════════
        MAIN BANNER (STONE & GOLD)
        ═══════════════════════════════════════ */
        #pill-container {
            display: inline-flex;
            align-items: center;
            position: relative;
            background: linear-gradient(135deg, rgba(20, 15, 10, 0.95), rgba(40, 25, 15, 0.95));
            border: 2px solid #b8860b;
            border-radius: 6px;
            padding: 16px 24px;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.7),
                inset 0 0 20px rgba(184, 134, 11, 0.15),
                inset 0 1px 1px rgba(255, 215, 0, 0.4);
            min-width: 520px;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            color: #ffffff;
            position: relative;
        }

        /* Inner subtle border for that ornate ancient look */
        #pill-container::before {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 4px;
            pointer-events: none;
        }

        #pill-container.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* ═══════════════════════════════════════
        AVATARS (SPARTA VS ATHENS)
        ═══════════════════════════════════════ */
        .avatars-wrapper {
            margin-right: 25px;
            z-index: 2;
            flex-shrink: 0;
            position: relative;
            display: flex;
        }

        .user-avatar {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            background-color: #1a120b;
            border: 3px solid #b8860b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #d4af37;
            font-family: 'Cinzel', serif;
        }

        /* Spartan Red */
        .avatar-p1 {
            z-index: 3;
            border-color: #9b111e;
            box-shadow: 0 0 20px rgba(155, 17, 30, 0.6), inset 0 0 10px rgba(0,0,0,0.8);
        }

        /* Athenian Blue */
        .avatar-p2 {
            z-index: 2;
            margin-left: -24px; /* Overlap effect */
            border-color: #005b96;
            box-shadow: 0 0 20px rgba(0, 91, 150, 0.6), inset 0 0 10px rgba(0,0,0,0.8);
        }

        /* ═══════════════════════════════════════
        COIN (DRACHMAE)
        ═══════════════════════════════════════ */
        .coin-anchor {
            position: relative;
            z-index: 2;
            margin-right: 25px;
        }

        .coin-stage {
            perspective: 800px;
            width: 60px;
            height: 60px;
        }

        .coin {
            width: 60px;
            height: 60px;
            position: relative;
            transform-style: preserve-3d;
            border-radius: 50%;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.6);
        }

        .coin-face {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #3b2b11;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.3);
            border: 3px solid #ffd700;
        }

        .coin-heads {
            background: radial-gradient(circle, #e6c27a 0%, #a67c00 70%, #664d00 100%);
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.4);
        }

        .coin-tails {
            background: radial-gradient(circle, #e6c27a 0%, #a67c00 70%, #664d00 100%);
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.4);
            transform: rotateY(180deg);
        }

        @keyframes spinHeads {
            0%   { transform: rotateY(0deg); }
            100% { transform: rotateY(1800deg); }
        }
        @keyframes spinTails {
            0%   { transform: rotateY(0deg); }
            100% { transform: rotateY(1980deg); }
        }
        .coin.spin-heads { animation: spinHeads 2.2s cubic-bezier(0.25, 1, 0.3, 1) forwards; }
        .coin.spin-tails { animation: spinTails 2.2s cubic-bezier(0.25, 1, 0.3, 1) forwards; }

        /* ═══════════════════════════════════════
        TEXT GROUP
        ═══════════════════════════════════════ */
        .text-group {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            z-index: 2;
            min-width: 0;
            justify-content: center;
        }

        .flip-title {
            font-family: 'Cinzel', serif;
            font-size: 0.75rem;
            letter-spacing: 4px;
            color: #d4af37;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 6px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .user-name {
            font-size: 1.4rem;
            color: #f4ebd8;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        .vs-text {
            font-family: 'Cinzel', serif;
            color: #9b111e;
            font-size: 0.9em;
            margin: 0 6px;
            font-weight: 900;
            text-shadow: 0 0 8px rgba(155, 17, 30, 0.6);
        }

        .flip-message {
            font-size: 0.95rem;
            color: #a89f91;
            letter-spacing: 0.5px;
            margin-top: 4px;
            font-style: italic;
        }

        /* ═══════════════════════════════════════
        RESULT SHARD (STONE PLAQUE)
        ═══════════════════════════════════════ */
        .stat-shard {
            margin-left: 20px;
            padding: 12px 20px;
            background: rgba(10, 5, 0, 0.6);
            border: 1px solid #5a4624;
            border-radius: 4px;
            text-align: center;
            z-index: 2;
            flex-shrink: 0;
            min-width: 130px;
            transition: all 0.5s ease;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .stat-shard.win {
            background: linear-gradient(to bottom, rgba(212, 175, 55, 0.15), rgba(10, 5, 0, 0.8));
            border-color: #d4af37;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.25), inset 0 0 15px rgba(0,0,0,0.8);
        }

        #badge-value {
            font-family: 'Cinzel', serif;
            display: block;
            font-weight: 900;
            font-size: 1.1rem;
            color: #8c7b60;
            letter-spacing: 1px;
            transition: color 0.5s, text-shadow 0.5s;
        }

        .stat-shard.win #badge-value { 
            color: #ffd700; 
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6); 
        }

        #badge-label {
            font-family: 'Cinzel', serif;
            display: block;
            font-size: 0.6rem;
            letter-spacing: 2px;
            color: #a89f91;
            margin-top: 6px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* ═══════════════════════════════════════
        ANIMATIONS
        ═══════════════════════════════════════ */
        .pulse { animation: greek-pulse 0.8s cubic-bezier(0.16, 1, 0.3, 1); }

        @keyframes greek-pulse {
            0%   { transform: scale(1); filter: brightness(1) contrast(1); }
            50%  { transform: scale(1.02); filter: brightness(1.2) contrast(1.1); box-shadow: 0 20px 50px rgba(212, 175, 55, 0.2); }
            100% { transform: scale(1); filter: brightness(1) contrast(1); }
        }

        @keyframes avatarReveal {
            from { opacity: 0; transform: scale(0.8) rotate(-10deg); }
            to   { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        #pill-container.show .avatars-wrapper {
            animation: avatarReveal 0.6s 0.2s cubic-bezier(0.16,1,0.3,1) both;
        }

        @keyframes resultFlash {
            0%   { opacity: 0; transform: scale(0.8); }
            60%  { transform: scale(1.08); }
            100% { opacity: 1; transform: scale(1); }
        }
        .stat-shard.win {
            animation: resultFlash 0.5s cubic-bezier(0.16,1,0.3,1) both;
        }
    </style>
</head>
<body>

<div id="pill-container">

    <!-- Avatars -->
    <div class="avatars-wrapper">
        <div class="user-avatar avatar-p1" id="avatar1">?</div>
        <div class="user-avatar avatar-p2" id="avatar2">?</div>
    </div>

    <!-- Coin -->
    <div class="coin-anchor">
        <div class="coin-stage">
            <div class="coin" id="coin">
                <!-- Spartan sun / lambda stylized -->
                <div class="coin-face coin-heads">𖤍</div>
                <!-- Crossed swords for tails -->
                <div class="coin-face coin-tails">⚔️</div>
            </div>
        </div>
    </div>

    <!-- Text -->
    <div class="text-group">
        <div class="flip-title">Trial by Drachmae</div>
        <div class="user-name" id="username">Initiator <span class="vs-text">VS</span> Target</div>
        <div class="flip-message" id="display-message">The gods decide...</div>
    </div>

    <!-- Result -->
    <div class="stat-shard" id="shard">
        <span id="badge-value">↻</span>
        <span id="badge-label">Fate Pending</span>
    </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);

let hideTimer = null;

ws.onopen = () => {
    ws.send(JSON.stringify({
        request: "Subscribe",
        events: { general: ["Custom"] },
        id: "CoinFlipAlert"
    }));
};

ws.onmessage = (event) => {
    const response = JSON.parse(event.data);
    if (response.data && response.data.eventName === "coin_flip_duel") {
        updateUI(response.data);
    }
};

function updateUI(data) {
    const pill  = document.getElementById('pill-container');
    const coin  = document.getElementById('coin');
    const shard = document.getElementById('shard');
    const avatar1 = document.getElementById('avatar1');
    const avatar2 = document.getElementById('avatar2');

    // 1. Setup Avatars
    if (data.initiatorAvatar) {
        avatar1.style.backgroundImage = `url('${data.initiatorAvatar}')`;
        avatar1.innerText = '';
    }
    if (data.targetAvatar) {
        avatar2.style.backgroundImage = `url('${data.targetAvatar}')`;
        avatar2.innerText = '';
    }

    // 2. Text — pre-flip state
    document.getElementById('username').innerHTML = `${data.initiator} <span class="vs-text">VS</span> ${data.target}`;
    document.getElementById('display-message').innerText = `${data.initiator} called ${cap(data.initCall)}. The coin is thrown...`;
    
    document.getElementById('badge-value').innerText  = "↻";
    document.getElementById('badge-label').innerText  = "Fate Pending";
    shard.className = "stat-shard";

    // 3. Clear any existing hide timer
    if (hideTimer) clearTimeout(hideTimer);

    // 4. Slide banner in
    pill.classList.remove('show');
    void pill.offsetWidth;
    pill.classList.add('show');

    // 5. Spin coin
    coin.className = 'coin';
    void coin.offsetWidth;
    coin.classList.add(data.result === "heads" ? "spin-heads" : "spin-tails");

    // 6. Reveal result after spin finishes (approx 2.3s to match animation)
    setTimeout(() => {
        document.getElementById('badge-value').innerText  = data.winner;
        document.getElementById('badge-label').innerText  = `VICTOR (${data.result.toUpperCase()})`;
        
        document.getElementById('display-message').innerText = `The gods favor ${data.winner}!`;

        shard.className = "stat-shard win"; 

        pill.classList.remove('pulse');
        void pill.offsetWidth;
        pill.classList.add('pulse');
    }, 2300);

    // 7. Auto-hide after 10s
    hideTimer = setTimeout(() => {
        pill.classList.remove('show');
    }, 10000);
}

function cap(str) {
    if (!str) return '';
    return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
}
</script>
</body>
</html>
