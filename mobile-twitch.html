/* =========================

  ========================= */
function parseHashForToken() {
  if (!window.location.hash) return null;
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  return params.get("access_token");

function initNavbarTwitchLogin() {
  const loginBtn = document.getElementById("twitchLoginBtn");
  const avatarEl = document.getElementById("twitchAvatar");
  const nameEl = document.getElementById("twitchUsername");
  const userIcon = document.getElementById("twitchUserIcon");
  const dropdown = document.getElementById("twitchDropdown");
  const signOutBtn = document.getElementById("signOutBtn");

  // show saved session if present
  const saved = JSON.parse(localStorage.getItem("twitchUser"));

      avatarEl.style.backgroundImage = `url('${saved.avatar}')`;

    }
    nameEl.textContent = saved.username || nameEl.textContent;
    if (userIcon) userIcon.style.display = saved.avatar ? "none" : "inline-block";

  if (!loginBtn) return;
  loginBtn.addEventListener("click", (e) => {

      const url =
        "https://id.twitch.tv/oauth2/authorize" +
        "?response_type=token" +

  if (signOutBtn) {

/* =========================

  ========================= */
async function fetchTwitchUser(token) {
  try {
    const resp = await fetch("https://api.twitch.tv/helix/users", {
      headers: { "Client-ID": LOGIN_CLIENT_ID, "Authorization": "Bearer " + token }
    });
    const json = await resp.json();
    if (!json.data || !json.data.length) { console.warn("fetchTwitchUser: no user data"); return; }
    const user = json.data[0];
    const saveData = { username: user.display_name, avatar: user.profile_image_url, id: user.id, token: token };
    localStorage.setItem("twitchUser", JSON.stringify(saveData));
    localStorage.setItem("twitch_token", token);
    localStorage.setItem("twitch_user", JSON.stringify(user));

    const avatarEl = document.getElementById("twitchAvatar");
    const nameEl = document.getElementById("twitchUsername");
    const userIcon = document.getElementById("twitchUserIcon");
    if (avatarEl) { avatarEl.style.backgroundImage = `url('${saveData.avatar}')`; avatarEl.style.display = "inline-block"; }
    if (nameEl) nameEl.textContent = saveData.username;
    if (userIcon) userIcon.style.display = "none";

    await initFollowingList();
  } catch (err) {
    console.error("Login fetch error:", err);
    try { localStorage.removeItem("twitchUser"); } catch(e) {}
  }
}

/* =========================
  API helpers (fetch all pages)
  ========================= */
async function fetchAllFollowed(baseUrl, clientId, token) {
  let allData = [];
  let cursor = "";
  try {
    do {
      let fetchUrl = baseUrl + (baseUrl.includes("?") ? "&" : "?") + (cursor ? `after=${cursor}&` : "") + `t=${Date.now()}`;
      const response = await fetch(fetchUrl, { headers: { "Client-ID": clientId, "Authorization": `Bearer ${token}` } });
      const json = await response.json();
      if (json.data) allData = allData.concat(json.data);
      cursor = json.pagination?.cursor || null;
    } while (cursor);
  } catch (e) { console.error("Fetch Loop Error:", e); }
  return allData;
}

async function fetchUserAvatars(ids, clientId, token) {
  const uniqueIds = [...new Set(ids)].filter(id => !cachedAvatars[id]);
  if (uniqueIds.length === 0) return cachedAvatars;
  for (let i = 0; i < uniqueIds.length; i += 100) {
    const batch = uniqueIds.slice(i, i + 100);
    const url = `https://api.twitch.tv/helix/users?id=${batch.join('&id=')}`;
    const resp = await fetch(url, { headers: { "Client-ID": clientId, "Authorization": `Bearer ${token}` } });
    const json = await resp.json();
    if (json.data) json.data.forEach(user => { cachedAvatars[user.id] = user.profile_image_url; });
  }
  return cachedAvatars;
}

/* =========================
  Build followed & live lists
  ========================= */
async function initFollowingList() {
  try {
    const saved = JSON.parse(localStorage.getItem("twitchUser"));
    if (!saved || !saved.token) {
      renderFollowingListUI([]);
      renderLiveRecsUI([]);
      return;
    }
    const userToken = saved.token;
    let myId = saved.id;
    if (!myId) {
      const userResponse = await fetch("https://api.twitch.tv/helix/users", { headers: { "Client-ID": LOGIN_CLIENT_ID, "Authorization": "Bearer " + userToken } });
      if (!userResponse.ok) throw new Error("401 - Invalid token");
      const userData = await userResponse.json();
      if (!userData.data || !userData.data.length) throw new Error("Could not retrieve user info.");
      myId = userData.data[0].id;
      const newSave = { token: userToken, id: myId, username: userData.data[0].display_name, avatar: userData.data[0].profile_image_url };
      localStorage.setItem("twitchUser", JSON.stringify(newSave));
    }

    const [liveStreams, allFollows, topStreamsResp] = await Promise.all([
      fetchAllFollowed(`https://api.twitch.tv/helix/streams/followed?user_id=${myId}&first=100`, LOGIN_CLIENT_ID, userToken),
      fetchAllFollowed(`https://api.twitch.tv/helix/channels/followed?user_id=${myId}&first=100`, LOGIN_CLIENT_ID, userToken),
      fetch(`https://api.twitch.tv/helix/streams?first=50`, { headers: { "Client-ID": APP_CLIENT_ID, "Authorization": `Bearer ${APP_TOKEN}` } }).then(r => r.json())
    ]);

    const followedIds = new Set(allFollows.map(f => f.broadcaster_id));
    const liveMap = new Map(liveStreams.map(s => [s.user_id, s]));

    currentFollowedData = allFollows.map(follow => ({
      id: follow.broadcaster_id,
      display_name: follow.broadcaster_name,
      login: follow.broadcaster_login,
      avatar: "",
      live: liveMap.get(follow.broadcaster_id) || null
    })).sort((a, b) => {
      if (a.live && !b.live) return -1;
      if (!a.live && b.live) return 1;
      if (a.live && b.live) return b.live.viewer_count - a.live.viewer_count;
      return a.display_name.localeCompare(b.display_name);
    });

    currentLiveRecsData = (topStreamsResp?.data || []).filter(stream => !followedIds.has(stream.user_id) && stream.user_id !== myId).map(stream => ({
      id: stream.user_id,
      display_name: stream.user_name,
      login: stream.user_login,
      avatar: "",
      live: stream
    })).slice(0, 20);

    const allIdsToFetch = [...currentFollowedData.map(d => d.id), ...currentLiveRecsData.map(d => d.id)];
    await fetchUserAvatars(allIdsToFetch, LOGIN_CLIENT_ID, userToken);
    currentFollowedData.forEach(d => d.avatar = cachedAvatars[d.id] || "");
    currentLiveRecsData.forEach(d => d.avatar = cachedAvatars[d.id] || "");

    renderFollowingListUI(currentFollowedData);
    renderLiveRecsUI(currentLiveRecsData);

    const gameIds = [...new Set(liveStreams.map(s => s.game_id))].filter(id => id);
    if (gameIds.length > 0) await fetchLiveCategoryData(gameIds);

  } catch (err) {
    console.error("Sidebar Sync Error:", err);
    if (String(err).includes("401")) {
      localStorage.removeItem("twitchUser");
      alert("Session expired. Please log in again.");
    }
  }
}

function generateChannelHTML(item) {
  const isLive = !!item.live;
  const vCount = isLive ? (item.live.viewer_count >= 1000 ? (item.live.viewer_count/1000).toFixed(1)+"K" : item.live.viewer_count) : "";
  // include data-login for easier selection
  return `
    <div class="channel-item ${isLive ? 'is-live' : 'is-offline'}" data-login="${item.login}">
      <div class="avatar-container" onclick="switchStreamer('${item.login}', event)">
        <img src="${item.avatar || 'https://static-cdn.jtvnw.net/user-default-pictures-uv/ce577150-75ef-4ed3-b3d3-f6f4df39455d-profile_image-70x70.png'}" class="channel-avatar" onerror="this.src='https://static-cdn.jtvnw.net/user-default-pictures-uv/ce577150-75ef-4ed3-b3d3-f6f4df39455d-profile_image-70x70.png'">
        ${isLive ? `<div class="live-dot-mini">LIVE</div>` : ""}
      </div>
      <div class="channel-name" style="font-size:.72rem;max-width:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${item.display_name}</div>
    </div>
  `;
}

/* =========================
  SIDEBAR TOGGLE
  ========================= */
function initSidebarToggle(){
  const sidebar = document.getElementById("mainSidebar");
  const toggleBtn = document.getElementById("sidebarToggle");
  if(!sidebar || !toggleBtn) return;
  toggleBtn.addEventListener("click", () => {
    sidebar.classList.toggle("collapsed");
    toggleBtn.innerHTML = sidebar.classList.contains("collapsed") ? "❯" : "❮";
    document.documentElement.style.setProperty("--sidebar-width", sidebar.classList.contains("collapsed") ? "50px" : "240px");
    setTimeout(() => window.dispatchEvent(new Event("resize")), 200);
  });
}

/* =========================
  TWITCH PLAYER & CHAT (responsive, mobile safe)
  ========================= */
function initTwitchEmbeds() {

  try {

    twitchPlayer = new Twitch.Player("twitch-player", {
      width: "100%",
      height: "100%",
      channel: currentChannel,
      autoplay: true,
      muted: true,
      playsinline: true,
      parent: ["caitlinscreativespace.xyz"]
    });

    twitchPlayer.addEventListener(Twitch.Player.READY, () => {
      twitchPlayer.setMuted(true);
      twitchPlayer.play();
    });

  } catch (err) {
    console.warn("Player init failed:", err);
  }

  updateChat(currentChannel);
  checkLiveAndHeader();
  setInterval(checkLiveAndHeader, 30000);
}

/* update chat URL with darkpopout + theme + prevent mobile redirect */
function updateChat(channel) {
  const chat = document.getElementById("twitch-chat");
  if (!chat) return;
  const domain = window.location.hostname;
  chat.src = `https://www.twitch.tv/embed/${encodeURIComponent(channel)}/chat?parent=${encodeURIComponent(domain)}&darkpopout&theme=dark&no-mobile-redirect=true`;
}

/* switch streamer: change player + chat + active highlight */
function switchStreamer(channel, event) {
  event && event.stopPropagation();
  currentChannel = channel;
  if (twitchPlayer && typeof twitchPlayer.setChannel === "function") {
    try { twitchPlayer.setChannel(channel); } catch(e) { console.warn("setChannel error", e); }
  } else {
    // fallback: recreate player (rare)
    initTwitchEmbeds();
  }
  updateChat(channel);
  // highlight active item
  document.querySelectorAll('.channel-item').forEach(el => el.classList.toggle('active', el.dataset.login === channel));
}

/* =========================
  Live/header updates (viewer count, followers etc.)
  ========================= */
async function checkLiveAndHeader() {
  try {
    const clientId = APP_CLIENT_ID;
    const oauthToken = APP_TOKEN;
    const username = currentChannel;

    // user info
    const userResp = await fetch(`https://api.twitch.tv/helix/users?login=${encodeURIComponent(username)}`, {
      headers: { "Client-ID": clientId, "Authorization": `Bearer ${oauthToken}` }
    });
    const userData = await userResp.json();
    if (!userData.data || !userData.data.length) return;
    const user = userData.data[0];
    const userId = user.id;

    const bioTextEl = document.getElementById("bioText");
    if (bioTextEl && user.description) bioTextEl.textContent = user.description || "";

    const avatarImg = document.getElementById('streamAvatar');
    if (avatarImg && user.profile_image_url) avatarImg.src = user.profile_image_url;

    // follower count
    const followResp = await fetch(`https://api.twitch.tv/helix/channels/followers?broadcaster_id=${userId}`, {
      headers: { "Client-ID": clientId, "Authorization": `Bearer ${oauthToken}` }
    });
    const followData = await followResp.json();
    const followerCountEl = document.getElementById("followerCount");
    if (followerCountEl && followData.total !== undefined) followerCountEl.textContent = followData.total.toLocaleString();

    const channelResp = await fetch(`https://api.twitch.tv/helix/channels?broadcaster_id=${userId}`, {
      headers: { "Client-ID": clientId, "Authorization": `Bearer ${oauthToken}` }
    });
    const channelData = await channelResp.json();
    if (channelData.data && channelData.data[0]) {
      const channel = channelData.data[0];
      const titleEl = document.getElementById("streamTitle");
      const gameEl = document.getElementById("streamGame");
      if (titleEl) titleEl.textContent = channel.title || "";
      if (gameEl) gameEl.textContent = channel.game_name || "";
    }

    const streamResp = await fetch(`https://api.twitch.tv/helix/streams?user_id=${userId}`, {
      headers: { "Client-ID": clientId, "Authorization": `Bearer ${oauthToken}` }
    });
    const streamData = await streamResp.json();
    const isLive = streamData.data && streamData.data.length > 0;
    document.querySelectorAll('#live-indicator').forEach(el => el.style.display = isLive ? "inline-block" : "none");

    const viewerCountEl = document.getElementById("viewerCount");
    if (isLive) {
      const stream = streamData.data[0];
      updateViewers(stream.viewer_count || 0, true);
      const started = new Date(stream.started_at);
      // start timer
      startStreamTimer(Math.floor((Date.now() - started.getTime()) / 1000));
    } else {
      updateViewers(0, false);
      stopStreamTimer();
    }

  } catch (err) {
    console.error("Twitch API error:", err);
  }
}

function updateViewers(count, isLive) {
  const viewerCountEl = document.getElementById("viewerCount");
  if (viewerCountEl) {
    viewerCountEl.textContent = isLive ? `👤 ${count}` : "";
    viewerCountEl.style.display = isLive ? "inline-block" : "none";
  }
}

function startStreamTimer(startSeconds = 0) {
  if (intervalRefs.timer) return;
  let seconds = startSeconds;
  const timerEl = document.getElementById("streamTimer");
  if (timerEl) timerEl.style.display = "inline";
  intervalRefs.timer = setInterval(() => {
    seconds++;
    const h = String(Math.floor(seconds / 3600)).padStart(2, "0");
    const m = String(Math.floor((seconds % 3600) / 60)).padStart(2, "0");
    const s = String(seconds % 60).padStart(2, "0");
    if (timerEl) timerEl.textContent = `${h}:${m}:${s}`;
  }, 1000);
}

function stopStreamTimer() {
  if (intervalRefs.timer) clearInterval(intervalRefs.timer);
  intervalRefs.timer = null;
  const timerEl = document.getElementById("streamTimer");
  if (timerEl) { timerEl.textContent = "00:00:00"; timerEl.style.display = "none"; }
}

/* =========================
  Misc: Show more / less listeners (kept minimal)
  ========================= */
function initShowMoreLessListeners() {
  document.addEventListener("click", (e) => {
    if (e.target.closest("#showMoreFollowed")) {
      visibleFollowedCount += 12; renderFollowingListUI(currentFollowedData);
    }
    if (e.target.closest("#showLessFollowed")) {
      visibleFollowedCount = 12; renderFollowingListUI(currentFollowedData);
    }
  });
}

/* =========================
  BOOT
  ========================= */
document.addEventListener("DOMContentLoaded", () => {
  initSidebarToggle();
  initNavbarTwitchLogin();
  initShowMoreLessListeners();
  initTwitchEmbeds();

  // restore saved session UI and followed list
  const saved = JSON.parse(localStorage.getItem("twitchUser"));
  if (saved && saved.token) {
    const avatarEl = document.getElementById("twitchAvatar");
    const nameEl = document.getElementById("twitchUsername");
    const userIcon = document.getElementById("twitchUserIcon");
    if (avatarEl && saved.avatar) { avatarEl.style.backgroundImage = `url('${saved.avatar}')`; avatarEl.style.display = "inline-block"; }
    if (nameEl) nameEl.textContent = saved.username || nameEl.textContent;
    if (userIcon && saved.avatar) userIcon.style.display = "none";
    initFollowingList();
  } else {
    renderFollowingListUI([]);
    renderLiveRecsUI([]);
  }
});

// refresh followed/live every 60s (keeps sidebar fresh)
setInterval(initFollowingList, 60000);

</script>
