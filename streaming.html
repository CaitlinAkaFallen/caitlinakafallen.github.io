<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Streaming</title>
    <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="streaming.css" />
  </head>
  <body>

    <header>
      <nav>
        <a href="index.html" class="home">Home</a>
        <a href="stream-commands.html" class="commands">Stream Commands</a>
      </nav>
    </header>

    <div class="stream-wrapper">
      <!-- Stream Section -->
      <div class="stream-container" id="twitch-container">
        <h2>
          <a href="https://www.twitch.com/fallenoneart" target="_blank" style="color:inherit; text-decoration:none;">
            Twitch Stream: fallenoneart
          </a>
        </h2>
        <div id="twitch-player" class="twitch-player" style="width:800px; height:450px;"></div>
      </div>
    
      <!-- Chat Section -->
      <iframe id="twitch-chat-embed"
        src="https://www.twitch.tv/embed/fallenoneart/chat?parent=localhost"
        height="500"
        width="350"
        class="chat-embed">
      </iframe>
    </div>

    <div class="stream-container" id="youtube-container">
      <h2>
        <a href="https://www.youtube.com/@caitlinakafallen" target="_blank" style="color:inherit; text-decoration:none;">
          YouTube: Caitlin aka Fallen
        </a>
      </h2>
      <iframe
        id="yt-iframe"
        src="https://www.youtube.com/embed/live_stream?channel=UCvbVbJh3CWljgXGSBuT1wAQ"
        width="800"
        height="450"
        allowfullscreen>
      </iframe>
    </div>

    <script src="https://player.twitch.tv/js/embed/v1.js"></script>
    <script>
      // --- Twitch Embed ---
      const twitchPlayer = new Twitch.Player("twitch-player", {
        width: 800,
        height: 450,
        channel: "fallenoneart",
        parent: ["localhost", "caitlinscreativespace.com"] // supports local + production
      });
    
      twitchPlayer.setVolume(0.5);
    
      // --- Twitch Live Check ---
      async function checkTwitchLive() {
        const resp = await fetch("https://api.twitch.tv/helix/streams?user_login=fallenoneart", {
          headers: {
            "Client-ID": "l7o17x4jquesk1htz1r5zwicaj6v"  // Use your real Client ID
          }
        });
        const { data } = await resp.json();
        document.getElementById("twitch-live")
          ?.classList.toggle("live", data && data.length > 0);
      }
    
      // --- YouTube Live Check ---
      async function checkYouTubeLive() {
        const apiKey = "109546453641-rppq2bcferlo9or60730io15lk34vg03.apps.googleusercontent.com"; // Your YouTube API key
        const channelId = "UCvbVbJh3CWljgXGSBuT1wAQ";
    
        const resp = await fetch(
          `https://www.googleapis.com/youtube/v3/search?part=id&channelId=UCvbVbJh3CWljgXGSBuT1wAQ&eventType=live&type=video&key=109546453641-rppq2bcferlo9or60730io15lk34vg03.apps.googleusercontent.com}`
        );
        const { items } = await resp.json();
    
        document.getElementById("youtube-live")
          ?.classList.toggle("live", items && items.length > 0);
      }
    
      // initial check + poll every 60s
      checkTwitchLive(); checkYouTubeLive();
      setInterval(checkTwitchLive, 60000);
      setInterval(checkYouTubeLive, 60000);
    </script>
    
  </body>
</html>
