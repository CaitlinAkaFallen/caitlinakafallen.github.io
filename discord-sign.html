<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Request Alert</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Share+Tech+Mono&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: transparent;
            font-family: 'Inter', sans-serif;
            color: #fff;
            overflow: hidden;
            padding: 20px 20px 20px 150px;
        }

        #discord-alert-container {
            display: flex;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        .discord-card {
            position: relative;
            display: flex;
            align-items: center;
            padding: 12px 20px;
            min-width: 400px;
            max-width: 600px;
            background: linear-gradient(135deg, rgba(30, 30, 40, 0.85) 0%, rgba(10, 10, 20, 0.75) 100%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            backdrop-filter: blur(20px) saturate(160%);
            border-radius: 8px;
            border: 1px solid rgba(114, 137, 218, 0.4);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
            animation: slideIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .avatar-wrap {
            position: absolute;
            left: -80px;
            width: 60px;
            height: 60px;
            background: #000;
            border-radius: 50%;
            border: 2px solid #7289da;
            box-shadow: 0 0 20px rgba(114, 137, 218, 0.3);
            overflow: visible;
            z-index: 5;
        }

        .avatar-wrap img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .mod-header {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ff4747;
            margin-bottom: -2px;
        }

        .message-text {
            font-size: 1rem;
            line-height: 1.4;
            color: #eeeeee;
        }

        .username-highlight {
            color: #7289da;
            font-weight: 700;
        }

        .discord-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 10%;
            right: 10%;
            height: 4px;
            background: #7289da;
            border-radius: 4px 4px 0 0;
            box-shadow: 0 0 15px rgba(114, 137, 218, 0.8);
        }

        #ws-status {
            position: fixed;
            top: 8px;
            left: 8px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4747;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #ws-status.disconnected { opacity: 1; }

        @keyframes slideIn {
            0%   { transform: translateX(50px); opacity: 0; filter: blur(10px); }
            100% { transform: translateX(0);    opacity: 1; filter: blur(0);    }
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: scale(0.95); filter: blur(10px); }
        }

        .fade-out {
            animation: fadeOut 0.5s ease forwards;
        }
    </style>
</head>
<body>

    <div id="ws-status" class="disconnected" title="WebSocket disconnected"></div>
    <div id="discord-alert-container"></div>

    <script>
        const params  = new URLSearchParams(window.location.search);
        const address = params.get("address") || "localhost";
        const port    = params.get("port")    || "8080";

        const TARGET_EVENT = "Discordsign";
        const DISPLAY_MS   = 10000;

        let ws;
        let hideTimer;
        const statusDot = document.getElementById('ws-status');

        function connect() {
            ws = new WebSocket(`ws://${address}:${port}/`);

            ws.onopen = () => {
                statusDot.classList.remove('disconnected');
                console.log("[DiscordAlert] Connected to Streamer.bot WebSocket.");
                ws.send(JSON.stringify({
                    request: "Subscribe",
                    events: { "General": ["Custom"] },
                    id: "DiscordSign-Sub"
                }));
            };

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (
                        msg.event &&
                        msg.event.source === "General" &&
                        msg.event.type   === "Custom"
                    ) {
                        let payload = msg.data;
                        if (typeof payload === "string") payload = JSON.parse(payload);

                        if (payload && payload.eventName === TARGET_EVENT) {
                            showDiscordAlert(
                                payload.user   || "A Brave Soul",
                                payload.avatar || ""
                            );
                        }
                    }
                } catch (err) {
                    console.error("[DiscordAlert] Failed to parse message:", err, event.data);
                }
            };

            ws.onerror = (err) => console.error("[DiscordAlert] WebSocket error:", err);

            ws.onclose = () => {
                statusDot.classList.add('disconnected');
                console.warn("[DiscordAlert] Connection closed — retrying in 5 s…");
                setTimeout(connect, 5000);
            };
        }

        connect();

        function showDiscordAlert(user, avatar) {
            const container = document.getElementById('discord-alert-container');

            clearTimeout(hideTimer);
            container.innerHTML = '';

            const card = document.createElement('div');
            card.className = 'discord-card';

            const safeUser   = escapeHtml(user);
            const safeAvatar = escapeHtml(avatar);

            card.innerHTML = `
                <div class="avatar-wrap">
                    <img src="${safeAvatar}"
                         alt="${safeUser}'s avatar"
                         onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
                </div>
                <div class="content">
                    <div class="mod-header">Mods! Link Requested</div>
                    <div class="message-text">
                        <span class="username-highlight">${safeUser}</span>
                        please wait for one of the mods to give you the discord link!
                    </div>
                </div>
            `;

            container.appendChild(card);

            hideTimer = setTimeout(() => {
                card.classList.add('fade-out');
                setTimeout(() => { if (card.parentNode) card.remove(); }, 500);
            }, DISPLAY_MS);
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
