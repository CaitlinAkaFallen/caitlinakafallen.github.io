<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars HUD Timer</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');

    :root {
        --sabres-color: #00f2ff; 
        --sabres-glow: rgba(0, 242, 255, 0.6);
        --hud-bg: rgba(30, 35, 40, 0.9);
    }

    body {
        margin: 0; padding: 0; overflow: hidden;
        background-color: transparent;
        font-family: 'Orbitron', sans-serif;
    }

    #rippleCanvas {
        position: absolute; top: 0; left: 0;
        width: 100vw; height: 100vh;
        pointer-events: none; z-index: 5;
    }

    .global-timer-container {
        position: absolute;
        right: 50px; top: 50px;
        padding: 15px 40px 15px 25px;
        background: var(--hud-bg);
        clip-path: polygon(0% 0%, 100% 0%, 93% 100%, 0% 100%);
        border-right: 5px solid var(--sabres-color);
        z-index: 10;
        opacity: 0;
        transform: translateX(100px); 
        transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        box-shadow: -15px 0 30px rgba(0,0,0,0.7);
    }

    .global-timer-container.show {
        opacity: 1;
        transform: translateX(0);
    }

    .timer-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: -5px;
    }

    .label {
        font-size: 11px;
        color: var(--sabres-color);
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 900;
        font-style: italic;
    }

    #sessionTimer { 
        font-size: 54px; 
        color: #fff; 
        font-weight: 900; 
        text-shadow: 0 0 15px var(--sabres-glow);
        line-height: 1;
        font-style: italic;
    }

    .timer-bar { 
        width: 200px; 
        height: 6px; 
        background: rgba(255,255,255,0.05); 
        margin-top: 10px; 
        position: relative;
    }

    #timerProgress { 
        height: 100%; 
        width: 100%; 
        background: #fff; 
        box-shadow: 
            0 0 4px #fff,
            0 0 12px var(--sabres-color),
            0 0 25px var(--sabres-color);
        transition: width 1s linear; 
    }

    .warning-active {
        --sabres-color: #ff003c;
        --sabres-glow: rgba(255, 0, 60, 0.8);
        background: rgba(30, 0, 5, 0.9);
    }

    .warning-active #sessionTimer {
        animation: system-glitch 0.15s infinite;
    }

    @keyframes system-glitch {
        0% { transform: translate(0); opacity: 1; }
        25% { transform: translate(-1px, 1px); opacity: 0.9; }
        50% { transform: translate(1px, -1px); opacity: 1; }
        75% { transform: translate(-1px, -1px); opacity: 0.8; }
        100% { transform: translate(0); }
    }
    </style>
</head>
<body>

    <canvas id="rippleCanvas"></canvas>

    <div class="global-timer-container" id="timerContainer">
        <div class="timer-header">
            <div class="label" id="userLabel">SYSTEM.LINK // ACTIVE</div>
        </div>
        <div id="sessionTimer">00:00</div>
        <div class="timer-bar"><div id="timerProgress"></div></div>
    </div>

    <script>
    const params = new URLSearchParams(window.location.search);
    const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);

    let timeLeft = 0;
    let totalTime = 0;
    let timerId = null;

    const timerDisplay = document.getElementById('sessionTimer');
    const progressBar = document.getElementById('timerProgress');
    const container = document.getElementById('timerContainer');
    const canvas = document.getElementById('rippleCanvas');
    const ctx = canvas.getContext('2d');
    let ripples = [];

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class ForcePulse {
        constructor(x, y, color) {
            this.x = x; this.y = y; this.r = 0; this.opacity = 1;
            this.color = color;
        }
        update() { 
            this.r += 12; 
            this.opacity -= 0.03; 
        }
        draw() {
            ctx.save();
            ctx.beginPath();
            ctx.rect(this.x - this.r/2, this.y - 2, this.r, 4); 
            ctx.fillStyle = this.color.replace('rgb', 'rgba').replace(')', `, ${this.opacity})`);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.r * 0.8, 0, Math.PI * 2);
            ctx.strokeStyle = this.color.replace('rgb', 'rgba').replace(')', `, ${this.opacity * 0.5})`);
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();
        }
    }

    function triggerPulse() {
        const rect = container.getBoundingClientRect();
        const centerX = rect.left + (rect.width / 2);
        const centerY = rect.top + (rect.height / 2);
        const color = getComputedStyle(document.documentElement).getPropertyValue('--sabres-color').trim();
        ripples.push(new ForcePulse(centerX, centerY, color));
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ripples = ripples.filter(r => r.opacity > 0);
        ripples.forEach(r => { r.update(); r.draw(); });
        requestAnimationFrame(animate);
    }
    animate();

    ws.onopen = () => {
        ws.send(JSON.stringify({ request: "Subscribe", events: { general: ["Custom"] }, id: "TimerTrigger" }));
    };

    ws.onmessage = (event) => {
        try {
            const response = JSON.parse(event.data);
            const d = response.data || response;

            if (d.eventName === "timer_start") {
                startTimer(parseInt(d.seconds));
            }
        } catch(e) {
            console.error("Error processing message:", e);
        }
    };

    function startTimer(seconds) {
        // Reset state
        clearInterval(timerId);
        
        timeLeft = seconds;
        totalTime = seconds;
        
        container.classList.remove('warning-active');
        container.classList.add('show');
        
        // Initial display update
        updateDisplay();
        triggerPulse();

        timerId = setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
                
                // Switch to Red/Warning mode at 10 seconds
                if (timeLeft <= 10 && !container.classList.contains('warning-active')) {
                    triggerPulse();
                    container.classList.add('warning-active');
                }

                updateDisplay();
            } else {
                // Time is up
                clearInterval(timerId);
                container.classList.remove('show');
            }
        }, 1000);
    }

    function updateDisplay() {
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        timerDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        
        // Progress bar calculation
        const percent = totalTime > 0 ? (timeLeft / totalTime) * 100 : 0;
        progressBar.style.width = `${percent}%`;
    }
    </script>
</body>
</html>
