<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Ball Z Overlay</title>
    <style>
        /* Iconic DBZ-style fonts */
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Orbitron:wght@400;900&family=Permanent+Marker&display=swap');

        :root {
            /* Base / Capsule Corp Theme */
            --dbz-blue: #0066ff;
            --dbz-bg: rgba(255, 255, 255, 0.9);
            --dbz-border: #333;
            
            /* Super Saiyan / Aura Theme */
            --ssj-gold: #ffcc00;
            --ssj-orange: #ff6600;
            --ssj-glow: rgba(255, 204, 0, 0.8);
        }

        body { margin: 0; padding: 40px; background-color: transparent; overflow: hidden; }

        #alert-wrapper {
            display: flex;
            align-items: center;
            opacity: 0;
            transform: scale(0.5) rotate(-5deg);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #alert-wrapper.show { opacity: 1; transform: scale(1) rotate(0deg); }

        #pill-container {
            display: flex;
            align-items: center;
            position: relative;
            padding: 15px 30px;
            background: var(--dbz-bg);
            border: 4px solid var(--dbz-border);
            border-radius: 15px 50px 15px 50px;
            min-width: 500px;
            max-width: 800px;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.2);
            transition: all 0.5s ease;
        }

        /* --- SUPER SAIYAN TRANSITION --- */
        #pill-container.thanks { 
            background: linear-gradient(135deg, #000 0%, #222 100%);
            border-color: var(--ssj-gold);
            box-shadow: 0 0 20px var(--ssj-glow), 0 0 40px var(--ssj-orange);
            animation: aura-shake 0.2s infinite;
        }

        @keyframes aura-shake {
            0% { transform: translate(0,0); }
            25% { transform: translate(1px, -1px); }
            50% { transform: translate(-1px, 1px); }
            75% { transform: translate(1px, 1px); }
            100% { transform: translate(0,0); }
        }

        /* Avatar styling (Scouter Lens) */
        .avatar-wrapper { 
            position: relative;
            margin-right: 25px; 
            z-index: 2; 
        }

        .user-avatar {
            width: 100px; height: 100px;
            background-size: cover; background-position: center;
            border-radius: 50%;
            border: 5px solid var(--dbz-blue);
            background-color: #000;
            transition: all 0.5s;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        #pill-container.thanks .user-avatar {
            border-color: var(--ssj-gold);
            filter: brightness(1.2) contrast(1.1);
            box-shadow: 0 0 15px var(--ssj-gold);
        }

        /* Text Styles */
        .text-group { display: flex; flex-direction: column; z-index: 2; }
        
        .user-header { 
            font-family: 'Orbitron', sans-serif; /* Scouter font style */
            font-size: 0.8rem; 
            font-weight: 900;
            color: var(--dbz-blue); 
            text-transform: uppercase; 
            letter-spacing: 2px;
            margin-bottom: -5px;
        }

        .user-name { 
            font-family: 'Bangers', cursive; /* DBZ Title font style */
            font-size: 3.5rem; 
            color: #333;
            margin: 0; 
            text-shadow: 3px 3px 0px #fff, 5px 5px 0px rgba(0,0,0,0.1);
            letter-spacing: 2px;
            -webkit-text-stroke: 1px #000;
        }
        
        .question-text { 
            font-family: 'Permanent Marker', cursive; 
            font-size: 1.4rem; 
            color: #444; 
            margin-top: 5px;
            line-height: 1;
        }

        /* Super Saiyan Text Colors */
        #pill-container.thanks .user-header { color: var(--ssj-gold); text-shadow: 0 0 5px var(--ssj-gold); }
        #pill-container.thanks .user-name { 
            color: var(--ssj-gold); 
            text-shadow: 3px 3px 0px var(--ssj-orange), 5px 5px 0px #000;
            -webkit-text-stroke: 1.5px #000;
        }
        #pill-container.thanks .question-text { color: #eee; }

        /* Speed Lines Effect */
        #pill-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,255,255,0.1) 41px);
            pointer-events: none;
            opacity: 0;
        }

        #pill-container.thanks::after {
            opacity: 1;
            animation: move-lines 0.1s linear infinite;
        }

        @keyframes move-lines {
            from { background-position: 0 0; }
            to { background-position: 40px 0; }
        }

    </style>
</head>
<body>

<div id="alert-wrapper">
    <div id="pill-container">
        <div class="avatar-wrapper">
            <div class="user-avatar" id="avatar"></div>
        </div>
        <div class="text-group">
            <div class="user-header" id="header-text">POWER LEVEL DETECTED</div>
            <div class="user-name" id="username">CHALLENGER</div>
            <div class="question-text" id="content-text">Incoming transmission...</div>
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);

    ws.onopen = () => {
        ws.send(JSON.stringify({ request: "Subscribe", events: { general: ["Custom"] }, id: "DBZAlert" }));
    };

    ws.onmessage = (event) => {
        const response = JSON.parse(event.data);
        const d = response.data || response;

        if (d.eventName === "questionAlert" || d.eventName === "thankYouAlert") {
            const pill = document.getElementById('pill-container');
            const wrapper = document.getElementById('alert-wrapper');
            const header = document.getElementById('header-text');
            
            document.getElementById('username').innerText = d.user;
            document.getElementById('avatar').style.backgroundImage = `url('${d.avatar}')`;

            if (d.eventName === "thankYouAlert") {
                pill.classList.add('thanks');
                header.innerText = "ZENKAI BOOST / SUPPORT";
                document.getElementById('content-text').innerText = "POWER LEVEL IS OVER 9000!!";
            } else {
                pill.classList.remove('thanks');
                header.innerText = "POWER LEVEL DETECTED";
                document.getElementById('content-text').innerText = d.message;
            }

            wrapper.classList.add('show');
            setTimeout(() => { wrapper.classList.remove('show'); }, 15000);
        }
    };
</script>
</body>
</html>
