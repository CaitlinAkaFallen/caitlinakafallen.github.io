<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Kick Stream and Chat - CaitlinAkAFallen</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
      body {
      margin: 0;
      padding: 0;
      background-color: #0f0f0f;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      background: #1f1f1f;
      padding: 12px 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
    }

    .nav-link {
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      padding: 10px 24px;
      border-radius: 8px;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    .nav-link:hover {
      background-color: #9147ff;
      color: #fff;
    }

    .youtube-link:hover {
      background-color: #cc0000;
      box-shadow: 0 0 12px #cc0000;
    }

    .stream-commands-link:hover {
      background: linear-gradient(45deg, #00bfae, #9147ff);
      color: #fff;
      box-shadow: 0 0 12px #00bfae, 0 0 12px #9147ff;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .kick-link:hover {
      background-color: #09d82c;
      box-shadow: 0 0 12px #eff0f0;
      color: #000;
    }

    .kick-glow-link {
      display: inline-block;
      text-align: center;
      color: #53fc18;
      font-weight: bold;
      text-decoration: none;
      font-size: 1.5rem;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      text-shadow: 0 0 2px #53fc18, 0 0 4px #53fc18;
      transition: text-shadow 0.3s ease, color 0.3s ease;
    }

    /* This centers the parent element */
    .kick-glow-link-wrapper {
      text-align: center;
    }

    .kick-glow-link:hover {
      text-shadow: 0 0 4px #55fc18fd, 0 0 6px #53fc18;
      color: #b6ffb1;
    }



    /* Pulsing animation */
    @keyframes pulse {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }

    @keyframes pulse-red {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .container {
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 10px;
      padding: 20px;
      flex-wrap: wrap;
    }

    .stream iframe,
    .chat iframe {
      border-radius: 10px;
      box-shadow: 0 0 20px #00ffae55;
    }

    @media (max-width: 1000px) {
      .container {
        flex-direction: column;
        align-items: center;
      }

      .stream iframe,
      .chat iframe {
        width: 100%;
        height: 480px;
      }
    }

    </style>
  </head>
  <body>
    <header>
      <nav>
          <a href="schedule.html" class="nav-link home-link">Schedule</a>
          <a href="stream-commands.html" class="nav-link stream-commands-link">Stream Commands</a>
          <a href="twitch.html" class="nav-link">Twitch</a>
          <a href="youtube.html" class="nav-link youtube-link active-tab">YouTube</a>
          <a href="kick.html" class="nav-link kick-link">Kick</a>
        </nav> 
    </header>
      <div class="stream-container active" id="kick-tab">
        <h2 style="text-align: center;">
          <a
            href="https://kick.com/caitlinakafallen"
            target="_blank"
            rel="noopener noreferrer"
            class="kick-glow-link"
            ><i class="fab fa-kickstarter"></i> Kick: CaitlinAkAFallen
          </a>
        </h2>

    </div>


    <div class="container">
      <div class="stream">
          <iframe 
            id="kick-player"
            src="https://player.kick.com/caitlinakafallen?allowfullscreen=false"
            height="720"
            width="1280"
            frameborder="0"
            scrolling="no"
            allowfullscreen>
        </iframe>

      </div>
      <div class="chat">
        <iframe
          src="https://kick.com/embed-chat/caitlinakafallen?theme=dark&username_color=00ffae"
          height="720"
          width="350"
          frameborder="0"
          scrolling="no">
        </iframe>
      </div>
    </div>


    <script>
      document.addEventListener("DOMContentLoaded", () => {
        console.log("Kick stream and chat loaded for CaitlinAkAFallen.");

        // Manually set live status here:
        const isLive = true;  // change to false if offline

        const liveIndicator = document.getElementById("live-indicator");
        if (isLive) {
          liveIndicator.classList.remove("live-off");
          liveIndicator.classList.add("live-on");
          liveIndicator.querySelector("strong").textContent = "LIVE";
        } else {
          liveIndicator.classList.remove("live-on");
          liveIndicator.classList.add("live-off");
          liveIndicator.querySelector("strong").textContent = "OFFLINE";
        }
      });
    </script>
  </body>
</html>
