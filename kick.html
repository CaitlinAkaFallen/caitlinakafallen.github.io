<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Kick Stream and Chat - CaitlinAkAFallen</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
   /* =========================
   Original Base & Nav (UNCHANGED)
   ========================= */
body {
    margin: 0;
    padding: 0;
    background-color: #0a0a0a;
    color: #fff;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    overflow-x: hidden;
}

.horizontal-nav {
    width: 100%;
    background: rgba(248, 248, 248, 0.233);
    backdrop-filter: blur(12px);
    padding: 16px 0;
    display: flex;
    justify-content: center;
    align-items: center;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1000;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    overflow-x: auto;
    scrollbar-width: none;
}

.horizontal-nav::-webkit-scrollbar { display: none; }

.nav-link {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 70px;
    height: 70px;
    margin: 0 10px;
    border-radius: 14px;
    color: #f0f0f0;
    font-size: 1.8rem;
    transition: color 0.3s ease, background-color 0.3s ease;
    text-decoration: none;
    position: relative;
}

.twitch-link:hover { color: #9147ff; }
.youtube-link:hover { color: #cc0000; }
.kick:hover { color: #09d82c; }
.stream-commands-link:hover { color: #00bfae; }
.home-link:hover { color: #ff6ec4; }
.discord-link:hover { color: #7289da; }

/* =========================
   Advanced UI Enhancements (FIXED)
   ========================= */

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

header {
    background: linear-gradient(rgba(0,0,0,0.6), rgba(15,15,15,1)), url("images/guitar.jpg") no-repeat center center / cover;
    height: 45vh; /* Slightly increased height */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    /* ADJUSTED: Increased margin to clear the fixed nav */
    margin-top: 100px; 
    text-align: center;
    border-bottom: 2px solid rgba(83, 252, 24, 0.2);
    cursor: pointer;
    position: relative;
    z-index: 1;
}

.header-link {
    text-decoration: none;
    display: block;
    width: 100%;
}

.header-link:hover header {
    filter: brightness(1.2);
    transition: filter 0.3s ease;
}

.header-content h1 {
    font-size: 3rem;
    color: #fff;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(83, 252, 24, 0.5);
    transition: transform 0.3s ease;
}

.header-content p {
    color: #53fc18;
    margin-top: 10px;
}

.header-content:hover h1 {
    transform: scale(1.05);
}

.main-content {
    max-width: 1400px;
    /* FIXED: Removed the negative margin-top that was pulling the video over the header */
    margin: 40px auto; 
    padding: 0 20px;
    animation: fadeInUp 0.8s ease-out forwards;
    position: relative;
    z-index: 2;
}

.video-wrapper {
    position: relative;
    background: #1a1a1a;
    border-radius: 20px;
    padding: 15px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 15px rgba(83, 252, 24, 0.15);
    border: 1px solid rgba(255,255,255,0.05);
}

.iframe-container {
    position: relative;
    width: 100%;
    padding-top: 56.25%; 
    overflow: hidden;
    border-radius: 12px;
}

.iframe-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
}

.info-container {
    text-align: center;
    padding: 30px;
}

.kick-glow-link {
    color: #53fc18;
    font-weight: bold;
    text-decoration: none;
    font-size: 1.8rem;
    text-shadow: 0 0 5px #53fc18, 0 0 10px #53fc18;
    transition: all 0.3s ease;
}

.kick-glow-link:hover {
    text-shadow: 0 0 10px #53fc18, 0 0 20px #53fc18;
    color: #fff;
}

#live-indicator {
    position: absolute;
    top: 5px;
    right: 5px;
    background: #ff0000;
    color: white;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: bold;
    animation: pulse 1.5s infinite;
    display: none;
}

@keyframes pulse {
    0% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(0.95); }
    100% { opacity: 1; transform: scale(1); }
}

@media (max-width: 768px) {
    header { margin-top: 80px; height: 30vh; }
    .header-content h1 { font-size: 1.8rem; }
    .nav-link { width: 55px; height: 55px; font-size: 1.4rem; }
    .kick-glow-link { font-size: 1.2rem; }
    .main-content { margin-top: 20px; }
}
    </style>
</head>
<body>

    <nav id="horizontal-nav" class="horizontal-nav">
        <a href="schedule.html" class="nav-link home-link">
            <i class="fas fa-calendar-alt"></i>
        </a>
        <a href="stream-commands.html" class="nav-link stream-commands-link">
            <i class="fas fa-sticky-note"></i>
        </a>
        <a href="twitch.html" class="nav-link twitch-link">
            <span id="live-indicator">LIVE</span>
            <i class="fab fa-twitch"></i>  
        </a>
        <a href="youtube.html" class="nav-link youtube-link">
            <i class="fab fa-youtube"></i>
        </a>
        <a href="kick.html" class="nav-link kick">
            <i class="fab fa-kickstarter-k"></i>
        </a>
    </nav>

    <a href="https://kick.com/caitlinakafallen" target="_blank" rel="noopener noreferrer" class="header-link">
    <header>
        <div class="header-content">
            <h1>CaitlinAkAFallen</h1>
            <p>LIVE ON KICK & TWITCH</p>
        </div>
    </header>
</a>

    <main class="main-content">
        <div class="video-wrapper">
            <div class="iframe-container">
                <iframe 
                    src="https://player.kick.com/caitlinakafallen?autoplay=true" 
                    allowfullscreen="true"> 
                </iframe>
            </div>
        </div>
    </main>



      <script>
        document.addEventListener("DOMContentLoaded", () => {
          console.log("Kick stream and chat loaded for CaitlinAkAFallen.");

          // Manually set live status here:
          const isLive = true;  // change to false if offline

          const liveIndicator = document.getElementById("live-indicator");
          if (isLive) {
            liveIndicator.classList.remove("live-off");
            liveIndicator.classList.add("live-on");
            liveIndicator.querySelector("strong").textContent = "LIVE";
          } else {
            liveIndicator.classList.remove("live-on");
            liveIndicator.classList.add("live-off");
            liveIndicator.querySelector("strong").textContent = "OFFLINE";
          }
        });
      </script>
  </body>
</html>
