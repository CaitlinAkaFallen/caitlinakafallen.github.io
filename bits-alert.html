<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Pill Bits Alert</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap');

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            padding: 50px;
            background: transparent;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            display: flex;
            align-items: flex-start;
        }

        /* ═══════════════════════════════════════
        MAIN WRAPPER 
        ═══════════════════════════════════════ */
        #alert-wrapper {
            display: flex;
            align-items: center;
            gap: 25px;
            position: relative;
            opacity: 0;
            transform: translateX(-50px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        #alert-wrapper.show {
            opacity: 1;
            transform: translateX(0);
        }

        /* ═══════════════════════════════════════
        AVATAR (Round Crystal Style)
        ═══════════════════════════════════════ */
        .avatar-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #111;
            border: 3px solid #ba68c8; /* Purple Crystal Border */
            box-shadow: 0 0 20px rgba(77, 245, 245, 0.4); /* Teal Glow */
            overflow: hidden;
            flex-shrink: 0;
            transform: translateX(-300px) rotate(-720deg);
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.4, 1);
        }

        #alert-wrapper.show .avatar-wrapper {
            transform: translateX(0) rotate(0deg);
        }

        .user-avatar {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        /* ═══════════════════════════════════════
        CONTENT COLUMN
        ═══════════════════════════════════════ */
        .content-column {
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        .top-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 0 20px;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s ease 0.5s, transform 0.4s ease 0.5s;
        }

        #alert-wrapper.show .top-label-row {
            opacity: 1;
            transform: translateY(0);
        }

        .bits-label {
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: #f06292; /* Pink Label */
            text-transform: uppercase;
            font-weight: 900;
        }

        .user-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(186, 104, 200, 0.8);
        }

        /* ═══════════════════════════════════════
        THE GLASS PILL
        ═══════════════════════════════════════ */
        .glass-pill {
            background: rgba(15, 10, 25, 0.85);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(77, 245, 245, 0.3); /* Teal Border */
            border-radius: 20px;
            width: 480px; 
            display: flex;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            height: 0; 
            padding: 0 30px;
            opacity: 0;
            transition: height 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }

        #alert-wrapper.show .glass-pill {
            height: 80px;
            opacity: 1;
            padding: 0 30px;
        }

        .message-text {
            font-size: 1rem;
            font-weight: 500;
            color: #4df5f5; /* Teal Message Text */
            font-style: italic;
            width: 70%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ═══════════════════════════════════════
        STAT SHARD (The Bits Count Box)
        ═══════════════════════════════════════ */
        .stat-shard {
            background: rgba(186, 104, 200, 0.2);
            border: 1px solid #ba68c8;
            padding: 5px 12px;
            border-radius: 10px;
            text-align: center;
            min-width: 90px;
        }

        #bits-value {
            display: block;
            font-weight: 900;
            font-size: 1.1rem;
            color: #ffffff;
        }

        #bits-label {
            display: block;
            font-size: 0.6rem;
            color: #f06292;
            font-weight: 700;
        }

        /* ═══════════════════════════════════════
        BOTTOM LABEL
        ═══════════════════════════════════════ */
        .bottom-label-row {
            margin-top: 8px;
            padding-right: 20px;
            display: flex;
            justify-content: flex-end;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.4s ease 0.5s, transform 0.4s ease 0.5s;
        }

        #alert-wrapper.show .bottom-label-row {
            opacity: 1;
            transform: translateY(0);
        }

        .crystal-power {
            font-size: 0.7rem;
            color: rgba(77, 245, 245, 0.6);
            letter-spacing: 2px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div id="alert-wrapper">
        <div class="avatar-wrapper">
            <div class="user-avatar" id="avatar"></div>
        </div>
        
        <div class="content-column">
            <div class="top-label-row">
                <div class="bits-label">New Cheer</div>
                <div class="user-name" id="username">WARRIOR</div>
            </div>

            <div class="glass-pill">
                <div class="message-text" id="message">Crystal shields active!</div>
                <div class="stat-shard">
                    <span id="bits-value">0</span>
                    <span id="bits-label">BITS</span>
                </div>
            </div>

            <div class="bottom-label-row">
                <div class="crystal-power">CRYSTAL ENERGY RESTORED</div>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);

        let hideTimer = null;

        ws.onopen = () => {
            console.log("Crystal Bits Connected");
            ws.send(JSON.stringify({ 
                request: "Subscribe", 
                events: { general: ["Custom"] }, 
                id: "CrystalBitsAlert" 
            }));
        };

        ws.onmessage = (event) => {
            const response = JSON.parse(event.data);
            
            // Check for bitsAlert in custom event data
            if (response.data && response.data.eventName === "bitsAlert") {
                updateUI(response.data);
            }
        };

        function updateUI(data) {
            const wrapper = document.getElementById('alert-wrapper');
            const avatarElem = document.getElementById('avatar');
            
            // Map the data to the UI
            document.getElementById('username').innerText = (data.user || "Warrior").toUpperCase(); 
            document.getElementById('message').innerText = data.message || "Sending crystal vibes!";
            document.getElementById('bits-value').innerText = data.bits || "0";
            
            if (data.avatar) {
                avatarElem.style.backgroundImage = `url('${data.avatar}')`;
            }

            // Animation Sequence
            if (hideTimer) clearTimeout(hideTimer);

            wrapper.classList.remove('show'); 
            void wrapper.offsetWidth; // Force Re-flow
            wrapper.classList.add('show');

            // Auto-Hide after 8 seconds
            hideTimer = setTimeout(() => {
                wrapper.classList.remove('show');
            }, 8000);
        }

        // Test manually if needed: 
        // updateUI({user: "CrystalGamer", message: "Love the vibes!", bits: "500", avatar: "URL_HERE"})
    </script>
</body>
</html>
