<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Bits Alert</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600&display=swap");

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 40px;
        background: transparent;
        font-family: "Inter", sans-serif;
        overflow: hidden;
      }

      #alert-wrapper {
        display: flex;
        align-items: center;
        opacity: 0;
        transform: translateX(-100px);

        transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }

      #alert-wrapper.show {
        opacity: 1;
        transform: translateX(0);
      }

      #pill-container {
        display: flex;

        align-items: center;

        background: radial-gradient(
          circle at center,
          rgba(15, 45, 55, 0.98) 0%,
          rgba(5, 15, 20, 1) 100%
        );

        -webkit-backdrop-filter: blur(15px);
        backdrop-filter: blur(15px);

        padding: 20px 40px;

        clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%);

        border-left: 6px solid #b700ff;

        box-shadow:
          0 10px 40px rgba(0, 0, 0, 0.8),
          0 0 20px rgba(183, 0, 255, 0.2);

        transform: skewX(-10deg);

        /* safer sizing */

        min-width: 500px;

        max-width: 850px;
      }

      .avatar-wrapper {
        transform: skewX(10deg);
        margin-right: 25px;
      }

      .bits-avatar {
        width: 85px;

        height: 85px;

        background-size: cover;

        background-position: center;

        border: 3px solid #b700ff;

        box-shadow: 0 0 15px rgba(183, 0, 255, 0.5);

        border-radius: 8px;
      }

      .text-group {
        display: flex;

        flex-direction: column;

        transform: skewX(10deg);

        color: white;

        max-width: 450px;
      }

      .user-name {
        font-family: "Cinzel", serif;

        font-size: 1.7rem;

        font-weight: 900;

        margin: 0;

        text-shadow: 0 0 10px rgba(183, 0, 255, 0.5);

        word-break: break-word;
      }

      .bits-line {
        font-size: 1.3rem;

        color: #00f2ff;

        font-weight: 700;

        margin-bottom: 5px;
      }

      .bits-line span {
        color: #ffffff;

        font-size: 0.9rem;

        font-weight: 400;
      }

      .message-line {
        font-size: 0.95rem;

        color: #a0c0c8;

        font-style: italic;

        border-top: 1px solid rgba(183, 0, 255, 0.3);

        padding-top: 5px;

        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div id="alert-wrapper">
      <div id="pill-container">
        <div class="avatar-wrapper">
          <div class="bits-avatar" id="avatar"></div>
        </div>
        <div class="text-group">
          <div class="user-name" id="username">Warrior</div>
          <div class="bits-line">
            <span id="bits-count">0</span> BITS <span>cheered!</span>
          </div>
          <div class="message-line" id="message">Skål!</div>
        </div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const ws = new WebSocket(
        `ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`,
      );

      ws.onopen = () => {
        ws.send(
          JSON.stringify({
            request: "Subscribe",
            events: { general: ["Custom"] },
            id: "VikingBitsAlert",
          }),
        );
      };

      ws.onmessage = (event) => {
        const response = JSON.parse(event.data);
        if (response.data && response.data.eventName === "bitsAlert") {
          const d = response.data;
          document.getElementById("username").innerText = d.user;
          document.getElementById("bits-count").innerText = d.bits;
          document.getElementById("message").innerText = d.message;
          document.getElementById("avatar").style.backgroundImage =
            `url('${d.avatar}')`;

          const wrapper = document.getElementById("alert-wrapper");
          wrapper.classList.add("show");
          setTimeout(() => wrapper.classList.remove("show"), 7000);
        }
      };
    </script>
  </body>
</html>
