<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upcoming Conventions</title>
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <style>
        /* 🌟 Variables */
      :root {
          --bg-color: #f4f4f9;
          --text-color: #030303;
          --accent-color: #424242;
          --sidebar-bg: rgba(48, 47, 47, 0.9);
          --sidebar-text: #ffffff;
          --sidebar-hover: #15e4d9;
          --button-bg: linear-gradient(#ffcc00, #ff8800);
          --button-hover: linear-gradient(#ffaa00, #ff6600);
          --dark-bg: #222;
          --dark-text: #f3f2f2;
          --shadow-light: 0px 6px 20px rgba(0, 0, 0, 0.1);
          --shadow-dark: 0px 6px 20px rgba(70, 223, 250, 0.733);
      }

      /* 🌙 Dark Mode Adjustments */
      .dark-mode {
          --bg-color: var(--dark-bg);
          --text-color: var(--dark-text);
      }

      /* 🏠 Base Styles */
      * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
      }

      body {
          font-family: 'Roboto', sans-serif;
          background-color: var(--bg-color);
          color: var(--text-color);
          line-height: 1.6;
          transition: background 0.3s ease, color 0.3s ease;
      }

      /* 🧢 Header */
      .main-header {
          text-align: center;
          padding: 50px 20px 30px;
          background: var(--accent-color);
          color: #fff;
          border-bottom: 6px solid #3ce7cb;
          box-shadow: var(--shadow-dark);
      }

      /* 🧢 Header Title */
      .main-header h1 {
          font-size: 3.5rem;
          font-weight: 700;
      }

      /* 🧢 Header Subtitle */
      .main-header p {
          font-size: 1.2rem;
          margin-top: 10px;
          font-weight: 500;
      }

      /* 📚 Navbar (under header) */
      .navbar {
          margin-top: 30px;
          display: flex;
          justify-content: center;
          background: rgba(0, 0, 0, 0.2);
          border-radius: 12px;
          padding: 10px 20px;
          backdrop-filter: blur(10px);
          box-shadow: var(--shadow-dark);
      }

      /* 📚 Navbar List */
      .navbar-list {
          list-style: none;
          display: flex;
          gap: 20px;
          margin: 0;
          padding: 0;
      }

      /* 📚 Navbar List Items */
      .navbar-list li {
          display: flex;
          align-items: center;
          transition: background 0.3s ease, transform 0.3s ease;
      }

      /* 📚 Navbar Hover Effects */
      .navbar-list li:hover {
          background: rgba(255, 255, 255, 0.1);
          border-radius: 8px;
          transform: translateY(-2px);
      }

      /* 📚 Navbar Links */
      .navbar-list a {
          text-decoration: none;
          color: var(--sidebar-text);
          display: flex;
          align-items: center;
          font-weight: 500;
          padding: 10px 15px;
      }

      /* 📚 Navbar Link Hover */
      .navbar-list a:hover {
          color: var(--sidebar-hover);
      }

      /* 📚 Navbar Text */
      .navbar-text {
          margin-left: 8px;
      }
      
      .conventions-btn {
        display: inline-block;
        background: #00bcd4;
        color: #fff;
        padding: 8px 16px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: bold;
        transition: background 0.3s ease;
      }
      
      .conventions-btn:hover {
        background: #0097a7;
      }


      /* 🌑 Dark Mode Button */
      .dark-mode-btn {
          position: absolute;
          top: 20px;
          right: 20px;
          background: var(--button-bg);
          color: #000;
          padding: 12px 25px;
          font-size: 16px;
          border: none;
          border-radius: 30px;
          font-weight: 600;
          display: flex;
          align-items: center;
          cursor: pointer;
          box-shadow: var(--shadow-light);
          transition: background 0.3s ease, transform 0.3s ease;
      }

      .dark-mode-btn:hover {
          background: var(--button-hover);
      }

      /* 📋 Convention List */
      .conventions-list {
          list-style: none;
          padding: 0;
          margin: 40px auto;
          max-width: 900px;
          display: flex;
          flex-direction: column;
          gap: 20px;
          background-color: var(--bg-color);
          box-shadow: var(--shadow-light);
          border-radius: 15px;
      }

      /* Convention Content Container */
      .convention-contention {
          display: flex;
          justify-content: center;
          align-items: center;
          width: 100%;
          padding: 20px;
          box-sizing: border-box;
      }

      /* Convention List Heading */
      .convention-contention h1 {
          text-align: center;
          font-size: 2.5rem;
          font-weight: 700;
          color: var(--accent-color);
          margin-bottom: 20px;
          width: 100%;
      }

      /* Convention List Items */
      .conventions-list li {
          display: flex;
          flex-direction: column;
          align-items: flex-start;
          padding: 20px;
          background: rgba(151, 150, 150, 0.815);
          border-radius: 15px;
          transition: transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
          box-shadow: var(--shadow-light);
      }

      .conventions-list li:hover {
          transform: scale(1.05);
          background: rgba(196, 206, 152, 0.61);
          box-shadow: var(--shadow-dark);
      }

      /* Event Name */
      .event-name {
          font-weight: 700;
          font-size: 1.4rem;
          color: #000;
      }

      /* Event Date, Location, and Description */
      .event-date,
      .event-location,
      .event-description {
          font-size: 1.1rem;
          margin-top: 5px;
          color: var(--accent-color);
      }

    

      /* 📱 Responsive */
      @media (max-width: 768px) {
          .sidebar {
              width: 220px;
          }

          .conventions-list {
              max-width: 100%;
              padding: 10px;
          }

          .conventions-list li {
              text-align: center;
              padding: 15px;
              margin: 10px 0;
          }

          .event-name {
              font-size: 1.2rem;
          }

          .event-date,
          .event-location,
          .event-description {
              font-size: 1rem;
          }
      }

    </style>
  </head>

  <body>
   


    <!-- Main Content -->
<div class="main-content">
  <header class="main-header">
    <h1>Upcoming Conventions</h1>
    <p>Where you can meet me! 🎉</p>

    <!-- Navbar -->
    <nav id="navbar" class="navbar">
      <ul class="navbar-list">
        <li>
          <a href="index.html" class="home-link">
            <img src="https://th.bing.com/th/id/R.19ed7c8b456956b57d48630777fa9198?rik=gw7I7o0tcu7vJQ&pid=ImgRaw&r=0" alt="Home" class="home-icon" width="24">
            <span class="navbar-text">HOME</span>
          </a>
        </li>
      </ul>
    </nav>

    <button id="darkModeToggle" class="dark-mode-btn" onclick="toggleDarkMode()">🔦 Light Mode</button>
  </header>


      
      <!-- Convention List -->
      <ul class="conventions-list">
        <li>
          <span class="event-name">Game On Expo</span>
          <span class="event-date">April 4th–6th, 2025</span>
          <span class="event-location">Phoenix, AZ</span>
          <span class="event-description">A celebration of gaming culture.</span>
        </li>
        <li>
          <span class="event-name">Phoenix Fan Fusion</span>
          <span class="event-date">June 6th–8th, 2025</span>
          <span class="event-location">Phoenix, AZ</span>
          <span class="event-description">Description</span>
        </li>
        <li>
          <span class="event-name">TBA</span>
          <span class="event-date">Date</span>
          <span class="event-location">Location</span>
          <span class="event-description">Description</span>
        </li>
      </ul>
    </div>

     <script>
  document.addEventListener('DOMContentLoaded', () => {
    const conventionsList = document.querySelector('.conventions-list');
    const today = new Date();

    // Parse the event date and return a Date object
    const parseDateRange = (dateStr) => {
      const regex = /([A-Za-z]+) (\d+)[a-z]{2}?[–-](\d+)[a-z]{2}?, (\d{4})/;
      const match = dateStr.match(regex);
      if (match) {
        const [_, month, startDay, endDay, year] = match;
        const endDate = new Date(`${month} ${endDay}, ${year}`);
        return endDate;
      }
      return null;
    };

    // Load saved conventions from localStorage
    const savedConventions = localStorage.getItem('conventionsList');
    if (savedConventions) {
      conventionsList.innerHTML = savedConventions;
    }

    // Remove passed events
    const items = conventionsList.querySelectorAll("li");
    items.forEach(item => {
      const dateSpan = item.querySelector(".event-date");
      const dateText = dateSpan?.innerText.trim();
      const endDate = parseDateRange(dateText);

      // If the event has passed, remove it
      if (endDate && endDate < today) {
        item.remove();
      }
    });

    // Save updated conventions to localStorage after removal
    localStorage.setItem('conventionsList', conventionsList.innerHTML);
  });

  // Sidebar toggle function
  function toggleSidebar() {
    const sidebar = document.querySelector(".sidebar");
    const toggleBtn = document.querySelector(".sidebar-toggle");

    sidebar.classList.toggle("open");
    toggleBtn.classList.toggle("open");
  }

  // Dark Mode Toggle
  function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
    const toggleButton = document.getElementById('darkModeToggle');
    if (document.body.classList.contains('dark-mode')) {
      toggleButton.innerHTML = "☀️ Dark Mode";
    } else {
      toggleButton.innerHTML = "🔦 Light Mode";
    }
  }

  // Load saved conventions from localStorage (again for safety)
  document.addEventListener('DOMContentLoaded', () => {
    const savedConventions = localStorage.getItem('conventionsList');
    const conventionsList = document.querySelector('.conventions-list');
    if (savedConventions) {
      conventionsList.innerHTML = savedConventions;
    }
  });
</script>


  </body>
</html>
