<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Discord Server Card</title>
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon" />
    <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --glass-bg: rgba(15, 20, 35, 0.7);
            --glass-stroke: rgba(255, 255, 255, 0.15);
            --text: #ffffff;
            --muted: #a0aec0;
            --accent: #00d2ff;
            --ok: #00f298;
            --discord: #5865F2;
            --shadow: rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background-color: #71a7cc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(88, 101, 242, 0.15) 0, transparent 50%), 
                radial-gradient(at 100% 100%, rgba(0, 210, 255, 0.15) 0, transparent 50%);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Adjusted padding to account for fixed nav and header spacing */
            padding: 100px 24px 40px; 
        }

/* ========================= Ultra-Wide & Mobile Friendly Header ========================= */
        header {
            background: url("images/main-page.JPG") no-repeat center center / cover;
            width: 98%;            /* Nearly full width on mobile devices */
            max-width: 1200px;     /* Ultra-wide cinematic look on desktop */
            height: 35vh;          /* Slightly taller to balance the extra width */
            min-height: 250px;
            border-radius: 28px;   /* Smooth, modern rounded corners */
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            text-align: center;
            margin: 20px auto 50px; /* Centered with a bit of top/bottom breathing room */
            box-shadow: 0 20px 50px var(--shadow);
            border: 1px solid var(--glass-stroke);
            transition: all 0.3s ease;
        }

        /* Overlay to ensure text readability */
        header::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            -webkit-backdrop-filter: blur(2px);
            backdrop-filter: blur(2px);
            z-index: 1;
        }

        header div {
            position: relative;
            z-index: 2;
            padding: 0 15px;
            width: 90%; /* Keeps text contained in the center */
        }

        header h2 {
            font-family: Georgia, serif;
            /* clamp(min, preferred, max) - perfectly responsive text */
            font-size: clamp(28px, 6vw, 56px); 
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #3ffded;
            text-shadow: 0 0 15px #000;
            margin: 0;
            line-height: 1.1;
        }

        header h5 {
            font-family: Verdana, sans-serif;
            font-size: clamp(16px, 3vw, 22px);
            font-weight: 400;
            margin-top: 15px;
            color: #fff;
            text-shadow: 0 0 10px #000;
            opacity: 0.9;
        }

        /* Responsive fixes for small mobile screens */
        @media (max-width: 768px) {
            header {
                height: 25vh;
                margin-top: 80px; /* Leaves space for the fixed nav bar */
                border-radius: 18px;
            }
        }

        /* ========================= Navigation Bar ========================= */
        .horizontal-nav {
            width: 100%;
            background: var(--glass-bg); 
            backdrop-filter: blur(12px);
            padding: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--glass-stroke); 
            overflow-x: auto;
            scrollbar-width: none;
        }

        .nav-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            margin: 0 10px;
            border-radius: 14px;
            color: var(--muted);
            font-size: 1.5rem;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            text-decoration: none;
            position: relative;
        }

        .nav-link #live-indicator {
            position: absolute;
            top: 0;
            right: 0;
            transform: translate(25%, -25%);
            font-size: 0.6rem;
            font-weight: bold;
            color: white;
            background-color: #ff4b4b;
            padding: 2px 6px;
            border-radius: 999px;
            animation: livePulse 1.6s ease-in-out infinite;
        }

        .nav-link:not(.is-live) #live-indicator { display: none; }

        @keyframes livePulse {
            0%, 100% { transform: translate(25%, -25%) scale(1); opacity: 0.9; }
            50% { transform: translate(25%, -25%) scale(1.1); opacity: 1; }
        }

        .nav-link:hover { background: rgba(255, 255, 255, 0.05); transform: translateY(-2px); }
           /* Twitch */
        .twitch-link:hover {
            background-color: transparent;
            color: #9147ff;
        }

        /* YouTube */
        .youtube-link:hover {
            background-color: transparent;
            color: #cc0000;
        }

        /* Kick */
        .kick-link:hover {
            background-color: transparent;
            color: #09d82c;
        }

        /* Stream Commands */
        .stream-commands-link:hover {
            background-color: transparent;
            color: #00bfae;
        }

        /* Schedule / Home */
        .home-link:hover {
            background-color: transparent;
            color: #ff6ec4;
        }

        .discord-link:hover {
            background-color: transparent;
            color: #7289da;
        }
        /* Schedule */
        .schedule-link:hover {
          background-color: transparent;
          color: #ff6ec4;
        }


         /* ========================= Twitch LIVE indicator ========================= */
        /* NOTE: The live indicator has been updated with a second block later in the CSS, 
          I have ensured the final version below is the one used for the compiled result. */

        /* Final version of live-indicator */
        #live-indicator {
          display: none; /* hidden by default */
          margin-left: 6px;
          font-size: 0.75rem;
          font-weight: bold;
          color: #ff0000;
          text-shadow: 0 0 6px rgba(255, 0, 0, 0.8), 0 0 12px rgba(255, 0, 0, 0.6);
          animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
          0% { opacity: 1; text-shadow: 0 0 6px rgba(255,0,0,0.9), 0 0 12px rgba(255,0,0,0.7); }
          50% { opacity: 0.5; text-shadow: 0 0 3px rgba(255,0,0,0.6), 0 0 8px rgba(255,0,0,0.4); }
          100% { opacity: 1; text-shadow: 0 0 6px rgba(255,0,0,0.9), 0 0 12px rgba(255,0,0,0.7); }
        }
        /* ===== Main Card ===== */
        .card {
            position: relative;
            width: 100%; max-width: 520px;
            background: var(--glass-bg);
            backdrop-filter: blur(18px) saturate(140%);
            border: 1px solid var(--glass-stroke);
            border-radius: 28px;
            padding: 22px;
            box-shadow: 0 10px 30px var(--shadow);
            overflow: hidden;
            isolation: isolate;
        }

        .card::before {
            content: "";
            position: absolute; inset: -2px;
            border-radius: inherit;
            background: conic-gradient(from 0deg at 50% 50%, #7bf2ff, #9a7bff, #ff86d6, #ffd66b, #7bf2ff);
            filter: blur(18px);
            opacity: 0.4;
            z-index: -2;
            animation: spin 9s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .row { display: flex; align-items: center; gap: 20px; }
        .icon { width: 80px; height: 80px; background: #1a1c23; border-radius: 22px; border: 1px solid var(--glass-stroke); overflow: hidden; }
        .icon img { width: 100%; height: 100%; object-fit: cover; }
        .name { font-size: 1.5rem; font-weight: 800; margin-bottom: 6px; }
        .meta { display: flex; gap: 15px; font-size: 0.85rem; color: var(--muted); }
        .status-item { display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .dot.online { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
        .dot.total { background: #718096; }
        .divider { height: 1px; background: linear-gradient(90deg, transparent, var(--glass-stroke), transparent); margin: 25px 0; }
        .footer { display: flex; justify-content: space-between; align-items: center; }

        .btn {
            display: inline-flex; align-items: center; gap: 10px; border: 0; border-radius: 16px; padding: 12px 18px; font-weight: 700;
            background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0.06));
            color: #fff; text-decoration: none; position: relative; transition: all .2s;
        }

        .btn::before {
            content: ""; position: absolute; inset: -1px; border-radius: inherit;
            background: linear-gradient(90deg, #00f5ff, #9e7bff, #ff86d6, #ffe27a);
            filter: blur(6px); opacity: .6; z-index: -1;
        }

        .btn:hover { transform: translateY(-2px); filter: brightness(1.2); }
        .est { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; }
    </style>
</head>
<body>

    <nav id="horizontal-nav" class="horizontal-nav">
        <a href="schedule.html" class="nav-link schedule-link" title="Schedule"><i class="fas fa-calendar-alt"></i></a>
        <a href="stream-commands.html" class="nav-link stream-commands-link" title="Commands"><i class="fas fa-sticky-note"></i></a>
        <a href="twitch.html" class="nav-link twitch-link is-live" title="Twitch">
            <span id="live-indicator">LIVE</span>
            <i class="fab fa-twitch"></i>     
        </a>
        <a href="youtube.html" class="nav-link youtube-link" title="YouTube"><i class="fab fa-youtube"></i></a>
        <a href="kick.html" class="nav-link kick-link" title="Kick"><i class="fab fa-kickstarter-k"></i></a>
        <a href="discord.html" class="nav-link discord-link" title="Discord"><i class="fab fa-discord"></i></a>
    </nav>

    <header>
      <div>
        <h2>Join MY Community</h2>
        <h5>Official Discord Server</h5>
      </div>
    </header> 

    <article class="card">
        <div class="row">
            <div class="icon">
                <img id="guildIcon" src="https://assets-global.website-files.com/6257adef93867e3d0394e2b1/6257adef93867eaf1194e314_discord-logo-clyde-white%402x.png" alt="Server icon" />
            </div>

            <div class="title">
                <div class="name" id="guildName">Discord Server</div>
                <div class="meta">
                    <div class="status-item"><div class="dot online"></div><span id="online">—</span> Online</div>
                    <div class="status-item"><div class="dot total"></div><span id="total">—</span> Members</div>
                </div>
            </div>
        </div>

        <div class="divider"></div>

        <div class="footer">
            <div class="est" id="established">Est. April 2020</div>
            <a id="inviteLink" href="https://discord.gg/RxNnfV8YcZ" class="btn" target="_blank" rel="noopener">
                Join Server
                <i class="fas fa-external-link-alt" style="font-size: 0.8rem;"></i>
            </a>
        </div>
    </article>
    
    <script>
        (async () => {
            const INVITE_CODE = "RxNnfV8YcZ";
            const inviteAPI = `https://discord.com/api/v9/invites/${INVITE_CODE}?with_counts=true`;

            const elName = document.getElementById('guildName');
            const elIcon = document.getElementById('guildIcon');
            const elOnline = document.getElementById('online');
            const elTotal = document.getElementById('total');
            const liveIndicator = document.getElementById("live-indicator");

            function format(n) { return Intl.NumberFormat().format(n); }

            async function fetchDiscordData() {
                try {
                    const res = await fetch(inviteAPI, { cache: "no-store" });
                    if (!res.ok) return;
                    const data = await res.json();
                    
                    if (data.guild) {
                        elName.textContent = data.guild.name;
                        elIcon.src = `https://cdn.discordapp.com/icons/${data.guild.id}/${data.guild.icon}.webp?size=128`;
                        elOnline.textContent = format(data.approximate_presence_count);
                        elTotal.textContent = format(data.approximate_member_count);
                    }

                    // Live Indicator Toggle Logic (Set to true to show)
                    const isLive = true; 
                    if (liveIndicator) {
                        liveIndicator.parentElement.classList.toggle('is-live', isLive);
                    }

                } catch (err) {
                    console.warn("Discord API blocked or unavailable.");
                }
            }

            fetchDiscordData();
            setInterval(fetchDiscordData, 60000);
        })();
    </script>
</body>
</html>
