<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sleek Vertical Chat v2</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script type="text/javascript" src="https://unpkg.com/@streamerbot/client/dist/streamerbot-client.js"></script>

<style>
/* Clean font stack: Inter for readability, Share Tech for that technical/RE vibe */

* { margin:0; padding:0; box-sizing:border-box; }

body {
    background: transparent;
    font-family: 'Inter', sans-serif;
    color: #fff;
    overflow: hidden;
    padding: 40px 80px; /* Space for floating avatars */
}

#event-feed {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-start;
    gap: 20px; 
    width: 500px;
    height: calc(100vh - 80px); 
}

/* DEBUG PANEL (only shown with ?debug=1 in URL) */
#debug-panel {
    display: none;
    position: fixed;
    top: 10px;
    right: 10px;
    width: 480px;
    max-height: 90vh;
    overflow-y: auto;
    background: rgba(0, 0, 0, 0.9);
    border: 2px solid #4afde5;
    border-radius: 8px;
    padding: 12px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: #4afde5;
    z-index: 9999;
    white-space: pre-wrap;
    word-break: break-word;
}
#debug-panel.active { display: block; }
#debug-panel h3 { color: #ff5e5e; margin-bottom: 6px; font-size: 13px; }
#debug-panel .field-result { color: #faed7b; margin-bottom: 8px; }
#debug-panel .field-result span { color: #5effad; }

/* THE CARD CONTAINER - MINIMAL GLASSMORPHISM */
.card {
    position: relative;
    display: flex;
    align-items: center;
    padding: 10px 16px 10px 15px;
    min-height: 65px;
    width: max-content;
    min-width: 220px;
    max-width: 500px;
    flex-shrink: 0;
    
    background: linear-gradient(135deg, rgba(15, 15, 20, 0.65) 0%, rgba(5, 5, 10, 0.55) 100%);
    -webkit-backdrop-filter: blur(15px) saturate(150%);
    backdrop-filter: blur(15px) saturate(150%);
    
    border-radius: 4px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    
    animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* FLOATING AVATAR - Detached with the -60px gap. Now a flex column so the
   timestamp chip lays out relative to the avatar itself instead of being
   guessed with a magic top offset. */
.avatar-wrap {
    position: absolute;
    left: -60px;
    top: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    z-index: 10;
}

.avatar-wrap .avatar-img {
    width: 50px;
    height: 50px;
    background: #000;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 0 15px rgba(0,0,0,0.8);
    overflow: hidden;
}

.avatar-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: contrast(1.1) brightness(1.1);
}

/* timestamp chip - now a normal flex child under the avatar, not absolutely positioned */
.timestamp {
    width: 50px;
    text-align: center;
    font-size: 0.55rem;
    font-family: 'Share Tech Mono', monospace;
    color: rgb(72, 247, 217);
    background: rgba(0, 0, 0, 0.35);
    padding: 1px 0;
    border-radius: 3px;
    white-space: nowrap;
}

/* THE EVENT COLOR BAR - GLOWING INDICATOR */
.card::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 5%;
    right: 5%;
    height: 3px;
    border-radius: 3px 3px 0 0;
    filter: blur(1px);
}

/* EVENT COLOR RESPECT - INDICATORS */
.card.chat::after      { background: #7945f3; box-shadow: 0 0 10px #7945f3; }
.card.sub::after       { background: #da70fa; box-shadow: 0 0 10px #da70fa; }
.card.giftsub::after   { background: #da70fa; box-shadow: 0 0 10px #da70fa; }
.card.raid::after      { background: #ff2222; box-shadow: 0 0 10px #ff2222; }
.card.bits::after      { background: #e248f7; box-shadow: 0 0 10px #e248f7; }
.card.points::after    { background: #dff756; box-shadow: 0 0 10px #dff756; }
.card.streak::after    { background: #4afde5; box-shadow: 0 0 10px #4afde5; }
.card.dono::after      { background: #00ff7f; box-shadow: 0 0 10px #00ff7f; }

/* USERNAME NEONS */
.card.chat .username     { color: #b08fff; text-shadow: 0 0 5px rgba(177, 146, 250, 0.9); }
.card.sub .username      { color: #c278ff; text-shadow: 0 0 5px rgba(194, 120, 255, 0.9); }
.card.giftsub .username  { color: #e59bff; text-shadow: 0 0 5px rgba(229, 155, 255, 0.9); }
.card.raid .username     { color: #ff5e5e; text-shadow: 0 0 5px rgba(255, 94, 94, 0.9); }
.card.bits .username     { color: #e248f7; text-shadow: 0 0 5px rgba(226, 72, 247, 0.9); }
.card.points .username   { color: #e9f88c; text-shadow: 0 0 5px rgba(233, 248, 140, 0.9); }
.card.streak .username   { color: #4afde5; text-shadow: 0 0 5px rgba(74, 253, 229, 0.9); }
.card.dono .username     { color: #5effad; text-shadow: 0 0 5px rgba(94, 255, 173, 0.9); }

/* PRONOUNS TAG */
.pronouns {
    font-size: 0.65rem;
    font-weight: 400;
    color: #faed7b;
    background: rgba(255, 255, 255, 0.08);
    padding: 1px 5px;
    border-radius: 3px;
    margin-left: auto; /* Locked to the right */
    vertical-align: middle;
    text-transform: lowercase;
    flex-shrink: 0;
}

/* badges, ported from Neon */
.event-badges {
    display: flex;
    gap: 0.3rem;
    align-items: center;
    margin-left: 6px;
    flex-shrink: 0;
}
.event-badges img {
    height: 1.1rem;
    width: 1.1rem;
    object-fit: contain;
    filter: drop-shadow(0 0 2px rgba(255,255,255,0.2)) brightness(1.1);
}

/* event label (e.g. "Viking Re-Sub", "Raid Incoming"), ported from Neon */
.event-label {
    font-size: 0.6rem;
    font-family: 'Share Tech Mono', monospace;
    color: #4afde5;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 2px;
}

/* TEXT CONTENT */
.content { flex: 1; min-width: 0; }

.top-row {
    display: flex;
    align-items: center;
    width: 100%;
    margin-bottom: 2px;
}

.username {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: -0.2px;
    white-space: nowrap;
}

.event-message {
    font-size: 0.95rem;
    color: #cecece;
    border-top: 1px solid rgba(255,255,255,0.05);
    margin-top: 4px;
    padding-top: 4px;
    line-height: 1.3;
    word-break: break-word;
}

/* emote sizing, ported from Neon */
.emote {
    height: 1.6em;
    vertical-align: middle;
    margin: 0 3px;
    object-fit: contain;
}

/* TWITCH LOGO */
.twitch-icon {
    font-size: 18px;
    color: #9146FF;
    opacity: 0.8;
    margin-left: 10px;
    filter: drop-shadow(0 0 8px rgba(145, 70, 255, 0.6));
    flex-shrink: 0;
}

/* ANIMATIONS */
@keyframes slideIn {
    0% { transform: translateX(-30px); opacity: 0; filter: blur(5px); }
    100% { transform: translateX(0); opacity: 1; filter: blur(0); }
}

.removing {
    animation: slideOut 0.4s ease forwards;
}

@keyframes slideOut {
    to { transform: translateX(50px); opacity: 0; filter: blur(10px); }
}
</style>
</head>

<body>

<div id="event-feed"></div>
<div id="debug-panel">
    <h3>🐛 DEBUG MODE — Last Event</h3>
    <div class="field-result" id="debug-resolved"></div>
    <div id="debug-json"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const WS_HOST = params.get("address") || "localhost";
const WS_PORT = params.get("port")    || "8080";
const DEBUG   = params.get("debug") === "1";

const MAX_CARDS = 6;
const CARD_LIFETIME = 15000;

/* THEMES, ported from Neon - maps a Streamer.bot event key to the card's
   CSS class + optional label. Keeps Sleek's card class names (chat/sub/raid/etc)
   so all the existing color-bar / username CSS above still applies untouched. */
const THEMES = {
    CHAT:           { cssClass: "chat",    label: "" },
    SUBSCRIPTION:   { cssClass: "sub",     label: "Viking Re-Sub" },
    GIFT_SUB:       { cssClass: "giftsub", label: "Gift Sub" },
    RAID:           { cssClass: "raid",    label: "Raid Incoming" },
    BITS:           { cssClass: "bits",    label: "Power Cells" },
    CHANNEL_POINTS: { cssClass: "points",  label: "Redeem" },
};

if (DEBUG) {
    document.getElementById("debug-panel").classList.add("active");
}

const avatarCache = new Map();
const pronounCache = new Map();

/**
 * Direct field checks for known Streamer.bot event shapes, ported from Neon.
 * Wider net than Sleek's old extractLogin() - covers nested `message` objects
 * and EventSub-style from_broadcaster_* fields too.
 */
function directFindUsername(data) {
    return (
        // data.user is the canonical TwitchUser object on ChatMessage/Sub/Raid as of the
        // 1.0.5+ EventSub migration (finalized in 1.0.7) - this is the primary path now.
        data.user?.name || data.user?.login ||
        data.username || data.userName || data.userLogin || data.user_login ||
        data.user_name || data.displayName || data.display_name ||
        // Shared Chat raid/announcement events use a "source" TwitchBaseUser instead of "user"
        data.source?.name || data.source?.login ||
        data.from_broadcaster_user_name || data.fromBroadcasterUserName ||
        data.from_broadcaster_user_login || data.fromBroadcasterUserLogin ||
        data.login || data.name ||
        null
    );
}

/**
 * Fallback: recursively walks the entire payload looking for any key
 * that plausibly holds a username, in case the actual field name doesn't
 * match any of our known variants. Ported from Neon - directFindUsername
 * should be the primary path once we know the real field name from debug mode.
 */
function deepFindUsername(obj, depth = 0) {
    if (!obj || typeof obj !== "object" || depth > 4) return null;
    const priorityKeys = [
        "username", "userName", "user_login", "userLogin",
        "displayName", "display_name", "user_name", "login", "name"
    ];
    for (const key of priorityKeys) {
        if (typeof obj[key] === "string" && obj[key].trim() && obj[key] !== "undefined") {
            return obj[key];
        }
    }
    for (const key in obj) {
        const val = obj[key];
        if (val && typeof val === "object") {
            const found = deepFindUsername(val, depth + 1);
            if (found) return found;
        }
    }
    return null;
}

function extractUsername(data) {
    return directFindUsername(data) || deepFindUsername(data);
}

function renderDebug(rawData, type, resolvedUser, resolvedAvatar) {
    if (!DEBUG) return;
    document.getElementById("debug-resolved").innerHTML =
        `Event: <span>${type}</span> | Username found: <span>${resolvedUser || "❌ NONE"}</span> | Avatar: <span>${resolvedAvatar ? "✅" : "❌"}</span>`;
    document.getElementById("debug-json").textContent = JSON.stringify(rawData, null, 2);
}

async function getPronouns(username) {
    if (!username) return "";
    const key = username.toLowerCase();
    if (pronounCache.has(key)) return pronounCache.get(key);
    try {
        const res = await fetch(`https://pronouns.alejo.io/api/users/${key}`);
        if (!res.ok) return "";
        const data = await res.json();
        if (data?.length > 0) {
            const p = data[0].pronoun_id;
            const map = { "hehim": "he/him", "sheher": "she/her", "theythem": "they/them", "hethey": "he/they", "shethey": "she/they" };
            const result = map[p] || p;
            pronounCache.set(key, result);
            return result;
        }
    } catch (e) { console.error("Pronoun error:", e); }
    return "";
}

/**
 * Live avatar fetch via decapi.me, ported from Neon. Sleek previously only
 * used whatever avatar URL happened to already be on the payload (or a
 * ui-avatars.com placeholder) - this actually pulls the real Twitch pfp.
 */
async function getAvatar(username) {
    if (!username) return `https://ui-avatars.com/api/?name=Unknown`;
    const key = username.toLowerCase();
    if (avatarCache.has(key)) return avatarCache.get(key);
    try {
        const res = await fetch(`https://decapi.me/twitch/avatar/${key}`);
        const url = await res.text();
        if (!url || url.includes("Error") || url.includes("error")) {
            const fallback = `https://ui-avatars.com/api/?name=${encodeURIComponent(username)}`;
            avatarCache.set(key, fallback);
            return fallback;
        }
        avatarCache.set(key, url);
        return url;
    } catch (_) {
        return `https://ui-avatars.com/api/?name=${encodeURIComponent(username)}`;
    }
}

/**
 * Emote rendering, ported from Neon. Sleek previously dumped data.message
 * straight into innerHTML with no emote image support at all.
 */
function insertEmotes(data) {
    // data.parts is the current parts-format message body; data.text is the plain-text
    // fallback on the same schema. data.message (legacy) was removed as of Streamer.bot 1.0.5.
    if (!data.parts) return data.text || "";
    let output = "";
    data.parts.forEach(part => {
        if (part.type === "text") output += part.text;
        else if (part.type === "emote") output += `<img class="emote" src="${part.imageUrl}">`;
    });
    return output;
}

/* Connection layer swapped from raw WebSocket + custom "StreamEvent" action
   to the official StreamerbotClient SDK, ported from Neon. This means chat/
   sub/raid cards now fire straight off Streamer.bot's native Twitch events -
   no custom C# action required to broadcast a "Custom" event first. */
const client = new StreamerbotClient({ host: WS_HOST, port: WS_PORT });

async function handleEvent(data, type, customMsg = "") {
    const user = extractUsername(data);
    if (!user) {
        console.warn(`[Sleek Chat] No username found for ${type} event — check this payload shape:`, data);
    }
    const [avatar, pronouns] = await Promise.all([getAvatar(user), getPronouns(user)]);
    renderDebug(data, type, user, avatar);
    createCard(data, type, avatar, pronouns, customMsg, user);
}

client.on('Twitch.ChatMessage', ({ data }) => handleEvent(data, "CHAT"));
client.on('Twitch.Sub', ({ data }) => handleEvent(data, "SUBSCRIPTION", "Joined the Clan!"));
client.on('Twitch.GiftSub', ({ data }) => handleEvent(data, "GIFT_SUB", "Gifted a sub!"));
client.on('Twitch.Raid', ({ data }) => handleEvent(data, "RAID", `Raid of ${data.viewers}!`));

function createCard(data, eventKey, avatarUrl, pronouns = "", customMsg = "", resolvedUser = "") {
    const feed = document.getElementById("event-feed");
    if (!feed) return;

    const theme = THEMES[eventKey] || THEMES.CHAT;

    const displayName = data.user?.name || data.user?.login || data.displayName || data.display_name || data.userName || data.user_name || data.username || data.name || resolvedUser || "User";
    const displayText = customMsg || insertEmotes(data);
    // Badges live on data.user.badges per Streamer.bot's TwitchUser schema (confirmed current
    // as of the 1.0.5+ EventSub migration, finalized in 1.0.7).
    const badgeList = data.user?.badges || [];
    const badgesHtml = badgeList.map(b => `<img src="${b.imageUrl}" title="${b.name || ''} ${b.version || ''}">`).join('');

    const now = new Date();
    const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    const card = document.createElement("div");
    card.className = `card ${theme.cssClass}`;

    const pronounTag = pronouns ? `<span class="pronouns">${pronouns}</span>` : "";

    card.innerHTML = `
        <div class="avatar-wrap">
            <div class="avatar-img">
                <img src="${avatarUrl}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(displayName)}'">
            </div>
            <span class="timestamp">${timeString}</span>
        </div>
        <div class="content">
            <div class="top-row">
                <span class="username">${displayName}</span>
                <div class="event-badges">${badgesHtml}</div>
                ${pronounTag}
            </div>
            ${theme.label ? `<div class="event-label">${theme.label}</div>` : ""}
            ${displayText ? `<div class="event-message">${displayText}</div>` : ""}
        </div>
        <i class="fa-brands fa-twitch twitch-icon"></i>
    `;

    feed.appendChild(card);

    if (feed.children.length > MAX_CARDS) {
        removeCard(feed.firstElementChild);
    }

    setTimeout(() => removeCard(card), CARD_LIFETIME);
}

function removeCard(el) {
    if (!el || el.classList.contains("removing")) return;
    el.classList.add("removing");
    el.addEventListener("animationend", () => el.remove(), { once: true });
}
</script>

</body>
</html>
