<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Vertical Chat v3.5</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script type="text/javascript" src="https://unpkg.com/@streamerbot/client/dist/streamerbot-client.js"></script>

<style>
/* ════════════════════════════════════════════════
    RESET & TOKENS
════════════════════════════════════════════════ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --col-chat:     #b08fff;
    --col-sub:      #c278ff;
    --col-giftsub:  #e59bff;
    --col-raid:     #ff5e5e;
    --col-bits:     #e248f7;
    --col-points:   #e9f88c;
    --col-streak:   #4afde5;
    --col-dono:     #5effad;

    --glow-chat:    rgba(177, 146, 250, 0.9);
    --glow-sub:     rgba(194, 120, 255, 0.9);
    --glow-raid:    rgba(255, 94, 94, 0.9);

    --bar-chat:     #7945f3;
    --bar-sub:      #da70fa;
    --bar-raid:     #ff2222;
}

body {
    background: transparent;
    font-family: 'Share Tech Mono', monospace;
    color: #fff;
    overflow: hidden;
    padding: 60px 120px;
}

#event-feed {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-start; /* Keeps cards aligned to the left */
    gap: 25px;
    width: 100%; /* Changed from fixed 580px */
    height: calc(100vh - 120px);
}

/* ════════════════════════════════════════════════
    CARD BASE (The Slim Fix)
════════════════════════════════════════════════ */
.card {
    position: relative;
    display: flex;
    flex-direction: column;
    padding: 10px 18px;
    
    /* SLIM LOGIC */
    width: max-content;      /* Card hugs the text width */
    min-width: 180px;        /* Prevents it from being too tiny */
    max-width: 500px;        /* Limits width for long messages */
    
    background: linear-gradient(135deg, rgba(12, 10, 20, 0.507) 0%, rgba(5, 4, 12, 0.479) 100%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
    animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* Left Neon Accent Bar */
.card::before {
    content: '';
    position: absolute;
    left: 0; top: 15%; bottom: 15%;
    width: 4px;
    border-radius: 0 4px 4px 0;
}

.card.chat::before { background: var(--bar-chat); box-shadow: 0 0 12px var(--bar-chat); }
.card.sub::before  { background: var(--bar-sub);  box-shadow: 0 0 12px var(--bar-sub); }
.card.raid::before { background: var(--bar-raid); box-shadow: 0 0 12px var(--bar-raid); }

/* ════════════════════════════════════════════════
    AVATAR & TIMESTAMP
════════════════════════════════════════════════ */
.avatar-wrap {
    position: absolute;
    left: -80px; /* Adjusted slightly for slimmer profile */
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
}

.timestamp {
    font-size: 0.6rem;
    color: rgb(72, 247, 217);
    background: rgba(0, 0, 0, 0.3);
    padding: 1px 4px;
    border-radius: 3px;
    white-space: nowrap;
}

.avatar-wrap img {
    width: 48px; /* Slightly smaller to match slim card */
    height: 48px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.2);
    background: #000;
    object-fit: cover;
}

/* ════════════════════════════════════════════════
    USER HEADER (Name + Badges Row)
════════════════════════════════════════════════ */
.user-header {
    display: flex;
    align-items: center;
    justify-content: space-between; /* Keeps badges and name spread out */
    gap: 12px;
    margin-bottom: 4px;
}

.username {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    white-space: nowrap;
}

.card.chat .username { color: var(--col-chat); text-shadow: 0 0 8px var(--glow-chat); }
.card.sub .username  { color: var(--col-sub);  text-shadow: 0 0 8px var(--glow-sub); }
.card.raid .username { color: var(--col-raid); text-shadow: 0 0 8px var(--glow-raid); }

.event-badges {
    display: flex;
    gap: 0.3rem; /* Using rem for consistent spacing */
    align-items: center;
}

.event-badges img {
    /* Increased size using rem for better visibility */
    height: 1.50rem; 
    width: 1.50rem;
    object-fit: contain;
    
    /* Optional: Subtle brightness boost to help them pop against the dark BG */
    filter: drop-shadow(0 0 2px rgba(255,255,255,0.2)) brightness(1.1);
}
/* ════════════════════════════════════════════════
    CONTENT AREA (Pronouns, Label, Message)
════════════════════════════════════════════════ */
.content {
    display: flex;
    flex-direction: column;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    padding-top: 6px;
}

.top-row {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 2px;
}

.pronouns {
    font-size: 1.20rem;
    color: #faed7b;
    background: rgba(255, 255, 255, 0.08);
    padding: 1px 5px;
    border-radius: 3px;
    text-transform: lowercase;
}

.event-label {
    font-size: 0.65rem;
    color: var(--col-streak);
    font-weight: bold;
    text-transform: uppercase;
    margin-bottom: 2px;
}

.event-message {
    font-size: 1rem;
    color: #efefef;
    line-height: 1.3;
    word-break: break-word;
}

.emote {
    /* Increased from 1.7em to 2.0em for better visibility */
    height: 2.0em; 
    
    /* Ensures the emote sits naturally on the text line */
    vertical-align: middle; 
    
    /* Slight increase in horizontal margin to prevent crowding text */
    margin: 0 4px; 
    
    /* Optional: Improves rendering of small icons */
    object-fit: contain; 
}

/* ════════════════════════════════════════════════
    ANIMATIONS
════════════════════════════════════════════════ */
@keyframes slideIn {
    0%   { transform: translateX(-30px); opacity: 0; }
    100% { transform: translateX(0); opacity: 1; }
}

.removing { animation: slideOut 0.4s ease forwards; }
@keyframes slideOut { to { transform: translateX(50px); opacity: 0; } }

</style>
</head>
<body>

<div id="event-feed"></div>

<script>
const params = new URLSearchParams(window.location.search);
const WS_HOST = params.get("address") || "localhost";
const WS_PORT = params.get("port")    || "8080";

const MAX_CARDS = 5;
const CARD_LIFETIME = 25000;

const THEMES = {
    CHAT:           { cssClass: "chat",    label: "" },
    SUBSCRIPTION:   { cssClass: "sub",     label: "Viking Re-Sub" },
    RAID:           { cssClass: "raid",    label: "Raid Incoming" },
    BITS:           { cssClass: "bits",    label: "Power Cells" },
    CHANNEL_POINTS: { cssClass: "points",  label: "Redeem" },
};

const avatarCache = new Map();
const pronounCache = new Map();

async function getPronouns(username) {
    if (!username) return "";
    const key = username.toLowerCase();
    if (pronounCache.has(key)) return pronounCache.get(key);
    try {
        const res = await fetch(`https://pronouns.alejo.io/api/users/${key}`);
        const data = await res.json();
        if (data?.length > 0) {
            const result = data[0].pronoun_id.replace("hehim", "He/Him").replace("sheher", "She/Her").replace("theythem", "They/Them");
            pronounCache.set(key, result);
            return result;
        }
    } catch (_) {}
    return "";
}

async function getAvatar(username) {
    const key = username.toLowerCase();
    if (avatarCache.has(key)) return avatarCache.get(key);
    try {
        const res = await fetch(`https://decapi.me/twitch/avatar/${key}`);
        const url = await res.text();
        avatarCache.set(key, url);
        return url;
    } catch (_) { return `https://decapi.me/twitch/avatar/${key}`; }
}

function insertEmotes(data) {
    if (!data.parts) return data.message?.message || data.message || "";
    let output = "";
    data.parts.forEach(part => {
        if (part.type === "text") output += part.text;
        else if (part.type === "emote") output += `<img class="emote" src="${part.imageUrl}">`;
    });
    return output;
}

const client = new StreamerbotClient({ host: WS_HOST, port: WS_PORT });

async function handleEvent(data, type, customMsg = "") {
    const user = data.user_name || data.name || data.message?.username || data.from_broadcaster_user_name;
    const [avatar, pronouns] = await Promise.all([getAvatar(user), getPronouns(user)]);
    createCard(data, type, avatar, pronouns, customMsg);
}

client.on('Twitch.ChatMessage', ({ data }) => handleEvent(data, "CHAT"));
client.on('Twitch.Sub', ({ data }) => handleEvent(data, "SUBSCRIPTION", "Joined the Clan!"));
client.on('Twitch.Raid', ({ data }) => handleEvent(data, "RAID", `Raid of ${data.viewers}!`));

function createCard(data, eventKey, avatarUrl, pronouns = "", customMsg = "") {
    const feed = document.getElementById("event-feed");
    const theme = THEMES[eventKey] || THEMES.CHAT;
    const m = data.message || data;
    
    const displayName = m.displayName || m.user_name || m.name || "User";
    const displayText = customMsg || insertEmotes(data);
    const badgesHtml = (m.badges) ? m.badges.map(b => `<img src="${b.imageUrl}">`).join('') : '';
    
    const now = new Date();
    const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    const card = document.createElement("div");
    card.className = `card ${theme.cssClass}`;

    // --- YOUR REQUESTED HTML STRUCTURE ---
    card.innerHTML = `
        <div class="avatar-wrap">
            <span class="timestamp">${timeString}</span>
            <img src="${avatarUrl}" onerror="this.src='https://ui-avatars.com/api/?name=${displayName}'">
        </div>
        <div class="user-header">
            <span class="username">${displayName}</span>
            <div class="event-badges">${badgesHtml}</div>
        </div>
        <div class="content">
            <div class="top-row">
                ${pronouns ? `<span class="pronouns">${pronouns}</span>` : ""}
            </div>
            ${theme.label ? `<div class="event-label">${theme.label}</div>` : ""}
            <div class="event-message">${displayText}</div>
        </div>
    `;

    feed.appendChild(card);
    if (feed.children.length > MAX_CARDS) removeCard(feed.firstElementChild);
    setTimeout(() => removeCard(card), CARD_LIFETIME);
}

function removeCard(el) {
    if (!el || el.classList.contains("removing")) return;
    el.classList.add("removing");
    el.addEventListener("animationend", () => el.remove(), { once: true });
}
</script>
</body>
</html>
