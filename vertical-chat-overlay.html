<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sleek Vertical Chat 3.1</title>

<!-- Streamer.bot WebSocket Client -->
<script src="https://cdn.jsdelivr.net/npm/@streamerbot/client/dist/streamerbot-client.js"></script>

<style>
/* Clean font stack: Inter for body, Share Tech Mono for that technical/RE vibe */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Share+Tech+Mono&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

body {
    background: transparent;
    font-family: 'Inter', sans-serif;
    color: #fff;
    overflow: hidden;
    padding: 40px 80px; /* Space for floating avatars */
}

#event-feed {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-start; /* cards hug their own content width instead of stretching */
    gap: 20px;
    width: 500px;
    height: calc(100vh - 80px);
}

/* THE CARD CONTAINER - MINIMAL GLASSMORPHISM */
.card {
    position: relative;
    display: flex;
    align-items: center;
    padding: 10px 16px 10px 20px;
    min-height: 65px;
    width: fit-content;   /* shrink for short messages ("hi") */
    max-width: 460px;     /* cap width, wraps + grows down for longer messages */
    min-width: 210px;     /* keep tiny messages from looking cramped */
    flex-shrink: 0;

    background: linear-gradient(135deg, rgba(15, 15, 20, 0.65) 0%, rgba(5, 5, 10, 0.55) 100%);
    -webkit-backdrop-filter: blur(15px) saturate(150%);
    backdrop-filter: blur(15px) saturate(150%);

    border-radius: 4px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-left: 3px solid rgba(121, 69, 243, 0.9);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);

    animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* EVENT COLOR RESPECT - LEFT BAR PER TYPE */
.card.chat      { border-left-color: #7945f3; }
.card.sub       { border-left-color: #da70fa; }
.card.giftsub   { border-left-color: #da70fa; }
.card.raid      { border-left-color: #ff2222; }
.card.bits      { border-left-color: #e248f7; }
.card.points    { border-left-color: #dff756; }
.card.streak    { border-left-color: #4afde5; }
.card.dono      { border-left-color: #00ff7f; }

/* USERNAME NEONS (fallback when Twitch doesn't provide a chat color) */
.card.chat .username     { color: #b08fff; text-shadow: 0 0 5px rgba(177, 146, 250, 0.9); }
.card.sub .username      { color: #c278ff; text-shadow: 0 0 5px rgba(194, 120, 255, 0.9); }
.card.giftsub .username  { color: #e59bff; text-shadow: 0 0 5px rgba(229, 155, 255, 0.9); }
.card.raid .username     { color: #ff5e5e; text-shadow: 0 0 5px rgba(255, 94, 94, 0.9); }
.card.bits .username     { color: #e248f7; text-shadow: 0 0 5px rgba(226, 72, 247, 0.9); }
.card.points .username   { color: #e9f88c; text-shadow: 0 0 5px rgba(233, 248, 140, 0.9); }
.card.streak .username   { color: #4afde5; text-shadow: 0 0 5px rgba(74, 253, 229, 0.9); }
.card.dono .username     { color: #5effad; text-shadow: 0 0 5px rgba(94, 255, 173, 0.9); }

/* AVATAR + TIMESTAMP COLUMN - floats to the left of the card */
.avatar-col {
    position: absolute;
    left: -63px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    z-index: 10;
}

.timestamp {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.5px;
    color: #4afde5;
    text-shadow: 0 0 6px rgba(74, 253, 229, 0.7);
    white-space: nowrap;
}

.avatar-wrap {
    width: 50px;
    height: 50px;
    background: #000;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 0 15px rgba(0,0,0,0.8);
    overflow: hidden;
}

.avatar-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: contrast(1.1) brightness(1.1);
}

/* TEXT CONTENT */
.content { flex: 1; min-width: 0; max-width: 100%; }

.top-row {
    display: flex;
    align-items: center;
    width: 100%;
    margin-bottom: 2px;
    gap: 8px;
}

.username {
    font-family: 'Share Tech Mono', monospace;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: -0.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* BADGES - real Twitch badge images pulled from data.user.badges */
.badges-wrap {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-left: auto;
    flex-shrink: 0;
}

.chat-badge {
    width: 20px;
    height: 20px;
    display: block;
    filter: drop-shadow(0 0 3px rgba(0,0,0,0.6));
}

/* PRONOUNS TAG */
.pronouns {
    font-size: 0.65rem;
    font-weight: 400;
    color: #faed7b;
    background: rgba(255, 255, 255, 0.08);
    padding: 1px 5px;
    border-radius: 3px;
    vertical-align: middle;
    text-transform: lowercase;
    flex-shrink: 0;
}

.event-message {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.9rem;
    color: #cecece;
    border-top: 1px solid rgba(255,255,255,0.05);
    margin-top: 4px;
    padding-top: 4px;
    line-height: 1.5;
    word-wrap: break-word;
}

/* EMOTES - inline images sized to text, from data.emotes[].ImageUrl */
.chat-emote {
    height: 1.6em;
    width: auto;
    vertical-align: middle;
    margin: -2px 2px;
}

/* ANIMATIONS */
@keyframes slideIn {
    0% { transform: translateX(-30px); opacity: 0; filter: blur(5px); }
    100% { transform: translateX(0); opacity: 1; filter: blur(0); }
}

.removing {
    animation: slideOut 0.4s ease forwards;
}

@keyframes slideOut {
    to { transform: translateX(50px); opacity: 0; filter: blur(10px); }
}
</style>
</head>

<body>

<div id="event-feed"></div>

<script>
const params = new URLSearchParams(window.location.search);
const host = params.get("address") || "127.0.0.1";
const port = params.get("port") || "8080";

const MAX_CARDS = 6;
const pronounCache = new Map();
const avatarCache = new Map();

// ---------- helpers ----------

function escapeHtml(str) {
    if (!str) return "";
    return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

async function getPronouns(username) {
    if (!username) return "";
    if (pronounCache.has(username)) return pronounCache.get(username);
    try {
        const response = await fetch(`https://pronouns.alejo.io/api/users/${username}`);
        if (!response.ok) return "";
        const data = await response.json();
        if (data && data.length > 0) {
            const p = data[0].pronoun_id;
            const map = { "hehim": "he/him", "sheher": "she/her", "theythem": "they/them", "hethey": "he/they", "shethey": "she/they" };
            const finalPronoun = map[p] || p;
            pronounCache.set(username, finalPronoun);
            return finalPronoun;
        }
    } catch (e) { console.error("Pronoun error:", e); }
    return "";
}

// decapi returns a plain-text avatar URL that needs to be fetched/resolved
async function getAvatar(login) {
    if (!login) return "";
    if (avatarCache.has(login)) return avatarCache.get(login);
    try {
        const res = await fetch(`https://decapi.me/twitch/avatar/${login}`);
        const url = (await res.text()).trim();
        if (url && url.startsWith("http")) {
            avatarCache.set(login, url);
            return url;
        }
    } catch (e) { console.error("Avatar error:", e); }
    return "";
}

// Render real Twitch badges (data.user.badges: {name, version, imageUrl, info})
function renderBadges(badges) {
    if (!badges || !badges.length) return "";
    return badges
        .filter(b => b && b.imageUrl)
        .map(b => {
            const title = escapeHtml(`${b.name || ""}${b.version ? " " + b.version : ""}`);
            return `<img class="chat-badge" src="${b.imageUrl}" title="${title}" alt="${title}">`;
        })
        .join("");
}

// Replace emote spans in the raw message text with the real emote images
// data.emotes: [{ Type, Name, StartIndex, EndIndex, ImageUrl }]
function renderMessage(text, emotes) {
    text = text || "";
    if (!emotes || !emotes.length) return escapeHtml(text);

    const sorted = [...emotes].sort((a, b) => a.StartIndex - b.StartIndex);
    let result = "";
    let cursor = 0;

    for (const emote of sorted) {
        if (emote.StartIndex == null || emote.StartIndex < cursor) continue;
        result += escapeHtml(text.substring(cursor, emote.StartIndex));
        const alt = escapeHtml(emote.Name || "");
        result += `<img class="chat-emote" src="${emote.ImageUrl}" alt="${alt}" title="${alt}">`;
        cursor = (emote.EndIndex != null ? emote.EndIndex : emote.StartIndex) + 1;
    }
    result += escapeHtml(text.substring(cursor));
    return result;
}

function formatTime(iso) {
    const d = iso ? new Date(iso) : new Date();
    if (isNaN(d.getTime())) return new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}

// ---------- card rendering ----------

async function createCard(data) {
    const feed = document.getElementById("event-feed");
    if (!feed) return;

    const user = data.user || {};
    const login = (user.login || "").toLowerCase();
    const displayName = user.name || user.login || "Unknown";

    const [pronouns, avatarUrl] = await Promise.all([
        getPronouns(login),
        getAvatar(login)
    ]);

    const card = document.createElement("div");
    card.className = "card chat";

    const colorStyle = user.color
        ? ` style="color:${user.color}; text-shadow: 0 0 5px ${user.color}99;"`
        : "";

    const badgesHTML = renderBadges(user.badges);
    const pronounTag = pronouns ? `<span class="pronouns">${escapeHtml(pronouns)}</span>` : "";
    const messageHTML = renderMessage(data.text, data.emotes);
    const timeStr = formatTime(data.createdAt);

    card.innerHTML = `
        <div class="avatar-col">
            <span class="timestamp">${timeStr}</span>
            <div class="avatar-wrap">
                <img src="${avatarUrl || 'https://via.placeholder.com/50'}" onerror="this.src='https://via.placeholder.com/50'">
            </div>
        </div>
        <div class="content">
            <div class="top-row">
                <span class="username"${colorStyle}>${escapeHtml(displayName)}</span>
                <div class="badges-wrap">${badgesHTML}${pronounTag}</div>
            </div>
            ${data.text ? `<div class="event-message">${messageHTML}</div>` : ""}
        </div>
    `;

    feed.appendChild(card);

    if (feed.children.length > MAX_CARDS) {
        const oldest = feed.firstChild;
        oldest.classList.add("removing");
        oldest.addEventListener("animationend", () => oldest.remove());
    }

    setTimeout(() => {
        if (card.parentElement) {
            card.classList.add("removing");
            card.addEventListener("animationend", () => card.remove());
        }
    }, 15000);
}

// ---------- Streamer.bot client ----------

// Initialize the Streamer.bot WebSocket Client
const client = new StreamerbotClient({
    host,
    port,
    endpoint: "/",
    onConnect: () => console.log("Connected to Streamer.bot"),
    onDisconnect: () => console.log("Disconnected from Streamer.bot")
});

// Subscribe to "Twitch.ChatMessage" events and register a callback
client.on('Twitch.ChatMessage', ({ event, data }) => {
    // Code here will run every time the event is received!
    console.log('Received event:', event.source, event.type);
    console.log('Event data:', data);

    createCard(data);
});
</script>

</body>
</html>
