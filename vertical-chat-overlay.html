<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sleek Vertical Chat v2.2</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Share+Tech+Mono&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

body {
    background: transparent;
    font-family: 'Inter', sans-serif;
    color: #fff;
    overflow: hidden;
    padding: 40px 80px; 
}

#event-feed {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 20px; 
    width: 500px;
    height: calc(100vh - 80px); 
}

.card {
    position: relative;
    display: flex;
    align-items: center;
    padding: 10px 16px 10px 15px;
    min-height: 65px;
    flex-shrink: 0;
    background: linear-gradient(135deg, rgba(15, 15, 20, 0.65) 0%, rgba(5, 5, 10, 0.55) 100%);
    -webkit-backdrop-filter: blur(15px);
    backdrop-filter: blur(15px) saturate(150%);
    border-radius: 4px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    animation: slideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.emote { 
    height: 1.2em; 
    vertical-align: middle; 
    margin: 0 2px;
    display: inline-block;
}

.avatar-wrap {
    position: absolute;
    left: -60px; 
    width: 50px;
    height: 50px;
    background: #000;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.3);
    z-index: 10;
    overflow: hidden;
}

.avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }

.card::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 5%;
    right: 5%;
    height: 3px;
    border-radius: 3px 3px 0 0;
    filter: blur(1px);
}

/* Theme Colors */
.card.chat::after      { background: #7945f3; box-shadow: 0 0 10px #7945f3; }
.card.sub::after       { background: #da70fa; box-shadow: 0 0 10px #da70fa; }
.card.giftsub::after   { background: #da70fa; box-shadow: 0 0 10px #da70fa; }
.card.raid::after      { background: #ff2222; box-shadow: 0 0 10px #ff2222; }
.card.bits::after      { background: #e248f7; box-shadow: 0 0 10px #e248f7; }
.card.points::after    { background: #dff756; box-shadow: 0 0 10px #dff756; }
.card.streak::after    { background: #4afde5; box-shadow: 0 0 10px #4afde5; }
.card.dono::after      { background: #00ff7f; box-shadow: 0 0 10px #00ff7f; }

.username { font-size: 1.1rem; font-weight: 700; color: #b08fff; }
.pronouns { font-size: 0.65rem; color: #faed7b; background: rgba(255, 255, 255, 0.08); padding: 1px 5px; border-radius: 3px; margin-left: auto; text-transform: lowercase; }
.content { flex: 1; min-width: 0; }
.top-row { display: flex; align-items: center; width: 100%; margin-bottom: 2px; }
.event-message { font-size: 0.95rem; color: #cecece; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 4px; padding-top: 4px; }
.twitch-icon { font-size: 18px; color: #9146FF; opacity: 0.8; margin-left: 10px; flex-shrink: 0; }

@keyframes slideIn { 0% { transform: translateX(-30px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
.removing { animation: slideOut 0.4s ease forwards; }
@keyframes slideOut { to { transform: translateX(50px); opacity: 0; } }
</style>
</head>
<body>

<div id="event-feed"></div>

<script>
const params = new URLSearchParams(window.location.search);
const host = params.get("address") || "localhost";
const port = params.get("port") || "8080";
const ws = new WebSocket(`ws://${host}:${port}/`);

const THEMES = {
    CHAT:           { cssClass: "chat" },
    SUBSCRIPTION:   { cssClass: "sub" },
    GIFT_SUB:       { cssClass: "giftsub" },
    RAID:           { cssClass: "raid" },
    BITS:           { cssClass: "bits" },
    CHANNEL_POINTS: { cssClass: "points" },
    WATCH_STREAK:   { cssClass: "streak" },
    DONATION:       { cssClass: "dono" },
};

const MAX_CARDS = 6;
const pronounCache = new Map();

async function getPronouns(username) {
    if (pronounCache.has(username)) return pronounCache.get(username);
    try {
        const res = await fetch(`https://pronouns.alejo.io/api/users/${username}`);
        if (!res.ok) return "";
        const data = await res.json();
        if (data && data.length > 0) {
            const p = data[0].pronoun_id;
            const map = { "hehim": "he/him", "sheher": "she/her", "theythem": "they/them", "hethey": "he/they", "shethey": "she/they" };
            const final = map[p] || p;
            pronounCache.set(username, final);
            return final;
        }
    } catch (e) { }
    return "";
}

ws.onopen = () => ws.send(JSON.stringify({ request: "Subscribe", events: { general: ["Custom"] }, id: "VerticalFeed" }));

ws.onmessage = async (event) => {
    let payload;
    try {
        const msg = JSON.parse(event.data);
        payload = typeof msg.data === "string" ? JSON.parse(msg.data) : msg.data || msg;
    } catch (e) { return; }

    if (payload?.eventName === "StreamEvent") {
        let pronouns = payload.pronouns;
        if (!pronouns && payload.type === "CHAT") pronouns = await getPronouns(payload.userLogin);
        createCard(payload, pronouns);
    }
};

function createCard(data, pronouns) {
    const feed = document.getElementById("event-feed");
    const theme = THEMES[data.type] || THEMES["CHAT"];
    const card = document.createElement("div");
    card.className = `card ${theme.cssClass}`;

    card.innerHTML = `
        <div class="avatar-wrap">
            <img src="${data.avatar}" onerror="this.src='https://via.placeholder.com/50'">
        </div>
        <div class="content">
            <div class="top-row">
                <span class="username">${data.user}</span>
                ${pronouns ? `<span class="pronouns">${pronouns}</span>` : ""}
            </div>
            <div class="event-message">${data.message || data.value || ''}</div>
        </div>
        <i class="fa-brands fa-twitch twitch-icon"></i>
    `;

    feed.appendChild(card);
    if (feed.children.length > MAX_CARDS) {
        const oldest = feed.firstChild;
        oldest.classList.add("removing");
        oldest.onanimationend = () => oldest.remove();
    }
    setTimeout(() => { if(card.parentNode) { card.classList.add("removing"); card.onanimationend = () => card.remove(); } }, 20000);
}
</script>
</body>
</html>
