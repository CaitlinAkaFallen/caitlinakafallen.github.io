<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FallenOneArt - Level Up Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-navy:#0a0915;
    --teal:#7de8c8;
    --purple:#c8a2ff;
    --gold:#ffd27d;
    --pink:#ff8fd0;
    --glass-bg: rgba(20, 18, 36, 0.55);
    --glass-border: rgba(255,255,255,0.14);
    --card-w: 320px;
    --card-h: 84px;
  }

  html,body{ margin:0; padding:0; width:100%; height:100%; background: transparent !important; overflow:hidden; font-family:'Share Tech Mono', monospace; }

  body.showcase-bg{
    background:
      radial-gradient(circle at 20% 20%, rgba(125,232,200,0.10), transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(200,162,255,0.10), transparent 45%),
      var(--bg-navy) !important;
  }

  #stage{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; perspective: 1400px; }

  /* ================= LAYOUT: HORIZONTAL (default) =================
     Layout/style live on each .card element (not #stage) so a
     viewer's personal preference can override the global default
     for just their own card instance. */
  .card[data-layout="horizontal"]{ width: 320px; height: 84px; }
  .card[data-layout="horizontal"] .front{ flex-direction:row; align-items:center; gap:8px; padding:8px 10px; }
  .card[data-layout="horizontal"] .info{ flex:1; min-width:0; }
  .card[data-layout="horizontal"] .username{ font-size:19px; }

  /* ================= LAYOUT: VERTICAL ================= */
  .card[data-layout="vertical"]{ width: 176px; height: 220px; }
  .card[data-layout="vertical"] .front{ flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:14px 10px; text-align:center; }
  .card[data-layout="vertical"] .avatar-wrap{ width:64px; height:64px; }
  .card[data-layout="vertical"] .info{ width:100%; align-items:center; }
  .card[data-layout="vertical"] .username{ font-size:15px; max-width:150px; }
  .card[data-layout="vertical"] .event-tag{ text-align:center; }
  .card[data-layout="vertical"] .xp-row{ width:100%; }

  /* ================= LAYOUT: COMPACT ================= */
  .card[data-layout="compact"]{ width: 236px; height: 58px; }
  .card[data-layout="compact"] .front{ flex-direction:row; align-items:center; gap:6px; padding:6px 9px; }
  .card[data-layout="compact"] .info{ flex:1; min-width:0; gap:2px; }
  .card[data-layout="compact"] .avatar-wrap{ width:36px; height:36px; }
  .card[data-layout="compact"] .username{ font-size:13px; }
  .card[data-layout="compact"] .event-tag{ font-size:9px; }
  .card[data-layout="compact"] .xp-row{ font-size:9px; }
  .card[data-layout="compact"] .xp-bar-track{ height:6px; }
  .card[data-layout="compact"] .level-badge{ min-width:14px; height:14px; font-size:7px; }

  .card{
    position:relative; transform-style: preserve-3d; opacity: 0;
    transform: rotateY(90deg) scale(0.92);
    transition: transform 0.85s cubic-bezier(.22,.9,.24,1.15), opacity 0.5s ease, width .3s ease, height .3s ease;
  }
  .card.is-in{ opacity:1; transform: rotateY(0deg) scale(1); }
  .card.is-flipped{ transform: rotateY(180deg) scale(1); }
  .card.is-out{ opacity:0; transform: rotateY(-100deg) scale(0.9); transition: transform 0.6s cubic-bezier(.5,0,.75,0), opacity 0.45s ease 0.15s; }

  .face{
    position:absolute; inset:0; border-radius: var(--card-radius, 18px); backface-visibility:hidden;
    background: var(--glass-bg); border:1px solid var(--glass-border);
    -webkit-backdrop-filter: blur(14px) saturate(140%); backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 8px 40px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.03);
    overflow:hidden; display:flex;
  }
  .face::before{
    content:""; position:absolute; inset:-2px; border-radius: var(--card-radius-outer, 20px); padding:2px;
    background: linear-gradient(135deg, var(--accent, var(--teal)), var(--accent2, var(--purple)));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; opacity:.65; pointer-events:none;
  }

  /* ---- STYLE: MINIMAL (flat, no blur, no glow) ---- */
  .card[data-style="minimal"] .face{ -webkit-backdrop-filter:none; backdrop-filter:none; background:#15132a; box-shadow:0 4px 16px rgba(0,0,0,.4); }
  .card[data-style="minimal"] .face::before{ opacity:.4; }
  .card[data-style="minimal"] .username{ text-shadow:none; }
  .card[data-style="minimal"] .lvl-up-number{ filter:none; }
  .card[data-style="minimal"] .avatar-ring{ animation:none; }

  /* ---- STYLE: CRT (scanlines, amber-leaning) ---- */
  .card[data-style="crt"] .face{ background:#0c0a06; border-color:rgba(255,210,125,.3); }
  .card[data-style="crt"] .face::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:multiply;
  }
  .card[data-style="crt"] .username, .card[data-style="crt"] .event-tag{ font-family:'Share Tech Mono', monospace; letter-spacing:0.5px; }

  .avatar-wrap{ position:relative; width:52px; height:52px; flex:0 0 auto; }
  .avatar-clip{ position:absolute; inset:0; border-radius:50%; overflow:hidden; }
  .avatar-ring{ position:absolute; inset:-3px; border-radius:50%; background: conic-gradient(from 0deg, var(--accent, var(--teal)), var(--accent2, var(--purple)), var(--accent, var(--teal))); filter: blur(0.3px); animation: spin 6s linear infinite; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .avatar-img{ position:absolute; top:2px; left:2px; width:calc(100% - 4px); height:calc(100% - 4px); border-radius:50%; object-fit:cover; object-position:center; background:#1a1830; border:1.5px solid var(--bg-navy); box-sizing:border-box; }
  .level-badge{ position:absolute; bottom:-3px; right:-3px; z-index:3; min-width:18px; height:18px; padding:0 2px; border-radius:50%; background: linear-gradient(135deg, var(--accent, var(--teal)), var(--accent2, var(--purple))); display:flex; align-items:center; justify-content:center; font-family:'Orbitron', sans-serif; font-weight:900; font-size:9px; color:#0a0915; box-shadow: 0 0 12px rgba(0,0,0,0.5), 0 0 calc(10px * var(--glow-scale, 1)) var(--accent, var(--teal)); border: 1.5px solid var(--bg-navy); }

  .info{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .username{ font-family:'Orbitron', sans-serif; font-weight:700; color:#f4f2ff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow: 0 0 calc(12px * var(--glow-scale, 1)) rgba(125,232,200,0.35); }
  .event-tag{ font-size:11px; letter-spacing:1px; text-transform:uppercase; color: var(--accent, var(--teal)); opacity:0.9; }
  .xp-row{ display:flex; justify-content:space-between; font-size:11px; color:#c9c6dd; }
  .xp-row .xp-numbers.is-hidden{ display:none; }
  .avatar-wrap.is-hidden{ display:none; }
  .level-badge.is-hidden{ display:none; }
  .xp-bar-track.is-hidden{ display:none; }
  .xp-bar-track{ height:9px; border-radius:5px; overflow:hidden; background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1); }
  .xp-bar-fill{ height:100%; width:0%; border-radius:5px; background: linear-gradient(90deg, var(--accent, var(--teal)), var(--accent2, var(--purple))); box-shadow: 0 0 calc(10px * var(--glow-scale, 1)) var(--accent, var(--teal)); transition: width 1.1s cubic-bezier(.3,.9,.3,1); }

  .back{ transform: rotateY(180deg); flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:10px; }
  .back .burst{ position:absolute; inset:0; background: radial-gradient(circle, rgba(255,255,255,0.18), transparent 60%); animation: burstPulse 1.4s ease-out infinite; }
  @keyframes burstPulse{ 0%{ opacity:.9; transform:scale(0.4);} 100%{ opacity:0; transform:scale(1.6);} }
  .back .lvl-up-label{ font-family:'Orbitron', sans-serif; font-weight:700; font-size:8px; letter-spacing:3px; color: var(--accent2, var(--purple)); text-shadow: 0 0 calc(14px * var(--glow-scale, 1)) var(--accent2, var(--purple)); z-index:2; }
  .back .lvl-up-number{ font-family:'Orbitron', sans-serif; font-weight:900; font-size:30px; background: linear-gradient(135deg, var(--accent, var(--teal)), var(--accent2, var(--purple))); -webkit-background-clip:text; background-clip:text; color:transparent; filter: drop-shadow(0 0 calc(18px * var(--glow-scale, 1)) var(--accent2, var(--purple))); z-index:2; line-height:1; }
  .back .lvl-up-user{ font-family:'Share Tech Mono', monospace; font-size:9px; color:#e9e6ff; opacity:.85; z-index:2; }
  .back .reward-badge{ z-index:2; font-size:22px; margin-top:2px; filter: drop-shadow(0 0 8px var(--accent2, var(--purple))); }
  .back .reward-title{ z-index:2; font-family:'Orbitron', sans-serif; font-weight:700; font-size:10px; color:var(--gold); letter-spacing:1px; text-align:center; }
  .back .reward-message{ z-index:2; font-size:8.5px; color:#cfc9ec; text-align:center; max-width:90%; line-height:1.3; }

  .spark{ position:absolute; top:50%; left:50%; width:6px; height:6px; border-radius:50%; background: var(--accent, var(--teal)); box-shadow: 0 0 8px var(--accent, var(--teal)); opacity:0; }
  .spark.animate{ animation: sparkFly 0.9s ease-out forwards; }
  @keyframes sparkFly{ 0%{ opacity:1; transform: translate(-50%,-50%) rotate(var(--ang)) translateX(0) scale(1);} 100%{ opacity:0; transform: translate(-50%,-50%) rotate(var(--ang)) translateX(var(--dist)) scale(0.3);} }
</style>
</head>
<body>
<div id="stage"></div>

<script>
/* ============================================================
   CONFIG / SHARED STATE
   Sync model: this card, the admin dashboard, and the viewer
   dashboard are assumed to run on the same machine (browser
   source + local browser tabs), same as the music player dash.
   - localStorage  = persisted config/user records
   - BroadcastChannel = instant cross-tab push (layout/style/reward
     config changes, and manual test/grant events from admin)
   - Streamer.bot WS = real live Twitch events -> XP grants
   ============================================================ */
const params = new URLSearchParams(window.location.search);
if (params.get("preview") === "1") document.body.classList.add("showcase-bg");

const LS_DISPLAY = "fallenoneart_levelup_display";   // { layout, style, accentPrimary, accentSecondary, glowIntensity, cornerRadius, showAvatar, showBadge, showXp, showProgress }
const LS_REWARDS = "fallenoneart_levelup_rewards";   // [{level, title, badge, message}]
const LS_USERS   = "fallenoneart_levelup_users";     // { [user]: {xp, level, unlockedLevels:[], history:[{level, ts}]} }
const LS_CURVE   = "fallenoneart_levelup_curve";     // { base, growth }
const LS_XPRATES = "fallenoneart_levelup_xprates";   // { [eventName]: { amount, perUnit } }
const CHANNEL    = "fallenoneart_levelup_channel";

const HOLD_MS         = 2600;
const LEVELUP_HOLD_MS = 2600;
const FLIP_MS         = 850;
const DEFAULT_AVATAR = "data:image/svg+xml;utf8," + encodeURIComponent(
  `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='#1a1830'/><circle cx='50' cy='38' r='18' fill='#7de8c8' opacity='0.5'/><ellipse cx='50' cy='88' rx='30' ry='24' fill='#7de8c8' opacity='0.5'/></svg>`
);

const stage = document.getElementById("stage");
const bc = ("BroadcastChannel" in window) ? new BroadcastChannel(CHANNEL) : null;

/* Keys every user record by a normalized (trimmed, lowercased) username so
   a viewer's Twitch-login-based record (from the viewer dashboard) always
   matches their live-event record (from Streamer.bot / admin), regardless
   of what casing each source happens to send. Display text still uses the
   original casing from the event itself. */
function normUser(u){ return (u || "viewer").trim().toLowerCase(); }

function tierColors(level){
  const tiers = [ ["#7de8c8","#c8a2ff"], ["#c8a2ff","#ff8fd0"], ["#ffd27d","#ff8fd0"], ["#ff8fd0","#7de8c8"], ["#ffd27d","#7de8c8"] ];
  return tiers[Math.min(Math.floor((level||1)/10), tiers.length-1)];
}

const EVENT_LABELS = { Sub:"New Subscriber", ReSub:"Resubscribed", GiftSub:"Gifted Subs", Cheer:"Cheered Bits", Donation:"Donation", Raid:"Raided the Channel", ChannelPointRedeem:"Redeemed Points", Manual:"XP Granted" };

/* Fallback rates used until the admin dashboard saves its own values */
function defaultXpRates(){
  return {
    Sub:                { amount:100, perUnit:false },
    ReSub:              { amount:80,  perUnit:false },
    GiftSub:            { amount:50,  perUnit:true  }, // × subs gifted
    Cheer:              { amount:1,   perUnit:true  }, // × bits
    Donation:           { amount:10,  perUnit:true  }, // × currency units (Streamlabs)
    Raid:               { amount:2,   perUnit:true  }, // × raiders
    ChannelPointRedeem: { amount:25,  perUnit:false }
  };
}
function loadXpRates(){
  const stored = load2(LS_XPRATES, null);
  return stored ? { ...defaultXpRates(), ...stored } : defaultXpRates();
}
function load2(key, fallback){ try{ const r = localStorage.getItem(key); return r ? JSON.parse(r) : fallback; }catch(e){ return fallback; } }
function loadCurve(){ return load2(LS_CURVE, { base:100, growth:1.15 }); }
function xpForNextFromCurve(level, curve){ return Math.round(curve.base * Math.pow(curve.growth, Math.max(0, level-1))); }
function levelFromXp(totalXp, curve){
  let level = 1, remaining = Math.max(0, totalXp), threshold = xpForNextFromCurve(1, curve);
  while (remaining >= threshold){ remaining -= threshold; level++; threshold = xpForNextFromCurve(level, curve); }
  return { level, xpIntoLevel: remaining, xpForNextLevel: threshold };
}

/* Turns a raw event ({eventName, user, avatar, quantity}) into a fully
   computed one ({..., xpGained, totalXp, level, xpIntoLevel, xpForNextLevel, leveledUp}).
   If the event already arrives fully computed (legacy Streamer.bot payloads,
   or the admin's manual Grant/Test tools), it's passed through untouched. */
function resolveEventData(raw){
  if (raw.xpGained !== undefined && raw.totalXp !== undefined) return raw;
  const rates = loadXpRates();
  const rate = rates[raw.eventName] || { amount:0, perUnit:false };
  const qty = Number(raw.quantity) || 1;
  const xpGained = Math.round(rate.amount * (rate.perUnit ? qty : 1));
  const users = loadUsers();
  const prevRec = users[normUser(raw.user)] || { xp:0, level:1 };
  const totalXp = (prevRec.xp || 0) + xpGained;
  const curve = loadCurve();
  const { level, xpIntoLevel, xpForNextLevel } = levelFromXp(totalXp, curve);
  const leveledUp = level > (prevRec.level || 1);
  return { ...raw, xpGained, totalXp, level, xpIntoLevel, xpForNextLevel, leveledUp };
}

/* ---------- config load/apply ---------- */
/* Matches the admin dashboard's defaultDisplayCfg() field-for-field so
   settings saved there (Layout, Style, Colors & Glow, Elements) all
   carry straight through to this overlay with no extra wiring needed. */
function defaultDisplayCfg(){
  return {
    layout:"horizontal",
    style:"glass",
    accentPrimary:"",
    accentSecondary:"",
    glowIntensity:60,
    cornerRadius:16,
    showAvatar:true,
    showBadge:true,
    showXp:true,
    showProgress:true
  };
}
function loadDisplay(){
  try{
    const raw = localStorage.getItem(LS_DISPLAY);
    const d = raw ? JSON.parse(raw) : {};
    return {
      ...defaultDisplayCfg(),
      ...d,
      layout: d.layout || params.get("layout") || "horizontal",
      style: d.style || params.get("style") || "glass"
    };
  }catch(e){ return defaultDisplayCfg(); }
}
let currentDisplay = loadDisplay();
function applyDisplay(d){ currentDisplay = d; }
applyDisplay(currentDisplay);

function loadRewards(){
  try{ return JSON.parse(localStorage.getItem(LS_REWARDS) || "[]"); }catch(e){ return []; }
}
function rewardForLevel(level){
  return loadRewards().find(r => Number(r.level) === Number(level));
}

function loadUsers(){
  try{ return JSON.parse(localStorage.getItem(LS_USERS) || "{}"); }catch(e){ return {}; }
}
function saveUsers(u){ localStorage.setItem(LS_USERS, JSON.stringify(u)); }

/* Record progress + reward unlock locally, then tell other tabs */
function recordProgress(data){
  const users = loadUsers();
  const key = normUser(data.user);
  const rec = users[key] || { xp:0, level:1, unlockedLevels:[], history:[] };
  rec.xp = data.totalXp ?? rec.xp;
  rec.level = data.level ?? rec.level;
  if (data.avatar) rec.avatar = data.avatar;
  if (data.leveledUp){
    rec.history.push({ level: data.level, ts: Date.now() });
    const rw = rewardForLevel(data.level);
    if (rw && !rec.unlockedLevels.includes(data.level)) rec.unlockedLevels.push(data.level);
  }
  users[key] = rec;
  saveUsers(users);
  bc && bc.postMessage({ type:"user_update", user:key, data:rec });
}

/* ---------- BroadcastChannel listeners (from admin/viewer dashboards) ---------- */
if (bc){
  bc.onmessage = (e) => {
    const msg = e.data || {};
    if (msg.type === "display_update"){
      // admin always saves to localStorage before broadcasting, so a full
      // reload here picks up every field (layout/style/colors/glow/elements)
      // in one shot rather than trying to merge partial broadcast payloads.
      applyDisplay(loadDisplay());
    } else if (msg.type === "rewards_update"){
      // nothing to render immediately, rewards are looked up at level-up time
    } else if (msg.type === "test_event" || msg.type === "live_event"){
      enqueue(msg.data);
    }
  };
}
// cross-tab fallback for browsers/contexts without BroadcastChannel
window.addEventListener("storage", (e) => {
  if (e.key === LS_DISPLAY) applyDisplay(loadDisplay());
});

/* ============================================================
   STREAMER.BOT WEBSOCKET (live Twitch events)
   ============================================================ */
let ws = null;
let connectedForReal = false;
// FIX: OBS browser sources never auto-refresh, so if the WebSocket to
// Streamer.bot ever drops or fails on first load (Streamer.bot not up yet,
// a restart, the PC waking from sleep, etc.), the card used to die silently
// forever — no error handling, no retry. This wraps the connection in a
// function that reconnects with a short delay any time it closes or errors,
// so a dropped connection recovers on its own instead of needing a manual
// "Refresh" in OBS.
function connectStreamerBot(){
  ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);
  ws.onopen = () => { ws.send(JSON.stringify({ request:"Subscribe", events:{ general:["Custom"] }, id:"LevelUp" })); };
  // Streamer.bot's WebSocketBroadcastJson is global — every action that
  // calls it (LevelUp, iPhoneCallTrigger, anything else) lands on this same
  // socket. Without a check here, any unrelated broadcast got rendered as a
  // fake "level up" card with +0 XP and stale/garbage numbers. Only enqueue
  // payloads explicitly tagged source:"levelup" by the C# LevelUp action.
  ws.onmessage = (event) => {
    const response = JSON.parse(event.data);
    if (response && response.data && response.data.source === "levelup") {
      connectedForReal = true; stopDemo();
      enqueue(response.data);
    }
  };
  ws.onerror = () => {};
  ws.onclose = () => { setTimeout(connectStreamerBot, 3000); };
}
connectStreamerBot();
// Demo/sample cards only run when explicitly requested via ?demo=1 in the
// browser source URL. They no longer auto-start just because the
// Streamer.bot WebSocket hasn't connected yet within 2.5s.
if (params.get("demo") === "1") {
  setTimeout(() => { if (!connectedForReal) startDemo(); }, 2500);
}

/* ============================================================
   QUEUE + RENDER
   ============================================================ */
const queue = [];
let processing = false;
function enqueue(data){ queue.push(resolveEventData(data)); if (!processing) processQueue(); }
async function processQueue(){ processing = true; while (queue.length){ await showCard(queue.shift()); } processing = false; }
function wait(ms){ return new Promise(r => setTimeout(r, ms)); }
function nextFrame(){ return new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))); }
function escapeHtml(str){ const d = document.createElement("div"); d.textContent = str; return d.innerHTML; }

async function showCard(data){
  const tier = tierColors(data.level || 1);
  // custom accent colors from the admin's Colors & Glow section win over the
  // level-tier auto colors; leave either field blank there to fall back to tiers.
  const accent = currentDisplay.accentPrimary || tier[0];
  const accent2 = currentDisplay.accentSecondary || tier[1];
  const users = loadUsers();
  const userPref = users[normUser(data.user)] || {};
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.layout = userPref.layoutPref || currentDisplay.layout;
  card.dataset.style = userPref.stylePref || currentDisplay.style;
  card.style.setProperty("--accent", accent);
  card.style.setProperty("--accent2", accent2);
  card.style.setProperty("--card-radius", (currentDisplay.cornerRadius ?? 16) + "px");
  card.style.setProperty("--card-radius-outer", ((currentDisplay.cornerRadius ?? 16) + 2) + "px");
  card.style.setProperty("--glow-scale", String((currentDisplay.glowIntensity ?? 60) / 60));

  const startPct = Math.max(0, Math.min(100, ((data.xpIntoLevel - data.xpGained) / (data.xpForNextLevel || 1)) * 100));
  const endPct   = Math.max(0, Math.min(100, (data.xpIntoLevel / (data.xpForNextLevel || 1)) * 100));
  const reward = data.leveledUp ? rewardForLevel(data.level) : null;

  const showAvatar = currentDisplay.showAvatar !== false;
  const showBadge = currentDisplay.showBadge !== false;
  const showXp = currentDisplay.showXp !== false;
  const showProgress = currentDisplay.showProgress !== false;

  card.innerHTML = `
    <div class="face front">
      <div class="avatar-wrap${showAvatar ? "" : " is-hidden"}">
        <div class="avatar-clip">
          <div class="avatar-ring"></div>
          <img class="avatar-img" src="${data.avatar || DEFAULT_AVATAR}" onerror="this.onerror=null;this.src='${DEFAULT_AVATAR}'">
        </div>
        <div class="level-badge${showBadge ? "" : " is-hidden"}">${data.level ?? 1}</div>
      </div>
      <div class="info">
        <div class="username">${escapeHtml(data.user || "viewer")}</div>
        <div class="event-tag">+${data.xpGained ?? 0} XP &middot; ${EVENT_LABELS[data.eventName] || data.eventName || "XP Gained"}</div>
        <div class="xp-row"><span>Lv ${data.level ?? 1}</span><span class="xp-numbers${showXp ? "" : " is-hidden"}">${data.xpIntoLevel ?? 0} / ${data.xpForNextLevel ?? 100} XP</span></div>
        <div class="xp-bar-track${showProgress ? "" : " is-hidden"}"><div class="xp-bar-fill" style="width:${startPct}%"></div></div>
      </div>
    </div>
    <div class="face back">
      <div class="burst"></div>
      <div class="lvl-up-label">LEVEL UP</div>
      <div class="lvl-up-number">${data.level ?? 1}</div>
      <div class="lvl-up-user">${escapeHtml(data.user || "viewer")}</div>
      ${reward ? `
        <div class="reward-badge">${escapeHtml(reward.badge || "\u2605")}</div>
        <div class="reward-title">${escapeHtml(reward.title || "Reward Unlocked")}</div>
        ${reward.message ? `<div class="reward-message">${escapeHtml(reward.message)}</div>` : ""}
      ` : ""}
    </div>
  `;
  stage.appendChild(card);

  await nextFrame();
  card.classList.add("is-in");
  await wait(FLIP_MS);

  const fill = card.querySelector(".xp-bar-fill");
  await nextFrame();
  fill.style.width = endPct + "%";
  await wait(1150);

  if (data.leveledUp){
    recordProgress(data);
    await wait(250);
    card.classList.add("is-flipped");
    spawnSparks(card);
    await wait(FLIP_MS + LEVELUP_HOLD_MS + (reward ? 500 : 0));
    card.classList.remove("is-flipped");
    await wait(FLIP_MS);
  } else {
    recordProgress(data);
    await wait(HOLD_MS - 1150);
  }

  card.classList.add("is-out");
  await wait(750);
  card.remove();
}

function spawnSparks(card){
  const back = card.querySelector(".back");
  const n = 14;
  for (let i=0;i<n;i++){
    const s = document.createElement("div");
    s.className = "spark";
    const ang = (360/n)*i, dist = 90 + Math.random()*40;
    s.style.setProperty("--ang", ang+"deg");
    s.style.setProperty("--dist", dist+"px");
    back.appendChild(s);
    requestAnimationFrame(() => s.classList.add("animate"));
    setTimeout(() => s.remove(), 1000);
  }
}

/* ---------- demo loop (opt-in only via ?demo=1) ---------- */
let demoTimer = null;
function startDemo(){
  if (demoTimer) return;
  const samples = [
    { eventName:"Sub", user:"PixelPioneer", avatar:"", xpGained:100, totalXp:420, level:4, xpIntoLevel:20, xpForNextLevel:500, leveledUp:false },
    { eventName:"Cheer", user:"BitBandit", avatar:"", xpGained:80, totalXp:590, level:4, xpIntoLevel:190, xpForNextLevel:500, leveledUp:false },
    { eventName:"GiftSub", user:"GenerousGoose", avatar:"", xpGained:500, totalXp:1090, level:5, xpIntoLevel:90, xpForNextLevel:600, leveledUp:true },
    { eventName:"Raid", user:"RaidCaptain", avatar:"", xpGained:150, totalXp:1240, level:5, xpIntoLevel:240, xpForNextLevel:600, leveledUp:false },
    { eventName:"Donation", user:"CoffeeSponsor", avatar:"", xpGained:250, totalXp:2340, level:6, xpIntoLevel:90, xpForNextLevel:700, leveledUp:true },
    { eventName:"ReSub", user:"LoyalLurker", avatar:"", xpGained:200, totalXp:2540, level:6, xpIntoLevel:290, xpForNextLevel:700, leveledUp:false },
  ];
  let i = 0;
  const run = () => { enqueue(samples[i % samples.length]); i++; };
  run();
  demoTimer = setInterval(run, 6500);
}
function stopDemo(){ if (demoTimer){ clearInterval(demoTimer); demoTimer = null; } }
