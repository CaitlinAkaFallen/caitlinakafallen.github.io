<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FallenOneArt - Level Up Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-navy:#0a0915;
    --teal:#7de8c8;
    --purple:#c8a2ff;
    --gold:#ffd27d;
    --pink:#ff8fd0;
    --glass-bg: rgba(20, 18, 36, 0.89);
    --glass-border: rgba(255,255,255,0.14);
    --card-w: 320px;
    --card-h: 84px;
  }

  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background: transparent !important;
    overflow:hidden;
    font-family:'Share Tech Mono', monospace;
  }

  /* Preview-only backdrop. OFF by default (transparent for real OBS capture).
     Turn it on for local testing with: levelup-overlay.html?preview=1 */
  body.showcase-bg{
    background:
      radial-gradient(circle at 20% 20%, rgba(125,232,200,0.10), transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(200,162,255,0.10), transparent 45%),
      var(--bg-navy) !important;
  }

  #stage{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    perspective: 1400px;
  }

  .card{
    width: var(--card-w);
    height: var(--card-h);
    position:relative;
    transform-style: preserve-3d;
    opacity: 0;
    transform: rotateY(90deg) scale(0.92);
    transition: transform 0.85s cubic-bezier(.22,.9,.24,1.15), opacity 0.5s ease;
  }
  .card.is-in{
    opacity:1;
    transform: rotateY(0deg) scale(1);
  }
  .card.is-flipped{
    transform: rotateY(180deg) scale(1);
  }
  .card.is-out{
    opacity:0;
    transform: rotateY(-100deg) scale(0.9);
    transition: transform 0.6s cubic-bezier(.5,0,.75,0), opacity 0.45s ease 0.15s;
  }

  .face{
    position:absolute; inset:0;
    border-radius:18px;
    backface-visibility:hidden;
    background: var(--glass-bg);
    border:1px solid var(--glass-border);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 8px 40px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.03);
    overflow:hidden;
  }

  .face::before{ /* accent glow ring, color driven by --accent / --accent2 */
    content:"";
    position:absolute; inset:-2px;
    border-radius:20px;
    padding:2px;
    background: linear-gradient(135deg, var(--accent, var(--teal)), var(--accent2, var(--purple)));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity:.65;
    pointer-events:none;
  }

  /* ---------- FRONT FACE ---------- */
  .front{ display:flex; align-items:center; gap:8px; padding:8px 10px; }

  .avatar-wrap{
    position:relative;
    width:52px; height:52px; flex:0 0 auto;
    /* NOTE: no overflow/border-radius here — this outer box must stay
       "open" so the level-badge below can overlap past the circle edge. */
  }
  .avatar-clip{
    position:absolute; inset:0;
    border-radius:50%;
    overflow:hidden; /* hard clip so the photo can NEVER escape the circle */
  }
  .avatar-ring{
    position:absolute; inset:-3px;
    border-radius:50%;
    background: conic-gradient(from 0deg, var(--accent, var(--teal)), var(--accent2, var(--purple)), var(--accent, var(--teal)));
    filter: blur(0.3px);
    animation: spin 6s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .avatar-img{
    position:absolute;
    top:2px; left:2px;
    width:calc(100% - 4px);
    height:calc(100% - 4px);
    border-radius:50%;
    object-fit:cover;
    object-position:center;
    background:#1a1830;
    border:1.5px solid var(--bg-navy);
    box-sizing:border-box;
  }
  .level-badge{
    position:absolute; bottom:-3px; right:-3px;
    z-index:3; /* sits above the clip layer, free to overlap the circle edge */
    min-width:18px; height:18px; padding:0 2px;
    border-radius:50%;
    background: linear-gradient(135deg, var(--accent, var(--teal)), var(--accent2, var(--purple)));
    display:flex; align-items:center; justify-content:center;
    font-family:'Orbitron', sans-serif; font-weight:900; font-size:9px;
    color:#0a0915;
    box-shadow: 0 0 12px rgba(0,0,0,0.5), 0 0 10px var(--accent, var(--teal));
    border: 1.5px solid var(--bg-navy);
  }

  .info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; }

  .username{
    font-family:'Orbitron', sans-serif; font-weight:700; font-size:19px;
    color:#f4f2ff;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    text-shadow: 0 0 12px rgba(125,232,200,0.35);
  }

  .event-tag{
    font-size:11px; letter-spacing:1px; text-transform:uppercase;
    color: var(--accent, var(--teal));
    opacity:0.9;
  }

  .xp-row{ display:flex; justify-content:space-between; font-size:11px; color:#c9c6dd; }
  .xp-bar-track{
    height:9px; border-radius:5px; overflow:hidden;
    background: rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.1);
  }
  .xp-bar-fill{
    height:100%; width:0%;
    border-radius:5px;
    background: linear-gradient(90deg, var(--accent, var(--teal)), var(--accent2, var(--purple)));
    box-shadow: 0 0 10px var(--accent, var(--teal));
    transition: width 1.1s cubic-bezier(.3,.9,.3,1);
  }

  /* ---------- BACK FACE (level up reveal) ---------- */
  .back{
    transform: rotateY(180deg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px;
  }
  .back .burst{
    position:absolute; inset:0;
    background: radial-gradient(circle, rgba(255,255,255,0.18), transparent 60%);
    animation: burstPulse 1.4s ease-out infinite;
  }
  @keyframes burstPulse{
    0%{ opacity:.9; transform:scale(0.4); }
    100%{ opacity:0; transform:scale(1.6); }
  }
  .back .lvl-up-label{
    font-family:'Orbitron', sans-serif; font-weight:700; font-size:8px;
    letter-spacing:3px; color: var(--accent2, var(--purple));
    text-shadow: 0 0 14px var(--accent2, var(--purple));
    z-index:2;
  }
  .back .lvl-up-number{
    font-family:'Orbitron', sans-serif; font-weight:900; font-size:30px;
    background: linear-gradient(135deg, var(--accent, var(--teal)), var(--accent2, var(--purple)));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter: drop-shadow(0 0 18px rgba(200,162,255,0.55));
    z-index:2;
    line-height:1;
  }
  .back .lvl-up-user{
    font-family:'Share Tech Mono', monospace; font-size:9px; color:#e9e6ff; opacity:.85; z-index:2;
  }

  .spark{
    position:absolute; top:50%; left:50%;
    width:6px; height:6px; border-radius:50%;
    background: var(--accent, var(--teal));
    box-shadow: 0 0 8px var(--accent, var(--teal));
    opacity:0;
  }
  .spark.animate{
    animation: sparkFly 0.9s ease-out forwards;
  }
  @keyframes sparkFly{
    0%{ opacity:1; transform: translate(-50%,-50%) rotate(var(--ang)) translateX(0) scale(1); }
    100%{ opacity:0; transform: translate(-50%,-50%) rotate(var(--ang)) translateX(var(--dist)) scale(0.3); }
  }
</style>
</head>
<body>
<div id="stage"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const params = new URLSearchParams(window.location.search);

// Default = fully transparent (correct for OBS Browser Source).
// Add ?preview=1 to the URL only when testing this file standalone
// in a normal browser tab, so you can actually see the card against something.
if (params.get("preview") === "1") {
  document.body.classList.add("showcase-bg");
}

const HOLD_MS        = 2600;   // how long the front face stays up after the bar fills
const LEVELUP_HOLD_MS= 2400;   // how long the "LEVEL UP" back face stays up
const FLIP_MS         = 850;
const DEFAULT_AVATAR = "data:image/svg+xml;utf8," + encodeURIComponent(
  `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='#1a1830'/><circle cx='50' cy='38' r='18' fill='#7de8c8' opacity='0.5'/><ellipse cx='50' cy='88' rx='30' ry='24' fill='#7de8c8' opacity='0.5'/></svg>`
);

// Tier colors — accent shifts every 10 levels to visually communicate rank
function tierColors(level){
  const tiers = [
    ["#7de8c8", "#c8a2ff"], // 1-9   teal -> purple
    ["#c8a2ff", "#ff8fd0"], // 10-19 purple -> pink
    ["#ffd27d", "#ff8fd0"], // 20-29 gold -> pink
    ["#ff8fd0", "#7de8c8"], // 30-39 pink -> teal
    ["#ffd27d", "#7de8c8"], // 40+   gold -> teal
  ];
  const idx = Math.min(Math.floor(level / 10), tiers.length - 1);
  return tiers[idx];
}

const EVENT_LABELS = {
  Sub: "New Subscriber",
  ReSub: "Resubscribed",
  GiftSub: "Gifted Subs",
  Cheer: "Cheered Bits",
  Donation: "Donation",
  Raid: "Raided the Channel"
};

/* ============================================================
   WEBSOCKET
   ============================================================ */
const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);
let connectedForReal = false;

ws.onopen = () => {
  ws.send(JSON.stringify({ request: "Subscribe", events: { general: ["Custom"] }, id: "LevelUp" }));
};

ws.onmessage = (event) => {
  connectedForReal = true;
  stopDemo();
  const response = JSON.parse(event.data);
  // Streamer.bot wraps broadcast payloads — the fields we sent land in response.data
  if (response && response.data) {
    enqueue(response.data);
  }
};

ws.onerror = () => {};
ws.onclose = () => {};

// If we never get a real message shortly after load, assume we're being
// previewed standalone (no Streamer.bot running) and show a demo loop instead.
setTimeout(() => { if (!connectedForReal) startDemo(); }, 2500);

/* ============================================================
   QUEUE
   ============================================================ */
const queue = [];
let processing = false;

function enqueue(data){
  queue.push(data);
  if (!processing) processQueue();
}

async function processQueue(){
  processing = true;
  while (queue.length){
    const data = queue.shift();
    await showCard(data);
  }
  processing = false;
}

function wait(ms){ return new Promise(r => setTimeout(r, ms)); }

/* ============================================================
   RENDER ONE LEVEL-UP CARD
   data = { eventName, user, avatar, xpGained, totalXp, level, xpIntoLevel, xpForNextLevel, leveledUp }
   ============================================================ */
async function showCard(data){
  const stage = document.getElementById("stage");

  const [accent, accent2] = tierColors(data.level || 1);

  const card = document.createElement("div");
  card.className = "card";
  card.style.setProperty("--accent", accent);
  card.style.setProperty("--accent2", accent2);

  const startPct = Math.max(0, Math.min(100,
    ((data.xpIntoLevel - data.xpGained) / (data.xpForNextLevel || 1)) * 100
  ));
  const endPct = Math.max(0, Math.min(100, (data.xpIntoLevel / (data.xpForNextLevel || 1)) * 100));

  card.innerHTML = `
    <div class="face front">
      <div class="avatar-wrap">
        <div class="avatar-clip">
          <div class="avatar-ring"></div>
          <img class="avatar-img" src="${data.avatar || DEFAULT_AVATAR}" onerror="this.onerror=null;this.src='${DEFAULT_AVATAR}'">
        </div>
        <div class="level-badge">${data.level ?? 1}</div>
      </div>
      <div class="info">
        <div class="username">${escapeHtml(data.user || "viewer")}</div>
        <div class="event-tag">+${data.xpGained ?? 0} XP &middot; ${EVENT_LABELS[data.eventName] || data.eventName || "XP Gained"}</div>
        <div class="xp-row"><span>Lv ${data.level ?? 1}</span><span>${data.xpIntoLevel ?? 0} / ${data.xpForNextLevel ?? 100} XP</span></div>
        <div class="xp-bar-track"><div class="xp-bar-fill" style="width:${startPct}%"></div></div>
      </div>
    </div>
    <div class="face back">
      <div class="burst"></div>
      <div class="lvl-up-label">LEVEL UP</div>
      <div class="lvl-up-number">${data.level ?? 1}</div>
      <div class="lvl-up-user">${escapeHtml(data.user || "viewer")}</div>
    </div>
  `;

  stage.appendChild(card);

  // Flip in
  await nextFrame();
  card.classList.add("is-in");
  await wait(FLIP_MS);

  // Animate xp bar filling
  const fill = card.querySelector(".xp-bar-fill");
  await nextFrame();
  fill.style.width = endPct + "%";
  await wait(1150);

  if (data.leveledUp){
    await wait(250);
    card.classList.add("is-flipped");
    spawnSparks(card);
    await wait(FLIP_MS + LEVELUP_HOLD_MS);
    card.classList.remove("is-flipped");
    await wait(FLIP_MS);
  } else {
    await wait(HOLD_MS - 1150);
  }

  // Flip out
  card.classList.add("is-out");
  await wait(750);
  card.remove();
}

function spawnSparks(card){
  const back = card.querySelector(".back");
  const n = 14;
  for (let i = 0; i < n; i++){
    const s = document.createElement("div");
    s.className = "spark";
    const ang = (360 / n) * i;
    const dist = 90 + Math.random() * 40;
    s.style.setProperty("--ang", ang + "deg");
    s.style.setProperty("--dist", dist + "px");
    back.appendChild(s);
    requestAnimationFrame(() => s.classList.add("animate"));
    setTimeout(() => s.remove(), 1000);
  }
}

function nextFrame(){ return new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))); }

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

</script>
</body>
</html>
