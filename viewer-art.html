        <style>
        /* General Body Styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(#40f1fd, #9f51f8);
            color: #333;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        /* Global Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* Container with responsive width */
        .container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            transition: margin-left 0.3s ease-in-out;
            padding-top: 60px;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Navbar Styling */
        .navbar {
            background-color: rgba(51, 51, 51, 0.8);
            color: #fff;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(30px);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
        }

        /* Navbar menu responsive */
        .navbar ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-wrap: wrap;
        }

        .navbar li {
            padding: 8px 16px;
            cursor: pointer;
            transition: background 0.3s;
            margin: 0 5px;
        }

        .navbar li:hover {
            background-color: #575757;
        }

        .navbar img {
            width: 24px;
            height: 24px;
            vertical-align: middle;
            margin-right: 8px;
        }

        /* HOME Icon styling */
        .home-icon {
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .home-icon img {
            margin-right: 10px;
        }

        /* Grid 1 (Main Grid) */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); /* Grid setup for responsive layout */
            gap: 20px; /* Adds spacing between items */
            justify-items: center; /* Centers items horizontally */
            align-items: center; /* Centers items vertically */
            padding: 10px;
            box-sizing: border-box;
        }

        /* Grid 2 (Second Set of Images) */
        .grid2 {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); /* Same responsive grid as Grid 1 */
            gap: 20px; /* Adds spacing between items */
            justify-items: center; /* Centers items horizontally */
            align-items: center; /* Centers items vertically */
            padding: 10px;
            box-sizing: border-box;
        }

        /* Image Item Styling */
        .image-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            max-width: 100%; /* Prevents the item from overflowing */
        }

        .image-item img {
            width: 100%; /* Full width for responsive layout */
            height: auto;
            border-radius: 10px;
            object-fit: cover;
            display: block;
            margin: 0 auto;
        }

        .image-item img:hover {
            transform: scale(1.05);
        }

        /* Caption Styling */
        .caption {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 5px;
            border-radius: 5px;
            text-align: center;
            font-size: 14px;
            margin-top: 10px;
        }

        /* Size Variations */
        .image-item.large img {
            width: 300px;
        }

        .image-item.medium img {
            width: 250px;
        }

        .image-item.small img {
            width: 200px;
        }

        /* Responsive Grid for Large Images */
        .grids2 {
            display: flex;
            gap: 15px;
            overflow-x: hidden;
            white-space: nowrap;
            flex-wrap: wrap;
            justify-content: center;
        }

        .large-image-item {
            flex: 0 1 auto;
            border-radius: 10px;
            overflow: hidden;
            width: 250px;
        }

        .large-image-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.3s;
        }

        .large-image-item img:hover {
            transform: scale(1.05);
        }

        #welcome {
            background: rgba(249, 249, 249, 0.7);  /* A light grey background with transparency */
            backdrop-filter: blur(10px);             /* Apply a 10px blur effect on the background */
            -webkit-backdrop-filter: blur(10px);     /* Safari support */
            padding: 40px;                           /* Internal spacing around the content */
            margin: 30px auto;                       /* Centered section with vertical spacing */
            max-width: 800px;                        /* Maximum width for readability */
            border-radius: 10px;                     /* Rounded corners for a soft look */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);  /* A subtle shadow to lift the section */
            text-align: center;                      /* Center the text within the section */
        }


        /* Styling the header within the welcome section */
        #welcome h1 {
            font-family: 'Georgia', serif;    /* Elegant, classic font for titles */
            font-size: 2.5rem;                  /* Large font size for the main header */
            margin-bottom: 20px;                /* Space below the header */
            color: #36a9b1;                     /* Accent color for the header text */
            position: relative;                 /* Needed for the pseudo-element positioning */
        }

        /* Adding a fancy underline using a pseudo-element */
        #welcome h1::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -10px;                         /* Adjust this value for vertical position */
            transform: translateX(-50%);          /* Center the underline */
            width: 260px;                         /* Length of the underline */
            height: 4px;                         /* Thickness of the underline */
            background-color: #36a9b1;        /* Matching the header color */
            border-radius: 2px;                /* Gives a subtle rounded effect */
            overflow: hidden;                 /*Ensures no overflow from the parent */
        }

        /* Styling the paragraphs inside the welcome section */
        #welcome p {
            font-family: 'Arial', sans-serif; /* Clean, modern font for body text */
            font-size: 1.1rem;                /* A bit larger for readability */
            line-height: 1.6;                 /* Improved line spacing for clarity */
            color: #7c0b86;                      /* A slightly softer dark color for text */
            margin-bottom: 20px;              /* Consistent spacing between paragraphs */
        }

        /* Footer */
        footer {
            text-align: center;
            position: relative;
        }

        footer h3 {
            color: rgb(241, 243, 247);
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        /* Social Links in Navbar */
        .social-links {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .social-links a {
            text-decoration: none;
            display: inline-block;
        }

        .social-links a i {
            font-size: 24px;
            color: #333;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .social-links a:hover i {
            transform: scale(1.2);
        }

        /* Social Sidebar inside Footer */
        .socials {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .social-link {
            font-size: 24px;
            color: #333;
            text-decoration: none;
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .social-link:hover {
            transform: scale(1.2);
        }

        /* Combined Instagram (both Instagram links) */
        .social-link:nth-child(1):hover,
        .social-link:nth-child(3):hover {
            color: #E4405F; /* Instagram color */
        }

        /* Patreon */
        .social-link:nth-child(2):hover {
            color: #9146FF;
        }

        /* Bluesky */
        .social-link:nth-child(4):hover {
            color: #1DA1F2;
        }

        /* X (formerly Twitter) */
        .social-link.x-link:hover {
            color: #000; /* Correct hover color for X */
        }

        /* GitHub */
        .social-link:nth-child(6):hover {
            color: #615f5f;
        }

        /* RESPONSIVENESS */
        @media screen and (max-width: 768px) {
            .container {
                padding: 10px;
                max-width: 100%;
            }

            /* Grid Styling */
            .grid,
            .grid2 {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); /* Adjust grid for smaller screens */
            }

            .large-image-item {
                width: 200px;
            }

            /* Keep navbar horizontal on mobile */
            .navbar {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                padding: 10px;
            }

            .navbar ul {
                flex-direction: row;
                width: auto;
                text-align: left;
            }

            .navbar li {
                display: inline-block;
                width: auto;
                text-align: left;
                padding: 8px 12px;
            }

            .navbar .social-links {
                flex-wrap: nowrap;
                justify-content: flex-end;
            }
        }

        @media screen and (max-width: 480px) {
            .container {
                padding: 5px;
            }

            /* Grid Styling */
            .grid,
            .grid2 {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); /* Adjust grid for even smaller screens */
            }

            .large-image-item {
                width: 180px;
            }

            /* Keep navbar horizontal on smaller mobiles */
            .navbar {
                padding: 5px;
            }

            .navbar ul {
                width: auto;
            }

            .navbar li {
                padding: 5px 8px;
            }
        }

        </style>
