<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <title>Twitch iPhone Call Overlay</title>
<style>
    :root {
        --bg-color: #000000; /* True black for that sleek OLED look */
        --text-color: #ffffff;
        --ios-gray: #5edbfa; /* Classic iOS subtext color */
        --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
        margin: 0;
        padding: 0;
        font-family: var(--font-family);
        background-color: transparent;
        overflow: hidden;
        width: 1920px;
        height: 1080px;
    }

    .iphone-call-overlay {
        position: fixed;
        top: 20px;
        left: 50%;
        /* Default state: Shrunk and hidden above the screen */
        transform: translateX(-50%) translateY(-150px) scale(0.5);
        transform-origin: center top;
        
        width: 420px; /* Slimmer now that buttons are gone */
        height: 85px; 
        background-color: var(--bg-color);
        border-radius: 45px;
        padding: 0 20px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        
        /* Smooth Transition Logic */
        transition: 
            transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), /* Bouncy enter */
            opacity 0.4s ease-in-out;
            
        opacity: 0;
        z-index: 9999;
        box-shadow: 0 15px 45px rgba(0,0,0,0.4);
    }

    /* Active state (when showing) */
    .iphone-call-overlay.active {
        transform: translateX(-50%) translateY(0) scale(1);
        opacity: 1;
        animation: island-shake 0.5s ease-in-out infinite;
        animation-delay: 0.6s; /* Wait for slide-in to finish before shaking */
    }

    /* Hide state (The smooth exit) */
    .iphone-call-overlay:not(.active) {
        /* Shrinks back into the top bezel */
        transform: translateX(-50%) translateY(-150px) scale(0.3);
        opacity: 0;
        transition: 
            transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), 
            opacity 0.3s ease-in;
    }

    .caller-info {
        display: flex;
        align-items: center;
        width: 100%;
    }

    .caller-avatar {
        width: 55px;
        height: 55px;
        border-radius: 50%;
        background-size: cover;
        background-position: center;
        margin-right: 15px;
        flex-shrink: 0;
    }

    .text-group {
        display: flex;
        flex-direction: column;
    }

    .redeem-text {
        font-size: 14px;
        color: var(--ios-gray);
        letter-spacing: -0.2px;
        margin-bottom: -1px;
    }

    .caller-name {
        font-size: 20px;
        font-weight: 600;
        color: var(--text-color);
        letter-spacing: -0.4px;
    }

    @keyframes island-shake {
        0%, 100% { transform: translateX(-50%) translateY(0) scale(1); }
        25% { transform: translateX(-50.5%) translateY(1px) scale(1.005); }
        75% { transform: translateX(-49.5%) translateY(-1px) scale(1.005); }
    }
</style>
</head>
<body>

<div id="overlay" class="iphone-call-overlay">
    <div class="caller-info">
        <div class="caller-avatar" id="avatar" style="background-image: url('https://i.pravatar.cc/150?u=aga');"></div>
        <div class="text-group">
            <div class="redeem-text" id="reward-display">iPhone</div>
            <div class="caller-name" id="username">Aga Orlova</div>
        </div>
    </div>
    
</div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const address = params.get("address") || "localhost";
        const port = params.get("port") || "8080";
        const ws = new WebSocket(`ws://${address}:${port}/`);
        let hideTimer, compactTimer;

        ws.onopen = () => {
            ws.send(JSON.stringify({
                request: "Subscribe",
                events: { general: ["Custom"] },
                id: "iPhoneCallOverlay"
            }));
        };

        ws.onmessage = (event) => {
            const message = JSON.parse(event.data);
            if (message.data?.eventName === "iPhoneCallTrigger") {
                const data = message.data;
                triggerCall(data.user, data.reward, data.cost, data.avatar);
            }
        };

        function triggerCall(user, reward, cost, avatarUrl) {
            const overlay = document.getElementById('overlay');
            const usernameEl = document.getElementById('username');
            const rewardDisplayEl = document.getElementById('reward-display');
            const avatarEl = document.getElementById('avatar');

            clearTimeout(compactTimer);
            clearTimeout(hideTimer);

            usernameEl.textContent = user;
            // Combined sentence logic here
            rewardDisplayEl.textContent = `Spent ${cost} points on ${reward}`;
            
            avatarEl.style.backgroundImage = `url('${avatarUrl}')`;

            overlay.classList.remove('compact', 'active');
            void overlay.offsetWidth; 
            overlay.classList.add('active');

            compactTimer = setTimeout(() => overlay.classList.add('compact'), 5000);
            hideTimer = setTimeout(() => overlay.classList.remove('active'), 12000);
        }

        ws.onclose = () => setTimeout(() => location.reload(), 5000);
    </script>
</body>
</html>
