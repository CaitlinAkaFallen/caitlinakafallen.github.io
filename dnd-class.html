<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BG3 Authentic Reveal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;700&family=Lora:ital,wght@1,400;1,600&display=swap');

        :root {
            --bg3-gold: #b28a48;
            --bg3-gold-light: #f1d392;
            --bg3-dark: #0a0a0c;
            --bg3-inner-border: #383129;
            --bg3-text-shadow: 0px 2px 4px rgba(0,0,0,0.8);
        }

        body { 
            margin: 0; padding: 0; background-color: transparent; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; overflow: hidden;
        }

        /* The Main Container */
        #alert-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            padding: 40px 70px;
            background: radial-gradient(circle at center, #1a1a1d 0%, #08080a 100%);
            border: 2px solid #2a241e;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 0 40px rgba(178, 138, 72, 0.1);
            opacity: 0;
            transform: scale(0.8) translateY(50px);
            transition: all 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            min-width: 700px;
        }

        #alert-wrapper.show {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* BG3 Ornate Filigree (Corners) */
        .filigree {
            position: absolute;
            width: 40px; height: 40px;
            border: 2px solid var(--bg3-gold);
            filter: drop-shadow(0 0 5px rgba(178, 138, 72, 0.5));
        }
        .tl { top: 10px; left: 10px; border-right: none; border-bottom: none; }
        .tr { top: 10px; right: 10px; border-left: none; border-bottom: none; }
        .bl { bottom: 10px; left: 10px; border-right: none; border-top: none; }
        .br { bottom: 10px; right: 10px; border-left: none; border-top: none; }

        /* User Portrait Section */
        .portrait-frame {
            position: relative;
            width: 130px; height: 130px;
            border: 3px solid var(--bg3-inner-border);
            outline: 2px solid var(--bg3-gold);
            border-radius: 2px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,1);
        }

        .user-avatar {
            width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
        }

        /* Text & Content */
        .content {
            margin-left: 40px;
            flex-grow: 1;
        }

        .narrator-text {
            font-family: 'Lora', serif;
            font-style: italic;
            color: #8a8a8a;
            font-size: 1.1rem;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .user-name {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 2.8rem;
            color: var(--bg3-gold-light);
            text-shadow: var(--bg3-text-shadow);
            margin: 0;
            line-height: 1;
        }

        .class-badge {
            display: inline-block;
            margin-top: 15px;
            padding: 5px 25px;
            background: linear-gradient(90deg, transparent 0%, rgba(178, 138, 72, 0.2) 50%, transparent 100%);
            border-top: 1px solid var(--bg3-gold);
            border-bottom: 1px solid var(--bg3-gold);
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            color: #fff;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Class Icon on the Right */
        .class-icon-container {
            margin-left: 30px;
            position: relative;
        }

        #class-image {
            width: 160px;
            height: 160px;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(178, 138, 72, 0.3));
        }

        /* The "Reveal" Glow Animation */
        #alert-wrapper.show #class-image {
            animation: classReveal 1.2s ease-out forwards, float 4s ease-in-out infinite 1.2s;
        }

        @keyframes classReveal {
            0% { transform: scale(0) rotate(-45deg); filter: brightness(5) white-balance(1); opacity: 0; }
            50% { transform: scale(1.2) rotate(10deg); filter: brightness(2); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); filter: brightness(1); opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); filter: drop-shadow(0 0 15px rgba(178, 138, 72, 0.4)); }
            50% { transform: translateY(-10px); filter: drop-shadow(0 0 25px rgba(178, 138, 72, 0.7)); }
        }
    </style>
</head>
<body>

<div id="alert-wrapper">
    <div class="filigree tl"></div>
    <div class="filigree tr"></div>
    <div class="filigree bl"></div>
    <div class="filigree br"></div>

    <div class="portrait-frame">
        <div class="user-avatar" id="avatar"></div>
    </div>

    <div class="content">
        <div class="narrator-text">The dice have settled...</div>
        <div id="username" class="user-name">Tav</div>
        <div id="class-name" class="class-badge">Unknown</div>
    </div>

    <div class="class-icon-container">
        <img id="class-image" src="" alt="">
    </div>
</div>

<script>
    const IMG_FOLDER = "DND Class Image/";
    const alertWrapper = document.getElementById('alert-wrapper');
    const classNameText = document.getElementById('class-name');
    const usernameText = document.getElementById('username');
    const avatarElem = document.getElementById('avatar');
    const classImg = document.getElementById('class-image');

    const params = new URLSearchParams(window.location.search);
    const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);

    ws.onopen = () => {
        ws.send(JSON.stringify({ request: "Subscribe", events: { general: ["Custom"] }, id: "DNDRoll" }));
    };

    ws.onmessage = async (event) => {
        const response = JSON.parse(event.data);
        const d = response.data || response;

        if (d.eventName === "DNDRoll") {
            usernameText.innerText = d.user;
            classNameText.innerText = d.className;
            avatarElem.style.backgroundImage = `url('${d.avatar}')`;

            await loadClassImage(d.className);

            alertWrapper.classList.add('show');
            setTimeout(() => { alertWrapper.classList.remove('show'); }, 8000);
        }
    };

    async function loadClassImage(className) {
        const extensions = ['png', 'jpg', 'jpeg'];
        let found = false;
        const cleanName = className.trim().toLowerCase();

        for (const ext of extensions) {
            if (found) break;
            const path = `${IMG_FOLDER}${cleanName}.${ext}?v=${Date.now()}`;
            const testImg = new Image();
            testImg.src = path;
            await new Promise((resolve) => {
                testImg.onload = () => {
                    classImg.src = path;
                    found = true;
                    resolve();
                };
                testImg.onerror = () => resolve();
            });
        }
    }
</script>
</body>
</html>
