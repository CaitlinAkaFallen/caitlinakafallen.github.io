<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dank Pill Sub Alert</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap');

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            padding: 50px;
            background: transparent;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            display: flex;
            align-items: flex-start;
        }

        /* ═══════════════════════════════════════
        MAIN WRAPPER 
        ═══════════════════════════════════════ */
        #qna-container {
            display: flex;
            align-items: center;
            gap: 25px;
            position: relative;
            opacity: 0;
            transform: translateX(-50px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        #qna-container.show {
            opacity: 1;
            transform: translateX(0);
        }

        /* ═══════════════════════════════════════
        AVATAR (Neon Ring Style)
        ═══════════════════════════════════════ */
        .avatar-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #050505;
            border: 4px solid #39ff14; /* Neon Green */
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.6); 
            overflow: hidden;
            flex-shrink: 0;
            transform: scale(0) rotate(-180deg);
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #qna-container.show .avatar-wrapper {
            transform: scale(1) rotate(0deg);
        }

        .user-avatar {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        /* ═══════════════════════════════════════
        CONTENT COLUMN
        ═══════════════════════════════════════ */
        .content-column {
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        .top-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 0 20px;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s ease 0.4s, transform 0.4s ease 0.4s;
        }

        #qna-container.show .top-label-row {
            opacity: 1;
            transform: translateY(0);
        }

        .inquiry-label {
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: #32cd32; /* Lime Green */
            text-transform: uppercase;
            font-weight: 900;
        }

        .user-name {
            font-size: 1.3rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 0 15px #39ff14; 
        }

        /* ═══════════════════════════════════════
        THE DANK PILL
        ═══════════════════════════════════════ */
        .glass-pill {
            background: rgba(10, 25, 10, 0.9);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(57, 255, 20, 0.4);
            border-radius: 40px; /* Fully rounded "pill" ends */
            width: 480px; 
            display: flex;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            height: 0; 
            padding: 0 35px;
            opacity: 0;
            transition: height 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            box-shadow: inset 0 0 20px rgba(57, 255, 20, 0.1);
        }

        #qna-container.show .glass-pill {
            height: 90px;
            opacity: 1;
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(57, 255, 20, 0.2); }
            100% { box-shadow: 0 0 30px rgba(57, 255, 20, 0.5); }
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 500;
            color: #e0ffe0; 
            font-style: normal;
            width: 70%;
        }

        /* ═══════════════════════════════════════
        STAT SHARD (The Amber Tier Box)
        ═══════════════════════════════════════ */
        .stat-shard {
            background: rgba(255, 191, 0, 0.15); /* Amber/Concentrate Color */
            border: 1px solid #ffbf00;
            padding: 6px 15px;
            border-radius: 15px;
            text-align: center;
            min-width: 80px;
            box-shadow: 0 0 10px rgba(255, 191, 0, 0.3);
        }

        #badge-value {
            display: block;
            font-weight: 900;
            font-size: 1.2rem;
            color: #ffbf00;
        }

        #badge-label {
            display: block;
            font-size: 0.6rem;
            color: #ffffff;
            letter-spacing: 1px;
            font-weight: 700;
        }

        /* ═══════════════════════════════════════
        BOTTOM LABEL
        ═══════════════════════════════════════ */
        .bottom-label-row {
            margin-top: 8px;
            padding-right: 25px;
            display: flex;
            justify-content: flex-end;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.4s ease 0.6s, transform 0.4s ease 0.6s;
        }

        #qna-container.show .bottom-label-row {
            opacity: 1;
            transform: translateY(0);
        }

        .time-stamp {
            font-size: 0.7rem;
            color: #39ff14;
            font-weight: 900;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="qna-container">
        <div class="avatar-wrapper">
            <div class="user-avatar" id="avatar"></div>
        </div>
        
        <div class="content-column">
            <div class="top-label-row">
                <div class="inquiry-label" id="alert-type">Fresh Vibe</div>
                <div class="user-name" id="username">StonerHunter</div>
            </div>

            <div class="glass-pill">
                <div class="question-text" id="display-message">Checking the altitude...</div>
                <div class="stat-shard">
                    <span id="badge-value">420</span>
                    <span id="badge-label">HIGH</span>
                </div>
            </div>

            <div class="bottom-label-row">
                <div class="time-stamp">FEELING GOOD</div>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);

        let hideTimer = null;

        ws.onopen = () => {
            ws.send(JSON.stringify({ request: "Subscribe", events: { general: ["Custom"] }, id: "PillAlert" }));
        };

        ws.onmessage = (event) => {
            const response = JSON.parse(event.data);
            // Changed this to match your "StonerReveal" event from earlier if needed, 
            // otherwise keep "sub_alert" to match your Streamer.bot setup.
            if (response.data && (response.data.eventName === "sub_alert" || response.data.eventName === "StonerReveal")) {
                updateUI(response.data);
            }
        };

        function updateUI(data) {
            const container = document.getElementById('qna-container');
            const avatarElem = document.getElementById('avatar');
            
            document.getElementById('username').innerText = data.user || "Homie"; 
            document.getElementById('display-message').innerText = data.message || "Just joined the rotation!";
            document.getElementById('badge-value').innerText = data.badge || data.randomNumber || "420";
            document.getElementById('badge-label').innerText = data.label || "HIGH";
            
            if (data.avatar) {
                avatarElem.style.backgroundImage = `url('${data.avatar}')`;
            } else {
                // Fallback icon if no avatar is provided
                avatarElem.style.backgroundColor = "#111";
            }

            if (hideTimer) clearTimeout(hideTimer);

            container.classList.remove('show'); 
            void container.offsetWidth; 
            container.classList.add('show');

            hideTimer = setTimeout(() => {
                container.classList.remove('show');
            }, 10000);
        }
    </script>
</body>
</html>
