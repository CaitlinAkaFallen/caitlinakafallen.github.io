<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Evil Requiem Overlay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Share+Tech+Mono&display=swap');

        :root {
            /* Umbrella / Danger Theme */
            --re-red: #cc0000;
            --re-red-glow: rgba(204, 0, 0, 0.5);
            --re-dark-bg: linear-gradient(145deg, #1a1a1a 0%, #000000 100%);
            
            /* Recovery / Safety Theme */
            --re-green: #00ff41;
            --re-green-glow: rgba(0, 255, 65, 0.5);
        }

        body { margin: 0; padding: 40px; background-color: transparent; font-family: 'Oswald', sans-serif; overflow: hidden; }

        #alert-wrapper {
            display: flex;
            align-items: center;
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        #alert-wrapper.show { opacity: 1; transform: scale(1) translateY(0); }

        #pill-container {
            display: flex;
            align-items: center;
            position: relative;
            padding: 15px 35px;
            background: var(--re-dark-bg);
            border: 2px solid #333;
            border-left: 8px solid var(--re-red);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            min-width: 550px;
            max-width: 850px;
            overflow: hidden;
            transition: all 0.6s ease-in-out;
        }

        /* --- GREEN HERB / SAFETY STATE --- */
        #pill-container.thanks { 
            border-left-color: var(--re-green);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px var(--re-green-glow);
        }

        /* Grid Background Effect */
        #pill-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
        }

        /* Scanning Line Animation */
        #pill-container::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(204, 0, 0, 0.1), transparent);
            animation: scan 4s infinite linear;
            z-index: 1;
        }

        #pill-container.thanks::after {
            background: linear-gradient(90deg, transparent, rgba(0, 255, 65, 0.1), transparent);
        }

        @keyframes scan {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .avatar-wrapper { 
            position: relative;
            margin-right: 25px; 
            z-index: 2; 
        }

        .user-avatar {
            width: 90px; height: 90px;
            background-size: cover; background-position: center;
            border: 2px solid #444;
            outline: 4px solid var(--re-red);
            outline-offset: -2px;
            background-color: #000;
            transition: outline-color 0.6s ease;
        }

        #pill-container.thanks .user-avatar {
            outline-color: var(--re-green);
        }

        /* Text Styles */
        .text-group { display: flex; flex-direction: column; color: white; z-index: 2; }
        
        .user-header { 
            font-family: 'Share Tech Mono', monospace; 
            font-size: 0.9rem; 
            color: var(--re-red); 
            text-transform: uppercase; 
            letter-spacing: 4px; 
            margin-bottom: 2px;
            transition: color 0.6s ease;
        }

        .user-name { 
            font-size: 2.2rem; 
            font-weight: 700; 
            margin: 0; 
            text-transform: uppercase;
            line-height: 1;
            letter-spacing: -1px;
        }
        
        .question-text { 
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1rem; 
            color: #aaa; 
            margin-top: 10px; 
            padding-top: 5px;
            border-top: 1px solid #333;
            word-break: break-word; 
        }

        #pill-container.thanks .user-header { color: var(--re-green); }

        /* Status Label Overlay */
        .status-tag {
            position: absolute;
            right: 15px; top: 10px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.7rem;
            padding: 2px 8px;
            background: var(--re-red);
            color: black;
            font-weight: bold;
            transition: background 0.6s ease;
        }

        #pill-container.thanks .status-tag { background: var(--re-green); }

    </style>
</head>
<body>

<div id="alert-wrapper">
    <div id="pill-container">
        <div class="status-tag" id="status-label">CONDITION: DANGER</div>
        <div class="avatar-wrapper">
            <div class="user-avatar" id="avatar"></div>
        </div>
        <div class="text-group">
            <div class="user-header" id="header-text">BIOHAZARD DETECTED</div>
            <div class="user-name" id="username">SUBJECT</div>
            <div class="question-text" id="content-text">Initializing transmission...</div>
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);

    ws.onopen = () => {
        ws.send(JSON.stringify({ request: "Subscribe", events: { general: ["Custom"] }, id: "ResidentQA" }));
    };

    ws.onmessage = (event) => {
        const response = JSON.parse(event.data);
        const d = response.data || response;

        if (d.eventName === "questionAlert" || d.eventName === "thankYouAlert") {
            const pill = document.getElementById('pill-container');
            const wrapper = document.getElementById('alert-wrapper');
            const status = document.getElementById('status-label');
            
            document.getElementById('username').innerText = d.user;
            document.getElementById('avatar').style.backgroundImage = `url('${d.avatar}')`;

            if (d.eventName === "thankYouAlert") {
                pill.classList.add('thanks');
                status.innerText = "CONDITION: FINE";
                document.getElementById('header-text').innerText = "DATA ARCHIVED";
                document.getElementById('content-text').innerText = "Subject cleared for extraction. Thank you.";
            } else {
                pill.classList.remove('thanks');
                status.innerText = "CONDITION: DANGER";
                document.getElementById('header-text').innerText = "BIOHAZARD DETECTED";
                document.getElementById('content-text').innerText = d.message;
            }

            wrapper.classList.add('show');
            setTimeout(() => { wrapper.classList.remove('show'); }, 15000);
        }
    };
</script>
</body>
</html>
