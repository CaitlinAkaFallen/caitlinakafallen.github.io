# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Only use ONE version. v4 is stable, v6 is the newest.
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        # v3 was giving you the "build" warning. v6 is the fix.
        uses: actions/upload-pages-artifact@v6
        with:
          path: '.'
          # Extra safety for your Twitch/YouTube keys
          exclude: |
            .env
            .git

      - name: Deploy to GitHub Pages
        id: deployment
        # v4 was giving you the "deploy" warning. v5 is the fix.
        uses: actions/deploy-pages@v5
