<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Pill Raid Alert</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap');

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            padding: 50px;
            background: transparent;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            display: flex;
            align-items: flex-start;
        }

        /* ═══════════════════════════════════════
        MAIN WRAPPER 
        ═══════════════════════════════════════ */
        #qna-container {
            display: flex;
            align-items: center;
            gap: 25px;
            position: relative;
            opacity: 0;
            transform: translateX(-50px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        #qna-container.show {
            opacity: 1;
            transform: translateX(0);
        }

        /* ═══════════════════════════════════════
        AVATAR (Round Crystal Style)
        ═══════════════════════════════════════ */
        .avatar-wrapper {
            position: relative;
            width: 95px;
            height: 95px;
            border-radius: 50%;
            background: #111;
            border: 3px solid #ba68c8; /* Purple Crystal Border */
            box-shadow: 0 0 20px rgba(77, 245, 245, 0.4); /* Teal Glow */
            overflow: hidden;
            flex-shrink: 0;
            transform: translateX(-300px) rotate(-720deg);
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.4, 1);
        }

        #qna-container.show .avatar-wrapper {
            transform: translateX(0) rotate(0deg);
        }

        .user-avatar {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        /* ═══════════════════════════════════════
        CONTENT COLUMN
        ═══════════════════════════════════════ */
        .content-column {
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        .top-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 0 20px;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s ease 0.5s, transform 0.4s ease 0.5s;
        }

        #qna-container.show .top-label-row {
            opacity: 1;
            transform: translateY(0);
        }

        .inquiry-label {
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: #f06292; /* Pink Label */
            text-transform: uppercase;
            font-weight: 900;
        }

        .user-name {
            font-size: 1.2rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(186, 104, 200, 0.8);
        }

        /* ═══════════════════════════════════════
        THE GLASS PILL
        ═══════════════════════════════════════ */
        .glass-pill {
            background: rgba(15, 10, 25, 0.9);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(77, 245, 245, 0.3);
            border-radius: 20px;
            width: 550px; /* Wider for the Viking message */
            display: flex;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            height: 0; 
            padding: 0 30px;
            opacity: 0;
            transition: height 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }

        #qna-container.show .glass-pill {
            height: 85px;
            opacity: 1;
            padding: 0 30px;
        }

        .question-text {
            font-size: 0.95rem;
            font-weight: 500;
            color: #4df5f5; /* Teal Message Text */
            width: 78%;
            line-height: 1.3;
        }

        /* ═══════════════════════════════════════
        STAT SHARD (The Viewer Count Box)
        ═══════════════════════════════════════ */
        .stat-shard {
            background: rgba(186, 104, 200, 0.2);
            border: 1px solid #ba68c8;
            padding: 6px 10px;
            border-radius: 12px;
            text-align: center;
            min-width: 85px;
        }

        #badge-value {
            display: block;
            font-weight: 900;
            font-size: 1.2rem;
            color: #ffffff;
        }

        #badge-label {
            display: block;
            font-size: 0.6rem;
            color: #f06292;
            font-weight: 800;
            letter-spacing: 1px;
        }

        /* ═══════════════════════════════════════
        BOTTOM LABEL
        ═══════════════════════════════════════ */
        .bottom-label-row {
            margin-top: 8px;
            padding-right: 20px;
            display: flex;
            justify-content: flex-end;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.4s ease 0.5s, transform 0.4s ease 0.5s;
        }

        #qna-container.show .bottom-label-row {
            opacity: 1;
            transform: translateY(0);
        }

        .time-stamp {
            font-size: 0.75rem;
            color: #4df5f5;
            font-weight: 700;
            letter-spacing: 1.5px;
        }
    </style>
</head>
<body>

    <div id="qna-container">
        <div class="avatar-wrapper">
            <div class="user-avatar" id="avatar"></div>
        </div>
        
        <div class="content-column">
            <div class="top-label-row">
                <div class="inquiry-label" id="alert-type">Incoming Raid</div>
                <div class="user-name" id="username">RAIDER</div>
            </div>

            <div class="glass-pill">
                <div class="question-text" id="display-message">Storming the gates!</div>
                <div class="stat-shard">
                    <span id="badge-value">0</span>
                    <span id="badge-label">WARRIORS</span>
                </div>
            </div>

            <div class="bottom-label-row">
                <div class="time-stamp" id="game-label">AN EPIC GAME</div>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);

        let hideTimer = null;

        ws.onopen = () => {
            console.log("Raid Pill Connected");
            ws.send(JSON.stringify({ request: "Subscribe", events: { general: ["Custom"] }, id: "RaidPillAlert" }));
        };

        ws.onmessage = (event) => {
            const response = JSON.parse(event.data);
            // Handling both direct and nested data objects
            let raidData = null;
            if (response.eventName === "raidAlert") raidData = response;
            else if (response.data && response.data.eventName === "raidAlert") raidData = response.data;

            if (raidData) updateUI(raidData);
        };

        function updateUI(data) {
            const container = document.getElementById('qna-container');
            const avatarElem = document.getElementById('avatar');
            
            // Text updates matching your C# data package
            document.getElementById('username').innerText = data.user.toUpperCase(); 
            document.getElementById('display-message').innerText = data.message;
            document.getElementById('badge-value').innerText = data.viewers || "0";
            document.getElementById('game-label').innerText = (data.game || "AN EPIC GAME").toUpperCase();
            
            if (data.avatar) {
                avatarElem.style.backgroundImage = `url('${data.avatar}')`;
            }

            // Animation Logic
            if (hideTimer) clearTimeout(hideTimer);

            container.classList.remove('show'); 
            void container.offsetWidth; // Reset
            container.classList.add('show');

            // Auto-Hide after 12 seconds
            hideTimer = setTimeout(() => {
                container.classList.remove('show');
            }, 12000);
        }
    </script>
</body>
</html>
