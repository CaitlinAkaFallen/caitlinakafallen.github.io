<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FallenOneArt Clips Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     DESIGN TOKENS - synthwave glassmorphism (shared system)
     ========================================================= */
  :root{
    --accent-teal: #7de8c8;
    --accent-purple: #c8a2ff;
    --bg-void: #0a0a12;
    --panel-bg: rgba(18, 18, 28, 0.72);
    --panel-border: rgba(125, 232, 200, 0.35);
    --text-main: #e8e8f0;
    --text-dim: #8a8aa0;
    --danger: #ff6b6b;
    --font-display: 'Orbitron', sans-serif;
    --font-mono: 'Share Tech Mono', monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: var(--font-mono);
    color: var(--text-main);
  }

  /* =========================================================
     EDITABLE LAYOUT CONSTANTS (via CSS vars, tweak freely)
     ========================================================= */
  :root{
    --clip-width: 720px;
    --clip-max-height: 405px;
  }

  /* ---------- Brand header (small, corner) ---------- */
  .brand-header{
    position: fixed;
    top: 14px;
    left: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-display);
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--text-dim);
    opacity: 0.85;
    z-index: 5;
    pointer-events: none;
  }
  .pulse-dot{
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--danger);
    box-shadow: 0 0 6px var(--danger);
    animation: pulse 2.4s ease-in-out infinite;
  }
  .pulse-dot.connected{
    background: var(--accent-teal);
    box-shadow: 0 0 8px var(--accent-teal);
  }
  @keyframes pulse{
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  /* ---------- Clip overlay ---------- */
  .clip-overlay{
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.96);
    width: var(--clip-width);
    max-width: 92vw;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease, transform 0.4s ease;
    z-index: 10;
  }
  .clip-overlay.visible{
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .clip-frame{
    position: relative;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    box-shadow: 0 0 40px rgba(125, 232, 200, 0.15), 0 10px 30px rgba(0,0,0,0.5);
    padding: 10px;
  }

  /* HUD corner brackets */
  .clip-frame::before, .clip-frame::after,
  .clip-frame .corner-tl, .clip-frame .corner-br {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    border: 2px solid var(--accent-teal);
  }
  .clip-frame::before{ top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .clip-frame::after{ bottom: -1px; right: -1px; border-left: none; border-top: none; }
  .clip-frame .corner-tl{ top: -1px; right: -1px; border-left: none; border-bottom: none; border-color: var(--accent-purple); }
  .clip-frame .corner-br{ bottom: -1px; left: -1px; border-right: none; border-top: none; border-color: var(--accent-purple); }

  video.clip-video{
    display: block;
    width: 100%;
    max-height: var(--clip-max-height);
    border-radius: 3px;
    background: #000;
  }

  .clip-meta{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 8px;
    padding: 0 4px;
  }
  .clip-label{
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--accent-teal);
    text-transform: uppercase;
  }
  .clip-title{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-dim);
    max-width: 60%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: right;
  }

  /* =========================================================
     SETTINGS PANEL (only relevant when viewed in a normal
     browser tab to configure - harmless as an OBS source)
     ========================================================= */
  .gear-btn{
    position: fixed;
    top: 14px;
    right: 14px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    color: var(--accent-teal);
    font-size: 15px;
    cursor: pointer;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .settings-panel{
    position: fixed;
    top: 54px;
    right: 14px;
    width: 320px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    padding: 16px;
    z-index: 20;
    display: none;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .settings-panel.open{ display: flex; }

  .settings-panel h3{
    margin: 0 0 4px 0;
    font-family: var(--font-display);
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--accent-purple);
    text-transform: uppercase;
  }

  .field{ display: flex; flex-direction: column; gap: 4px; }
  .field label{ font-size: 11px; color: var(--text-dim); letter-spacing: 0.5px; }
  .field input{
    background: rgba(0,0,0,0.35);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    color: var(--text-main);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 7px 8px;
  }
  .field input:focus{ outline: none; border-color: var(--accent-teal); }

  .btn{
    background: rgba(125, 232, 200, 0.12);
    border: 1px solid var(--accent-teal);
    color: var(--accent-teal);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 8px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .btn:hover{ background: rgba(125, 232, 200, 0.22); }
  .btn.secondary{
    border-color: var(--accent-purple);
    color: var(--accent-purple);
    background: rgba(200, 162, 255, 0.1);
  }
  .btn.secondary:hover{ background: rgba(200, 162, 255, 0.2); }

  .status-row{
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-dim);
  }
  .status-row .ok{ color: var(--accent-teal); }
  .status-row .bad{ color: var(--danger); }

  .divider{
    border: none;
    border-top: 1px solid var(--panel-border);
    margin: 2px 0;
  }
</style>
</head>
<body>

  <div class="brand-header">
    <span class="pulse-dot" id="wsDot"></span>
    <span>FALLENONEART // CLIPS DASHBOARD</span>
  </div>

  <button class="gear-btn" id="gearBtn" title="Settings">⚙</button>

  <div class="settings-panel" id="settingsPanel">
    <h3>Clips Dashboard Setup</h3>

    <div class="field">
      <label for="clientIdInput">Twitch Client ID</label>
      <input type="text" id="clientIdInput" placeholder="Your Twitch app Client ID" />
    </div>

    <button class="btn" id="saveClientIdBtn">Save Client ID</button>

    <hr class="divider" />

    <div class="status-row">
      <span>Twitch Account</span>
      <span id="authStatus" class="bad">Not connected</span>
    </div>
    <button class="btn secondary" id="connectTwitchBtn">Connect Twitch Account</button>

    <hr class="divider" />

    <div class="status-row">
      <span>Streamer.bot WS</span>
      <span id="wsStatusText" class="bad">Disconnected</span>
    </div>

    <hr class="divider" />

    <h3>Test It</h3>
    <div class="field">
      <label for="testSoUser">Preview shoutout clip (username)</label>
      <input type="text" id="testSoUser" placeholder="e.g. someStreamer" />
    </div>
    <button class="btn" id="testSoBtn">Play Shoutout Clip</button>

    <div class="field">
      <label for="testBrbUser">Preview BRB clip (username)</label>
      <input type="text" id="testBrbUser" placeholder="e.g. FallenOneArt" />
    </div>
    <button class="btn" id="testBrbBtn">Play BRB Clip</button>
  </div>

  <div class="clip-overlay" id="clipOverlay">
    <div class="clip-frame">
      <span class="corner-tl"></span>
      <span class="corner-br"></span>
        <video class="clip-video" id="clipVideo"></video>
    </div>
  </div>

<script>
(() => {
  'use strict';

  /* =======================================================
     EDITABLE CONSTANTS
     ======================================================= */
  const urlParams = new URLSearchParams(window.location.search);

  const CONFIG = {
    WS_ADDRESS: urlParams.get('address') || 'localhost',
    WS_PORT: urlParams.get('port') || '8080',
    RECONNECT_DELAY_MS: 3000,
    CLIP_FETCH_COUNT: 100,               // clips pulled per channel, per fetch
    CLIP_CACHE_TTL_MS: 10 * 60 * 1000,   // 10 min - avoid refetching on every SO
    OVERLAY_HIDE_DELAY_MS: 1200,         // pause after clip ends before hiding
    MAX_CLIP_DURATION_FALLBACK_MS: 60000,// safety hide timer if 'ended' never fires
    EVENT_SOURCE_KEY: 'clipsdashboard',  // must match the "source" field sent from C#
    REDIRECT_URI: window.location.origin + window.location.pathname,
  };

  const STORAGE_KEYS = {
    CLIENT_ID: 'clipsdashboard_client_id',
    OAUTH_TOKEN: 'clipsdashboard_oauth_token',
  };

  /* =======================================================
     STATE
     ======================================================= */
  const state = {
    ws: null,
    clientId: localStorage.getItem(STORAGE_KEYS.CLIENT_ID) || '',
    oauthToken: localStorage.getItem(STORAGE_KEYS.OAUTH_TOKEN) || '',
    clipCache: {},   // { [loginLower]: { broadcasterId, clips, fetchedAt } }
    hideTimer: null,
  };

  /* =======================================================
     DOM REFS
     ======================================================= */
  const wsDot = document.getElementById('wsDot');
  const gearBtn = document.getElementById('gearBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  const clientIdInput = document.getElementById('clientIdInput');
  const saveClientIdBtn = document.getElementById('saveClientIdBtn');
  const connectTwitchBtn = document.getElementById('connectTwitchBtn');
  const authStatus = document.getElementById('authStatus');
  const wsStatusText = document.getElementById('wsStatusText');
  const testSoUser = document.getElementById('testSoUser');
  const testSoBtn = document.getElementById('testSoBtn');
  const testBrbUser = document.getElementById('testBrbUser');
  const testBrbBtn = document.getElementById('testBrbBtn');

  const clipOverlay = document.getElementById('clipOverlay');
  const clipVideo = document.getElementById('clipVideo');
  const clipLabel = document.getElementById('clipLabel');
  const clipTitleText = document.getElementById('clipTitleText');

  /* =======================================================
     UI HELPERS
     ======================================================= */
  function refreshSettingsUI() {
    clientIdInput.value = state.clientId;
    updateAuthStatusUI();
  }

  function updateAuthStatusUI() {
    if (state.oauthToken) {
      authStatus.textContent = 'Connected';
      authStatus.className = 'ok';
    } else {
      authStatus.textContent = 'Not connected';
      authStatus.className = 'bad';
    }
  }

  function updateWsStatusUI(connected) {
    wsDot.classList.toggle('connected', connected);
    wsStatusText.textContent = connected ? 'Connected' : 'Disconnected';
    wsStatusText.className = connected ? 'ok' : 'bad';
  }

  gearBtn.addEventListener('click', () => {
    settingsPanel.classList.toggle('open');
  });

  saveClientIdBtn.addEventListener('click', () => {
    state.clientId = clientIdInput.value.trim();
    localStorage.setItem(STORAGE_KEYS.CLIENT_ID, state.clientId);
    alert('Client ID saved.');
  });

  connectTwitchBtn.addEventListener('click', connectTwitchAccount);

  testSoBtn.addEventListener('click', () => {
    const u = testSoUser.value.trim();
    if (!u) return;
    playClipEvent(u, `Shoutout: ${u}`);
  });

  testBrbBtn.addEventListener('click', () => {
    const u = testBrbUser.value.trim();
    if (!u) return;
    playClipEvent(u, 'BRB - enjoy this clip!');
  });

  /* =======================================================
     TWITCH OAUTH (implicit grant - same pattern as the
     emote picker: Client ID + user token, no server needed)
     ======================================================= */
  function connectTwitchAccount() {
    if (!state.clientId) {
      alert('Enter and save a Client ID first.');
      return;
    }
    const url = `https://id.twitch.tv/oauth2/authorize` +
      `?client_id=${encodeURIComponent(state.clientId)}` +
      `&redirect_uri=${encodeURIComponent(CONFIG.REDIRECT_URI)}` +
      `&response_type=token` +
      `&scope=`;
    window.location.href = url;
  }

  function handleOAuthRedirect() {
    if (window.location.hash.includes('access_token')) {
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      const token = hashParams.get('access_token');
      if (token) {
        state.oauthToken = token;
        localStorage.setItem(STORAGE_KEYS.OAUTH_TOKEN, token);
        // Clean the token out of the visible URL/history
        history.replaceState(null, '', window.location.pathname + window.location.search);
      }
    }
  }

  /* =======================================================
     TWITCH HELIX API
     ======================================================= */
  async function getBroadcasterId(login) {
    const res = await fetch(`https://api.twitch.tv/helix/users?login=${encodeURIComponent(login)}`, {
      headers: {
        'Client-Id': state.clientId,
        'Authorization': `Bearer ${state.oauthToken}`,
      },
    });
    if (!res.ok) throw new Error(`Twitch Users API error (${res.status}) for "${login}"`);
    const json = await res.json();
    if (!json.data || !json.data.length) throw new Error(`No Twitch user found for "${login}"`);
    return json.data[0].id;
  }

  async function getClipsForBroadcaster(broadcasterId) {
    const res = await fetch(`https://api.twitch.tv/helix/clips?broadcaster_id=${broadcasterId}&first=${CONFIG.CLIP_FETCH_COUNT}`, {
      headers: {
        'Client-Id': state.clientId,
        'Authorization': `Bearer ${state.oauthToken}`,
      },
    });
    if (!res.ok) throw new Error(`Twitch Clips API error (${res.status})`);
    const json = await res.json();
    return json.data || [];
  }

  async function getClipsForLogin(loginRaw) {
    const login = loginRaw.trim().toLowerCase();
    const cached = state.clipCache[login];
    const now = Date.now();
    if (cached && (now - cached.fetchedAt) < CONFIG.CLIP_CACHE_TTL_MS) {
      return cached.clips;
    }
    const broadcasterId = await getBroadcasterId(login);
    const clips = await getClipsForBroadcaster(broadcasterId);
    state.clipCache[login] = { broadcasterId, clips, fetchedAt: now };
    return clips;
  }

  function pickRandomClip(clips) {
    if (!clips.length) return null;
    return clips[Math.floor(Math.random() * clips.length)];
  }

  // Twitch's Helix API doesn't return a direct video file URL.
  // The standard (unofficial, widely used) trick: the clip's thumbnail
  // path minus the "-preview-###x###.jpg" suffix, plus ".mp4", is a
  // playable direct link. Note: Twitch could change this at any time.
  function clipToMp4Url(clip) {
    return clip.thumbnail_url.split('-preview-')[0] + '.mp4';
  }

  /* =======================================================
     OVERLAY PLAYBACK
     ======================================================= */
  async function playClipEvent(login, label) {
    if (!state.clientId || !state.oauthToken) {
      console.warn('clipsdashboard: Client ID / OAuth token not set. Open settings (gear icon) to configure.');
      return;
    }
    try {
      const clips = await getClipsForLogin(login);
      const clip = pickRandomClip(clips);
      if (!clip) {
        console.warn(`clipsdashboard: no clips found for "${login}".`);
        return;
      }
      showClipOverlay(clip, label);
    } catch (err) {
      console.error('clipsdashboard error:', err);
    }
  }

  function showClipOverlay(clip, label) {
    clearTimeout(state.hideTimer);

    clipVideo.src = clipToMp4Url(clip);
    clipLabel.textContent = label;
    clipTitleText.textContent = clip.title || '';

    clipOverlay.classList.add('visible');
    clipVideo.currentTime = 0;
    clipVideo.play().catch(e => console.warn('clipsdashboard: autoplay blocked -', e));

    state.hideTimer = setTimeout(hideOverlay, CONFIG.MAX_CLIP_DURATION_FALLBACK_MS);
  }

  clipVideo.addEventListener('ended', () => {
    clearTimeout(state.hideTimer);
    state.hideTimer = setTimeout(hideOverlay, CONFIG.OVERLAY_HIDE_DELAY_MS);
  });

  function hideOverlay() {
    clipOverlay.classList.remove('visible');
    clipVideo.pause();
    clipVideo.removeAttribute('src');
    clipVideo.load();
  }

  /* =======================================================
     STREAMER.BOT WEBSOCKET
     ======================================================= */
  function connectWS() {
    const ws = new WebSocket(`ws://${CONFIG.WS_ADDRESS}:${CONFIG.WS_PORT}/`);
    state.ws = ws;

    ws.onopen = () => {
      updateWsStatusUI(true);
      ws.send(JSON.stringify({ request: 'Subscribe', events: { general: ['Custom'] }, id: '' }));
    };

    ws.onclose = () => {
      updateWsStatusUI(false);
      setTimeout(connectWS, CONFIG.RECONNECT_DELAY_MS);
    };

    ws.onerror = () => ws.close();

    ws.onmessage = (evt) => {
      let msg;
      try { msg = JSON.parse(evt.data); } catch { return; }

      const data = msg.data;
      if (!data || data.source !== CONFIG.EVENT_SOURCE_KEY) return;

      if (data.eventName === 'shoutout_clip' && data.targetUser) {
        playClipEvent(data.targetUser, `Shoutout: ${data.targetUser}`);
      } else if (data.eventName === 'brb_clip' && data.targetUser) {
        playClipEvent(data.targetUser, 'BRB - enjoy this clip!');
      }
    };
  }

  /* =======================================================
     INIT
     ======================================================= */
  handleOAuthRedirect();
  refreshSettingsUI();
  connectWS();
})();
</script>
</body>
</html>
