<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <style>
        :root {
            --background-color: #f4f4f4;
            --text-color: #333;
            --container-background: #fff;
            --button-background: #007BFF;
            --button-hover: #0056b3;
        }

        .dark-mode {
            --background-color: #333;
            --text-color: #f4f4f4;
            --container-background: #444;
            --button-background: #ff5722;
            --button-hover: #e64a19;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            background-color: var(--container-background);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            transition: background-color 0.3s;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--text-color);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--text-color);
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: var(--button-background);
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: var(--button-hover);
        }

        .links {
            text-align: center;
            margin-top: 15px;
        }

        .links a {
            color: var(--button-background);
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .toggle-button {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: var(--button-background);
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            width: 15%;
        }

        .toggle-button:hover {
            background-color: var(--button-background);
        }
    </style>
</head>

<body>
    
    <div class="container">
    <button class="toggle-button" id="toggle-button">Toggle Dark Mode</button>
    <h2>Forgot Password</h2>

    <form id="forgot-password-form">
        <!-- Email input field with validation -->
        <label for="email">Enter your email:</label>
        <input type="email" id="email" placeholder="Enter your email" required>
        <small id="email-validation" style="color: red; display: none;">Please enter a valid email address.</small>

        <!-- Password strength meter (visible after reset request) -->
        <div id="password-strength-container" style="display: none;">
            <label for="new-password">New Password:</label>
            <input type="password" id="new-password" placeholder="Enter a new password" required>
            <div id="password-strength-meter">
                <div id="strength-bar"></div>
            </div>
            <small id="password-strength-text"></small>
        </div>

        <!-- Reset password button -->
        <button type="submit">Reset Password</button>
    </form>

    <div class="links">
        <a href="Merchandise-customers-login.html">Back to Login</a>
    </div>
</div>

    <script>
        document.getElementById('forgot-password-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            alert(`Password reset link has been sent to ${email}.`);
        });

        const toggleButton = document.getElementById('toggle-button');
        const body = document.body;

        toggleButton.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            const isDarkMode = body.classList.contains('dark-mode');
            toggleButton.textContent = isDarkMode ? 'Toggle to Light Mode' : 'Toggle to Dark Mode';
        });
    </script>
</body>

</html>
