<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounty Hunter HUD v4.5</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Changa:wght@400;700&family=Share+Tech+Mono&display=swap');

        :root {
            --hull-cyan: #00f2ff;
            --hull-gold: #ffb700;
            --hull-red: #ff3c3c;
            --glass: rgba(10, 10, 10, 0.9);
        }

        body { 
            background: transparent; overflow: hidden; 
            font-family: 'Share Tech Mono', monospace; 
            color: white; margin: 0; padding: 40px;
        }

        /* SHARED GLASS STYLE */
        .glass-panel {
            background: var(--glass);
            -webkit-backdrop-filter: blur(15px);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
        }

        /* MAIN BOUNTY HUD (Left Side) */
        #hud-master {
            position: absolute; top: 40px; left: 40px;
            width: 500px; display: flex; flex-direction: column; gap: 15px;
            opacity: 0; transform: translateX(-50px);
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            z-index: 2;
        }
        #hud-master.active { opacity: 1; transform: translateX(0); }

        /* CREDIT CHECK PANEL (Updated to Left Side) */
        #credit-panel {
            position: absolute; 
            top: 220px; /* Positioned below the main HUD if both are active */
            left: 40px; /* Changed from right to left */
            width: 350px; padding: 20px;
            border-left: 4px solid var(--hull-gold); /* Border moved to left side */
            display: flex; align-items: center; gap: 15px;
            opacity: 0; 
            transform: translateX(-50px); /* Slide in from left */
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            z-index: 1;
        }
        #credit-panel.active { opacity: 1; transform: translateX(0); }

        .credit-avatar {
            width: 60px; height: 60px;
            clip-path: polygon(20% 0%, 100% 0%, 100% 80%, 80% 100%, 0% 100%, 0% 20%);
            border: 1px solid var(--hull-gold);
            flex-shrink: 0;
        }

        .credit-info .label { font-size: 0.7rem; color: var(--hull-gold); }
        .credit-info .name { font-size: 1rem; text-transform: uppercase; margin-bottom: 5px; }
        .credit-info .total { font-size: 1.5rem; color: #fff; font-weight: bold; }

        /* BOUNTY STYLING */
        .hud-header { padding: 10px 20px; border-left: 4px solid var(--hull-cyan); display: flex; justify-content: space-between; align-items: center; }
        .sys-title { font-family: 'Changa', sans-serif; font-weight: 700; font-size: 1.2rem; color: var(--hull-cyan); text-shadow: 0 0 10px rgba(0, 242, 255, 0.5); }
        .hud-body { display: flex; gap: 20px; padding: 20px; }
        .target-frame { position: relative; width: 100px; height: 100px; flex-shrink: 0; }
        .avatar { width: 100%; height: 100%; object-fit: cover; clip-path: polygon(10% 0, 100% 0, 100% 90%, 90% 100%, 0 100%, 0 10%); }
        .reward-block { font-size: 1.8rem; font-weight: bold; color: var(--hull-gold); display: none; }

        /* HUD STATES */
        .state-chase .hud-header { border-left-color: var(--hull-gold); }
        .state-chase .sys-title { color: var(--hull-gold); }
        .state-fail .hud-header { border-left-color: var(--hull-red); }
        .state-fail .sys-title { color: var(--hull-red); }
    </style>
</head>
<body>

<div id="hud-master">
    <div class="hud-header glass-panel">
        <div class="sys-title" id="hud-title">BOUNTY_SYSTEM</div>
        <div class="sys-status">SYS_VER::4.5.0</div>
    </div>
    <div class="hud-body glass-panel">
        <div class="target-frame">
            <img id="hud-avatar" class="avatar" src="">
        </div>
        <div class="info-block">
            <div id="hud-user" style="text-transform: uppercase; letter-spacing: 1px;">HUNTER</div>
            <div id="hud-text" style="font-size: 0.9rem; color: rgba(255,255,255,0.7); margin-top: 5px;">Awaiting sequence...</div>
            <div class="reward-block" id="hud-reward">+<span id="hud-reward-val">0</span> CR</div>
        </div>
    </div>
</div>

<div id="credit-panel" class="glass-panel">
    <img id="credit-avatar" class="credit-avatar" src="">
    <div class="credit-info">
        <div class="label">ACCOUNT_BALANCE</div>
        <div id="credit-user" class="name">USER</div>
        <div class="total"><span id="credit-val">0</span> CR</div>
    </div>
</div>

<script>
    const ws = new WebSocket("ws://localhost:8080/");
    
    const master = document.getElementById('hud-master');
    const creditPanel = document.getElementById('credit-panel');

    ws.onopen = () => {
        ws.send(JSON.stringify({ request: "Subscribe", events: { general: ["Custom"] }, id: "BountyHUD" }));
    };

    ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        const data = msg.data;

        if (!data) return;

        if (data.eventName === "BountyEvent") {
            document.getElementById('hud-user').innerText = data.user;
            document.getElementById('hud-avatar').src = data.avatar;

            switch (data.type) {
                case "INIT":
                    master.className = "active state-init";
                    document.getElementById('hud-title').innerText = "BOUNTY_DEPROYED";
                    document.getElementById('hud-text').innerText = "Target locked. Acquisition sequence initiated.";
                    document.getElementById('hud-reward').style.display = "none";
                    break;
                case "CHASE_INIT":
                    master.className = "active state-chase";
                    document.getElementById('hud-title').innerText = "CHASE_ACTIVE";
                    document.getElementById('hud-text').innerText = `ALERT: ${data.evasion}`;
                    break;
                case "SUCCESS":
                    master.className = "active state-success";
                    document.getElementById('hud-title').innerText = "TARGET_CAPTURED";
                    document.getElementById('hud-reward').style.display = "block";
                    document.getElementById('hud-reward-val').innerText = data.reward.toLocaleString();
                    setTimeout(() => master.classList.remove('active'), 8000);
                    break;
                case "FAIL":
                    master.className = "active state-fail";
                    document.getElementById('hud-title').innerText = "CHASE_FAILED";
                    setTimeout(() => master.classList.remove('active'), 6000);
                    break;
            }
        }

        if (data.eventName === "CreditCheckEvent") {
            document.getElementById('credit-user').innerText = data.user;
            document.getElementById('credit-avatar').src = data.avatar;
            document.getElementById('credit-val').innerText = data.total.toLocaleString();
            
            creditPanel.classList.add('active');
            setTimeout(() => creditPanel.classList.remove('active'), 7000);
        }
    };
</script>
</body>
</html>
