<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Caitlin's Programming</title>
        <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
        <link rel="icon" href="images/favicon.ico" type="image/x-icon">
        <link rel="stylesheet" href="coding.css">
        

    </head>

    <body>
        <header>
            <h1>Coding</h1>
            <p>Welcome to the Coding Section</p>
            <p>where you can explore various programming languages and projects.</p>
        </header>
        
        <!-- Horizontal Navbar -->
        <nav class="navbar">
            <ul class="nav-list">
                <li>
                    <a href="index.html" class="home-icon">
                        <img src="https://th.bing.com/th/id/R.19ed7c8b456956b57d48630777fa9198?rik=gw7I7o0tcu7vJQ&pid=ImgRaw&r=0" alt="Home" width="24">
                    </a>
                </li>
                <li class="dropdown">
                    <a href="#" class="dropdown-btn">
                        <img src="images/csharp.png" alt="C# Icon" class="nav-icon" width="24">
                    </a>
                    <ul class="dropdown-content">
                        <li><a href="csharp.html">Projects</a></li>
                    </ul>
                </li>
                <li class="dropdown">
                    <a href="#" class="dropdown-btn">
                        <img src="images/json.png" alt="JSON Icon" class="nav-icon" width="24">
                    </a>
                    <ul class="dropdown-content">
                        <li><a href="json-projects.html">Projects</a></li>
                    </ul>
                </li>
                <li>
                    <a href="https://streamer.bot/" class="Streamer-bot-icon">
                        <img src="images/streamer-bot.png" alt="Stream" width="24">
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <section class="main-content">
            <h2>Explore Programming Languages</h2>
            <p>Click on the navbar items to navigate through tutorials, projects, and guides.</p>

            <!-- Announcements Section -->
            <div class="announcements">
                <h3>Latest Announcements</h3>
                <ul id="announcement-list">
                    <!-- Announcements will be added here dynamically -->
                </ul>

                <!-- Form to add a new announcement -->
                <div class="announcement-form">
                    <input type="text" id="announcement-title" placeholder="Announcement Title" />
                    <input type="url" id="announcement-link" placeholder="Link to Project" />
                    <input type="text" id="announcement-version" placeholder="Version" />
                    <textarea id="announcement-notes" placeholder="Notes" rows="4"></textarea>
                    <button id="add-announcement-btn" onclick="addCustomAnnouncement()">Add Announcement</button>
                    <button id="edit-announcement-btn" onclick="updateAnnouncement()" style="display:none;">Update Announcement</button>
                </div>




                <!-- Announcement List -->
                <ul id="announcementlist"></ul>
  

                <!-- Checkbox and Delete Button -->
                <div>
                    <button id="delete-announcement" style="display: none;">Delete Selected Announcements</button>
                </div>
            </div>

        </section>

        <script src="coding.js"></script>
        
    </body>

</html>
