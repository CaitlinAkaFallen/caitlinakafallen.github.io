<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MW Tactical HUD</title>
    <style>
        /* Modern Warfare uses heavy, condensed sans-serifs */
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto+Condensed:wght@400;700;900&display=swap');

        :root {
            --mw-yellow: #ffde00;
            --mw-white: #ffffff;
            --mw-bg: rgba(10, 10, 10, 0.95);
            --mw-accent: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0; padding: 0;
            background-color: transparent;
            overflow: hidden;
            width: 1920px; height: 1080px;
            font-family: 'Roboto Condensed', sans-serif;
        }

        .mw-container {
            position: fixed;
            top: 150px;
            left: 80px;
            display: flex;
            flex-direction: column;
            opacity: 0;
            /* The signature MW tilt */
            transform: translateX(-30px) skewX(-10deg);
            transition: all 0.4s cubic-bezier(0.15, 0.85, 0.35, 1);
        }

        .mw-container.active {
            opacity: 1;
            transform: translateX(0) skewX(-10deg);
        }

        /* Subtle tactical scanline texture across the whole overlay */
        .mw-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.02) 3px);
            pointer-events: none;
        }

        .top-tag {
            background: var(--mw-yellow);
            color: black;
            font-weight: 900;
            font-size: 14px;
            padding: 2px 10px;
            width: fit-content;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: -5px;
            margin-left: 120px; /* Aligns with the name */
        }

        .user-section {
            display: flex;
            align-items: flex-end;
            margin-bottom: 10px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border: 4px solid var(--mw-white);
            background-size: cover;
            background-position: center;
            margin-right: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            transform: skewX(10deg); /* Counter-skew image */
            position: relative;
        }

        .username {
            font-family: 'Oswald', sans-serif;
            font-size: 72px; /* Huge and imposing */
            color: var(--mw-white);
            text-transform: uppercase;
            line-height: 0.9;
            letter-spacing: -2px;
            text-shadow: 5px 5px 0px rgba(0,0,0,1);
        }

        .reward-box {
            background: var(--mw-bg);
            border-left: 8px solid var(--mw-yellow);
            padding: 10px 60px 10px 40px;
            position: relative;
            overflow: hidden;
            box-shadow: 10px 10px 20px rgba(0,0,0,0.5);
        }

        .reward-name {
            font-size: 48px;
            color: var(--mw-yellow);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-style: italic;
        }

        .footer-data {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            padding-left: 120px;
        }

        .data-item {
            color: var(--mw-white);
            background: rgba(0,0,0,0.6);
            padding: 5px 15px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            border-bottom: 3px solid var(--mw-yellow);
        }

        /* Animated glitch line */
        .glitch-bar {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%;
            height: 4px;
            background: white;
            opacity: 0.3;
            animation: moveGlitch 3s infinite;
        }

        @keyframes moveGlitch {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
    </style>
</head>
<body>

<div id="overlay" class="mw-container">
    <div class="top-tag">REWARD ACQUIRED</div>
    
    <div class="user-section">
        <div class="avatar" id="avatar"></div>
        <div class="username" id="username">OPERATOR</div>
    </div>
    
    <div class="reward-box">
        <div class="reward-name" id="reward-display">STREAK READY</div>
        <div class="glitch-bar"></div>
    </div>

    <div class="footer-data">
        <div class="data-item" id="data-log">CP: 0000</div>
        <div class="data-item" style="border-color: #fff; opacity: 0.6;">STATUS: ACTIVE</div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const address = params.get("address") || "localhost";
    const port = params.get("port") || "8080";
    const ws = new WebSocket(`ws://${address}:${port}/`);
    let hideTimer;

    ws.onopen = () => {
        ws.send(JSON.stringify({
            request: "Subscribe",
            events: { general: ["Custom"] },
            id: "MWOverlay"
        }));
    };

    ws.onmessage = (event) => {
        const message = JSON.parse(event.data);
        if (message.data?.eventName === "iPhoneCallTrigger") {
            const data = message.data;
            triggerMW(data.user, data.reward, data.cost, data.avatar);
        }
    };

    function triggerMW(user, reward, cost, avatarUrl) {
        const overlay = document.getElementById('overlay');
        const usernameEl = document.getElementById('username');
        const rewardEl = document.getElementById('reward-display');
        const dataLogEl = document.getElementById('data-log');
        const avatarEl = document.getElementById('avatar');

        clearTimeout(hideTimer);

        // Standard 4-digit CP look
        const formattedCost = String(cost).padStart(4, '');

        usernameEl.textContent = user;
        rewardEl.textContent = reward.toUpperCase();
        dataLogEl.textContent = `CP: ${formattedCost}`;
        avatarEl.style.backgroundImage = `url('${avatarUrl}')`;

        overlay.classList.remove('active');
        void overlay.offsetWidth; 
        overlay.classList.add('active');

        hideTimer = setTimeout(() => overlay.classList.remove('active'), 8500);
    }

    ws.onclose = () => setTimeout(() => location.reload(), 5000);
</script>
</body>
</html>
