<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek Coin Flip</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        padding: 40px;
        background: transparent;
        font-family: 'Outfit', sans-serif;
        overflow: hidden;
    }

    /* ═══════════════════════════════════════
    MAIN BANNER (GLASSMORPHISM)
    ═══════════════════════════════════════ */
    #pill-container {
        display: inline-flex;
        align-items: center;
        position: relative;
        background: rgba(15, 20, 30, 0.65);
        -webkit-backdrop-filter: blur(16px);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 16px 24px;
        box-shadow: 
            0 20px 40px rgba(0, 0, 0, 0.4),
            inset 0 1px 1px rgba(255, 255, 255, 0.1);
        min-width: 520px;
        opacity: 0;
        transform: translateY(30px);
        transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1),
                    transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: none;
        color: #ffffff;
    }

    #pill-container.show {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
    }

    /* ═══════════════════════════════════════
    AVATAR
    ═══════════════════════════════════════ */
    .avatar-wrapper {
        margin-right: 20px;
        z-index: 2;
        flex-shrink: 0;
        position: relative;
    }

    .user-avatar {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background-size: cover;
        background-position: center;
        background-color: rgba(255, 255, 255, 0.05);
        border: 2px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 0 15px rgba(0, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        color: #8892b0;
        font-weight: 300;
    }

    /* ═══════════════════════════════════════
    COIN
    ═══════════════════════════════════════ */
    .coin-anchor {
        position: relative;
        z-index: 2;
        margin-right: 20px;
    }

    .coin-stage {
        perspective: 800px;
        width: 56px;
        height: 56px;
    }

    .coin {
        width: 56px;
        height: 56px;
        position: relative;
        transform-style: preserve-3d;
        border-radius: 50%;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }

    .coin-face {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        font-weight: 900;
        color: white;
        border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .coin-heads {
        background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
        box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .coin-tails {
        background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
        box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.5);
        transform: rotateY(180deg);
    }

    @keyframes spinHeads {
        0%   { transform: rotateY(0deg); }
        100% { transform: rotateY(1800deg); }
    }
    @keyframes spinTails {
        0%   { transform: rotateY(0deg); }
        100% { transform: rotateY(1980deg); }
    }
    .coin.spin-heads { animation: spinHeads 2s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
    .coin.spin-tails { animation: spinTails 2s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

    /* ═══════════════════════════════════════
    TEXT GROUP
    ═══════════════════════════════════════ */
    .text-group {
        display: flex;
        flex-direction: column;
        flex-grow: 1;
        z-index: 2;
        min-width: 0;
        justify-content: center;
    }

    .flip-title {
        font-size: 0.65rem;
        letter-spacing: 3px;
        color: #64ffda;
        text-transform: uppercase;
        font-weight: 700;
        margin-bottom: 4px;
        opacity: 0.9;
    }

    .user-name {
        font-size: 1.3rem;
        font-weight: 700;
        color: #ccd6f6;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .flip-message {
        font-size: 0.85rem;
        font-weight: 300;
        color: #8892b0;
        letter-spacing: 0.5px;
        margin-top: 2px;
    }

    /* ═══════════════════════════════════════
    RESULT SHARD
    ═══════════════════════════════════════ */
    .stat-shard {
        margin-left: 20px;
        padding: 10px 18px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        text-align: center;
        z-index: 2;
        flex-shrink: 0;
        min-width: 90px;
        transition: all 0.5s ease;
    }

    .stat-shard.win {
        background: rgba(100, 255, 218, 0.1);
        border-color: rgba(100, 255, 218, 0.4);
        box-shadow: 0 0 20px rgba(100, 255, 218, 0.15);
    }

    .stat-shard.lose {
        background: rgba(255, 107, 107, 0.1);
        border-color: rgba(255, 107, 107, 0.4);
        box-shadow: 0 0 20px rgba(255, 107, 107, 0.15);
    }

    #badge-value {
        display: block;
        font-weight: 900;
        font-size: 1rem;
        color: #e2e8f0;
        letter-spacing: 1px;
        transition: color 0.5s, text-shadow 0.5s;
    }

    .stat-shard.win #badge-value { 
        color: #64ffda; 
        text-shadow: 0 0 10px rgba(100, 255, 218, 0.6); 
    }
    .stat-shard.lose #badge-value { 
        color: #ff6b6b; 
        text-shadow: 0 0 10px rgba(255, 107, 107, 0.6); 
    }

    #badge-label {
        display: block;
        font-size: 0.55rem;
        letter-spacing: 2px;
        color: #8892b0;
        margin-top: 4px;
        text-transform: uppercase;
        font-weight: 500;
    }

    /* ═══════════════════════════════════════
    ANIMATIONS
    ═══════════════════════════════════════ */
    .pulse { animation: sleek-pulse 0.8s cubic-bezier(0.16, 1, 0.3, 1); }

    @keyframes sleek-pulse {
        0%   { transform: scale(1); filter: brightness(1); }
        50%  { transform: scale(1.03); filter: brightness(1.2); }
        100% { transform: scale(1); filter: brightness(1); }
    }

    @keyframes avatarReveal {
        from { opacity: 0; transform: scale(0.8); }
        to   { opacity: 1; transform: scale(1); }
    }
    #pill-container.show .avatar-wrapper {
        animation: avatarReveal 0.5s 0.2s cubic-bezier(0.16,1,0.3,1) both;
    }

    @keyframes resultFlash {
        0%   { opacity: 0; transform: scale(0.8); }
        60%  { transform: scale(1.1); }
        100% { opacity: 1; transform: scale(1); }
    }
    .stat-shard.win, .stat-shard.lose {
        animation: resultFlash 0.4s cubic-bezier(0.16,1,0.3,1) both;
    }
    </style>
</head>
<body>

<div id="pill-container">

    <!-- Avatar -->
    <div class="avatar-wrapper">
        <div class="user-avatar" id="avatar">?</div>
    </div>

    <!-- Coin -->
    <div class="coin-anchor">
        <div class="coin-stage">
            <div class="coin" id="coin">
                <div class="coin-face coin-heads">𖤍</div>
                <div class="coin-face coin-tails">⚔️</div>
            </div>
        </div>
    </div>

    <!-- Text -->
    <div class="text-group">
        <div class="flip-title">Coin Toss</div>
        <div class="user-name"   id="username">Username</div>
        <div class="flip-message" id="display-message">Initiating flip sequence...</div>
    </div>

    <!-- Result -->
    <div class="stat-shard" id="shard">
        <span id="badge-value">...</span>
        <span id="badge-label">Status</span>
    </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);

let hideTimer = null;

ws.onopen = () => {
    ws.send(JSON.stringify({
        request: "Subscribe",
        events: { general: ["Custom"] },
        id: "CoinFlipAlert"
    }));
};

ws.onmessage = (event) => {
    const response = JSON.parse(event.data);
    if (response.data && response.data.eventName === "coin_flip") {
        updateUI(response.data);
    }
};

function updateUI(data) {
    const pill  = document.getElementById('pill-container');
    const coin  = document.getElementById('coin');
    const shard = document.getElementById('shard');
    const avatar = document.getElementById('avatar');
    const isWin = data.called === data.result;

    // 1. Avatar
    if (data.avatar) {
        avatar.style.backgroundImage = `url('${data.avatar}')`;
        avatar.innerText = '';
    } else {
        avatar.style.backgroundImage = '';
        avatar.innerText = '?';
    }

    // 2. Text — pre-flip state
    document.getElementById('username').innerText = data.user || "User";
    document.getElementById('display-message').innerText = `Guessed ${cap(data.called)}. Flipping...`;
    document.getElementById('badge-value').innerText  = "↻";
    document.getElementById('badge-label').innerText  = "Processing";
    shard.className = "stat-shard";

    // 3. Clear any existing hide timer
    if (hideTimer) clearTimeout(hideTimer);

    // 4. Slide banner in
    pill.classList.remove('show');
    void pill.offsetWidth;
    pill.classList.add('show');

    // 5. Spin coin
    coin.className = 'coin';
    void coin.offsetWidth;
    coin.classList.add(data.result === "heads" ? "spin-heads" : "spin-tails");

    // 6. Reveal result after spin finishes (2s)
    setTimeout(() => {
        document.getElementById('badge-value').innerText  = data.result === "heads" ? "HEADS" : "TAILS";
        document.getElementById('badge-label').innerText  = isWin ? "SUCCESS" : "FAILED";
        document.getElementById('display-message').innerText = isWin
            ? `${cap(data.called)} was correct. Match won.`
            : `${cap(data.called)} was incorrect. Match lost.`;

        shard.className = "stat-shard " + (isWin ? "win" : "lose");

        pill.classList.remove('pulse');
        void pill.offsetWidth;
        pill.classList.add('pulse');
    }, 2100);

    // 7. Auto-hide after 8s
    hideTimer = setTimeout(() => {
        pill.classList.remove('show');
    }, 8000);
}

function cap(str) {
    if (!str) return '';
    return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
}
</script>
</body>
</html>
