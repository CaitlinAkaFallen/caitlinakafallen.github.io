<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viking Fart Counter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@700&display=swap');
        body { margin: 0; padding: 20px; background: transparent; overflow: hidden; font-family: 'Inter', sans-serif; }

        #pill-container {
            display: flex; align-items: center; position: relative;
            background: linear-gradient(145deg, rgba(30, 30, 10, 1) 0%, rgba(10, 10, 5, 1) 100%);
            padding: 15px 45px; clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
            border-left: 6px solid #aaff00; /* Toxic Yellow-Green */
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
            transform: skewX(-10deg); width: fit-content;
        }

        /* Gas Cloud Particles */
        .gas-cloud {
            position: absolute; background: rgba(170, 255, 0, 0.2);
            filter: blur(15px); border-radius: 50%; pointer-events: none;
            z-index: 1;
        }

        .stat-group { display: flex; flex-direction: column; align-items: center; transform: skewX(10deg); color: white; position: relative; z-index: 2; }
        .label { font-family: 'Cinzel', serif; font-size: 0.85rem; letter-spacing: 3px; color: #d4ff00; text-shadow: 0 0 10px rgba(170, 255, 0, 0.5); }
        .count { font-size: 3.2rem; font-weight: 900; text-shadow: 0 0 20px rgba(170, 255, 0, 0.3); margin-top: -5px; }

        .stink { animation: stink-wobble 0.5s ease-in-out; }
        @keyframes stink-wobble {
            0% { transform: skewX(10deg) translate(0, 0); }
            25% { transform: skewX(10deg) translate(-2px, -2px); filter: hue-rotate(20deg); }
            75% { transform: skewX(10deg) translate(2px, 2px); }
            100% { transform: skewX(10deg) translate(0, 0); }
        }
    </style>
</head>
<body>

<div id="pill-container">
    <div class="stat-group" id="fart-group">
        <div class="label">Farts</div>
        <div id="fart-count" class="count">0</div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);

    function releaseGas() {
        const container = document.getElementById('pill-container');
        for (let i = 0; i < 5; i++) {
            const cloud = document.createElement('div');
            cloud.className = 'gas-cloud';
            const size = Math.random() * 60 + 40;
            cloud.style.width = size + 'px';
            cloud.style.height = size + 'px';
            cloud.style.left = '40%';
            cloud.style.top = '20%';
            container.appendChild(cloud);

            cloud.animate([
                { transform: 'translate(0, 0) scale(1)', opacity: 0.6 },
                { transform: `translate(${Math.random() * 100 - 50}px, -50px) scale(2)`, opacity: 0 }
            ], { duration: 1500, easing: 'ease-out' }).onfinish = () => cloud.remove();
        }
    }

    ws.onopen = () => ws.send(JSON.stringify({ request: "Subscribe", events: { general: ["Custom"] }, id: "FartStats" }));

    ws.onmessage = (event) => {
        const d = JSON.parse(event.data).data || JSON.parse(event.data);
        if (d.eventName === "updateFarts") {
            const countEl = document.getElementById('fart-count');
            const groupEl = document.getElementById('fart-group');

            if (parseInt(d.count) > parseInt(countEl.innerText)) {
                releaseGas();
            }

            countEl.innerText = d.count;
            groupEl.classList.remove('stink');
            void groupEl.offsetWidth; 
            groupEl.classList.add('stink');
        }
    };
</script>
</body>
</html>
