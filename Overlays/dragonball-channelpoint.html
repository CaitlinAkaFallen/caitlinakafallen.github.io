<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Warrior Overlay</title>
    <style>
        /* Bold, slanted fonts for that action feel */
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Orbitron:wght@700;900&display=swap');

        :root {
            --dbz-orange: #ff8a00;
            --dbz-yellow: #ffcc00;
            --dbz-blue: #0046ad;
            --scouter-green: #33ff33;
            --font-action: 'Bangers', cursive;
            --font-tech: 'Orbitron', sans-serif;
        }

        body {
            margin: 0; padding: 0;
            background-color: transparent;
            overflow: hidden;
            width: 1920px; height: 1080px;
        }

        .dbz-overlay {
            position: fixed;
            top: 50px;
            left: 50%;
            /* Hidden state: Zoomed out with a flash */
            transform: translateX(-50%) scale(0);
            
            width: 650px;
            height: 110px; 
            background: linear-gradient(135deg, var(--dbz-blue) 0%, #001a40 100%);
            border: 4px solid #fff;
            box-shadow: 0 0 20px var(--dbz-blue), inset 0 0 15px rgba(255,255,255,0.3);
            
            /* Aggressive slanted shape */
            clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%);
            
            display: flex;
            align-items: center;
            padding: 0 40px;
            box-sizing: border-box;
            
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
            opacity: 0;
        }

        .dbz-overlay.active {
            transform: translateX(-50%) scale(1);
            opacity: 1;
        }

        .caller-avatar {
            width: 80px;
            height: 80px;
            background-size: cover;
            background-position: center;
            margin-right: 20px;
            border: 3px solid var(--dbz-orange);
            /* Circular but slanted via the parent container */
            border-radius: 10px;
            flex-shrink: 0;
            box-shadow: 0 0 15px var(--dbz-yellow);
        }

        .text-group {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .redeem-text {
            font-family: var(--font-tech);
            font-size: 14px;
            color: var(--scouter-green);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: -5px;
            text-shadow: 0 0 5px var(--scouter-green);
        }

        .caller-name {
            font-family: var(--font-action);
            font-size: 45px;
            color: white;
            letter-spacing: 2px;
            -webkit-text-stroke: 1.5px var(--dbz-orange);
            text-shadow: 3px 3px 0px var(--dbz-blue);
            line-height: 1.1;
        }

        /* Power Level Glow Effect */
        .dbz-overlay.active::after {
            content: '';
            position: absolute;
            inset: -10px;
            border: 2px solid var(--dbz-yellow);
            opacity: 0.5;
            filter: blur(5px);
            animation: aura-pulse 1.5s infinite alternate;
            z-index: -1;
        }

        @keyframes aura-pulse {
            from { transform: scale(1); opacity: 0.3; }
            to { transform: scale(1.05); opacity: 0.7; }
        }
    </style>
</head>
<body>

<div id="overlay" class="dbz-overlay">
    <div class="caller-avatar" id="avatar" style="background-image: url('https://decapi.me/twitch/avatar/twitch');"></div>
    <div class="text-group">
        <div class="redeem-text" id="reward-display">POWER LEVEL: 0</div>
        <div class="caller-name" id="username">Z-WARRIOR</div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const address = params.get("address") || "localhost";
    const port = params.get("port") || "8080";
    const ws = new WebSocket(`ws://${address}:${port}/`);
    let hideTimer;

    ws.onopen = () => {
        ws.send(JSON.stringify({
            request: "Subscribe",
            events: { general: ["Custom"] },
            id: "DBZOverlay"
        }));
        console.log("Connected: Waiting for the power to overflow!");
    };

    ws.onmessage = (event) => {
        const message = JSON.parse(event.data);
        if (message.data?.eventName === "iPhoneCallTrigger") {
            const data = message.data;
            triggerDBZ(data.user, data.reward, data.cost, data.avatar);
        }
    };

    function triggerDBZ(user, reward, cost, avatarUrl) {
        const overlay = document.getElementById('overlay');
        const usernameEl = document.getElementById('username');
        const rewardDisplayEl = document.getElementById('reward-display');
        const avatarEl = document.getElementById('avatar');

        clearTimeout(hideTimer);

        usernameEl.textContent = user.toUpperCase();
        // Label cost as Power Level for the Scouter theme
        rewardDisplayEl.textContent = `POWER LEVEL: ${cost} • ${reward}`;
        avatarEl.style.backgroundImage = `url('${avatarUrl}')`;

        overlay.classList.remove('active');
        void overlay.offsetWidth; 
        overlay.classList.add('active');

        // Shorter duration for high energy
        hideTimer = setTimeout(() => overlay.classList.remove('active'), 7000);
    }

    ws.onclose = () => setTimeout(() => location.reload(), 5000);
</script>
</body>
</html>
