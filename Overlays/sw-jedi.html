<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jedi Holocron Overlay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Orbitron:wght@400;700&display=swap');

        :root {
            --jedi-blue: #00d2ff;
            --jedi-white: #e0f7ff;
            --temple-gold: #c5a059;
            --force-glow: 0 0 20px rgba(0, 210, 255, 0.6);
            --bg-glass: rgba(10, 25, 40, 0.85);
        }

        body {
            margin: 0; padding: 0;
            background-color: transparent;
            overflow: hidden;
            width: 1920px; height: 1080px;
            font-family: 'Orbitron', sans-serif;
        }

        .jedi-container {
            position: fixed;
            top: 150px;
            left: 80px;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .jedi-container.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* The Guardian Lightsaber Accent */
        .saber-bar {
            width: 5px;
            height: 100%;
            position: absolute;
            left: -20px;
            background: #fff;
            box-shadow: 0 0 10px #fff, 0 0 20px var(--jedi-blue), 0 0 40px var(--jedi-blue);
            border-radius: 10px;
            animation: hum 2s infinite ease-in-out;
        }

        @keyframes hum {
            0%, 100% { opacity: 0.9; transform: scaleY(1); }
            50% { opacity: 1; transform: scaleY(1.02); }
        }

        /* Top High Council Label */
        .title-tag {
            font-family: 'Cinzel', serif;
            color: var(--temple-gold);
            font-size: 16px;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 0 0 8px rgba(197, 160, 89, 0.5);
            padding-left: 5px;
            border-left: 2px solid var(--temple-gold);
        }

        .main-panel {
            position: relative;
            background: linear-gradient(135deg, var(--bg-glass) 0%, rgba(0, 15, 30, 0.95) 100%);
            border: 1px solid rgba(0, 210, 255, 0.3);
            padding: 30px;
            display: flex;
            align-items: center;
            box-shadow: var(--force-glow), inset 0 0 30px rgba(0, 210, 255, 0.1);
            /* Elegant, architectural Jedi Temple cut */
            clip-path: polygon(5% 0%, 95% 0%, 100% 20%, 100% 80%, 95% 100%, 5% 100%, 0% 80%, 0% 20%);
        }

        .avatar {
            width: 120px;
            height: 120px;
            border: 2px solid var(--jedi-blue);
            background-size: cover;
            background-position: center;
            margin-right: 35px;
            /* Holocron projection effect */
            filter: brightness(1.1) contrast(1.1) saturate(0.8) cyan(0.2);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
            border-radius: 2px;
        }

        .content {
            display: flex;
            flex-direction: column;
        }

        .username {
            font-family: 'Cinzel', serif;
            font-size: 52px;
            color: var(--jedi-white);
            text-transform: uppercase;
            margin: 0;
            line-height: 1;
            text-shadow: 0 0 15px var(--jedi-blue);
        }

        .reward-text {
            color: var(--jedi-blue);
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 12px;
            font-weight: 700;
            text-shadow: 0 0 10px var(--jedi-blue);
        }

        .cost-data {
            margin-top: 15px;
            font-size: 18px;
            color: var(--temple-gold);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
        }

        .cost-value {
            color: #fff;
            font-weight: bold;
            font-size: 24px;
            text-shadow: 0 0 5px #fff;
        }

        /* Force Particles animation */
        .particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle, #fff 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.1;
            animation: floatParticles 10s linear infinite;
            pointer-events: none;
        }

        @keyframes floatParticles {
            from { background-position: 0 0; }
            to { background-position: 100px 100px; }
        }
    </style>
</head>
<body>

<div id="overlay" class="jedi-container">
    <div class="saber-bar"></div>
    <div class="title-tag">Jedi Archive Record</div>
    
    <div class="main-panel">
        <div class="particles"></div>
        <div class="avatar" id="avatar"></div>
        
        <div class="content">
            <div class="username" id="username">JEDI_KNIGHT</div>
            <div class="reward-text" id="reward-display">May the Force be with you</div>
            
            <div class="cost-data">
                REPUBLIC CREDITS: <span class="cost-value" id="data-log">0000</span>
            </div>
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const address = params.get("address") || "localhost";
    const port = params.get("port") || "8080";
    const ws = new WebSocket(`ws://${address}:${port}/`);
    let hideTimer;

    ws.onopen = () => {
        ws.send(JSON.stringify({
            request: "Subscribe",
            events: { general: ["Custom"] },
            id: "JediOverlay"
        }));
    };

    ws.onmessage = (event) => {
        const message = JSON.parse(event.data);
        if (message.data?.eventName === "iPhoneCallTrigger") {
            const data = message.data;
            triggerJedi(data.user, data.reward, data.cost, data.avatar);
        }
    };

    function triggerJedi(user, reward, cost, avatarUrl) {
        const overlay = document.getElementById('overlay');
        const usernameEl = document.getElementById('username');
        const rewardEl = document.getElementById('reward-display');
        const dataLogEl = document.getElementById('data-log');
        const avatarEl = document.getElementById('avatar');

        clearTimeout(hideTimer);

        usernameEl.textContent = user;
        rewardEl.textContent = reward;
        dataLogEl.textContent = cost;
        avatarEl.style.backgroundImage = `url('${avatarUrl}')`;

        overlay.classList.remove('active');
        void overlay.offsetWidth; 
        overlay.classList.add('active');

        hideTimer = setTimeout(() => overlay.classList.remove('active'), 8500);
    }

    ws.onclose = () => setTimeout(() => location.reload(), 5000);
</script>
</body>
</html>
