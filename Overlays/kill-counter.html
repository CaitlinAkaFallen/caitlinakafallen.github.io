<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viking Kill Counter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@700&display=swap');
        body { margin: 0; padding: 20px; background: transparent; overflow: hidden; font-family: 'Inter', sans-serif; }

        #pill-container {
            display: flex; align-items: center; position: relative;
            background: linear-gradient(145deg, rgba(40, 10, 10, 1) 0%, rgba(20, 5, 5, 1) 100%);
            padding: 15px 45px; clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
            border-left: 6px solid #ff1414; /* Blood Red */
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
            transform: skewX(-10deg); width: fit-content;
        }

        #pill-container::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            opacity: 0.2; mix-blend-mode: overlay; pointer-events: none;
        }

        .stat-group { display: flex; flex-direction: column; align-items: center; transform: skewX(10deg); color: white; position: relative; }
        .label { font-family: 'Cinzel', serif; font-size: 0.85rem; letter-spacing: 3px; color: #ff4444; text-shadow: 0 0 10px rgba(255, 20, 20, 0.5); }
        .count { font-size: 3.2rem; font-weight: 900; text-shadow: 0 0 20px rgba(255, 0, 0, 0.4); margin-top: -5px; z-index: 2; }

        /* Shatter Particles */
        .particle {
            position: absolute; background: #e0e0e0; pointer-events: none;
            width: 6px; height: 6px; border-radius: 1px; z-index: 1;
        }

        .shatter { animation: skull-shatter 0.4s ease-out; }
        @keyframes skull-shatter {
            0% { transform: skewX(10deg) scale(1); filter: brightness(1); }
            50% { transform: skewX(10deg) scale(1.3); filter: brightness(2) drop-shadow(0 0 15px red); }
            100% { transform: skewX(10deg) scale(1); }
        }
    </style>
</head>
<body>

<div id="pill-container">
    <div class="stat-group" id="kill-group">
        <div class="label">Kills</div>
        <div id="kill-count" class="count">0</div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);

    function createShatter() {
        const container = document.getElementById('kill-group');
        for (let i = 0; i < 15; i++) { // Increased particle count
            const p = document.createElement('div');
            p.className = 'particle';
            
            // Randomize bone shard sizes
            const size = Math.random() * 8 + 2;
            p.style.width = size + 'px';
            p.style.height = (size / 2) + 'px'; // Shard shape
            
            const angle = Math.random() * Math.PI * 2;
            const tx = Math.cos(angle) * (Math.random() * 120 + 40);
            const ty = Math.sin(angle) * (Math.random() * 120 + 40);
            
            p.style.left = '50%';
            p.style.top = '50%';
            container.appendChild(p);

            p.animate([
                { transform: 'translate(-50%, -50%) rotate(0deg) scale(1)', opacity: 1 },
                { transform: `translate(${tx}px, ${ty}px) rotate(${Math.random() * 360}deg) scale(0)`, opacity: 0 }
            ], { duration: 700, easing: 'cubic-bezier(0.1, 0.9, 0.2, 1)' }).onfinish = () => p.remove();
        }
    }

    ws.onopen = () => ws.send(JSON.stringify({ request: "Subscribe", events: { general: ["Custom"] }, id: "KillStats" }));

    ws.onmessage = (event) => {
        const d = JSON.parse(event.data).data || JSON.parse(event.data);
        if (d.eventName === "updateKills") {
            const countEl = document.getElementById('kill-count');
            const groupEl = document.getElementById('kill-group');

            // Trigger shatter ONLY on + kills
            if (parseInt(d.count) > parseInt(countEl.innerText)) {
                createShatter();
            }

            countEl.innerText = d.count;
            groupEl.classList.remove('shatter');
            void groupEl.offsetWidth; 
            groupEl.classList.add('shatter');
        }
    };
</script>
</body>
</html>
