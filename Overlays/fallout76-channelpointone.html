<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fallout 76 Pip-Boy Overlay</title>
    <style>
        /* Terminal Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

        :root {
            --pip-green: #14ff00;
            --pip-green-dim: rgba(20, 255, 0, 0.4);
            --pip-bg: rgba(5, 20, 5, 0.85);
            --pip-glow: 0 0 15px rgba(20, 255, 0, 0.7);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            overflow: hidden;
            width: 1920px;
            height: 1080px;
            font-family: 'Share Tech Mono', monospace;
        }

        .fallout-container {
            position: fixed;
            top: 150px;
            left: 100px;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .fallout-container.active {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* Header */
        .header-strip {
            background: var(--pip-green);
            color: black;
            font-size: 22px;
            padding: 4px 20px;
            width: fit-content;
            text-transform: uppercase;
            clip-path: polygon(0 0, 100% 0, 95% 100%, 0% 100%);
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        /* Main Panel */
        .user-section {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--pip-bg);
            border: 2px solid var(--pip-green);
            padding: 20px;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.8), var(--pip-glow);
            border-radius: 4px;
            overflow: hidden;
        }

        /* Avatar */
        .avatar {
            width: 110px;
            height: 110px;
            border: 2px solid var(--pip-green);
            background-size: cover;
            background-position: center;
            margin-right: 25px;
            filter: contrast(1.3) saturate(1.2) hue-rotate(90deg);
            box-shadow: var(--pip-glow);
        }

        /* Text */
        .info-text {
            display: flex;
            flex-direction: column;
        }

        .username {
            font-size: 48px;
            color: var(--pip-green);
            text-shadow: var(--pip-glow);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .reward-display {
            font-family: 'VT323', monospace;
            font-size: 32px;
            color: var(--pip-green);
            margin-top: 5px;
            text-shadow: var(--pip-glow);
        }

        .cost-section {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .caps-label {
            background: var(--pip-green);
            color: black;
            padding: 2px 10px;
            font-weight: bold;
            font-size: 20px;
        }

        .cost-value {
            font-size: 32px;
            color: var(--pip-green);
            text-shadow: var(--pip-glow);
        }

        /* CRT Scanlines */
        .crt-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.05) 0px,
                rgba(0, 0, 0, 0.05) 2px,
                rgba(0, 0, 0, 0.15) 3px
            );
            opacity: 0.35;
        }

        /* Scanner Line */
        .scanner-line {
            position: absolute;
            top: -120px;
            left: 0;
            width: 100%;
            height: 120px;
            background: linear-gradient(
                to bottom,
                rgba(20, 255, 0, 0) 0%,
                rgba(20, 255, 0, 0.25) 50%,
                rgba(20, 255, 0, 0) 100%
            );
            animation: scan 4s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% { top: -120px; }
            100% { top: 100%; }
        }
    </style>
</head>
<body>

<div id="overlay" class="fallout-container">
    <div class="header-strip">OBJECTIVE COMPLETED</div>
    
    <div class="user-section">
        <div class="avatar" id="avatar"></div>

        <div class="info-text">
            <div class="username" id="username">VAULT_DWELLER</div>
            <div class="reward-display" id="reward-display">COLLECTING REWARD...</div>

            <div class="cost-section">
                <div class="caps-label">CAPS</div>
                <div class="cost-value" id="data-log">0000</div>
            </div>
        </div>

        <div class="crt-overlay"></div>
        <div class="scanner-line"></div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const address = params.get("address") || "localhost";
    const port = params.get("port") || "8080";
    const ws = new WebSocket(`ws://${address}:${port}/`);
    let hideTimer;

    ws.onopen = () => {
        ws.send(JSON.stringify({
            request: "Subscribe",
            events: { general: ["Custom"] },
            id: "FalloutOverlay"
        }));
    };

    ws.onmessage = (event) => {
        const message = JSON.parse(event.data);
        if (message.data?.eventName === "iPhoneCallTrigger") {
            const data = message.data;
            triggerFallout(data.user, data.reward, data.cost, data.avatar);
        }
    };

    function triggerFallout(user, reward, cost, avatarUrl) {
        const overlay = document.getElementById('overlay');
        const usernameEl = document.getElementById('username');
        const rewardEl = document.getElementById('reward-display');
        const dataLogEl = document.getElementById('data-log');
        const avatarEl = document.getElementById('avatar');

        clearTimeout(hideTimer);

        usernameEl.textContent = user;
        rewardEl.textContent = reward.toUpperCase();
        dataLogEl.textContent = cost;
        avatarEl.style.backgroundImage = `url('${avatarUrl}')`;

        overlay.classList.remove('active');
        void overlay.offsetWidth;
        overlay.classList.add('active');

        hideTimer = setTimeout(() => overlay.classList.remove('active'), 8500);
    }

    ws.onclose = () => setTimeout(() => location.reload(), 5000);
</script>

</body>
</html>
