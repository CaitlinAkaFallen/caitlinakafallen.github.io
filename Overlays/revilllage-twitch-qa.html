<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Evil Village: House of Lords</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Playfair+Display:ital,wght@0,700;1,400&family=IM+Fell+English+SC&display=swap');

        :root {
            /* Village / Survivor Theme */
            --rev-cold-grey: #2c3e50;
            --rev-mist: rgba(200, 210, 220, 0.9);
            --rev-iron: #1a1a1a;
            
            /* The Four Lords Theme */
            --lord-gold: #c5a059;
            --lord-blood: #4a0404;
            --lord-bg: #0d0d0d;
        }

        body { margin: 0; padding: 40px; background-color: transparent; overflow: hidden; }

        #alert-wrapper {
            display: flex;
            align-items: center;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        #alert-wrapper.show { opacity: 1; transform: translateY(0) scale(1); }

        #pill-container {
            display: flex;
            align-items: center;
            position: relative;
            padding: 25px 45px;
            background: var(--rev-mist);
            border: 2px solid var(--rev-iron);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            min-width: 600px;
            max-width: 850px;
            transition: all 1s ease-in-out;
        }

        /* --- THE FOUR LORDS TRANSITION --- */
        #pill-container.thanks { 
            background: var(--lord-bg);
            border: 2px solid var(--lord-gold);
            box-shadow: 0 0 30px rgba(197, 160, 89, 0.2), inset 0 0 60px var(--lord-blood);
        }

        /* Ornate Corners for the Lords */
        #pill-container::before, #pill-container::after {
            content: '♦';
            position: absolute;
            color: var(--rev-iron);
            font-size: 20px;
            transition: all 0.8s;
            opacity: 0.5;
        }
        #pill-container::before { top: 10px; left: 10px; }
        #pill-container::after { bottom: 10px; right: 10px; }

        #pill-container.thanks::before, #pill-container.thanks::after {
            content: '⚜';
            color: var(--lord-gold);
            opacity: 1;
            text-shadow: 0 0 10px var(--lord-gold);
        }

        /* Avatar: The Portrait Frame */
        .avatar-wrapper { 
            position: relative;
            margin-right: 35px; 
            z-index: 2; 
        }

        .user-avatar {
            width: 110px; height: 110px;
            background-size: cover; background-position: center;
            border: 4px solid var(--rev-iron);
            filter: grayscale(0.6) sepia(0.2);
            transition: all 0.8s;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.4);
        }

        #pill-container.thanks .user-avatar {
            border: 4px solid var(--lord-gold);
            filter: grayscale(0) contrast(1.1) brightness(0.9);
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.4);
        }

        /* Text Styles */
        .text-group { display: flex; flex-direction: column; z-index: 2; }
        
        .user-header { 
            font-family: 'IM Fell English SC', serif;
            font-size: 1rem; 
            color: var(--rev-iron); 
            text-transform: uppercase; 
            letter-spacing: 3px;
            margin-bottom: 2px;
            transition: color 0.8s;
        }

        .user-name { 
            font-family: 'Cinzel Decorative', cursive;
            font-size: 2.2rem; 
            color: #111;
            margin: 0; 
            line-height: 1;
            transition: color 0.8s;
        }
        
        .question-text { 
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem; 
            color: #333; 
            margin-top: 12px;
            font-style: italic;
            border-top: 1px solid rgba(0,0,0,0.1);
            padding-top: 8px;
            transition: color 0.8s, border-color 0.8s;
        }

        /* Lord Text Colors */
        #pill-container.thanks .user-header { color: var(--lord-gold); }
        #pill-container.thanks .user-name { 
            color: #fff; 
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }
        #pill-container.thanks .question-text { 
            color: #ccc; 
            border-top-color: var(--lord-gold);
        }

        /* Subtle Blood Stain Effect for the Lords */
        .blood-stain {
            position: absolute;
            top: 0; right: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at top right, rgba(74, 4, 4, 0.4), transparent 70%);
            opacity: 0;
            transition: opacity 1s;
            pointer-events: none;
        }
        #pill-container.thanks .blood-stain { opacity: 1; }

    </style>
</head>
<body>

<div id="alert-wrapper">
    <div id="pill-container">
        <div class="blood-stain"></div>
        <div class="avatar-wrapper">
            <div class="user-avatar" id="avatar"></div>
        </div>
        <div class="text-group">
            <div class="user-header" id="header-text">VILLAGE SURVIVOR</div>
            <div class="user-name" id="username">STRANGER</div>
            <div class="question-text" id="content-text">"I hope you're prepared for what's coming..."</div>
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);

    ws.onopen = () => {
        ws.send(JSON.stringify({ request: "Subscribe", events: { general: ["Custom"] }, id: "RE8Village" }));
    };

    ws.onmessage = (event) => {
        const response = JSON.parse(event.data);
        const d = response.data || response;

        if (d.eventName === "questionAlert" || d.eventName === "thankYouAlert") {
            const pill = document.getElementById('pill-container');
            const wrapper = document.getElementById('alert-wrapper');
            const header = document.getElementById('header-text');
            
            document.getElementById('username').innerText = d.user;
            document.getElementById('avatar').style.backgroundImage = `url('${d.avatar}')`;

            if (d.eventName === "thankYouAlert") {
                pill.classList.add('thanks');
                header.innerText = "GUEST OF THE LORDS";
                document.getElementById('content-text').innerText = "A contribution to the House. How generous.";
            } else {
                pill.classList.remove('thanks');
                header.innerText = "VILLAGE SURVIVOR";
                document.getElementById('content-text').innerText = d.message;
            }

            wrapper.classList.add('show');
            setTimeout(() => { wrapper.classList.remove('show'); }, 15000);
        }
    };
</script>
</body>
</html>
