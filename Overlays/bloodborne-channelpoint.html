<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloodborne Hunter Overlay</title>
    <style>
        /* Gothic Serif for that Yharnam feel */
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,600;1,700&family=EB+Garamond:wght@500;800&display=swap');

        :root {
            --blood-red: #8a0303;
            --insight-white: #f0ebe0;
            --hunter-black: rgba(10, 10, 12, 0.95);
            --font-gothic: 'EB Garamond', serif;
        }

        body {
            margin: 0; padding: 0;
            background-color: transparent;
            overflow: hidden;
            width: 1920px; height: 1080px;
        }

        .bloodborne-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scaleX(0); /* Expands from center */
            
            width: 700px;
            height: 120px; 
            background: linear-gradient(90deg, transparent, var(--hunter-black) 20%, var(--hunter-black) 80%, transparent);
            border-top: 1px solid rgba(138, 3, 3, 0.5);
            border-bottom: 1px solid rgba(138, 3, 3, 0.5);
            
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 50px;
            box-sizing: border-box;
            
            transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s;
            opacity: 0;
        }

        .bloodborne-overlay.active {
            transform: translate(-50%, -50%) scaleX(1);
            opacity: 1;
        }

        .caller-avatar {
            width: 80px;
            height: 80px;
            background-size: cover;
            background-position: center;
            margin-right: 25px;
            border: 1px solid var(--blood-red);
            outline: 3px solid var(--hunter-black);
            box-shadow: 0 0 15px rgba(138, 3, 3, 0.7);
            flex-shrink: 0;
            filter: sepia(0.5) contrast(1.2); /* Gritty look */
        }

        .text-group {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .redeem-text {
            font-family: 'Crimson Text', serif;
            font-size: 16px;
            font-style: italic;
            text-transform: uppercase;
            color: var(--insight-white);
            letter-spacing: 4px;
            opacity: 0.8;
            margin-bottom: 2px;
        }

        .caller-name {
            font-family: var(--font-gothic);
            font-size: 38px;
            font-weight: 800;
            color: var(--blood-red);
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1;
            /* Faint glow like a boss name */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8), 0 0 10px rgba(138, 3, 3, 0.4);
        }

        /* Blood Splatter Effect on Enter */
        .blood-drip {
            position: absolute;
            top: 100%; left: 0; width: 100%; height: 0;
            background: linear-gradient(to bottom, var(--blood-red), transparent);
            opacity: 0;
            transition: height 2s ease, opacity 1s;
        }

        .bloodborne-overlay.active .blood-drip {
            height: 40px;
            opacity: 0.4;
        }
    </style>
</head>
<body>

<div id="overlay" class="bloodborne-overlay">
    <div class="blood-drip"></div>
    <div class="caller-avatar" id="avatar" style="background-image: url('https://decapi.me/twitch/avatar/twitch');"></div>
    <div class="text-group">
        <div class="redeem-text" id="reward-display">Blood Echoes Spent</div>
        <div class="caller-name" id="username">Good Hunter</div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const address = params.get("address") || "localhost";
    const port = params.get("port") || "8080";
    const ws = new WebSocket(`ws://${address}:${port}/`);
    let hideTimer;

    ws.onopen = () => {
        ws.send(JSON.stringify({
            request: "Subscribe",
            events: { general: ["Custom"] },
            id: "BloodborneOverlay"
        }));
        console.log("Connected: The Hunt begins...");
    };

    ws.onmessage = (event) => {
        const message = JSON.parse(event.data);
        if (message.data?.eventName === "iPhoneCallTrigger") {
            const data = message.data;
            triggerBloodborne(data.user, data.reward, data.cost, data.avatar);
        }
    };

    function triggerBloodborne(user, reward, cost, avatarUrl) {
        const overlay = document.getElementById('overlay');
        const usernameEl = document.getElementById('username');
        const rewardDisplayEl = document.getElementById('reward-display');
        const avatarEl = document.getElementById('avatar');

        clearTimeout(hideTimer);

        usernameEl.textContent = user;
        // The cost is now labeled as "Blood Echoes"
        rewardDisplayEl.textContent = `${cost} Echoes • ${reward}`;
        avatarEl.style.backgroundImage = `url('${avatarUrl}')`;

        overlay.classList.remove('active');
        void overlay.offsetWidth; 
        overlay.classList.add('active');

        // Bloodborne titles linger a bit longer for dramatic effect
        hideTimer = setTimeout(() => overlay.classList.remove('active'), 10000);
    }

    ws.onclose = () => setTimeout(() => location.reload(), 5000);
</script>
</body>
</html>
