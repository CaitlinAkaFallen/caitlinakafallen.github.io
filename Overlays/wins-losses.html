<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viking Win/Loss Pill</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@700&display=swap');
        body { margin: 0; padding: 20px; background: transparent; overflow: hidden; font-family: 'Inter', sans-serif; }
        #pill-container {
            display: flex; align-items: center; position: relative;
            background: linear-gradient(145deg, rgba(30, 45, 50, 1) 0%, rgba(10, 20, 25, 1) 100%);
            padding: 15px 35px; clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%);
            border-left: 6px solid #00d4ff; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
            transform: skewX(-10deg); width: fit-content; transition: border-color 0.4s ease;
        }
        #pill-container::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            opacity: 0.15; mix-blend-mode: soft-light; pointer-events: none;
        }
        .stat-group { display: flex; gap: 40px; transform: skewX(10deg); color: white; margin-left: 10px; }
        .stat-item { display: flex; flex-direction: column; align-items: center; }
        .label { font-family: 'Cinzel', serif; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; }
        .count { font-size: 2.2rem; font-weight: 900; }
        .win-text { color: #22ff88; text-shadow: 0 0 15px rgba(34, 255, 136, 0.4); }
        .loss-text { color: #ff4444; text-shadow: 0 0 15px rgba(255, 68, 68, 0.4); }
        .pulse { animation: pulse-anim 0.5s ease-out; }
        @keyframes pulse-anim {
            0% { transform: skewX(-10deg) scale(1); }
            50% { transform: skewX(-10deg) scale(1.1); filter: brightness(1.3); }
            100% { transform: skewX(-10deg) scale(1); }
        }
    </style>
</head>
<body>
<div id="pill-container">
    <div class="stat-group">
        <div class="stat-item">
            <div class="label win-text">Wins</div>
            <div id="win-count" class="count">0</div>
        </div>
        <div class="stat-item">
            <div class="label loss-text">Losses</div>
            <div id="loss-count" class="count">0</div>
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);

    ws.onopen = () => {
        ws.send(JSON.stringify({ request: "Subscribe", events: { general: ["Custom"] }, id: "VikingStats" }));
        console.log("Connected to Streamer.bot");
    };

    ws.onmessage = (event) => {
        const response = JSON.parse(event.data);
        // Look for the data either in response.data (standard) or directly in response (broadcast)
        const d = response.data || response;

        if (d.eventName === "updateStats") {
            const winEl = document.getElementById('win-count');
            const lossEl = document.getElementById('loss-count');
            const pill = document.getElementById('pill-container');

            // Update the numbers
            winEl.innerText = d.wins;
            lossEl.innerText = d.losses;

            // Trigger animation
            pill.classList.remove('pulse');
            void pill.offsetWidth; 
            pill.classList.add('pulse');
        }
    };
</script>
</body>
</html>
