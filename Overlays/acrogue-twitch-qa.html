<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Rogue: Assassin to Templar</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@600;700&display=swap');

        :root {
            /* Assassin Style (Shay's Beginning) */
            --assassin-teal: #008c8c;
            --assassin-bg: rgba(255, 255, 255, 0.9);
            --assassin-accent: #2c3e50;
            
            /* Templar Style (The Rogue) */
            --templar-red: #8b0000;
            --templar-bg: rgba(10, 10, 10, 0.95);
            --templar-frost: #e0eafc;
        }

        body { margin: 0; padding: 40px; background-color: transparent; font-family: 'Cormorant Garamond', serif; overflow: hidden; }

        #alert-wrapper {
            display: flex;
            align-items: center;
            opacity: 0;
            transform: translateX(-50px) skewX(-5deg);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        #alert-wrapper.show { opacity: 1; transform: translateX(0) skewX(0deg); }

        #pill-container {
            display: flex;
            align-items: center;
            position: relative;
            padding: 20px 40px;
            min-width: 550px;
            max-width: 800px;
            background: var(--assassin-bg);
            border-top: 2px solid var(--assassin-teal);
            border-bottom: 2px solid var(--assassin-teal);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- TEMPLAR TRANSITION (When 'thanks' class is added) --- */
        #pill-container.thanks { 
            background: var(--templar-bg);
            border-top-color: var(--templar-red);
            border-bottom-color: var(--templar-red);
            box-shadow: 0 15px 40px rgba(0,0,0,0.8), inset 0 0 100px rgba(139, 0, 0, 0.2);
        }

        /* Animus Glitch Background Overlay */
        #pill-container::before {
            content: "|||||||||||||||||";
            position: absolute;
            font-size: 80px;
            font-family: Arial;
            color: var(--assassin-teal);
            opacity: 0.05;
            top: -20px; right: -20px;
            letter-spacing: -5px;
            pointer-events: none;
            transition: color 0.8s;
        }

        #pill-container.thanks::before {
            color: var(--templar-red);
            content: "✕✕✕✕✕✕✕✕✕✕";
        }

        .avatar-wrapper { 
            position: relative;
            margin-right: 30px; 
            z-index: 2; 
        }

        .user-avatar {
            width: 80px; height: 80px;
            background-size: cover; background-position: center;
            border: 2px solid var(--assassin-teal);
            transform: rotate(-3deg);
            transition: all 0.8s;
            filter: sepia(0.5);
        }

        #pill-container.thanks .user-avatar {
            border-color: var(--templar-red);
            transform: rotate(0deg) scale(1.1);
            filter: contrast(1.2) grayscale(0.3);
            box-shadow: 0 0 15px var(--templar-red);
        }

        .text-group { display: flex; flex-direction: column; z-index: 2; position: relative; }
        
        .user-header { 
            font-family: 'Cinzel', serif;
            font-size: 0.85rem; 
            color: var(--assassin-teal); 
            text-transform: uppercase; 
            letter-spacing: 5px; 
            margin-bottom: 5px;
            transition: color 0.8s;
        }

        .user-name { 
            font-family: 'Cinzel', serif;
            font-size: 2rem; 
            font-weight: 700; 
            color: var(--assassin-accent);
            margin: 0; 
            transition: color 0.8s;
        }
        
        .question-text { 
            font-size: 1.3rem; 
            color: #444; 
            margin-top: 5px; 
            font-style: italic;
            transition: color 0.8s;
        }

        /* Templar Text Colors */
        #pill-container.thanks .user-header { color: var(--templar-red); }
        #pill-container.thanks .user-name { color: white; }
        #pill-container.thanks .question-text { color: #ccc; }

        /* The Crest Decoration */
        .crest-bg {
            position: absolute;
            right: -20px;
            bottom: -20px;
            font-family: 'Cinzel';
            font-size: 120px;
            color: var(--assassin-teal);
            opacity: 0.1;
            pointer-events: none;
            transition: all 0.8s;
        }
        #pill-container.thanks .crest-bg {
            color: var(--templar-red);
            transform: rotate(180deg);
            opacity: 0.15;
        }

    </style>
</head>
<body>

<div id="alert-wrapper">
    <div id="pill-container">
        <div class="crest-bg">Λ</div> <!-- Placeholder for Assassin/Templar crest vibe -->
        <div class="avatar-wrapper">
            <div class="user-avatar" id="avatar"></div>
        </div>
        <div class="text-group">
            <div class="user-header" id="header-text">Assassin Brotherhood</div>
            <div class="user-name" id="username">Novice</div>
            <div class="question-text" id="content-text">"Stay my blade from the flesh of the innocent..."</div>
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);

    ws.onopen = () => {
        ws.send(JSON.stringify({ request: "Subscribe", events: { general: ["Custom"] }, id: "ACRogueQA" }));
    };

    ws.onmessage = (event) => {
        const response = JSON.parse(event.data);
        const d = response.data || response;

        if (d.eventName === "questionAlert" || d.eventName === "thankYouAlert") {
            const pill = document.getElementById('pill-container');
            const wrapper = document.getElementById('alert-wrapper');
            const header = document.getElementById('header-text');
            const crest = document.querySelector('.crest-bg');
            
            document.getElementById('username').innerText = d.user;
            document.getElementById('avatar').style.backgroundImage = `url('${d.avatar}')`;

            if (d.eventName === "thankYouAlert") {
                // TEMPLAR STATE
                pill.classList.add('thanks');
                header.innerText = "Templar Order";
                crest.innerText = "✕"; // Templar Cross style
                document.getElementById('content-text').innerText = "May the Father of Understanding lead us.";
            } else {
                // ASSASSIN STATE
                pill.classList.remove('thanks');
                header.innerText = "Assassin Brotherhood";
                crest.innerText = "Λ"; // Assassin Crest style
                document.getElementById('content-text').innerText = d.message;
            }

            wrapper.classList.add('show');
            setTimeout(() => { wrapper.classList.remove('show'); }, 15000);
        }
    };
</script>
</body>
</html>
