<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sith Holocron Overlay</title>
    <style>
        /* Cinematic and Sci-Fi Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Orbitron:wght@400;700&display=swap');

        :root {
            --sith-red: #ff0000;
            --dark-side: #0a0000;
            --lava-glow: rgba(255, 0, 0, 0.6);
            --border-glow: 0 0 20px rgba(255, 0, 0, 0.5);
        }

        body {
            margin: 0; padding: 0;
            background-color: transparent;
            overflow: hidden;
            width: 1920px; height: 1080px;
            font-family: 'Orbitron', sans-serif;
        }

        .sith-container {
            position: fixed;
            top: 150px;
            left: 80px;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: perspective(1000px) rotateY(-20deg) scale(0.8);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .sith-container.active {
            opacity: 1;
            transform: perspective(1000px) rotateY(0deg) scale(1);
        }

        /* The Lightsaber Accent Bar */
        .saber-bar {
            width: 4px;
            height: 100%;
            position: absolute;
            left: -15px;
            background: #fff;
            box-shadow: 0 0 10px #fff, 0 0 20px var(--sith-red), 0 0 40px var(--sith-red);
            animation: flicker 0.15s infinite alternate;
        }

        @keyframes flicker {
            from { opacity: 0.8; }
            to { opacity: 1; }
        }

        /* Top Cinematic Label */
        .title-tag {
            font-family: 'Cinzel', serif;
            color: var(--sith-red);
            font-size: 18px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 8px;
            text-shadow: 0 0 10px var(--sith-red);
            border-bottom: 1px solid var(--sith-red);
            width: fit-content;
        }

        .main-panel {
            position: relative;
            background: linear-gradient(135deg, #1a0000 0%, #050000 100%);
            border: 1px solid rgba(255, 0, 0, 0.3);
            padding: 25px;
            display: flex;
            align-items: center;
            box-shadow: var(--border-glow), inset 0 0 50px rgba(0,0,0,0.9);
            clip-path: polygon(0 0, 100% 0, 100% 85%, 95% 100%, 0 100%);
        }

        .avatar {
            width: 120px;
            height: 120px;
            border: 2px solid var(--sith-red);
            background-size: cover;
            background-position: center;
            margin-right: 30px;
            filter: grayscale(0.5) contrast(1.2) sepia(0.5) hue-rotate(-50deg);
            box-shadow: 0 0 15px var(--lava-glow);
            position: relative;
        }

        .content {
            display: flex;
            flex-direction: column;
        }

        .username {
            font-family: 'Cinzel', serif;
            font-size: 55px;
            color: #fff;
            text-transform: uppercase;
            margin: 0;
            line-height: 1;
            text-shadow: 0 0 20px var(--sith-red);
        }

        .reward-text {
            color: var(--sith-red);
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; text-shadow: 0 0 5px var(--sith-red); }
            50% { opacity: 1; text-shadow: 0 0 20px var(--sith-red); }
            100% { opacity: 0.6; text-shadow: 0 0 5px var(--sith-red); }
        }

        .cost-data {
            margin-top: 15px;
            font-size: 22px;
            color: rgba(255, 255, 255, 0.7);
            border-top: 1px solid rgba(255, 0, 0, 0.2);
            padding-top: 5px;
        }

        .cost-value {
            color: #fff;
            font-weight: bold;
            font-size: 26px;
        }

        /* Animated Dark Clouds / Smoke effect inside the panel */
        .smoke-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            opacity: 0.1;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="overlay" class="sith-container">
    <div class="saber-bar"></div>
    <div class="title-tag">Imperial Priority Alert</div>
    
    <div class="main-panel">
        <div class="smoke-overlay"></div>
        <div class="avatar" id="avatar"></div>
        
        <div class="content">
            <div class="username" id="username">DARTH_USER</div>
            <div class="reward-text" id="reward-display">Execute Order 66</div>
            
            <div class="cost-data">
                CREDITS: <span class="cost-value" id="data-log">0000</span> // SYSTEM: RED_SECTOR
            </div>
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const address = params.get("address") || "localhost";
    const port = params.get("port") || "8080";
    const ws = new WebSocket(`ws://${address}:${port}/`);
    let hideTimer;

    ws.onopen = () => {
        ws.send(JSON.stringify({
            request: "Subscribe",
            events: { general: ["Custom"] },
            id: "SithOverlay"
        }));
    };

    ws.onmessage = (event) => {
        const message = JSON.parse(event.data);
        if (message.data?.eventName === "iPhoneCallTrigger") {
            const data = message.data;
            triggerSith(data.user, data.reward, data.cost, data.avatar);
        }
    };

    function triggerSith(user, reward, cost, avatarUrl) {
        const overlay = document.getElementById('overlay');
        const usernameEl = document.getElementById('username');
        const rewardEl = document.getElementById('reward-display');
        const dataLogEl = document.getElementById('data-log');
        const avatarEl = document.getElementById('avatar');

        clearTimeout(hideTimer);

        usernameEl.textContent = user;
        rewardEl.textContent = reward;
        dataLogEl.textContent = cost;
        avatarEl.style.backgroundImage = `url('${avatarUrl}')`;

        overlay.classList.remove('active');
        void overlay.offsetWidth; 
        overlay.classList.add('active');

        hideTimer = setTimeout(() => overlay.classList.remove('active'), 8500);
    }

    ws.onclose = () => setTimeout(() => location.reload(), 5000);
</script>
</body>
</html>
