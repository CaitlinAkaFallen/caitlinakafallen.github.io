<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lurk and Unlurk Overlay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600&display=swap');

        body { 
            margin: 0; 
            padding: 40px; 
            background-color: transparent; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
        }

        #alert-wrapper {
            display: flex;
            align-items: center;
            opacity: 0;
            transform: translateX(-100px);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #alert-wrapper.show { 
            opacity: 1; 
            transform: translateX(0); 
        }

        #pill-container {
            display: flex;
            align-items: center;
            background: radial-gradient(circle at center, rgba(20, 40, 45, 0.98) 0%, rgba(5, 15, 20, 1) 100%);
            -webkit-backdrop-filter: blur(15px);
            backdrop-filter: blur(15px);
            padding: 15px 35px;
            clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%);
            border-left: 6px solid #ffaa00;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            transform: skewX(-10deg);
            min-width: 480px;
        }

        .avatar-wrapper { 
            transform: skewX(10deg); 
            margin-right: 25px; 
        }

        .user-avatar {
            width: 75px; 
            height: 75px;
            background-size: cover; 
            background-position: center;
            border: 3px solid #ffaa00;
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.3);
        }

        .text-group { 
            display: flex; 
            flex-direction: column; 
            transform: skewX(10deg); 
            color: white; 
        }

        .user-name { 
            font-family: 'Cinzel', serif; 
            font-size: 1.6rem; 
            font-weight: 900; 
            margin: 0; 
            text-shadow: 0 0 10px rgba(0,0,0,0.5); 
        }

        .status-text { 
            font-size: 1rem; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            margin-bottom: 3px; 
        }

        .extra-msg { 
            font-size: 0.9rem; 
            color: #a0c0c8; 
            font-style: italic; 
            opacity: 0.9; 
        }
    </style>
</head>
<body>

<div id="alert-wrapper">
    <div id="pill-container">
        <div class="avatar-wrapper">
            <div class="user-avatar" id="avatar"></div>
        </div>
        <div class="text-group">
            <div class="user-name" id="username">Warrior</div>
            <div class="status-text" id="status">Lurking...</div>
            <div class="extra-msg" id="extra"></div>
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);

    ws.onopen = () => {
        ws.send(JSON.stringify({ request: "Subscribe", events: { general: ["Custom"] }, id: "LurkComboOverlay" }));
    };

    ws.onmessage = (event) => {
        const response = JSON.parse(event.data);
        if (response.data && response.data.eventName === "lurkCombo") {
            const d = response.data;
            
            // Update Text and Images
            document.getElementById('username').innerText = d.user;
            document.getElementById('status').innerText = d.status;
            document.getElementById('extra').innerText = d.input ? `"${d.input}"` : "";
            document.getElementById('avatar').style.backgroundImage = `url('${d.avatar}')`;

            // Update Colors Dynamically
            const pill = document.getElementById('pill-container');
            const status = document.getElementById('status');
            const avatar = document.getElementById('avatar');
            
            pill.style.borderLeftColor = d.color;
            status.style.color = d.color;
            avatar.style.borderColor = d.color;

            // Show Animation
            const wrapper = document.getElementById('alert-wrapper');
            wrapper.classList.add('show');
            setTimeout(() => wrapper.classList.remove('show'), 7000);
        }
    };
</script>
</body>
</html>
