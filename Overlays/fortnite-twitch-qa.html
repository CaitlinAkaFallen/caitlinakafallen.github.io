<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortnite Battle Royale Overlay</title>
    <style>
        /* Fortnite-style heavy condensed fonts */
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=Luckiest+Guy&family=Roboto:wght@700;900&display=swap');

        :root {
            /* Rare/Blue Tier Theme */
            --fn-blue: #0078ff;
            --fn-blue-dark: #003087;
            --fn-bg: rgba(20, 25, 35, 0.95);
            
            /* Legendary/Victory Theme */
            --fn-gold: #f5b041;
            --fn-gold-bright: #fff3a3;
            --fn-crown: #ffd700;
        }

        body { margin: 0; padding: 40px; background-color: transparent; overflow: hidden; }

        #alert-wrapper {
            display: flex;
            align-items: center;
            opacity: 0;
            transform: scale(0.8) rotate(-2deg);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #alert-wrapper.show { opacity: 1; transform: scale(1) rotate(0deg); }

        #pill-container {
            display: flex;
            align-items: center;
            position: relative;
            padding: 15px 35px;
            background: linear-gradient(135deg, #1e2532 0%, #11141b 100%);
            border: 4px solid var(--fn-blue);
            border-bottom: 8px solid var(--fn-blue-dark);
            border-radius: 12px;
            min-width: 500px;
            max-width: 800px;
            transform: skewX(-5deg); /* Signature slanted UI */
            box-shadow: 10px 10px 0px rgba(0,0,0,0.3);
            transition: all 0.5s ease;
        }

        /* --- VICTORY ROYALE TRANSITION --- */
        #pill-container.thanks { 
            background: linear-gradient(135deg, #2a2210 0%, #110f08 100%);
            border-color: var(--fn-gold);
            border-bottom-color: #b37d1d;
            box-shadow: 0 0 20px rgba(245, 176, 65, 0.4), 10px 10px 0px rgba(0,0,0,0.3);
        }

        /* Avatar styling (Item Shop Rarity Frame) */
        .avatar-wrapper { 
            position: relative;
            margin-right: 25px; 
            z-index: 2; 
            transform: skewX(5deg);
        }

        .user-avatar {
            width: 95px; height: 95px;
            background-size: cover; background-position: center;
            border-radius: 8px;
            border: 3px solid var(--fn-blue);
            background-color: #0a0c10;
            box-shadow: inset 0 0 15px rgba(0, 120, 255, 0.5);
            transition: all 0.5s;
        }

        #pill-container.thanks .user-avatar {
            border-color: var(--fn-gold);
            box-shadow: inset 0 0 15px rgba(245, 176, 65, 0.5), 0 0 15px var(--fn-gold);
        }

        /* Text Styles */
        .text-group { display: flex; flex-direction: column; z-index: 2; transform: skewX(5deg); }
        
        .user-header { 
            font-family: 'Roboto', sans-serif;
            font-size: 0.85rem; 
            font-weight: 900;
            color: var(--fn-blue); 
            text-transform: uppercase; 
            letter-spacing: 1.5px;
            margin-bottom: -2px;
            transition: color 0.5s;
        }

        .user-name { 
            font-family: 'Anton', sans-serif; /* Closest to Burbank Big Condensed */
            font-size: 3rem; 
            color: #fff;
            margin: 0; 
            text-transform: uppercase;
            line-height: 1;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }
        
        .question-text { 
            font-family: 'Luckiest Guy', cursive; 
            font-size: 1.2rem; 
            color: #bdc3c7; 
            margin-top: 8px;
            line-height: 1.1;
            transition: color 0.5s;
        }

        /* Victory Text Styles */
        #pill-container.thanks .user-header { color: var(--fn-gold); }
        #pill-container.thanks .user-name { 
            background: linear-gradient(to bottom, #fff 40%, var(--fn-gold) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 2px 0px #000);
        }
        #pill-container.thanks .question-text { color: #fff; }

        /* Flare animation for Victory */
        .flare {
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.5s;
            pointer-events: none;
        }

        #pill-container.thanks .flare {
            animation: fn-shine 2s infinite;
        }

        @keyframes fn-shine {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }

    </style>
</head>
<body>

<div id="alert-wrapper">
    <div id="pill-container">
        <div class="flare"></div>
        <div class="avatar-wrapper">
            <div class="user-avatar" id="avatar"></div>
        </div>
        <div class="text-group">
            <div class="user-header" id="header-text">NEW CHALLENGER</div>
            <div class="user-name" id="username">PLAYER</div>
            <div class="question-text" id="content-text">Searching for loot...</div>
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);

    ws.onopen = () => {
        ws.send(JSON.stringify({ request: "Subscribe", events: { general: ["Custom"] }, id: "FortniteAlert" }));
    };

    ws.onmessage = (event) => {
        const response = JSON.parse(event.data);
        const d = response.data || response;

        if (d.eventName === "questionAlert" || d.eventName === "thankYouAlert") {
            const pill = document.getElementById('pill-container');
            const wrapper = document.getElementById('alert-wrapper');
            const header = document.getElementById('header-text');
            
            document.getElementById('username').innerText = d.user;
            document.getElementById('avatar').style.backgroundImage = `url('${d.avatar}')`;

            if (d.eventName === "thankYouAlert") {
                pill.classList.add('thanks');
                header.innerText = "VICTORY ROYALE";
                document.getElementById('content-text').innerText = "CROWNED VICTORY! THANK YOU!";
            } else {
                pill.classList.remove('thanks');
                header.innerText = "NEW CHALLENGER";
                document.getElementById('content-text').innerText = d.message;
            }

            wrapper.classList.add('show');
            setTimeout(() => { wrapper.classList.remove('show'); }, 15000);
        }
    };
</script>
</body>
</html>
