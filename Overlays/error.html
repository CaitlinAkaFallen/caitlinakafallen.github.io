<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abstergo System Breach</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Share+Tech+Mono&family=Orbitron:wght@400;900&display=swap');

        body {
            margin: 0; padding: 0; overflow: hidden;
            background-color: transparent; 
            display: flex; justify-content: center; align-items: center;
            height: 100vh; width: 100vw;
            font-family: 'Orbitron', sans-serif;
        }

        /* --- ANIMUS DNA GRID BACKGROUND --- */
        #glitch-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.05);
            pointer-events: none;
            z-index: 9998;
            display: none;
            background-image: 
                radial-gradient(circle at 2px 2px, rgba(0, 242, 255, 0.15) 1px, transparent 0);
            background-size: 40px 40px;
        }

        .overlay-active {
            display: block !important;
            animation: animus-pulse 0.2s infinite;
        }

        /* --- ABSTERGO STYLE CONTAINER --- */
        #error-container {
            position: relative;
            padding: 40px 80px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(200, 200, 200, 0.95) 100%);
            border: 2px solid #ff0033;
            clip-path: polygon(0 15%, 5% 0, 100% 0, 100% 85%, 95% 100%, 0 100%);
            color: #000;
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 0, 51, 0.4), 0 0 20px rgba(0, 242, 255, 0.3);
            display: none; 
            opacity: 0;
            transform: scale(0.9);
            z-index: 9999;
        }

        .glitch-active {
            display: block !important;
            opacity: 1 !important;
            animation: intense-glitch 0.1s infinite, animus-in 0.4s ease-out forwards;
        }

        /* The Abstergo Image Logo */
        .abstergo-logo {
            width: 80px; /* Adjusted size for the PNG */
            height: auto;
            margin: 0 auto 20px;
            display: block;
        }

        h1 {
            margin: 0; font-size: 2.5rem; letter-spacing: 5px;
            color: #000; font-weight: 900;
            border-bottom: 2px solid #ff0033;
            display: inline-block; padding-bottom: 5px;
        }

        .user-highlight {
            color: #ff0033;
            font-weight: 900;
            text-decoration: underline;
        }

        #error-msg {
            font-family: 'Share Tech Mono', monospace;
            color: #333; font-size: 1.2rem; margin-top: 20px;
            text-transform: uppercase; line-height: 1.4;
        }

        /* --- KEYFRAMES --- */
        @keyframes animus-pulse {
            0% { background-color: rgba(255, 0, 51, 0.05); }
            50% { background-color: rgba(0, 242, 255, 0.05); }
            100% { background-color: rgba(255, 0, 51, 0.05); }
        }

        @keyframes animus-in {
            from { transform: scale(1.2) translateY(-50px); opacity: 0; filter: blur(10px); }
            to { transform: scale(1) translateY(0); opacity: 1; filter: blur(0); }
        }

        @keyframes intense-glitch {
            0% { transform: translate(0,0); filter: contrast(1); }
            25% { transform: translate(-2px, 2px); filter: contrast(1.5) hue-rotate(90deg); }
            50% { transform: translate(2px, -2px); }
            75% { transform: translate(-1px, -1px); filter: brightness(1.2); }
            100% { transform: translate(0,0); }
        }
    </style>
</head>
<body>

<div id="glitch-overlay"></div>

<div id="error-container">
    <img src="images/abstergo.png" alt="Abstergo Industries" class="abstergo-logo">
    <h1>DESYNCHRONIZATION</h1>
    <div id="error-msg">
        CRITICAL ERROR CAUSED BY: <span class="user-highlight" id="hacker-name">USER</span><br>
        <span id="error-text">RE-ESTABLISHING MEMORY LINK...</span>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);

    ws.onopen = () => {
        ws.send(JSON.stringify({ 
            request: "Subscribe", events: { general: ["Custom"] }, id: "Error" 
        }));
    };

    ws.onmessage = (event) => {
        const response = JSON.parse(event.data);
        if (response.data && response.data.eventName === "pointRedeemGlitch") {
            showError(response.data.user, response.data.message);
        }
    };

    function showError(userName, message) {
        const container = document.getElementById('error-container');
        const overlay = document.getElementById('glitch-overlay');
        const nameElem = document.getElementById('hacker-name');
        const msgText = document.getElementById('error-text');
        
        nameElem.innerText = userName;
        msgText.innerText = message;
        
        container.classList.add('glitch-active');
        overlay.classList.add('overlay-active');
        
        playAnimusGlitch();

        setTimeout(() => {
            container.classList.remove('glitch-active');
            overlay.classList.remove('overlay-active');
        }, 10000);
    }

    function playAnimusGlitch() {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        const beep = audioCtx.createOscillator();
        const beepGain = audioCtx.createGain();
        beep.type = 'square';
        beep.frequency.setValueAtTime(880, audioCtx.currentTime); 
        beepGain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        beepGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        beep.connect(beepGain);
        beepGain.connect(audioCtx.destination);
        beep.start();
        beep.stop(audioCtx.currentTime + 0.2);

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(40, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(200, audioCtx.currentTime + 0.5);
        
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        for(let i=0; i<15; i++) {
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime + (i * 0.03));
            gain.gain.setValueAtTime(0, audioCtx.currentTime + (i * 0.03) + 0.01);
        }
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
    }
</script>
</body>
</html>
