<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Donation Alert</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600&display=swap");

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;

        padding: 20px;

        background: transparent;

        font-family: "Inter", sans-serif;

        overflow: hidden;
      }

      /* ALERT WRAPPER */

      #alert-wrapper {
        display: flex;

        align-items: center;

        opacity: 0;

        transform: translateX(-100px);

        transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }

      #alert-wrapper.show {
        opacity: 1;

        transform: translateX(0);
      }

      /* PILL */

      #pill-container {
        display: flex;

        align-items: center;

        background: radial-gradient(
          circle,
          rgba(20, 55, 65, 0.98) 0%,
          rgba(10, 25, 30, 1) 100%
        );

        /* Safari fix */

        -webkit-backdrop-filter: blur(15px);

        backdrop-filter: blur(15px);

        padding: 18px 35px;

        /* safer sizing */

        min-width: 450px;

        max-width: 800px;

        width: auto;

        /* shape */

        clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%);

        border-left: 6px solid #00f2ff;

        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);

        transform: skewX(-10deg);
      }

      /* AVATAR */

      .avatar-wrapper {
        transform: skewX(10deg);

        margin-right: 25px;
      }

      .donno-avatar {
        width: 90px;

        height: 90px;

        background-size: cover;

        background-position: center;

        border-radius: 8px;

        border: 3px solid #00f2ff;

        box-shadow: 0 0 15px rgba(0, 242, 255, 0.5);

        background-image: url("https://decapi.me/twitch/avatar/fallenoneart");
      }

      /* TEXT */

      .text-group {
        display: flex;

        flex-direction: column;

        transform: skewX(10deg);

        color: white;

        max-width: 420px;
      }

      .user-name {
        font-family: "Cinzel", serif;

        font-size: 28px;

        font-weight: 900;

        margin: 0;

        text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);

        word-break: break-word;
      }

      .amount-line {
        font-size: 18px;

        color: #00f2ff;

        font-weight: 600;

        margin-bottom: 6px;
      }

      .message-line {
        font-size: 15px;

        color: #a0c0c8;

        font-style: italic;

        border-top: 1px solid rgba(0, 242, 255, 0.2);

        padding-top: 6px;

        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div id="alert-wrapper">
      <div id="pill-container">
        <div class="avatar-wrapper">
          <div class="donno-avatar" id="avatar"></div>
        </div>
        <div class="text-group">
          <div class="user-name" id="username"></div>
          <div class="amount-line">just tipped <span id="amount"></span></div>
          <div class="message-line" id="message"></div>
        </div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const ws = new WebSocket(
        `ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`,
      );

      ws.onopen = () => {
        ws.send(
          JSON.stringify({
            request: "Subscribe",
            events: { general: ["Custom"] },
            id: "VikingDonno",
          }),
        );
      };

      ws.onmessage = (event) => {
        const response = JSON.parse(event.data);
        if (response.data && response.data.eventName === "donnoAlert") {
          const d = response.data;
          document.getElementById("username").innerText = d.user;
          document.getElementById("amount").innerText = d.amount;
          document.getElementById("message").innerText = d.message;
          document.getElementById("avatar").style.backgroundImage =
            `url('${d.avatar}')`;

          const wrapper = document.getElementById("alert-wrapper");
          wrapper.classList.add("show");
          setTimeout(() => wrapper.classList.remove("show"), 8000);
        }
      };
    </script>
  </body>
</html>
