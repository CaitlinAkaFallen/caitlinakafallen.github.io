<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitch Viking Raid Alert</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600&display=swap');

body { 
    margin: 0; 
    padding: 40px; 
    background-color: transparent; 
    font-family: 'Inter', sans-serif; 
    overflow: hidden; 
}

#raid-container {
    display: inline-flex;
    align-items: center;
    position: relative;
    
    /* VALHALLA BACKGROUND STYLE: Deep teal stone with radial lighting */
    background: radial-gradient(circle at center, rgba(20, 55, 65, 0.98) 0%, rgba(10, 25, 30, 1) 100%);
    
    -webkit-backdrop-filter: blur(15px);
    backdrop-filter: blur(15px);
    
    padding: 20px 45px;
    border-radius: 4px;
    clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%);
    
    /* Glowing Cyan Border like the logo */
    border-left: 5px solid #00f2ff;
    box-shadow: 0 0 30px rgba(0, 242, 255, 0.2), inset 0 0 20px rgba(0,0,0,0.5);
    
    transition: all 0.5s ease;
    max-width: 850px;
    opacity: 0;
    transform: translateX(-150px) skewX(-10deg);
}

/* ADDING THE STONE CRACKS & TEXTURE EFFECT */
#raid-container::after {
    content: '';
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    /* This creates a subtle rocky grain over the stone */
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    opacity: 0.1;
    mix-blend-mode: soft-light;
    pointer-events: none;
    z-index: 1;
}

.avatar-wrapper { 
    margin-right: 25px; 
    position: relative; 
    z-index: 2;
}

.raider-avatar {
    width: 85px; 
    height: 85px; 
    clip-path: polygon(25% 0%, 100% 0%, 75% 100%, 0% 100%);
    background-size: cover; 
    background-position: center;
    border: 2px solid #00f2ff;
    box-shadow: 0 0 15px rgba(0, 242, 255, 0.4);
}

.text-group { 
    display: flex; 
    flex-direction: column;
    transform: skewX(10deg); 
    z-index: 2;
}

.raider-name { 
    font-family: 'Cinzel', serif;
    font-size: 1.9rem; 
    font-weight: 900; 
    color: #ffffff; 
    text-transform: uppercase;
    letter-spacing: 3px;
    /* Engraved glow effect */
    text-shadow: 0 0 10px rgba(0, 242, 255, 0.8), 2px 2px 5px rgba(0,0,0,1);
}

.raid-message { 
    font-size: 1.1rem; 
    font-weight: 600; 
    line-height: 1.3; 
    margin-top: 5px;
    color: #a0c0c8; /* Desaturated teal */
    text-shadow: 1px 1px 2px black;
}

/* Animations */
.show-raid { 
    animation: valhalla-in 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
}

.hide-raid {
    animation: valhalla-out 0.6s ease-in forwards;
}

@keyframes valhalla-in {
    from { transform: translateX(-150px) skewX(-10deg); opacity: 0; filter: brightness(2); }
    to { transform: translateX(0) skewX(-10deg); opacity: 1; filter: brightness(1); }
}

@keyframes valhalla-out {
    from { transform: translateX(0) skewX(-10deg); opacity: 1; }
    to { transform: translateX(200px) skewX(-10deg); opacity: 0; }
}
    </style>
</head>
<body>

    <div id="raid-container">
        <div class="avatar-wrapper">
            <div class="raider-avatar" id="avatar"></div>
        </div>
        <div class="text-group">
            <div class="raider-name" id="username">RAID!</div>
            <div class="raid-message" id="display-message">The gates are falling...</div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        // Connect to Streamer.bot
        const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);

        ws.onopen = () => {
            ws.send(JSON.stringify({ 
                request: "Subscribe", 
                events: { general: ["Custom"] }, 
                id: "VikingRaidListener" 
            }));
            console.log("Connected: Listening for Viking Raids...");
        };

        ws.onmessage = (event) => {
            const response = JSON.parse(event.data);
            // Check for the "raidAlert" event from your C# script
            if (response.data && response.data.eventName === "raidAlert") {
                triggerRaid(response.data);
            }
        };

        function triggerRaid(data) {
            const container = document.getElementById('raid-container');
            const avatar = document.getElementById('avatar');
            const userText = document.getElementById('username');
            const messageText = document.getElementById('display-message');

            // 1. Update content
            userText.innerText = data.user;
            messageText.innerText = data.message;
            
            // 2. Set Avatar (Fallback to DecAPI if needed)
            const imgUrl = data.avatar || `https://decapi.me/twitch/avatar/${data.user}`;
            avatar.style.backgroundImage = `url('${imgUrl}')`;

            // 3. Reset and Show Animation
            container.classList.remove('show-raid', 'hide-raid');
            void container.offsetWidth; // Force CSS reflow
            container.classList.add('show-raid');

            // 4. Stay on screen for 12 seconds, then animate out
            setTimeout(() => {
                container.classList.add('hide-raid');
                // Optional: fully clear after hide animation ends
                setTimeout(() => {
                    container.classList.remove('show-raid');
                }, 800);
            }, 12000); 
        }
    </script>
</body>
</html>
