<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viking Call Overlay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600&display=swap');

        :root {
            /* AC Valhalla Color Palette */
            --viking-gold: #ffcc00;
            --viking-teal: #00f2ff;
            --stone-bg: radial-gradient(circle at center, rgba(20, 55, 65, 0.95), rgba(10, 25, 30, 1));
            --font-main: 'Cinzel', serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            overflow: hidden;
            width: 1920px;
            height: 1080px;
        }

        .viking-overlay {
            position: fixed;
            top: 40px;
            left: 50%;
            /* Starts hidden and scaled down */
            transform: translateX(-50%) translateY(-200px) skewX(-10deg);
            
            width: 500px;
            height: 100px; 
            background: var(--stone-bg);
            border-left: 6px solid var(--viking-teal);
            
            /* Sharp Viking Shard Shape */
            clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%);
            
            display: flex;
            align-items: center;
            padding: 0 30px;
            box-sizing: border-box;
            
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s;
            opacity: 0;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .viking-overlay.active {
            transform: translateX(-50%) translateY(0) skewX(-10deg);
            opacity: 1;
        }

        /* Avatar Shard */
        .caller-avatar {
            width: 65px;
            height: 65px;
            background-size: cover;
            background-position: center;
            margin-right: 20px;
            border: 2px solid var(--viking-gold);
            /* Matching shard shape for avatar */
            clip-path: polygon(15% 0%, 100% 0%, 85% 100%, 0% 100%);
            flex-shrink: 0;
            transform: skewX(10deg); /* Counter-skew to keep face straight */
        }

        .text-group {
            display: flex;
            flex-direction: column;
            transform: skewX(10deg); /* Counter-skew for text readability */
        }

     .redeem-text {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    text-transform: uppercase;
    color: var(--viking-teal); /* The glowing blue/cyan from Valhalla */
    letter-spacing: 1.5px;
    font-weight: 800;
    text-shadow: 0 0 8px rgba(0, 242, 255, 0.6);
    margin-bottom: 2px;
}

        .caller-name {
            font-family: var(--font-main);
            font-size: 26px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
            margin-top: -2px;
        }

        /* Glitch animation for that Animus feel */
        .viking-overlay.active::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 242, 255, 0.1), transparent);
            animation: glitch-scan 3s infinite linear;
        }

        @keyframes glitch-scan {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
    </style>
</head>
<body>

<div id="overlay" class="viking-overlay">
    <div class="caller-avatar" id="avatar" style="background-image: url('https://decapi.me/twitch/avatar/twitch');"></div>
    <div class="text-group">
        <div class="redeem-text" id="reward-display">Viking Tribute</div>
        <div class="caller-name" id="username">Eivor Varinsdottir</div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const address = params.get("address") || "localhost";
    const port = params.get("port") || "8080";
    const ws = new WebSocket(`ws://${address}:${port}/`);
    let hideTimer;

    ws.onopen = () => {
        ws.send(JSON.stringify({
            request: "Subscribe",
            events: { general: ["Custom"] },
            id: "VikingCallOverlay"
        }));
        console.log("Connected: Waiting for the Skal...");
    };

    ws.onmessage = (event) => {
        const message = JSON.parse(event.data);
        if (message.data?.eventName === "iPhoneCallTrigger") { // Keeping your original trigger name
            const data = message.data;
            triggerVikingCall(data.user, data.reward, data.cost, data.avatar);
        }
    };

    function triggerVikingCall(user, reward, cost, avatarUrl) {
    const overlay = document.getElementById('overlay');
    const usernameEl = document.getElementById('username');
    const rewardDisplayEl = document.getElementById('reward-display');
    const avatarEl = document.getElementById('avatar');

    clearTimeout(hideTimer);

    // Update the text to show the points used
    usernameEl.textContent = user;
    
    // This line now displays the cost and the reward name
    rewardDisplayEl.textContent = ` Spent ${cost} on • ${reward}`;
    
    avatarEl.style.backgroundImage = `url('${avatarUrl}')`;

    overlay.classList.remove('active');
    void overlay.offsetWidth; // Trigger reflow for animation
    overlay.classList.add('active');

    // Hide after 8 seconds
    hideTimer = setTimeout(() => overlay.classList.remove('active'), 8000);
}

    // Auto-reload if connection drops
    ws.onclose = () => setTimeout(() => location.reload(), 5000);
</script>
</body>
</html>
