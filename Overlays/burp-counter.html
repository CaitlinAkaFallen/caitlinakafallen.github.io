<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viking Burp Counter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@700&display=swap');

        body { margin: 0; padding: 20px; background: transparent; overflow: hidden; font-family: 'Inter', sans-serif; }

        #pill-container {
            display: flex;
            align-items: center;
            position: relative;
            background: linear-gradient(145deg, rgba(20, 40, 20, 1) 0%, rgba(5, 15, 5, 1) 100%);
            padding: 15px 40px;
            clip-path: polygon(8% 0%, 100% 0%, 92% 100%, 0% 100%);
            border-left: 6px solid #b514ff; /* Toxic Neon Green */
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
            transform: skewX(-10deg);
            width: fit-content;
        }

        /* Stone Texture Overlay */
        #pill-container::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            opacity: 0.18; mix-blend-mode: overlay; pointer-events: none;
        }

        .stat-group { display: flex; flex-direction: column; align-items: center; transform: skewX(10deg); color: white; }
        
        .label { 
            font-family: 'Cinzel', serif; 
            font-size: 0.85rem; 
            letter-spacing: 3px; 
            text-transform: uppercase; 
            color: #14ffe0;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
        }

        .count { 
            font-size: 3rem; 
            font-weight: 900; 
            text-shadow: 0 0 20px rgba(57, 255, 20, 0.3);
            margin-top: -5px;
        }

        .pulse { animation: burp-pulse 0.4s ease-out; }
        @keyframes burp-pulse {
            0% { transform: skewX(10deg) scale(1); }
            50% { transform: skewX(10deg) scale(1.2); filter: hue-rotate(45deg) brightness(1.5); }
            100% { transform: skewX(10deg) scale(1); }
        }
    </style>
</head>
<body>

<div id="pill-container">
    <div class="stat-group" id="burp-group">
        <div class="label">Burps</div>
        <div id="burp-count" class="count">0</div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);

    ws.onopen = () => {
        ws.send(JSON.stringify({ request: "Subscribe", events: { general: ["Custom"] }, id: "BurpStats" }));
    };

    ws.onmessage = (event) => {
        const response = JSON.parse(event.data);
        const d = response.data || response;

        if (d.eventName === "updateBurps") {
            const countEl = document.getElementById('burp-count');
            const groupEl = document.getElementById('burp-group');

            countEl.innerText = d.count;

            // Trigger Animation
            groupEl.classList.remove('pulse');
            void groupEl.offsetWidth; 
            groupEl.classList.add('pulse');
        }
    };
</script>
</body>
</html>
