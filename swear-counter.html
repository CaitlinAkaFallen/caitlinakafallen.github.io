<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swear Counter</title>
 <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@700&display=swap');
    
    body { margin: 0; padding: 20px; background: transparent; overflow: hidden; font-family: 'Inter', sans-serif; }

    #pill-container {
        display: flex; align-items: center; position: relative;
        /* Deep Navy to Black Gradient */
        background: linear-gradient(145deg, rgba(10, 20, 30, 1) 0%, rgba(5, 5, 15, 1) 100%);
        padding: 15px 45px; clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
        border-left: 6px solid #00f2ff; /* Electric Cyan */
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
        transform: skewX(-10deg); width: fit-content;
    }

    /* Digital Static Overlay */
    #pill-container::after {
        content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        opacity: 0.12; mix-blend-mode: overlay; pointer-events: none;
    }

    .stat-group { display: flex; flex-direction: column; align-items: center; transform: skewX(10deg); color: white; }
    
    .label { 
        font-family: 'Cinzel', serif; 
        font-size: 0.85rem; 
        letter-spacing: 3px; 
        color: #00f2ff; 
        text-shadow: 0 0 10px rgba(0, 242, 255, 0.6); 
    }
    
    .count { 
        font-size: 3.2rem; 
        font-weight: 900; 
        text-shadow: 0 0 20px rgba(0, 242, 255, 0.4); 
        margin-top: -5px; 
    }

    /* Glitch Animation - Updated for Blue/Pink/White logic */
    .glitch { animation: glitch-anim 0.3s cubic-bezier(.25,.46,.45,.94) both; }
    
    @keyframes glitch-anim {
        0% { transform: translate(0); text-shadow: 0 0 20px #00f2ff; }
        20% { transform: translate(-3px, 3px); color: #ff00ff; } /* Hot Pink glitch */
        40% { transform: translate(-3px, -3px); color: #00ffff; } /* Cyan glitch */
        60% { transform: translate(3px, 3px); }
        80% { transform: translate(3px, -3px); }
        100% { transform: translate(0); color: white; }
    }
</style>
</head>
<body>

<div id="pill-container">
    <div class="stat-group" id="swear-group">
        <div class="label">Swears</div>
        <div id="swear-count" class="count">0</div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);

    ws.onopen = () => ws.send(JSON.stringify({ request: "Subscribe", events: { general: ["Custom"] }, id: "SwearStats" }));

    ws.onmessage = (event) => {
        const d = JSON.parse(event.data).data || JSON.parse(event.data);
        if (d.eventName === "updateSwears") {
            const countEl = document.getElementById('swear-count');
            const groupEl = document.getElementById('swear-group');

            countEl.innerText = d.count;
            groupEl.classList.remove('glitch');
            void groupEl.offsetWidth; 
            groupEl.classList.add('glitch');
        }
    };
</script>
</body>
</html>
