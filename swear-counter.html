<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Swear Counter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Teko:wght@700&display=swap');

        body { 
            margin: 0; 
            padding: 20px; 
            background: transparent; 
            overflow: hidden; 
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            align-items: center;
        }

        /* GLITCH CONTAINER */
        #swear-container {
            display: flex; 
            flex-direction: column;
            align-items: center; 
            background: rgba(15, 5, 15, 0.8); /* Dark purple-black glass */
            
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            
            border: 1px solid rgba(255, 0, 255, 0.2); 
            border-top: 1px solid rgba(255, 0, 255, 0.5);
            border-right: 1px solid rgba(0, 255, 255, 0.4);
            border-radius: 2px;
            
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9), 
                        inset 0 0 20px rgba(255, 0, 255, 0.05);

            padding: 15px 45px 20px 45px; 
            width: fit-content; 
            position: relative;
        }

        /* Glitchy "Corrupted" Header */
        #swear-container::before {
            content: 'DATA_CENSOR: BYPASSED';
            position: absolute;
            top: -15px;
            left: 5px;
            font-size: 10px;
            color: #ff00ff;
            text-shadow: 2px 0 #00ffff;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .stat-group { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            color: white; 
            margin: 10px 0;
        }

        .label { 
            font-size: 0.85rem; 
            letter-spacing: 5px; 
            color: #00ffff; 
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.6); 
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .count { 
            font-family: 'Teko', sans-serif;
            font-size: 5.5rem; 
            font-weight: 700; 
            line-height: 0.85;
            color: #ffffff;
            text-shadow: 3px 3px 0px #ff00ff, -3px -3px 0px #00ffff;
            margin: 0;
            transition: all 0.1s ease;
        }

        /* Censor bar logic */
        .footer-log {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 10px;
            border-top: 1px solid rgba(255, 0, 255, 0.3);
            padding-top: 5px;
            width: 100%;
            text-align: center;
        }

        /* HARD GLITCH ANIMATION */
        .glitch-active { 
            animation: hard-glitch 0.3s cubic-bezier(.25,.46,.45,.94) both; 
        }

        @keyframes hard-glitch {
            0% { transform: translate(0); clip-path: inset(0 0 0 0); }
            20% { transform: translate(-5px, 2px); color: #ff00ff; clip-path: inset(10% 0 40% 0); }
            40% { transform: translate(5px, -2px); color: #00ffff; clip-path: inset(50% 0 10% 0); }
            60% { transform: translate(-2px, 5px); color: white; }
            80% { transform: translate(2px, -5px); }
            100% { transform: translate(0); clip-path: inset(0 0 0 0); }
        }
    </style>
</head>
<body>

<div id="swear-container">
    <div class="stat-group" id="swear-group">
        <div class="label">Profanity Log</div>
        <div id="swear-count" class="count">0</div>
    </div>
    <div class="footer-log">CENSOR_PROTOCOL_NULL</div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);

    ws.onopen = () => {
        ws.send(JSON.stringify({ request: "Subscribe", events: { general: ["Custom"] }, id: "SwearStats" }));
    };

    ws.onmessage = (event) => {
        const d = JSON.parse(event.data).data || JSON.parse(event.data);
        if (d.eventName === "updateSwears") {
            const countEl = document.getElementById('swear-count');
            const groupEl = document.getElementById('swear-group');

            countEl.innerText = d.count;

            // Trigger Hard Glitch
            groupEl.classList.remove('glitch-active');
            void groupEl.offsetWidth; 
            groupEl.classList.add('glitch-active');
        }
    };
</script>
</body>
</html>
