<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Login</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #f0f9ff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-box {
      background: #ffffff;
      padding: 2.5rem 2rem;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    .login-box h2 {
      margin-bottom: 1.5rem;
      color: #333;
    }

    input[type="password"],
    button {
      width: 100%;
      padding: 0.75rem;
      margin-top: 1rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
    }

    input[type="password"]:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    .remember-show {
      margin-top: 0.75rem;
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: #555;
    }

    .remember-show label {
      cursor: pointer;
    }

    button {
      background-color: #3b82f6;
      color: white;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #2563eb;
    }

    #error {
      margin-top: 1rem;
      color: #dc2626;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Admin Login</h2>
    <label for="passwordInput">Password:</label>
    <input type="password" id="passwordInput" placeholder="Enter password" onkeydown="handleEnter(event)" />
    
    <div class="remember-show">
      <label><input type="checkbox" id="rememberMe" /> Remember Me</label>
      <label><input type="checkbox" id="togglePassword" onclick="togglePasswordVisibility()" /> Show Password</label>
    </div>

    <button onclick="checkPassword()">Login</button>
    <div id="error"></div>
  </div>

  <script>
   let passwordFromJson = '';
let redirectURL = 'conventions.html';  // Default redirection URL

// Fetch password from secret JSON (simulated locally)
fetch('secret.json')
  .then(res => res.json())
  .then(data => {
    passwordFromJson = data.adminPassword;
    redirectURL = data.redirectURL || 'conventions.html';  // Use data.redirectURL if available

    // Fill password if remembered
    if (localStorage.getItem('rememberMe') === 'true') {
      document.getElementById('passwordInput').value = passwordFromJson;
      document.getElementById('rememberMe').checked = true;
    }
  });

function checkPassword() {
  const input = document.getElementById('passwordInput').value;

  if (input === passwordFromJson) {
    localStorage.setItem('adminAuth', 'true');

    if (document.getElementById('rememberMe').checked) {
      localStorage.setItem('rememberMe', 'true');
    } else {
      localStorage.removeItem('rememberMe');
    }

    window.location.href = redirectURL;  // Use the redirectURL fetched from JSON
  } else {
    document.getElementById('error').textContent = 'Incorrect password!';
  }
}

function togglePasswordVisibility() {
  const input = document.getElementById('passwordInput');
  input.type = input.type === 'password' ? 'text' : 'password';
}

function handleEnter(event) {
  if (event.key === 'Enter') checkPassword();
}

  </script>
</body>
</html>
