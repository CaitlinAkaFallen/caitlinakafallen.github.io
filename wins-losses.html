<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Win/Loss Tracker</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap');

        body { 
            margin: 0; 
            padding: 20px; 
            background: transparent; 
            overflow: hidden; 
            display: flex;
            align-items: center;
        }

        /* SLEEK GLASS CONTAINER */
        #pill-container {
            display: flex; 
            align-items: center; 
            background: rgba(15, 15, 20, 0.425);
            
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px; 
            
            padding: 15px 45px; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3), inset 0 0 20px rgba(255, 255, 255, 0.02);
            width: fit-content; 
            
            /* TRANSITION STATE: Hidden and shifted left */
            opacity: 0;
            transform: translateX(-50px);
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        /* ACTIVE STATE: Triggered by JS */
        #pill-container.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        .stat-group { 
            display: flex; 
            gap: 50px; 
            color: white; 
        }

        .stat-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            position: relative;
        }

        .stat-item:first-child::after {
            content: '';
            position: absolute;
            right: -25px;
            top: 15%;
            height: 70%;
            width: 1px;
            background: rgba(255, 255, 255, 0.15);
        }

        .label { 
            font-family: 'Share Tech Mono', monospace; 
            font-size: 0.85rem; 
            letter-spacing: 3px; 
            text-transform: uppercase; 
            margin-bottom: 5px;
        }

        .count { 
            font-family: 'Rajdhani', sans-serif;
            font-size: 3rem; 
            font-weight: 700; 
            line-height: 0.9;
            color: #ffffff;
        }

        .win-label { 
            color: #00ffcc; 
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6); 
        }
        #win-count {
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
        }

        .loss-label { 
            color: #ff0055; 
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.6); 
        }
        #loss-count {
            text-shadow: 0 0 20px rgba(255, 0, 85, 0.3);
        }

        /* PULSE FOR UPDATES */
        .pulse { 
            animation: glass-pulse 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        @keyframes glass-pulse {
            0% { transform: scale(1); }
            50% { 
                transform: scale(1.05); 
                border-color: rgba(255, 255, 255, 0.4); 
            }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
<div id="pill-container">
    <div class="stat-group">
        <div class="stat-item">
            <div class="label win-label">Wins</div>
            <div id="win-count" class="count">0</div>
        </div>
        <div class="stat-item">
            <div class="label loss-label">Losses</div>
            <div id="loss-count" class="count">0</div>
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);
    
    let hideTimeout;

    ws.onopen = () => {
        ws.send(JSON.stringify({ request: "Subscribe", events: { general: ["Custom"] }, id: "GlassStats" }));
        console.log("Connected to Streamer.bot");
    };

    ws.onmessage = (event) => {
        const response = JSON.parse(event.data);
        const d = response.data || response;

        if (d.eventName === "updateStats") {
            const winEl = document.getElementById('win-count');
            const lossEl = document.getElementById('loss-count');
            const pill = document.getElementById('pill-container');

            // 1. Update text
            winEl.innerText = d.wins;
            lossEl.innerText = d.losses;

            // 2. Trigger Entrance and Pulse
            pill.classList.add('active');
            pill.classList.remove('pulse');
            void pill.offsetWidth; 
            pill.classList.add('pulse');

            // 3. Clear existing timer and set new 10-second exit timer
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => {
                pill.classList.remove('active');
            }, 10000); // 10000ms = 10 seconds
        }
    };
</script>
</body>
</html>
