<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Wheel — Overlay</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      font-family: 'Rajdhani', sans-serif;
    }

    /* ── Wheel ─────────────────────────────────────────── */
    #wheel-wrap {
      position: relative;
      width: 620px; height: 620px;
      display: flex; align-items: center; justify-content: center;
    }

    #wheelCanvas {
      width: 600px; height: 600px;
      filter:
        drop-shadow(0 0 24px rgba(167,139,250,.35))
        drop-shadow(0 0 60px rgba(167,139,250,.12));
    }

    /* CSS hub — visible when no custom image */
    #css-hub {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 60px; height: 60px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff 0%, #d4d4d8 50%, #71717a 100%);
      border: 3px solid rgba(0,0,0,.5);
      box-shadow:
        0 0 0 4px rgba(255,255,255,.2),
        inset 0 2px 6px rgba(255,255,255,.7),
        0 4px 16px rgba(0,0,0,.5);
      z-index: 20;
    }

    /* Pointer triangle */
    .pointer {
      position: absolute; top: -6px; left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      width: 0; height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-top: 48px solid #ffffff;
      filter:
        drop-shadow(0 0 10px rgba(255,255,255,.9))
        drop-shadow(0 4px 14px rgba(0,0,0,.8));
    }

    /* Spinning-for banner */
    #spin-banner {
      position: absolute; bottom: -58px; left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px; letter-spacing: 3px; color: #fff;
      text-shadow: 0 0 24px rgba(255,255,255,.9), 0 2px 8px rgba(0,0,0,.9);
      opacity: 0; transition: opacity .35s ease;
      pointer-events: none;
    }

    /* ── Winner card ──────────────────────────────────── */
    #winner-overlay {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 999; pointer-events: none;
    }

    #winner-card {
      position: relative;
      background: rgba(7, 7, 14, .95);
      border-radius: 24px;
      padding: 32px 56px 36px;
      text-align: center;
      min-width: 300px;
      transform: scale(0) rotate(-10deg);
      opacity: 0;
      transition:
        transform .55s cubic-bezier(.34,1.56,.64,1),
        opacity .3s ease;
    }

    /* Gradient border via pseudo */
    #winner-card::before {
      content: '';
      position: absolute; inset: -2px;
      border-radius: 26px;
      background: var(--card-border, linear-gradient(135deg, #7c3aed, #0d9488));
      z-index: -1;
    }

    /* Inner glow */
    #winner-card::after {
      content: '';
      position: absolute; inset: 0;
      border-radius: 24px;
      background: radial-gradient(ellipse at 50% 0%,
        var(--card-glow, rgba(124,58,237,.25)) 0%, transparent 65%);
      pointer-events: none;
    }

    #winner-card.show {
      transform: scale(1) rotate(0deg);
      opacity: 1;
    }

    /* Avatar */
    #wc-avatar-wrap {
      width: 88px; height: 88px;
      border-radius: 50%;
      margin: 0 auto 12px;
      display: none;
    }
    #wc-avatar-wrap.visible { display: block; }
    #wc-avatar {
      width: 88px; height: 88px;
      border-radius: 50%; object-fit: cover;
      border: 3px solid var(--prize-col, #7c3aed);
      box-shadow: 0 0 20px var(--prize-col, #7c3aed), 0 0 50px rgba(0,0,0,.7);
    }

    .wc-user {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px; letter-spacing: 4px;
      color: var(--prize-col, #7c3aed);
      text-shadow: 0 0 24px var(--prize-col, #7c3aed);
      margin-top: 4px;
    }

    .wc-prize {
      font-family: 'Rajdhani', sans-serif;
      font-size: 22px; font-weight: 700;
      color: #f1f5f9;
      margin-top: 8px; letter-spacing: 1px;
      line-height: 1.2;
    }

    .wc-sub {
      font-size: 13px; color: #94a3b8;
      margin-top: 8px; letter-spacing: 1.5px;
      font-weight: 600; text-transform: uppercase;
    }

    /* WS status dot */
    #ws-dot {
      position: fixed; top: 14px; right: 16px;
      width: 10px; height: 10px; border-radius: 50%;
      background: #555;
      transition: background .4s, box-shadow .4s;
      z-index: 9999;
    }
    #ws-dot.on  { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
    #ws-dot.off { background: #ef4444; box-shadow: 0 0 10px #ef4444; }
  </style>
</head>
<body>

<div id="ws-dot"></div>

<div id="wheel-wrap">
  <div class="pointer"></div>
  <canvas id="wheelCanvas"></canvas>
  <div id="css-hub"></div>
  <div id="spin-banner"></div>
</div>

<div id="winner-overlay">
  <div id="winner-card">
    <div id="wc-avatar-wrap">
      <img id="wc-avatar" src=" " alt="">
    </div>
    <div class="wc-user"  id="wc-user">@Username</div>
    <div class="wc-prize" id="wc-prize">Prize</div>
    <div class="wc-sub"   id="wc-sub">Added to inventory!</div>
  </div>
</div>

<script>
'use strict';

/* ══════════════════════════════════════════════════════
   SEGMENTS  (fallback; overridden by admin dashboard)
══════════════════════════════════════════════════════ */
let SEGMENTS = [
  { key:'WCG',           label:'Winner\nChoose Game', color:'#7C3AED', text:'#ffffff' },
  { key:'SF',            label:'Shitface',            color:'#0D9488', text:'#ffffff' },
  { key:'Hydrate',       label:'Hydrate',             color:'#9333EA', text:'#ffffff' },
  { key:'ViewersChoice', label:"Viewer's\nChoice",    color:'#0891B2', text:'#ffffff' },
  { key:'fallgreement',  label:'Fallgreement',        color:'#6D28D9', text:'#ffffff' },
  { key:'VI',            label:'Voice Impression',    color:'#14B8A6', text:'#ffffff' },
  { key:'Cosplay',       label:'CC Cosplay',          color:'#5B21B6', text:'#ffffff' },
  { key:'Nothing',       label:'Nothing',             color:'#1E293B', text:'#ffffff' },
  { key:'No Swear',      label:'No Swearing',         color:'#4F46E5', text:'#ffffff' },
  { key:'DF',            label:'Diabolical Foods',    color:'#0E7490', text:'#ffffff' },
];

(function loadSegments() {
  try {
    const s = localStorage.getItem('sw_segments');
    if (s) SEGMENTS = JSON.parse(s);
  } catch(e) {}
})();

/* ══════════════════════════════════════════════════════
   CANVAS
══════════════════════════════════════════════════════ */
const canvas  = document.getElementById('wheelCanvas');
const ctx     = canvas.getContext('2d');
const DPR     = Math.min(window.devicePixelRatio || 1, 2);
const SIZE    = 600;
const CX      = SIZE / 2;
const CY      = SIZE / 2;
const R       = 278;   // outer wheel radius
const HUB_R   = 30;   // hub circle radius

canvas.width  = SIZE * DPR;
canvas.height = SIZE * DPR;
canvas.style.width  = SIZE + 'px';
canvas.style.height = SIZE + 'px';
ctx.scale(DPR, DPR);

let angle    = 0;
let spinning = false;
const queue  = [];

/* ══════════════════════════════════════════════════════
   HUB IMAGE
══════════════════════════════════════════════════════ */
let hubImage = null;
const cssHub = document.getElementById('css-hub');

function loadHubImage() {
  const stored = localStorage.getItem('sw_hub_image');
  if (!stored) {
    hubImage = null;
    cssHub.style.display = '';
    drawWheel(angle);
    return;
  }
  const img = new Image();
  img.onload  = () => { hubImage = img; cssHub.style.display = 'none'; drawWheel(angle); };
  img.onerror = () => { hubImage = null; cssHub.style.display = ''; drawWheel(angle); };
  img.src = stored;
}

// Live-sync from admin dashboard (same origin, different tab)
window.addEventListener('storage', e => {
  if (e.key === 'sw_hub_image')  loadHubImage();
  if (e.key === 'sw_segments') {
    try { if (e.newValue) SEGMENTS = JSON.parse(e.newValue); drawWheel(angle); } catch(e) {}
  }
});

/* ══════════════════════════════════════════════════════
   DRAW WHEEL
══════════════════════════════════════════════════════ */
function drawWheel(a) {
  ctx.clearRect(0, 0, SIZE, SIZE);
  const n   = SEGMENTS.length;
  const arc = (2 * Math.PI) / n;

  // Slices
  SEGMENTS.forEach((seg, i) => {
    const start = a + i * arc;
    const end   = start + arc;

    // Fill
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, R, start, end);
    ctx.closePath();
    ctx.fillStyle = seg.color;
    ctx.fill();

    // Divider stroke
    ctx.strokeStyle = 'rgba(0,0,0,.5)';
    ctx.lineWidth   = 2.5;
    ctx.stroke();

    // Alternate sheen
    if (i % 2 === 0) {
      ctx.beginPath();
      ctx.moveTo(CX, CY);
      ctx.arc(CX, CY, R, start, end);
      ctx.closePath();
      ctx.fillStyle = 'rgba(255,255,255,.04)';
      ctx.fill();
    }

    // Label
    ctx.save();
    ctx.translate(CX, CY);
    ctx.rotate(start + arc / 2);
    ctx.textAlign    = 'right';
    ctx.textBaseline = 'middle';

    const lines = seg.label.split('\\n');
    const lh    = 30;

    ctx.font         = 'bold 25px Rajdhani, Arial, sans-serif';
    ctx.fillStyle    = seg.text || '#ffffff';
    ctx.shadowColor  = 'rgba(0,0,0,.95)';
    ctx.shadowBlur   = 8;
    ctx.shadowOffsetX = 1;
    ctx.shadowOffsetY = 1;

    lines.forEach((ln, li) => {
      const y = (li - (lines.length - 1) / 2) * lh;
      ctx.fillText(ln, R - 18, y);
    });

    ctx.restore();
  });

  // Outer ring
  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,.6)';
  ctx.lineWidth   = 5;
  ctx.stroke();

  // Hub — image or plain ring
  if (hubImage) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(CX, CY, HUB_R, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(hubImage, CX - HUB_R, CY - HUB_R, HUB_R * 2, HUB_R * 2);
    ctx.restore();

    // Rim over image
    ctx.beginPath();
    ctx.arc(CX, CY, HUB_R, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,.55)';
    ctx.lineWidth   = 3;
    ctx.stroke();
  } else {
    // Dark centre hole so CSS hub shows through
    ctx.beginPath();
    ctx.arc(CX, CY, HUB_R + 2, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(0,0,0,.6)';
    ctx.lineWidth   = 2;
    ctx.stroke();
  }
}

/* ══════════════════════════════════════════════════════
   PHYSICS
══════════════════════════════════════════════════════ */
function getWinner(a) {
  const n    = SEGMENTS.length;
  const arc  = (2 * Math.PI) / n;
  const norm = (((-a - Math.PI / 2) % (2 * Math.PI)) + (2 * Math.PI)) % (2 * Math.PI);
  return SEGMENTS[Math.floor(norm / arc) % n];
}

function easeOut(t) {
  return 1 - Math.pow(1 - t, 4);
}

function spin(user, displayName, avatarUrl) {
  if (spinning) return;
  spinning = true;

  const banner = document.getElementById('spin-banner');
  banner.textContent = `Spinning for @${displayName}`;
  banner.style.opacity = '1';

  const laps      = 6 + Math.floor(Math.random() * 5);
  const extra     = Math.random() * 2 * Math.PI;
  const total     = laps * 2 * Math.PI + extra;
  const duration  = 5000;
  const startAngle = angle;
  const t0        = performance.now();

  (function frame(now) {
    const t = Math.min((now - t0) / duration, 1);
    angle = startAngle + total * easeOut(t);
    drawWheel(angle);

    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      angle    = (((startAngle + total) % (2 * Math.PI)) + (2 * Math.PI)) % (2 * Math.PI);
      spinning = false;
      banner.style.opacity = '0';
      showWinner(user, displayName, avatarUrl, getWinner(angle));
    }
  })(t0);
}

/* ══════════════════════════════════════════════════════
   WINNER CARD
══════════════════════════════════════════════════════ */
function showWinner(user, displayName, avatarUrl, seg) {
  const card = document.getElementById('winner-card');

  card.style.setProperty('--card-border',
    `linear-gradient(135deg, ${seg.color}, ${seg.color}88)`);
  card.style.setProperty('--card-glow',  seg.color + '30');
  card.style.setProperty('--prize-col',  seg.color);

  // Avatar
  const wrap = document.getElementById('wc-avatar-wrap');
  const img  = document.getElementById('wc-avatar');
  if (avatarUrl) {
    img.src = avatarUrl;
    wrap.classList.add('visible');
  } else {
    wrap.classList.remove('visible');
  }

  document.getElementById('wc-user').textContent  = `@${displayName}`;
  document.getElementById('wc-prize').textContent = seg.label.replace('\\n', ' ');
  document.getElementById('wc-sub').textContent   =
    seg.key === 'SpinAgain' ? 'SPINNING AGAIN!'                :
    seg.key === 'Nothing'   ? 'Better luck next time...'       :
                              'Added to inventory! Use $redeem';

  card.classList.add('show');
  sendResult(user, displayName, seg);

  setTimeout(() => {
    card.classList.remove('show');
    setTimeout(() => {
      if (seg.key === 'SpinAgain') queue.unshift({ user, displayName, avatarUrl, count: 1 });
      processQueue();
    }, 600);
  }, 6500);
}

/* ══════════════════════════════════════════════════════
   QUEUE
══════════════════════════════════════════════════════ */
function processQueue() {
  if (!queue.length) return;
  const next = queue[0];
  if (next.count <= 0) { queue.shift(); processQueue(); return; }
  next.count--;
  if (next.count === 0) queue.shift();
  spin(next.user, next.displayName, next.avatarUrl || '');
}

/* ══════════════════════════════════════════════════════
   SEND RESULT TO STREAMER.BOT
   DoAction → "WheelSpin_Trigger" (Combo action handler)
   Args land directly in C# args[] dictionary.
══════════════════════════════════════════════════════ */
function sendResult(user, displayName, seg) {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    console.warn('[WheelSpin] WS not open — result dropped');
    return;
  }

  const msg = JSON.stringify({
    request: 'DoAction',
    action:  { name: 'WheelSpin_Trigger' }, // Point it to your Combo Action
    args: {
      wheelUser:    user,
      wheelDisplay: displayName,
      wheelPrize:   seg.key,
      wheelLabel:   seg.label.replace('\\n', ' ')
    },
    id: 'wsr_' + Date.now()
  });

  ws.send(msg);
  console.log('[WheelSpin] sendResult →', msg);
}

/* ══════════════════════════════════════════════════════
   WEBSOCKET
══════════════════════════════════════════════════════ */
const params = new URLSearchParams(window.location.search);
const WS_HOST = params.get('address') || 'localhost';
const WS_PORT = params.get('port')    || '8080';
const WS_URI  = `ws://${WS_HOST}:${WS_PORT}/`;

let ws, wsTimer;

function setDot(cls) { document.getElementById('ws-dot').className = cls; }

function connect() {
  try {
    ws = new WebSocket(WS_URI);

    ws.onopen = () => {
      clearTimeout(wsTimer);
      setDot('on');
      console.log('[WheelSpin] Connected →', WS_URI);
      ws.send(JSON.stringify({
        request: 'Subscribe',
        events:  { general: ['Custom'] },
        id:      'WheelSpinSub'
      }));
    };

    ws.onmessage = e => {
      let msg;
      try { msg = JSON.parse(e.data); } catch { return; }
      route(msg);
    };

    ws.onclose = () => {
      setDot('off');
      console.log('[WheelSpin] Disconnected — retrying in 3s');
      wsTimer = setTimeout(connect, 3000);
    };

    ws.onerror = err => {
      console.error('[WheelSpin] WS error', err);
      setDot('off');
      ws.close();
    };

  } catch (err) {
    console.error('[WheelSpin] connect() threw:', err);
    setDot('off');
    wsTimer = setTimeout(connect, 3000);
  }
}

/* Unwrap Streamer.bot's event envelope */
function route(msg) {
  const isSpinPayload = p => p && (p.type === 'spin' || p.eventName === 'WheelSpin');
  const isWalletUpdate = p => p && p.eventName === 'WalletUpdate';

  let data = null;

  if (isSpinPayload(msg) || isWalletUpdate(msg)) {
    data = msg;
  } else if (msg.data !== undefined) {
    let inner = msg.data;
    if (typeof inner === 'string') {
      try { inner = JSON.parse(inner); } catch { inner = null; }
    }
    if (isSpinPayload(inner) || isWalletUpdate(inner)) data = inner;
  }

  if (!data) return;

  if (isWalletUpdate(data)) {
    // Save to localStorage so the Viewer Dashboard can instantly read it!
    localStorage.setItem(`sw_inv_${data.user}`, JSON.stringify(data.inventory));
    // Trigger a storage event manually for same-page updates if needed
    window.dispatchEvent(new Event('storage'));
    return;
  }

  const rawUser     = (data.user || 'unknown').replace(/^@/, '');
  const user        = rawUser.toLowerCase();
  const displayName = data.displayName || rawUser;
  const avatarUrl   = data.avatarUrl   || '';
  const count       = Math.max(1, Math.min(parseInt(data.count) || 1, 10));

  console.log(`[WheelSpin] Queuing ×${count} for ${displayName}`);
  queue.push({ user, displayName, avatarUrl, count });
  if (!spinning) processQueue();
}

/* ── Boot ─────────────────────────────────────────── */
drawWheel(0);
loadHubImage();
connect();
</script>
</body>
</html>
