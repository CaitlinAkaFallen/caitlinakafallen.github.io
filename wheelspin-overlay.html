<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Wheel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      font-family: 'Rajdhani', sans-serif;
    }
    #wheel-wrap {
      position: relative; width: 620px; height: 620px;
      display: flex; align-items: center; justify-content: center;
    }
    #wheelCanvas {
      width: 600px; height: 600px;
      filter: drop-shadow(0 0 18px rgba(255,255,255,.18)) drop-shadow(0 0 50px rgba(255,255,255,.06));
    }
    .pointer {
      position: absolute; top: -4px; left: 50%; transform: translateX(-50%);
      z-index: 20; width: 0; height: 0;
      border-left: 22px solid transparent; border-right: 22px solid transparent;
      border-top: 50px solid #ffffff;
      filter: drop-shadow(0 0 8px rgba(255,255,255,1)) drop-shadow(0 3px 12px rgba(0,0,0,.7));
    }
    .hub {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 56px; height: 56px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff 0%, #cccccc 55%, #888 100%);
      border: 4px solid rgba(0,0,0,.5);
      box-shadow: 0 0 0 3px rgba(255,255,255,.25), inset 0 2px 4px rgba(255,255,255,.6);
      z-index: 20;
    }
    #spin-banner {
      position: absolute; bottom: -52px; left: 50%; transform: translateX(-50%);
      white-space: nowrap; font-family: 'Bebas Neue', sans-serif;
      font-size: 22px; letter-spacing: 2px; color: #fff;
      text-shadow: 0 0 20px rgba(255,255,255,.9), 0 2px 8px rgba(0,0,0,.8);
      opacity: 0; transition: opacity .3s ease; pointer-events: none;
    }

    /* ── Winner overlay ── */
    #winner-overlay {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
      z-index: 999; pointer-events: none;
    }
    #winner-card {
      background: rgba(8,8,10,.93); border-radius: 20px;
      padding: 28px 52px 32px;
      text-align: center;
      transform: scale(0) rotate(-8deg); opacity: 0;
      transition: transform .5s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
      position: relative;
      min-width: 280px;
    }
    #winner-card::before {
      content: ''; position: absolute; inset: -2px; border-radius: 22px;
      background: var(--border-grad, linear-gradient(135deg,#7C3AED,#0D9488)); z-index: -1;
    }
    #winner-card.show { transform: scale(1) rotate(0deg); opacity: 1; }
    .wc-glow {
      position: absolute; inset: 0; border-radius: 20px;
      background: radial-gradient(ellipse at 50% 0%, var(--glow-col,rgba(124,58,237,.2)) 0%, transparent 70%);
      pointer-events: none;
    }

    #wc-avatar-wrap {
      width: 80px; height: 80px; border-radius: 50%;
      margin: 0 auto 4px; position: relative;
      display: none;
    }
    #wc-avatar-wrap.visible { display: block; }
    #wc-avatar {
      width: 80px; height: 80px; border-radius: 50%; object-fit: cover;
      border: 3px solid var(--prize-col, #7C3AED);
      box-shadow: 0 0 18px var(--prize-col, #7C3AED), 0 0 40px rgba(0,0,0,.6);
      display: block;
    }

    .wc-emoji  { font-size: 60px; line-height: 1; display: block; filter: drop-shadow(0 0 12px var(--prize-col,#7C3AED)); }
    .wc-user   { font-family:'Bebas Neue',sans-serif; font-size:30px; letter-spacing:3px; color:var(--prize-col,#7C3AED); margin-top:10px; text-shadow:0 0 20px var(--prize-col,#7C3AED); }
    .wc-prize  { font-family:'Rajdhani',sans-serif; font-size:20px; font-weight:700; color:#fff; margin-top:6px; letter-spacing:1px; }
    .wc-sub    { font-size:13px; color:#aaa; margin-top:6px; letter-spacing:1px; font-weight:600; }

    #ws-dot {
      position: fixed; top: 12px; right: 14px;
      width: 10px; height: 10px; border-radius: 50%;
      background: #555; transition: background .4s, box-shadow .4s;
    }
    #ws-dot.on  { background: #00ff88; box-shadow: 0 0 10px #00ff88; }
    #ws-dot.off { background: #ff3333; box-shadow: 0 0 10px #ff3333; }
  </style>
</head>
<body>

<div id="ws-dot"></div>

<div id="wheel-wrap">
  <div class="pointer"></div>
  <canvas id="wheelCanvas"></canvas>
  <div class="hub" id="css-hub"></div>
  <div id="spin-banner"></div>
</div>

<div id="winner-overlay">
  <div id="winner-card">
    <div class="wc-glow"></div>
    <div id="wc-avatar-wrap">
      <img id="wc-avatar" src=" " alt="avatar">
    </div>
    <span class="wc-emoji" id="wc-emoji"></span>
    <div class="wc-user"  id="wc-user">@Username</div>
    <div class="wc-prize" id="wc-prize">Prize Name</div>
    <div class="wc-sub"   id="wc-sub">Added to inventory!</div>
  </div>
</div>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════
    SEGMENTS — Fallback if dashboard unconfigured
═══════════════════════════════════════════════════════════ */
let SEGMENTS = [
  { key:'WCG',            label:'Winner\nChoose Game', color:'#7C3AED', text:'#ffffff', emoji:'' },
  { key:'SF',             label:'Shitface',            color:'#0D9488', text:'#ffffff', emoji:'' },
  { key:'Hydrate',        label:'Hydrate',             color:'#9333EA', text:'#ffffff', emoji:'' },
  { key:'ViewersChoice',  label:"Viewer's\nChoice",    color:'#0891B2', text:'#ffffff', emoji:'' },
  { key:'fallgreement',   label:'Fallgreement',        color:'#6D28D9', text:'#ffffff', emoji:'' },
  { key:'VI',             label:'Voice Impression',    color:'#14B8A6', text:'#ffffff', emoji:'' },
  { key:'Cosplay',        label:'CC Cosplay',          color:'#5B21B6', text:'#ffffff', emoji:'' },
  { key:'Nothing',        label:'Nothing',             color:'#1E293B', text:'#ffffff', emoji:'' },
  { key:'No Swear',       label:'No Swearing',         color:'#4F46E5', text:'#ffffff', emoji:'' },
  { key:'DF',             label:'Diabolical Foods',    color:'#0E7490', text:'#ffffff', emoji:'' },
];

const storedSegments = localStorage.getItem('stream_wheel_segments');
if (storedSegments) {
  try { SEGMENTS = JSON.parse(storedSegments); }
  catch(e) { console.error('[WheelSpin] Failed parsing segments:', e); }
}

/* ═══════════════════════════════════════════════════════════
    CANVAS SETUP
═══════════════════════════════════════════════════════════ */
const canvas = document.getElementById('wheelCanvas');
const ctx    = canvas.getContext('2d');
const DPR    = Math.min(window.devicePixelRatio || 1, 2);
const SIZE   = 600, R = 278, CX = SIZE/2, CY = SIZE/2;
const HUB_R  = 30; // hub circle radius in canvas units

canvas.width  = SIZE * DPR; canvas.height = SIZE * DPR;
canvas.style.width = SIZE+'px'; canvas.style.height = SIZE+'px';
ctx.scale(DPR, DPR);

let angle = 0, spinning = false;
const queue = [];

/* ═══════════════════════════════════════════════════════════
    HUB IMAGE — load from localStorage, draw on canvas
═══════════════════════════════════════════════════════════ */
let hubImage = null;
const cssHub = document.getElementById('css-hub');

function loadHubImage() {
  const stored = localStorage.getItem('stream_wheel_hub_image');
  if (!stored) {
    hubImage = null;
    cssHub.style.display = '';  // show default chrome hub
    drawWheel(angle);
    return;
  }
  const img = new Image();
  img.onload = () => {
    hubImage = img;
    cssHub.style.display = 'none'; // hide CSS hub, canvas draws it
    drawWheel(angle);
  };
  img.onerror = () => {
    hubImage = null;
    cssHub.style.display = '';
    drawWheel(angle);
  };
  img.src = stored;
}

// Pick up changes saved from dashboard in same browser (same-origin)
window.addEventListener('storage', e => {
  if (e.key === 'stream_wheel_hub_image') loadHubImage();
});

/* ═══════════════════════════════════════════════════════════
    DRAW
═══════════════════════════════════════════════════════════ */
function drawWheel(a) {
  ctx.clearRect(0, 0, SIZE, SIZE);
  const n = SEGMENTS.length, arc = (2*Math.PI)/n;

  SEGMENTS.forEach((seg, i) => {
    const s = a + i*arc, e = s + arc;

    ctx.beginPath(); ctx.moveTo(CX,CY); ctx.arc(CX,CY,R,s,e); ctx.closePath();
    ctx.fillStyle = seg.color; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 2.5; ctx.stroke();

    if (i%2===0) {
      ctx.beginPath(); ctx.moveTo(CX,CY); ctx.arc(CX,CY,R,s,e); ctx.closePath();
      ctx.fillStyle='rgba(255,255,255,.05)'; ctx.fill();
    }

    ctx.save();
    ctx.translate(CX,CY); ctx.rotate(s+arc/2);
    ctx.textAlign    = 'right';
    ctx.textBaseline = 'middle';

    const lines     = seg.label.split('\\n');
    const lh        = 32;
    const FONT_SIZE = 26;

    ctx.font          = `bold ${FONT_SIZE}px Rajdhani,Arial,sans-serif`;
    ctx.fillStyle     = seg.text || '#ffffff';
    ctx.shadowColor   = 'rgba(0,0,0,0.98)';
    ctx.shadowBlur    = 9;
    ctx.shadowOffsetX = 1;
    ctx.shadowOffsetY = 1;

    lines.forEach((ln, li) => {
      ctx.fillText(ln, R - 16, (li - (lines.length - 1) / 2) * lh);
    });

    ctx.restore();
  });

  /* Outer ring */
  ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=5; ctx.stroke();

  /* ── Hub: custom image OR inner ring fallback ── */
  if (hubImage) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(CX, CY, HUB_R, 0, Math.PI*2);
    ctx.clip();
    ctx.drawImage(hubImage, CX - HUB_R, CY - HUB_R, HUB_R * 2, HUB_R * 2);
    ctx.restore();

    ctx.beginPath(); ctx.arc(CX, CY, HUB_R, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.arc(CX, CY, HUB_R - 2, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 2; ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(CX,CY,32,0,Math.PI*2);
    ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=2; ctx.stroke();
  }
}

function getWinner(a) {
  const n=SEGMENTS.length, arc=(2*Math.PI)/n;
  const norm=(((-a-Math.PI/2)%(2*Math.PI))+(2*Math.PI))%(2*Math.PI);
  return SEGMENTS[Math.floor(norm/arc)%n];
}

function easeOut(t) { return 1-Math.pow(1-t,4); }

function spin(user, displayName, avatarUrl) {
  if (spinning) return;
  spinning=true;
  const banner=document.getElementById('spin-banner');
  banner.textContent=`Spinning for  @${displayName}`; banner.style.opacity='1';
  const laps=6+Math.floor(Math.random()*6), extra=Math.random()*2*Math.PI;
  const total=laps*2*Math.PI+extra, duration=4800, startAngle=angle, t0=performance.now();
  (function frame(now){
    const t=Math.min((now-t0)/duration,1);
    angle=startAngle+total*easeOut(t); drawWheel(angle);
    if(t<1){ requestAnimationFrame(frame); }
    else {
      angle=(((startAngle+total)%(2*Math.PI))+(2*Math.PI))%(2*Math.PI);
      spinning=false; banner.style.opacity='0';
      showWinner(user, displayName, avatarUrl, getWinner(angle));
    }
  })(t0);
}

function showWinner(user, displayName, avatarUrl, seg) {
  const card = document.getElementById('winner-card');
  card.style.setProperty('--border-grad',`linear-gradient(135deg,${seg.color},${seg.color}99)`);
  card.style.setProperty('--glow-col', seg.color+'33');
  card.style.setProperty('--prize-col', seg.color);

  const avatarWrap = document.getElementById('wc-avatar-wrap');
  const avatarImg  = document.getElementById('wc-avatar');
  const emojiEl    = document.getElementById('wc-emoji');
  if (avatarUrl) {
    avatarImg.src = avatarUrl;
    avatarWrap.classList.add('visible');
    emojiEl.style.display = 'none';
  } else {
    avatarWrap.classList.remove('visible');
    emojiEl.style.display = 'none';
  }

  document.getElementById('wc-user').textContent  = `@${displayName}`;
  document.getElementById('wc-prize').textContent = seg.label.replace('\\n',' ');
  document.getElementById('wc-sub').textContent   =
    seg.key=='SpinAgain' ? 'SPINNING AGAIN!'                  :
    seg.key=='Nothing'   ? 'Better luck next time...'         :
                            'Added to inventory!  Use $redeem to claim.';

  card.classList.add('show');
  sendResult(user, displayName, seg);

  setTimeout(()=>{
    card.classList.remove('show');
    setTimeout(()=>{
      if(seg.key==='SpinAgain') queue.unshift({user, displayName, avatarUrl, count:1});
      processQueue();
    },500);
  },6000);
}

function processQueue() {
  if(!queue.length) return;
  const next=queue[0];
  if(next.count<=0){queue.shift();processQueue();return;}
  next.count--;
  if(next.count===0) queue.shift();
  spin(next.user, next.displayName, next.avatarUrl||'');
}

/* ═══════════════════════════════════════════════════════════
    WEBSOCKET
═══════════════════════════════════════════════════════════ */
const params = new URLSearchParams(window.location.search);
const WS_URI = `ws://${params.get('address')||'localhost'}:${params.get('port')||'8080'}/`;
let ws, wsTimer;

function setDot(s){ document.getElementById('ws-dot').className=s; }

function connect(){
  try {
    ws=new WebSocket(WS_URI);
    ws.onopen=()=>{
      console.log('[WheelSpin] Connected →', WS_URI);
      clearTimeout(wsTimer); setDot('on');
      ws.send(JSON.stringify({request:'Subscribe',events:{general:['Custom']},id:'WheelSpin'}));
    };
    ws.onmessage=e=>{ let m; try{m=JSON.parse(e.data);}catch{return;} route(m); };
    ws.onclose=()=>{ console.log('[WheelSpin] Disconnected — retrying in 3s'); setDot('off'); wsTimer=setTimeout(connect,3000); };
    ws.onerror=err=>{ console.error('[WheelSpin] Error',err); setDot('off'); ws.close(); };
  } catch(err){ console.error('[WheelSpin] connect() threw:',err); setDot('off'); wsTimer=setTimeout(connect,3000); }
}

function route(msg){
  let data=null;
  function isSpinPayload(p){ return p?.type==='spin' || p?.eventName==='WheelSpin'; }

  if(isSpinPayload(msg)){
    data=msg;
  }
  else if(msg?.data!==undefined){
    let inner=msg.data;
    if(typeof inner==='string'){ try{ inner=JSON.parse(inner); }catch{ inner=null; } }
    if(isSpinPayload(inner)) data=inner;
  }

  if(data){
    const rawUser=(data.user||'unknown').replace(/^@/,'');
    const user=rawUser.toLowerCase();
    const displayName=data.displayName||rawUser;
    const avatarUrl=data.avatarUrl||'';
    const count=Math.max(1,Math.min(parseInt(data.count)||1,10));
    console.log(`[WheelSpin] Queuing spin for ${displayName} (×${count}) avatar=${avatarUrl||'none'}`);
    queue.push({user, displayName, avatarUrl, count});
    if(!spinning) processQueue();
  }
}

/* ═══════════════════════════════════════════════════════════
   SEND RESULT
   This format matches the requirement for Streamer.bot's 
   WebSocket "Custom JSON Event" trigger.
═══════════════════════════════════════════════════════════ */
function sendResult(user, displayName, seg){
  if(!ws || ws.readyState !== WebSocket.OPEN) {
    console.error('[WheelSpin] Cannot send result: WebSocket not connected.');
    return;
  }
  
  const payload = {
    request: 'DoAction',
    action: { name: 'WheelSpin_HandleResult' },
    args: {
      wheelUser: user,
      wheelDisplay: displayName,
      wheelPrize: seg.key,
      wheelLabel: seg.label.replace('\n', ' '),
      wheelEmoji: seg.emoji || ''
    }
  };

  console.log('[WheelSpin] Sending result to Streamer.bot:', payload);
  ws.send(JSON.stringify(payload));
}

/* ── Init ── */
drawWheel(0);
loadHubImage();
connect();
</script>
</body>
</html>
