<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fallout 76 Pip-Boy Overlay</title>
    <style>
        /* Digital/Terminal style fonts */
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&family=Roboto+Condensed:wght@700&display=swap');

        :root {
            /* Classic Fallout 76 Amber/Gold */
            --fo-amber: #ffb642; 
            --fo-bg: rgba(20, 15, 5, 0.9);
            --fo-glow: 0 0 15px rgba(255, 182, 66, 0.4);
        }

        body {
            margin: 0; padding: 0;
            background-color: transparent;
            overflow: hidden;
            width: 1920px; height: 1080px;
            font-family: 'Share Tech Mono', monospace;
        }

        .fallout-container {
            position: fixed;
            top: 150px;
            left: 100px;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .fallout-container.active {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* The Header Scanline Box */
        .header-strip {
            background: var(--fo-amber);
            color: #000;
            font-family: 'Roboto Condensed', sans-serif;
            font-weight: 900;
            font-size: 20px;
            padding: 4px 20px;
            width: fit-content;
            text-transform: uppercase;
            clip-path: polygon(0 0, 100% 0, 95% 100%, 0% 100%);
            margin-bottom: 5px;
        }

        .user-section {
            display: flex;
            align-items: center;
            background: var(--fo-bg);
            border: 2px solid var(--fo-amber);
            padding: 15px;
            box-shadow: var(--fo-glow), inset 0 0 20px rgba(0,0,0,0.5);
            border-radius: 0 15px 0 15px;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border: 2px solid var(--fo-amber);
            background-size: cover;
            background-position: center;
            margin-right: 25px;
            /* Fallout "CRT" filter effect */
            filter: sepia(1) saturate(2) hue-rotate(-15deg) contrast(1.2);
            box-shadow: var(--fo-glow);
        }

        .info-text {
            display: flex;
            flex-direction: column;
        }

        .username {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 50px;
            color: var(--fo-amber);
            text-transform: uppercase;
            line-height: 1;
            text-shadow: var(--fo-glow);
        }

        .reward-display {
            font-family: 'VT323', monospace;
            font-size: 36px;
            color: var(--fo-amber);
            margin-top: 5px;
            letter-spacing: 2px;
        }

        /* The "CAPS" style cost box */
        .cost-section {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .caps-label {
            background: var(--fo-amber);
            color: black;
            padding: 2px 10px;
            font-weight: bold;
            font-size: 22px;
        }

        .cost-value {
            font-size: 32px;
            color: var(--fo-amber);
            text-shadow: var(--fo-glow);
        }

        /* CRT Scanline Effect Overlay */
        .crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            opacity: 0.3;
        }
    </style>
</head>
<body>

<div id="overlay" class="fallout-container">
    <div class="header-strip">OBJECTIVE COMPLETED</div>
    
    <div class="user-section">
        <div class="avatar" id="avatar"></div>
        <div class="info-text">
            <div class="username" id="username">VAULT_DWELLER</div>
            <div class="reward-display" id="reward-display">COLLECTING REWARD...</div>
            
            <div class="cost-section">
                <div class="caps-label">CAPS</div>
                <div class="cost-value" id="data-log">0000</div>
            </div>
        </div>
        <div class="crt-overlay"></div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const address = params.get("address") || "localhost";
    const port = params.get("port") || "8080";
    const ws = new WebSocket(`ws://${address}:${port}/`);
    let hideTimer;

    ws.onopen = () => {
        ws.send(JSON.stringify({
            request: "Subscribe",
            events: { general: ["Custom"] },
            id: "FalloutOverlay"
        }));
    };

    ws.onmessage = (event) => {
        const message = JSON.parse(event.data);
        if (message.data?.eventName === "iPhoneCallTrigger") {
            const data = message.data;
            triggerFallout(data.user, data.reward, data.cost, data.avatar);
        }
    };

    function triggerFallout(user, reward, cost, avatarUrl) {
        const overlay = document.getElementById('overlay');
        const usernameEl = document.getElementById('username');
        const rewardEl = document.getElementById('reward-display');
        const dataLogEl = document.getElementById('data-log');
        const avatarEl = document.getElementById('avatar');

        clearTimeout(hideTimer);

        usernameEl.textContent = user;
        rewardEl.textContent = reward.toUpperCase();
        dataLogEl.textContent = cost;
        avatarEl.style.backgroundImage = `url('${avatarUrl}')`;

        overlay.classList.remove('active');
        void overlay.offsetWidth; 
        overlay.classList.add('active');

        hideTimer = setTimeout(() => overlay.classList.remove('active'), 8500);
    }

    ws.onclose = () => setTimeout(() => location.reload(), 5000);
</script>
</body>
</html>
