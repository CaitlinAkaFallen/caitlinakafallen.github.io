<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resident Evil Requiem Overlay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&display=swap');

        :root {
            --req-white: #ffffff;
            --req-black: #000000;
        }

        body {
            margin: 0; padding: 0;
            background-color: transparent;
            overflow: hidden;
            width: 1920px; height: 1080px;
            font-family: 'Special Elite', serif;
        }

        .requiem-overlay {
            position: fixed;
            top: 150px;
            left: 100px;
            display: flex;
            flex-direction: column;
            opacity: 0; 
            transform: translateX(-100px);
            transition: opacity 0.5s ease, transform 0.8s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .requiem-overlay.active {
            opacity: 1;
            transform: translateX(0);
        }

        /* The vertical film line from your image */
        .requiem-overlay::before {
            content: '';
            position: absolute;
            left: -30px;
            width: 5px;
            height: 100%;
            background: var(--req-white);
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }

        .user-section {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border: 2px solid var(--req-white);
            background-size: cover;
            background-position: center;
            filter: grayscale(1) contrast(1.4);
            margin-right: 30px;
            position: relative;
        }

        .username {
            font-size: 60px;
            color: var(--req-white);
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 3px 3px 0px black;
        }

        /* The white paint stroke background */
        .brush-box {
            background: var(--req-white);
            padding: 10px 45px;
            width: fit-content;
            transform: rotate(-1.5deg);
            clip-path: polygon(1% 10%, 99% 2%, 100% 90%, 97% 98%, 3% 95%, 0% 85%);
        }

        .reward-name {
            font-size: 42px;
            color: var(--req-black);
            font-weight: bold;
            text-transform: lowercase;
            letter-spacing: -1px;
        }

        /* This is where the COST (PT) appears */
        .data-text {
            color: var(--req-white);
            font-size: 22px;
            margin-top: 15px;
            letter-spacing: 2px;
            opacity: 0.8;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div id="overlay" class="requiem-overlay">
    <div class="user-section">
        <div class="avatar" id="avatar"></div>
        <div class="username" id="username">SUBJECT</div>
    </div>
    
    <div class="brush-box">
        <div class="reward-name" id="reward-display">requiem</div>
    </div>

    <div class="data-text" id="data-log">FILE_LOG: 0000 PT // STATUS: VERIFIED</div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const address = params.get("address") || "localhost";
    const port = params.get("port") || "8080";
    const ws = new WebSocket(`ws://${address}:${port}/`);
    let hideTimer;

    ws.onopen = () => {
        ws.send(JSON.stringify({
            request: "Subscribe",
            events: { general: ["Custom"] },
            id: "RequiemOverlay"
        }));
    };

    ws.onmessage = (event) => {
        const message = JSON.parse(event.data);
        if (message.data?.eventName === "iPhoneCallTrigger") {
            const data = message.data;
            triggerRequiem(data.user, data.reward, data.cost, data.avatar);
        }
    };

    function triggerRequiem(user, reward, cost, avatarUrl) {
        const overlay = document.getElementById('overlay');
        const usernameEl = document.getElementById('username');
        const rewardEl = document.getElementById('reward-display');
        const dataLogEl = document.getElementById('data-log');
        const avatarEl = document.getElementById('avatar');

        clearTimeout(hideTimer);

        // This ensures the cost is 4 digits (like 0100 PT)
        const formattedCost = String(cost).padStart(4, '');

        usernameEl.textContent = user;
        rewardEl.textContent = reward;
        // Updated this line to show the cost!
        dataLogEl.textContent = `FILE_LOG: ${formattedCost} PT // STATUS: VERIFIED`;
        avatarEl.style.backgroundImage = `url('${avatarUrl}')`;

        overlay.classList.remove('active');
        void overlay.offsetWidth; 
        overlay.classList.add('active');

        hideTimer = setTimeout(() => overlay.classList.remove('active'), 8500);
    }

    ws.onclose = () => setTimeout(() => location.reload(), 5000);
</script>
</body>
</html>
