<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBZ Scouter Overlay</title>
    <style>
        /* Bold, digital-style font */
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Orbitron:wght@400;900&display=swap');

        body {
            margin: 0;
            padding: 50px;
            background: transparent;
            overflow: hidden;
            display: flex;
            align-items: center;
            height: 100vh;
            font-family: 'Orbitron', sans-serif;
        }

        /* SCOUTER CONTAINER */
        #scouter-hud {
            display: flex;
            align-items: center;
            gap: 0;
            opacity: 0;
            transform: translateX(-50px);
            transition: all 0.4s ease-out;
        }

        #scouter-hud.show {
            opacity: 1;
            transform: translateX(0);
        }

        /* LENS / AVATAR BOX */
        .scouter-lens {
            position: relative;
            width: 140px;
            height: 140px;
            background: rgba(0, 255, 0, 0.1); /* Green Scouter Tint */
            border: 2px solid rgba(0, 255, 0, 0.5);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            overflow: hidden;
            clip-path: polygon(0% 0%, 100% 0%, 100% 80%, 80% 100%, 0% 100%);
        }

        /* Scanline Animation */
        .scouter-lens::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 255, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.03), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        .user-avatar {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: grayscale(0.5) sepia(1) hue-rotate(70deg) saturate(3);
        }

        /* DATA READOUT PANEL */
        .readout-panel {
            display: flex;
            flex-direction: column;
            padding: 10px 30px;
            background: rgba(0, 0, 0, 0.6);
            border-top: 2px solid #00ff00;
            border-bottom: 2px solid #00ff00;
            min-width: 350px;
            position: relative;
        }

        /* Decorative HUD Brackets */
        .readout-panel::before {
            content: "[ SCANNING ]";
            position: absolute;
            top: -25px;
            left: 0;
            color: #00ff00;
            font-size: 12px;
            letter-spacing: 2px;
        }

        .user-tag {
            font-size: 18px;
            color: #00ff00;
            text-transform: uppercase;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .power-value {
            font-size: 64px;
            color: #fff;
            font-family: 'Archivo Black', sans-serif;
            line-height: 1;
            text-shadow: 0 0 10px #00ff00;
            font-style: italic;
        }

        /* Animated "Glitch" Text */
        .power-value span {
            font-size: 24px;
            color: #00ff00;
            margin-left: 10px;
            vertical-align: middle;
        }

        /* Intensify animation on show */
        #scouter-hud.show .power-value {
            animation: digitalFlicker 0.1s infinite alternate;
        }

        @keyframes digitalFlicker {
            from { opacity: 0.95; }
            to { opacity: 1; text-shadow: 0 0 15px #00ff00; }
        }
    </style>
</head>
<body>

    <div id="scouter-hud">
        <div class="scouter-lens">
            <div id="avatar" class="user-avatar"></div>
        </div>
        
        <div class="readout-panel">
            <div id="username" class="user-tag">TARGET_IDENTIFIED</div>
            <div class="power-value">
                <span>Lv.</span>
                <span id="power-level">0000</span>              
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);
        let hideTimer = null;

        ws.onopen = () => {
            ws.send(JSON.stringify({
                request: "Subscribe",
                events: { general: ["Custom"] },
                id: "DBZReveal"
            }));
        };

        ws.onmessage = (event) => {
            const response = JSON.parse(event.data);
            const data = response.data;

            if (data && data.eventName === "DBZReveal") {
                document.getElementById('username').innerText = data.user;
                document.getElementById('power-level').innerText = data.randomNumber;
                
                if (data.avatar) {
                    document.getElementById('avatar').style.backgroundImage = `url('${data.avatar}')`;
                }

                const container = document.getElementById('scouter-hud');
                if (hideTimer) clearTimeout(hideTimer);

                container.classList.remove('show'); 
                void container.offsetWidth; 
                container.classList.add('show');

                hideTimer = setTimeout(() => {
                    container.classList.remove('show');
                }, 8000);
            }
        };
    </script>
</body>
</html>
