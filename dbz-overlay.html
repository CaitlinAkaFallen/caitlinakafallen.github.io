<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBZ Scouter HUD - Ultimate Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');
        
        :root {
            /* Default State (Green - No Threat) */
            --scouter-color: #00ff00;
            --scouter-glow: rgba(0, 255, 0, 0.7);
            --bg-tint: rgba(0, 255, 0, 0.05);
            --avatar-filter: grayscale(1) sepia(1) hue-rotate(80deg) brightness(1.2) contrast(1.5);
        }

        /* 8000+ Mode (Greenish Yellow - Semi-Threat) */
        .warning-mode {
            --scouter-color: #ccff00 !important;
            --scouter-glow: rgba(204, 255, 0, 0.7) !important;
            --bg-tint: rgba(204, 255, 0, 0.1) !important;
            --avatar-filter: grayscale(1) sepia(1) hue-rotate(40deg) brightness(1.2) contrast(1.5) !important;
        }

        /* 9000+ Mode (Red - Serious Threat) */
        .danger-mode {
            --scouter-color: #ff0000 !important;
            --scouter-glow: rgba(255, 0, 0, 0.8) !important;
            --bg-tint: rgba(255, 0, 0, 0.15) !important;
            --avatar-filter: grayscale(1) sepia(1) hue-rotate(-50deg) brightness(1.1) contrast(1.6) !important;
        }

        body {
            margin: 0; padding: 50px;
            background: transparent;
            overflow: hidden;
            display: flex; align-items: center; height: 100vh;
            font-family: 'Orbitron', sans-serif;
        }

        #scouter-hud {
            display: flex; align-items: center;
            opacity: 0; 
            transform: scale(0.5) translateX(-200px);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: var(--scouter-color);
        }

        #scouter-hud.show { 
            opacity: 1; 
            transform: scale(1) translateX(0); 
            animation: digitalBoot 0.4s ease-out;
        }

        @keyframes digitalBoot {
            0% { filter: brightness(5) blur(10px); }
            100% { filter: brightness(1) blur(0px); }
        }

        /* LENS / AVATAR BOX */
        .scouter-lens {
            position: relative;
            width: 180px; height: 180px;
            border: 3px solid var(--scouter-color);
            background: var(--bg-tint);
            overflow: hidden;
            clip-path: polygon(0 0, 100% 0, 100% 75%, 75% 100%, 0 100%);
            box-shadow: inset 0 0 20px var(--scouter-glow);
        }

        .reticle {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            border: 1px solid var(--scouter-color);
            animation: pulseReticle 2s infinite ease-in-out;
            opacity: 0.4;
        }

        @keyframes pulseReticle {
            0%, 100% { transform: scale(0.9); opacity: 0.2; }
            50% { transform: scale(1.1); opacity: 0.6; }
        }

        .user-avatar {
            width: 100%; height: 100%;
            background-size: cover; background-position: center;
            filter: var(--avatar-filter);
            transition: filter 0.5s ease;
        }

        /* DATA READOUT PANEL */
        .readout-panel {
            padding: 20px 50px;
            position: relative;
            display: flex; flex-direction: column;
            background: rgba(0, 0, 0, 0.5);
            -webkit-backdrop-filter: blur(5px);
            backdrop-filter: blur(5px);
            border-left: 5px solid var(--scouter-color);
        }

        .readout-panel::after {
            content: ""; position: absolute; right: 0; top: 0; height: 100%; width: 4px;
            background: linear-gradient(to bottom, transparent, var(--scouter-color), transparent);
        }

        .status-top {
            font-size: 14px; letter-spacing: 4px;
            margin-bottom: 5px; text-transform: uppercase;
            font-weight: 900;
        }

        .power-container {
            display: flex; align-items: baseline; gap: 15px;
        }

        .power-value {
            font-size: 90px; font-weight: 900;
            line-height: 0.8; font-style: italic;
            text-shadow: 0 0 20px var(--scouter-glow);
        }

        .hud-bar-bg {
            width: 100%; height: 6px;
            background: rgba(255, 255, 255, 0.1);
            margin-top: 15px; border-radius: 3px;
            overflow: hidden;
        }

        .hud-bar-fill {
            height: 100%; width: 0%;
            background: var(--scouter-color);
            box-shadow: 0 0 10px var(--scouter-glow);
            transition: width 1.5s cubic-bezier(0.1, 0.7, 0.1, 1);
        }

        .scanlines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, var(--bg-tint) 50%);
            background-size: 100% 6px; pointer-events: none;
            z-index: 10; opacity: 0.4;
        }

        #scouter-hud.show .power-value {
            animation: jitter 0.15s infinite;
        }

        @keyframes jitter {
            0% { transform: translate(0,0); }
            25% { transform: translate(-1px, 1px); }
            50% { transform: translate(1px, -1px); }
            75% { transform: translate(-1px, -1px); }
            100% { transform: translate(0,0); }
        }
    </style>
</head>
<body>

    <div id="scouter-hud">
        <div class="scouter-lens">
            <div id="avatar" class="user-avatar"></div>
            <div class="reticle"></div>
            <div class="scanlines"></div>
        </div>
        
        <div class="readout-panel">
            <div class="status-top">Target: <span id="username">---</span></div>
            <div class="power-container">
                <span id="power-level" class="power-value">0000</span>
            </div>
            <div id="analysis" class="status-top" style="margin-top: 5px; font-size: 11px;">Initializing...</div>
            
            <div class="hud-bar-bg">
                <div id="pwr-bar" class="hud-bar-fill"></div>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);
        let hideTimer = null;

        ws.onopen = () => {
            ws.send(JSON.stringify({
                request: "Subscribe",
                events: { general: ["Custom"] },
                id: "DBZReveal"
            }));
        };

        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start).toString().padStart(4, '0');
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        ws.onmessage = (event) => {
            const response = JSON.parse(event.data);
            const data = response.data;

            if (data && data.eventName === "DBZReveal") {
                const container = document.getElementById('scouter-hud');
                const powerText = document.getElementById('power-level');
                const analysisText = document.getElementById('analysis');
                const barFill = document.getElementById('pwr-bar');
                const pwr = parseInt(data.randomNumber);
                
                document.getElementById('username').innerText = data.user;
                if (data.avatar) {
                    document.getElementById('avatar').style.backgroundImage = `url('${data.avatar}')`;
                }

                container.classList.remove('warning-mode', 'danger-mode');

                // logic for threat levels
                if (pwr >= 9000) {
                    container.classList.add('danger-mode');
                    analysisText.innerText = "Analysis: Serious Threat";
                } else if (pwr >= 8000) {
                    container.classList.add('warning-mode');
                    analysisText.innerText = "Analysis: Semi Threat";
                } else {
                    analysisText.innerText = "Analysis: Not a Threat";
                }

                if (hideTimer) clearTimeout(hideTimer);
                container.classList.remove('show'); 
                void container.offsetWidth; 
                container.classList.add('show');

                animateValue(powerText, 0, pwr, 1500);
                
                const barWidth = Math.min((pwr / 10000) * 100, 100);
                barFill.style.width = '0%';
                setTimeout(() => { barFill.style.width = barWidth + '%'; }, 100);

                hideTimer = setTimeout(() => {
                    container.classList.remove('show');
                }, 9000);
            }
        };
    </script>
</body>
</html>
