<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars Twitch Overlay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600&display=swap');

        :root {
            /* Sith Theme Colors */
            --sith-red: #ff0000;
            --sith-glow: rgba(255, 0, 0, 0.6);
            --sith-bg: linear-gradient(145deg, #1a0505 0%, #050000 100%);
            
            /* Jedi Theme Colors */
            --jedi-blue: #00d4ff;
            --jedi-glow: rgba(0, 212, 255, 0.6);
            --jedi-bg: linear-gradient(145deg, #051a1e 0%, #00080a 100%);
        }

        body { margin: 0; padding: 40px; background-color: transparent; font-family: 'Inter', sans-serif; overflow: hidden; }

        #alert-wrapper {
            display: flex;
            align-items: center;
            opacity: 0;
            transform: translateX(-100px);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #alert-wrapper.show { opacity: 1; transform: translateX(0); }

        #pill-container {
            display: flex;
            align-items: center;
            position: relative;
            padding: 20px 45px;
            clip-path: polygon(4% 0%, 100% 0%, 96% 100%, 0% 100%);
            transform: skewX(-10deg);
            min-width: 500px;
            max-width: 850px;
            overflow: hidden;
            background: var(--sith-bg);
            border-left: 6px solid var(--sith-red);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.9), inset 0 0 30px rgba(0, 0, 0, 0.5);
            /* Smooth transition between Sith and Jedi states */
            transition: background 0.8s ease-in-out, border-color 0.8s ease-in-out, box-shadow 0.8s ease-in-out;
        }

        /* --- JEDI TRANSITION (When 'thanks' class is added) --- */
        #pill-container.thanks { 
            background: var(--jedi-bg);
            border-left-color: var(--jedi-blue); 
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.9), 0 0 20px var(--jedi-glow);
        }

        /* Text color transitions */
        .user-header, .user-name {
            transition: color 0.8s ease-in-out, text-shadow 0.8s ease-in-out;
        }

        /* Sith Text (Default) */
        .user-header { font-family: 'Cinzel', serif; font-size: 1rem; color: var(--sith-red); font-weight: 700; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 2px; }
        .user-name { font-family: 'Cinzel', serif; font-size: 1.8rem; font-weight: 900; color: #fff; text-shadow: 0 0 15px var(--sith-glow); margin: 0; }
        
        /* Jedi Text */
        #pill-container.thanks .user-header { color: var(--jedi-blue); }
        #pill-container.thanks .user-name { text-shadow: 0 0 15px var(--jedi-glow); }

        /* Animation for the "Lightsaber" edge */
        #pill-container::before {
            content: '';
            position: absolute;
            left: 0; top: 0; height: 100%; width: 2px;
            background: #fff;
            box-shadow: 0 0 15px 2px #fff;
            opacity: 0.8;
            z-index: 5;
        }

        #pill-container::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.1;
            mix-blend-mode: overlay;
            pointer-events: none;
            z-index: 1;
        }

        .avatar-wrapper { transform: skewX(10deg); margin-right: 25px; z-index: 2; }
        .user-avatar {
            width: 85px; height: 85px;
            background-size: cover; background-position: center;
            border: 3px solid var(--sith-red);
            box-shadow: 0 0 20px var(--sith-glow);
            background-color: #111;
            transition: border-color 0.8s ease-in-out, box-shadow 0.8s ease-in-out;
        }

        #pill-container.thanks .user-avatar {
            border-color: var(--jedi-blue);
            box-shadow: 0 0 20px var(--jedi-glow);
        }

        .text-group { display: flex; flex-direction: column; transform: skewX(10deg); color: white; z-index: 2; }
        .question-text { font-size: 1.15rem; color: #e0e0e0; line-height: 1.4; margin-top: 8px; word-break: break-word; font-weight: 400; }
        
        /* Subtle scanline effect */
        .scanline {
            position: absolute;
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 3;
        }
    </style>
</head>
<body>

<div id="alert-wrapper">
    <div id="pill-container">
        <div class="scanline"></div>
        <div class="avatar-wrapper">
            <div class="user-avatar" id="avatar"></div>
        </div>
        <div class="text-group">
            <div class="user-header" id="header-text">Dark Side Inquiry</div>
            <div class="user-name" id="username">Warrior</div>
            <div class="question-text" id="content-text">Awaiting the Force...</div>
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);

    ws.onopen = () => {
        ws.send(JSON.stringify({ request: "Subscribe", events: { general: ["Custom"] }, id: "TwitchQAS" }));
    };

    ws.onmessage = (event) => {
        const response = JSON.parse(event.data);
        const d = response.data || response;

        if (d.eventName === "questionAlert" || d.eventName === "thankYouAlert") {
            const pill = document.getElementById('pill-container');
            const wrapper = document.getElementById('alert-wrapper');
            
            // Set Base Content
            document.getElementById('username').innerText = d.user;
            document.getElementById('avatar').style.backgroundImage = `url('${d.avatar}')`;

            if (d.eventName === "thankYouAlert") {
                pill.classList.add('thanks');
                document.getElementById('header-text').innerText = "Jedi Recognition";
                document.getElementById('content-text').innerText = "The Force is strong with this one. Thank you!";
            } else {
                pill.classList.remove('thanks');
                document.getElementById('header-text').innerText = "Dark Side Inquiry";
                document.getElementById('content-text').innerText = d.message;
            }

            // Animation
            wrapper.classList.add('show');
            
            // Auto hide after 15 seconds
            setTimeout(() => {
                wrapper.classList.remove('show');
            }, 15000);
        }
    };
</script>
</body>
</html>
