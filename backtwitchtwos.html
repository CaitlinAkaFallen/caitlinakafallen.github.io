<script>
document.addEventListener('DOMContentLoaded', () => {
    // 1. Setup UI elements immediately
    const clipsContainer = document.getElementById("clipsContainer");

/* =====================
   Sidebar Toggle Logic (Enhanced)
   ===================== */
function initSidebarToggle() {
    const sidebar = document.getElementById("mainSidebar");
    const toggleBtn = document.getElementById("sidebarToggle");
    
    if (!sidebar || !toggleBtn) {
        console.warn("Sidebar elements not found in HTML.");
        return;
    }

    toggleBtn.addEventListener("click", () => {
        sidebar.classList.toggle("collapsed");
        
        // Update arrow icon
        const isCollapsed = sidebar.classList.contains("collapsed");
        toggleBtn.innerHTML = isCollapsed ? "❯" : "❮";

        // CRITICAL: Tell the browser the window resized. 
        // This helps the Twitch Chat/Player realize the layout changed
        // and can clear the "obscured" error.
        window.dispatchEvent(new Event('resize'));
    });
}

/* =====================
   Following List (Auto-Detect: WHO I FOLLOW)
   ===================== */
async function initFollowingList() {
    const followingListEl = document.getElementById("followingList");
    const clientId = "gp762nuuoqcoxypju8c569th9wz7q5";
    const userToken = "v6cfob7r9ynjqyh8hbqnfgcpo0x4dq"; 

    if (!followingListEl) return;
    followingListEl.innerHTML = "<div style='padding:10px; font-size:11px; color:#adadb8;'>Loading follows...</div>";

    try {
        // 1. Get Your ID
        const userResp = await fetch(`https://api.twitch.tv/helix/users`, {
            headers: { "Client-ID": clientId, "Authorization": `Bearer ${userToken}` }
        });
        const userData = await userResp.json();
        if (!userData.data || userData.data.length === 0) throw new Error("Invalid User Token");
        const myId = userData.data[0].id;

        // 2. Get Followed Channels
        const followResp = await fetch(`https://api.twitch.tv/helix/channels/followed?user_id=${myId}&first=50`, {
            headers: { "Client-ID": clientId, "Authorization": `Bearer ${userToken}` }
        });
        const followData = await followResp.json();
        
        if (!followData.data || followData.data.length === 0) {
            followingListEl.innerHTML = "<div style='padding:10px; font-size:11px; color:#adadb8;'>No followed channels.</div>";
            return;
        }

        const broadcasterIds = followData.data.map(f => f.broadcaster_id);

        // 3. Get Details and Stream Status
        const [detailsResp, streamsResp] = await Promise.all([
            fetch(`https://api.twitch.tv/helix/users?id=${broadcasterIds.join('&id=')}`, {
                headers: { "Client-ID": clientId, "Authorization": `Bearer ${userToken}` }
            }),
            fetch(`https://api.twitch.tv/helix/streams?user_id=${broadcasterIds.join('&user_id=')}`, {
                headers: { "Client-ID": clientId, "Authorization": `Bearer ${userToken}` }
            })
        ]);

        const detailsData = await detailsResp.json();
        const streamsData = await streamsResp.json();
        const liveMap = {};
        streamsData.data.forEach(s => liveMap[s.user_id] = s);

        followingListEl.innerHTML = ""; 

        // 4. Sort: Live first
        const sortedList = detailsData.data.sort((a, b) => (liveMap[b.id] ? 1 : 0) - (liveMap[a.id] ? 1 : 0));

        // 5. Render
        sortedList.forEach(user => {
            const live = liveMap[user.id];
            const item = document.createElement("div");
            item.className = "channel-item";
            
            let vCount = live ? (live.viewer_count >= 1000 ? (live.viewer_count/1000).toFixed(1)+'K' : live.viewer_count) : "";

            item.innerHTML = `
                <div class="avatar-container">
                    <img src="${user.profile_image_url}" class="channel-avatar">
                </div>
                <div class="channel-info">
                    <div class="channel-top-row">
                        <span class="channel-name">${user.display_name}</span>
                        ${live ? `<span class="live-dot">● <span class="v-count">${vCount}</span></span>` : '<span class="offline-tag">Offline</span>'}
                    </div>
                    <span class="channel-game">${live ? live.game_name : "Offline"}</span>
                </div>
            `;

            item.onclick = () => window.open(`https://twitch.tv/${user.login}`, '_blank');
            followingListEl.appendChild(item);
        });

    } catch (err) {
        console.error("Sidebar Error:", err);
        followingListEl.innerHTML = "<div style='padding:10px; font-size:11px; color:#adadb8;'>Unable to load follows.</div>";
    }
}

                headers: { "Client-ID": clientId, "Authorization": `Bearer ${oauthToken}` }
            });
            const userData = await userResp.json();
            if (!userData.data || !userData.data.length) return;
            const user = userData.data[0];
            const userId = user.id;

            if (bioTextEl && user.description) bioTextEl.textContent = user.description;

            const avatarImg = document.querySelector('.bottom-avatar img');
            if (avatarImg && user.profile_image_url) avatarImg.src = user.profile_image_url;

            const followResp = await fetch(`https://api.twitch.tv/helix/channels/followers?broadcaster_id=${userId}`, {
                headers: { "Client-ID": clientId, "Authorization": `Bearer ${oauthToken}` }
            });
            const followData = await followResp.json();
            if (followerCountEl && followData.total !== undefined) followerCountEl.textContent = followData.total.toLocaleString(); 

            const channelResp = await fetch(`https://api.twitch.tv/helix/channels?broadcaster_id=${userId}`, {
                headers: { "Client-ID": clientId, "Authorization": `Bearer ${oauthToken}` }
            });
            const channelData = await channelResp.json();
            if (channelData.data && channelData.data[0]) {
                const channel = channelData.data[0];
                if (titleEl) titleEl.textContent = channel.title || "";
                if (gameEl) gameEl.textContent = channel.game_name || "";
            }

            const streamResp = await fetch(`https://api.twitch.tv/helix/streams?user_id=${userId}`, {
                headers: { "Client-ID": clientId, "Authorization": `Bearer ${oauthToken}` }
            });
            const streamData = await streamResp.json();
            const isLive = streamData.data && streamData.data.length > 0;

            liveIndicator.forEach(el => { if (el) el.style.display = isLive ? "inline-block" : "none"; });

            if (isLive) {
                const stream = streamData.data[0];
                updateViewers(stream.viewer_count || 0, true);
                const started = new Date(stream.started_at);
                streamSeconds = Math.floor((Date.now() - started.getTime()) / 1000);
                startTimer();
            } else {
                stopTimer();
                updateViewers(0, false);
            }
        } catch (err) {
            console.error("Twitch API error:", err);
        }
    }

    function startTimer() {
        if (interval) return;
        if (timerEl) timerEl.style.display = "inline";
        interval = setInterval(() => {
            streamSeconds++;
            const h = String(Math.floor(streamSeconds / 3600)).padStart(2, "0");
            const m = String(Math.floor((streamSeconds % 3600) / 60)).padStart(2, "0");
            const s = String(streamSeconds % 60).padStart(2, "0");
            if (timerEl) timerEl.textContent = `${h}:${m}:${s}`;
        }, 1000);
    }

    function stopTimer() {
        if (interval) clearInterval(interval);
        interval = null;
        streamSeconds = 0;
        if (timerEl) {
            timerEl.textContent = "00:00:00";
            timerEl.style.display = "none";
        }
    }

    function updateViewers(count, isLive) {
        if (viewerCountEl) {
            viewerCountEl.textContent = `👤 ${count}`;
            viewerCountEl.style.display = isLive ? "inline" : "none";
        }
    }

    checkLive();
    setInterval(checkLive, 30000);
}
</script>
