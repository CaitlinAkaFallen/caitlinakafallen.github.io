<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Pill Sub Alert</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap');
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { padding: 50px; background: transparent; font-family: 'Outfit', sans-serif; overflow: hidden; display: flex; align-items: flex-start; }

        #qna-container {
            display: flex; align-items: center; gap: 25px;
            opacity: 0; transform: translateX(-50px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        #qna-container.show { opacity: 1; transform: translateX(0); }

        .avatar-wrapper {
            width: 90px; height: 90px; border-radius: 50%;
            background: #111; border: 3px solid #ba68c8;
            box-shadow: 0 0 20px rgba(77, 245, 245, 0.4);
            overflow: hidden; transform: translateX(-300px) rotate(-720deg);
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.4, 1);
        }

        #qna-container.show .avatar-wrapper { transform: translateX(0) rotate(0deg); }

        .user-avatar { width: 100%; height: 100%; background-size: cover; background-position: center; }

        .glass-pill {
            background: rgba(15, 10, 25, 0.85); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
            border: 1px solid rgba(77, 245, 245, 0.3); border-radius: 20px;
            width: 450px; height: 0; padding: 0 30px; display: flex;
            align-items: center; justify-content: space-between;
            opacity: 0; transition: height 0.6s ease, opacity 0.3s ease;
        }

        #qna-container.show .glass-pill { height: 80px; opacity: 1; }

        .user-name { font-size: 1.1rem; font-weight: 700; color: #ffffff; text-shadow: 0 0 10px #ba68c8; }
        .stat-shard { background: rgba(186, 104, 200, 0.2); border: 1px solid #ba68c8; padding: 5px 12px; border-radius: 10px; text-align: center; }
        #badge-value { display: block; font-weight: 900; color: #fff; }
    </style>
</head>
<body>

    <div id="qna-container">
        <div class="avatar-wrapper"><div class="user-avatar" id="avatar"></div></div>
        <div class="content-column">
            <div style="margin-bottom:8px; padding:0 20px;">
                <div id="username" class="user-name">Warrior</div>
            </div>
            <div class="glass-pill">
                <div id="display-message" style="color: #4df5f5; font-style: italic; font-size: 0.9rem;">Joined the clan!</div>
                <div class="stat-shard">
                    <span id="badge-value">T1</span>
                    <span id="badge-label" style="font-size:0.6rem; color:#f06292; font-weight:700;">TIER</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);
        let hideTimer = null;

        ws.onopen = () => {
            ws.send(JSON.stringify({ request: "Subscribe", events: { general: ["Custom"] } }));
        };

        ws.onmessage = (event) => {
            const response = JSON.parse(event.data);
            // LISTEN ONLY FOR CRYSTAL SUB
            if (response.data && response.data.eventName === "CrystalSub") {
                updateUI(response.data);
            }
        };

        function updateUI(data) {
            const container = document.getElementById('qna-container');
            document.getElementById('username').innerText = data.user; 
            document.getElementById('display-message').innerText = data.message;
            document.getElementById('badge-value').innerText = data.badge;
            document.getElementById('badge-label').innerText = data.label;
            document.getElementById('avatar').style.backgroundImage = `url('${data.avatar}')`;

            if (hideTimer) clearTimeout(hideTimer);
            container.classList.remove('show'); 
            void container.offsetWidth; 
            container.classList.add('show');
            hideTimer = setTimeout(() => container.classList.remove('show'), 10000);
        }
    </script>
</body>
</html>
