<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tutorials – Submit Your Video</title>
  <style>
    /* Import Poppins */
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
  
    /* Body & Layout */
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #40f1fd, #9f51f8);
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
  
    .container {
      padding: 20px;
      max-width: 1200px;
      margin: 60px auto 40px;
    }
  
    h1 {
      font-size: 2.5rem;
      color: #fff;
      text-align: center;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
  
  /* Video Gallery Styling */
  #video-gallery {
                margin-top: 50px;
                text-align: center;
                width: 100%;
                overflow: hidden;
                padding-bottom: 50px;
            }

            #videos-list {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 20px;
                padding: 20px;
                max-width: 100%;
                box-sizing: border-box;
            }

            /* Individual Video Item Styling */
            #videos-list div {
                background: rgba(255, 255, 255, 0.2);
                backdrop-filter: blur(12px);
                padding: 18px;
                border-radius: 12px;
                box-shadow: 0px 6px 14px rgba(0, 0, 0, 0.15);
                transition: transform 0.3s ease-in-out;
                word-wrap: break-word;
                overflow: hidden;
                border: 2px solid #9c27b0;
            }

            #videos-list div:hover {
                transform: scale(1.03);
            }

            #videos-list h3 {
                margin: 10px 0;
                color: #6200ea;
                font-size: 18px;
                text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.4);
            }

            #videos-list video {
                width: 100%;
                border-radius: 12px;
                max-width: 100%;
                transition: transform 0.3s ease-in-out;
                border: 2px solid #9c27b0;
                margin-bottom: 10px;
            }

            #videos-list video:hover {
                transform: scale(1.02);
            }

            /* Responsive Adjustments */
            @media screen and (max-width: 768px) {
                #video-upload-form {
                    max-width: 100%;
                }

                #videos-list {
                    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                }
            }

            @media screen and (max-width: 480px) {
                #videos-list {
                    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                }
            }

            /* Animation for Fade-in */
            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(-20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            
</style>
<!-- Fancy Animated Circle Button -->
<a href="customer-view-art.html" class="circle-button">
    <span>Back</span>
</a>
  
</head>
<body>
  <div class="container">
    <h1>Time to Explore the Art Brain</h1>
    <p>Enjoy the  art time-lapse or video to showcase your creative process!</p>

    <!-- ► Form has been removed per your request ◄ -->

    <!-- On-page IndexedDB gallery -->
    <div id="video-gallery">
      <h2>Submitted Videos</h2>
      <div id="videos-list"></div>
    </div>

    <!-- localStorage gallery preview -->
    <div id="video-display-area">
      <h2>Submitted Videos</h2>
    </div>
  </div>

  <script>
    // === IndexedDB setup & helpers ===
    let currentEditingVideoId = null;
    const videosList  = document.getElementById("videos-list");
    const displayArea = document.getElementById("video-display-area");

    function initDB() {
      return new Promise((res, rej) => {
        const req = indexedDB.open("videoDB", 1);
        req.onupgradeneeded = e => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("videos")) {
            const store = db.createObjectStore("videos", { keyPath: "id", autoIncrement: true });
            store.createIndex("title", "title");
          }
        };
        req.onsuccess = e => res(e.target.result);
        req.onerror   = e => rej(e.target.error);
      });
    }

    async function saveVideoToDB(title, description, category, file) {
      return new Promise((res, rej) => {
        const reader = new FileReader();
        reader.readAsArrayBuffer(file);
        reader.onload = async () => {
          const db    = await initDB();
          const tx    = db.transaction("videos", "readwrite");
          const store = tx.objectStore("videos");
          const data  = { id: Date.now(), title, description, category, file: reader.result };
          const addReq = store.add(data);
          addReq.onsuccess = () => { loadVideos(); res(); };
          addReq.onerror   = e => rej(e);
        };
        reader.onerror = e => rej(e);
      });
    }

    async function loadVideos() {
      const db    = await initDB();
      const tx    = db.transaction("videos", "readonly");
      const store = tx.objectStore("videos");
      const getAll = store.getAll();
      getAll.onsuccess = () => {
        videosList.innerHTML = "";
        getAll.result.forEach(v => displayVideo(v.id, v.title, v.description, v.category, v.file));
      };
    }

    function displayVideo(id, title, description, category, fileData) {
      const div = document.createElement("div");
      div.className = "video-item";
      const blob = new Blob([fileData], { type: "video/mp4" });
      const url  = URL.createObjectURL(blob);
      div.innerHTML = `
        <h3>${title}</h3>
        <p>${description}</p>
        ${category ? `<p><em>Category:</em> ${category}</p>` : ""}
        <video controls src="${url}"></video>
      `;
      videosList.appendChild(div);
    }

    // === Render localStorage “submittedVideos” gallery ===
    function renderLocalStorageGallery() {
      displayArea.innerHTML = "";
      const stored = JSON.parse(localStorage.getItem("submittedVideos")) || [];
      if (!stored.length) {
        displayArea.innerHTML = "<p>No videos have been submitted yet.</p>";
      } else {
        stored.forEach(v => {
          const entry = document.createElement("div");
          entry.className = "video-entry";
          entry.innerHTML = `
            <h2>${v.title}</h2>
            <p><strong>Category:</strong> ${v.category}</p>
            <p>${v.description}</p>
            <video controls src="${v.videoURL}"></video>
          `;
          displayArea.appendChild(entry);
        });
      }
    }

    window.onload = () => {
      loadVideos();
      renderLocalStorageGallery();
    };
  </script>
</body>
</html>
