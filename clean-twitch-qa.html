<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Q&A Overlay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap');

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            padding: 50px;
            background: transparent;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
        }

        /* ═══════════════════════════════════════
        MAIN WRAPPER (The Container)
        ═══════════════════════════════════════ */
        #qna-container {
            display: inline-flex;
            align-items: center;
            position: relative;
            opacity: 0;
            transform: translateX(-50px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        #qna-container.show {
            opacity: 1;
            transform: translateX(0);
        }

        /* ═══════════════════════════════════════
        AVATAR (The "Anchor" of the container)
        ═══════════════════════════════════════ */
        .avatar-wrapper {
            position: relative;
            z-index: 3; 
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #111;
            border: 3px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            flex-shrink: 0;
            
            /* Version 1 Roll Animation */
            transform: translateX(-300px) rotate(-720deg);
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.4, 1), opacity 0.5s ease;
        }

        #qna-container.show .avatar-wrapper {
            transform: translateX(0) rotate(0deg);
        }

        .user-avatar {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        /* ═══════════════════════════════════════
        THE PILL BODY (The Glassmorphism Part)
        ═══════════════════════════════════════ */
        .pill-body {
            position: relative;
            z-index: 2;
            margin-left: -40px; /* TUCKS BEHIND THE AVATAR like V1 */
            
            /* Glassmorphism Styling */
            background: rgba(15, 20, 30, 0.7);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-left: none; /* Seamless connection */
            border-radius: 0 40px 40px 0;
            
            /* Expansion Animation */
            max-width: 0;
            min-height: 70px;
            display: flex;
            align-items: center;
            overflow: hidden;
            transition: max-width 0.9s cubic-bezier(0.16, 1, 0.3, 1), padding 0.9s ease, opacity 0.4s ease;
            padding: 0;
            opacity: 0;
        }

        #qna-container.expanded .pill-body {
            max-width: 800px;
            padding: 15px 40px 15px 55px; /* Large left padding to clear the avatar circle */
            opacity: 1;
        }

        /* ═══════════════════════════════════════
        TEXT CONTENT (V1 Structural Layout)
        ═══════════════════════════════════════ */
        .content-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            min-width: 300px;
            opacity: 0;
            transition: opacity 0.5s ease 0.4s; /* Fade in after pill expands */
        }

        #qna-container.expanded .content-wrapper {
            opacity: 1;
        }

        .top-row { 
            display: flex; 
            justify-content: flex-end; /* V1 Username placement */
            margin-bottom: 2px;
        }

        .user-label {
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: #64ffda;
            text-transform: uppercase;
            font-weight: 700;
        }

        .user-name {
            font-size: 0.85rem;
            font-weight: 700;
            color: #ccd6f6;
            margin-left: 10px;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 500;
            color: #ffffff;
            line-height: 1.3;
            white-space: normal;
        }

        .bottom-row { 
            display: flex; 
            justify-content: flex-end; /* V1 Timestamp placement */
            margin-top: 4px;
        }

        .time-stamp {
            font-size: 0.65rem;
            font-weight: 300;
            color: #58ebde;
        }

        /* Gold Theme for Thank You Alerts */
        #qna-container.thanks .user-label { color: #ffaa00; }
        #qna-container.thanks .avatar-wrapper { border-color: #ffaa00; }
    </style>
</head>
<body>

<div id="qna-container">
    <div class="avatar-wrapper">
        <div class="user-avatar" id="avatar"></div>
    </div>
    
    <div class="pill-body">
        <div class="content-wrapper">
            <div class="top-row">
                <span class="user-label" id="label-text">Inquiry From</span>
                <span class="user-name" id="username">userName</span>
            </div>
            
            <div class="question-text" id="content-text">
                Question content goes here...
            </div>
            
            <div class="bottom-row">
                <span class="time-stamp" id="time">00:00 PM</span>
            </div>
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);

    let resetTimer = null;

    ws.onopen = () => {
        ws.send(JSON.stringify({ request: "Subscribe", events: { general: ["Custom"] }, id: "TwitchQAS" }));
    };

    ws.onmessage = (event) => {
        const response = JSON.parse(event.data);
        const d = response.data || response;

        if (d.eventName === "questionAlert" || d.eventName === "thankYouAlert") {
            triggerAlert(d);
        }
    };

    function triggerAlert(data) {
        const container = document.getElementById('qna-container');
        
        // Reset state
        if (resetTimer) clearTimeout(resetTimer);
        container.classList.remove('show', 'expanded', 'thanks');
        void container.offsetWidth; // Force Reflow

        // Set Dynamic Data
        document.getElementById('username').innerText = data.user;
        document.getElementById('avatar').style.backgroundImage = `url('${data.avatar}')`;
        document.getElementById('time').innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        if (data.eventName === "thankYouAlert") {
            container.classList.add('thanks');
            document.getElementById('label-text').innerText = "Appreciation From";
            document.getElementById('content-text').innerText = "Thank you for the wonderful question!";
        } else {
            document.getElementById('label-text').innerText = "Inquiry From";
            document.getElementById('content-text').innerText = data.message;
        }

        // Animation Sequence: Roll-in then Expand
        container.classList.add('show'); 
        
        setTimeout(() => {
            container.classList.add('expanded');
        }, 800);

        // Auto-hide after 15 seconds
        resetTimer = setTimeout(() => {
            container.classList.remove('expanded');
            setTimeout(() => container.classList.remove('show'), 900);
        }, 15000);
    }
</script>
</body>
</html>
