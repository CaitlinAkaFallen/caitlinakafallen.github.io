          <script>
     // Allowed domains for Twitch embed parent paramMore actions
      const allowedParents = ['localhost', 'caitlinscreativespace.com', 'caitlinakafallen.github.io'];

        // Detect current domain or fallback
        const domain = window.location.hostname;
        const parentDomain = allowedParents.includes(domain) ? domain : 'localhost';

        console.log('Current domain:', domain);
        console.log('Using Twitch embed parent:', parentDomain);

        // Twitch Embed player setup with proper parent param
        const twitchPlayer = new Twitch.Player("twitch-player", {
          channel: "fallenoneart",
          width: 800,
          height: 450,
          parent: allowedParents,
          autoplay: false,
        });
        twitchPlayer.setVolume(0.5);

        // Dynamically set Twitch Chat iframe src with correct parent
        (function () {
          const iframe = document.getElementById('twitch-chat-embed');
          if (iframe) {
            iframe.src = `https://www.twitch.tv/embed/fallenoneart/chat?parent=${parentDomain}&theme=dark`;
          }
      })();

        // Twitch API credentials
        const clientId = '08nkuo02qic2pa729foara0287b49x';
        const oauthToken = 'puk4c4jle2hdkakbm6zmxpadjwhwu1';
        const username = 'fallenoneart';

        // Title & Game display elements
        const titleEl = document.getElementById("streamTitle");
        const gameEl = document.getElementById("streamGame");

        // Twitch Live Check using OAuth token and client ID
        async function checkTwitchLive() {
          try {
            const resp = await fetch(`https://api.twitch.tv/helix/streams?user_login=${username}`, {
              headers: {
                "Client-ID": clientId,
                "Authorization": `Bearer ${oauthToken}`
              }
            });
            const { data } = await resp.json();
            const isLive = data && data.length > 0;

            const liveEl = document.getElementById("twitch-live");
            if (liveEl) liveEl.classList.toggle("live", isLive);

            if (isLive) {
              const stream = data[0];
              updateViewerCount(stream.viewer_count || 0);

              // Set title & game
              if (titleEl) titleEl.textContent = ` ${stream.title}`;
              if (gameEl) gameEl.textContent = ` ${stream.game_name}`;

              // Calculate seconds since stream started
              const startedAt = new Date(stream.started_at);
              streamSeconds = Math.floor((Date.now() - startedAt.getTime()) / 1000);
              startStreamTimer();
            } else {
              stopStreamTimer();
              updateViewerCount(0);

              // Not live fallback text
              if (titleEl) titleEl.textContent = "Not Live";
              if (gameEl) gameEl.textContent = "";
            }

          } catch (e) {
            console.error("Error checking Twitch live status:", e);
            stopStreamTimer();
            updateViewerCount(0);
            if (titleEl) titleEl.textContent = "Not Live";
            if (gameEl) gameEl.textContent = "";
          }
        }

        // YouTube Live Check (unchanged)
        async function checkYouTubeLive() {
          try {
            const apiKey = "109546453641-rppq2bcferlo9or60730io15lk34vg03.apps.googleusercontent.com";
            const channelId = "UCvbVbJh3CWljgXGSBuT1wAQ";

            const resp = await fetch(
              `https://www.googleapis.com/youtube/v3/search?part=id&channelId=${channelId}&eventType=live&type=video&key=${apiKey}`
            );
            const { items } = await resp.json();

            document.getElementById("youtube-live")
              ?.classList.toggle("live", items && items.length > 0);
          } catch (e) {
            console.error("Error checking YouTube live status:", e);
          }
        }

        // Stream Timer Logic
        let streamSeconds = 0;
        let streamInterval = null;
        const streamTimerEl = document.getElementById("streamTimer");

        function startStreamTimer() {
          if (streamInterval) return; // prevent multiple intervals
          streamTimerEl.style.display = "inline"; // show timer when live
          streamInterval = setInterval(() => {
            streamSeconds++;
            const hrs = String(Math.floor(streamSeconds / 3600)).padStart(2, '0');
            const mins = String(Math.floor((streamSeconds % 3600) / 60)).padStart(2, '0');
            const secs = String(streamSeconds % 60).padStart(2, '0');
            if (streamTimerEl) {
              streamTimerEl.textContent = ` ${hrs}:${mins}:${secs}`;
            }
          }, 1000);
        }


        function stopStreamTimer() {
          if (streamInterval) clearInterval(streamInterval);
          streamInterval = null;
          streamSeconds = 0;
          if (streamTimerEl) {
            streamTimerEl.textContent = ` 00:00:00`;
            streamTimerEl.style.display = "none"; // hide timer when not live
          }
        }


        // Viewer Count Logic
        const viewerCountEl = document.getElementById("viewerCount");

        function updateViewerCount(count) {
          if (viewerCountEl) {
            viewerCountEl.textContent = `👤 ${count}`;
          }
        }

        // Initial check + refresh every 15s
        checkTwitchLive();
        checkYouTubeLive();
        setInterval(checkTwitchLive, 15000);
        setInterval(checkYouTubeLive, 15000);

    </script>
