<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FallenOneArt | Twitch Lounge</title>
<meta name="description" content="Watch FallenOneArt live on Twitch, see who you follow, and browse clips and categories." />

<link rel="icon" href="images/favicon.ico" type="image/x-icon" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
 <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" rel="stylesheet"/>

<style>
  :root {
    --bg: #07060d;
    --twitch: #9146ff;
    --twitch-hi: #bf94ff;
    --red: #eb0400;
    --aqua: #4ae4e9;
    --ink: #efeff1;
    --muted: #adadb8;
    --glass: rgba(255, 255, 255, 0.05);
    --glass-strong: rgba(14, 12, 24, 0.7);
    --line: rgba(255, 255, 255, 0.09);
    --radius: 18px;
    --ease: cubic-bezier(.2, .7, .2, 1);
    --top: 68px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    color: var(--ink);
    background:
      linear-gradient(rgba(7, 6, 13, .45), rgba(7, 6, 13, .7)),
      url("images/main-page.JPG") center / cover fixed no-repeat;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed; inset: -20%; z-index: -2;
    background:
      radial-gradient(40% 35% at 10% 15%, rgba(145, 70, 255, .30), transparent 60%),
      radial-gradient(35% 30% at 90% 10%, rgba(0, 168, 255, .18), transparent 60%),
      radial-gradient(45% 40% at 60% 95%, rgba(190, 46, 221, .18), transparent 60%);
    filter: blur(40px);
    animation: drift 24s ease-in-out infinite alternate;
  }
  body::after {
    content: "";
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
  }
  @keyframes drift { to { transform: translate3d(3%, -2%, 0) scale(1.05); } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes ping {
    0% { box-shadow: 0 0 0 0 rgba(235,4,0,.7); }
    70% { box-shadow: 0 0 0 8px rgba(235,4,0,0); }
    100% { box-shadow: 0 0 0 0 rgba(235,4,0,0); }
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: var(--top);
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 0 18px; gap: 12px;
    background: var(--glass-strong);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 10px 30px rgba(0,0,0,.3);
  }
  .brand {
    display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; min-width: 0;
  }
  .brand .logo {
    width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0;
    background: linear-gradient(135deg, var(--twitch), #00a8ff);
    box-shadow: 0 6px 18px rgba(145,70,255,.4);
  }
  .brand .logo svg { width: 18px; height: 18px; }
  .brand .name { font-family: "Orbitron", sans-serif; font-weight: 800; font-size: .95rem; letter-spacing: .04em; white-space: nowrap; }
  .brand .name em { font-style: normal; color: var(--twitch-hi); }

  .nav { display: flex; gap: 4px; padding: 5px; border-radius: 999px; background: rgba(255,255,255,.04); border: 1px solid var(--line); }
  .nav a {
    width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
    color: var(--muted); text-decoration: none; position: relative;
    transition: color .25s, background .25s, transform .25s var(--ease);
  }
  .nav a:hover { color: #fff; background: rgba(255,255,255,.08); transform: translateY(-2px); }
  .nav a[aria-current="page"] { color: var(--twitch-hi); background: rgba(145,70,255,.18); }
  .nav a[data-s="youtube"]:hover { color: #ff4d4d; }
  .nav a[data-s="schedule"]:hover { color: #ff6ec4; }
  .nav a[data-s="commands"]:hover { color: #00bfae; }
  .nav svg { width: 19px; height: 19px; }

  .login-wrap { display: flex; justify-content: flex-end; }
  .login {
    height: 40px; display: inline-flex; align-items: center; gap: 10px; padding: 0 16px 0 5px;
    border-radius: 999px; cursor: pointer; font: inherit; font-size: .88rem; font-weight: 600; color: #fff;
    background: rgba(145,70,255,.12); border: 1px solid rgba(145,70,255,.45);
    transition: background .2s, box-shadow .2s, transform .2s var(--ease);
  }
  .login:hover { background: rgba(145,70,255,.3); box-shadow: 0 0 18px rgba(145,70,255,.3); transform: translateY(-1px); }
  .avatar-sm {
    width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(255,255,255,.08) center / cover no-repeat; color: var(--muted); font-size: .85rem;
  }
  .avatar-sm.has-img { background-color: transparent; }
  .login .u { max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- Layout ---------- */
  .layout {
    display: grid;
    grid-template-columns: 260px minmax(0, 1fr) 340px;
    gap: 16px;
    padding: calc(var(--top) + 18px) 16px 24px;
    align-items: start;
    transition: grid-template-columns .35s var(--ease);
  }
  .layout.collapsed { grid-template-columns: 64px minmax(0, 1fr) 340px; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    position: sticky; top: calc(var(--top) + 18px);
    height: calc(100vh - var(--top) - 42px);
    overflow-y: auto; scrollbar-width: none;
    padding: 14px 12px;
    border-radius: var(--radius);
    background: var(--glass);
    border: 1px solid var(--line);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .sidebar::-webkit-scrollbar { display: none; }
  .side-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .side-title { font-family: "Fira Code", monospace; font-size: .7rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .icon-btn {
    width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; cursor: pointer;
    background: rgba(255,255,255,.04); border: 1px solid var(--line); color: var(--muted); font: inherit;
    transition: color .2s, background .2s;
  }
  .icon-btn:hover { color: #fff; background: rgba(255,255,255,.1); }

  .sec { margin-top: 14px; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 6px 8px; }
  .sec-head h3 { margin: 0; font-size: .82rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink); }
  .sec-head small { color: var(--muted); font-size: .74rem; }

  .row {
    display: flex; align-items: center; gap: 11px; padding: 7px 8px; border-radius: 12px;
    text-decoration: none; color: inherit; cursor: pointer; background: none; border: 0; width: 100%; font: inherit; text-align: left;
    transition: background .2s, transform .2s var(--ease);
  }
  .row:hover { background: rgba(255,255,255,.07); transform: translateX(2px); }
  .av-wrap { position: relative; flex-shrink: 0; }
  .av { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: #2c2c2f; display: block; }
  .live-tick {
    position: absolute; right: -2px; bottom: -2px; width: 11px; height: 11px; border-radius: 50%;
    background: var(--red); border: 2px solid #15131d;
  }
  .meta { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .nm { font-size: .88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gm { font-size: .76rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vc { font-size: .76rem; color: var(--ink); font-weight: 600; flex-shrink: 0; display: inline-flex; align-items: center; gap: 5px; }
  .vc::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--red); animation: ping 1.6s infinite; }
  .row.cat .av { border-radius: 8px; width: 38px; height: 38px; }

  .more { display: flex; justify-content: space-between; padding: 6px 6px 0; }
  .more button {
    background: none; border: 0; color: var(--twitch-hi); font: inherit; font-size: .78rem; font-weight: 600; cursor: pointer; padding: 4px 2px;
  }
  .more button:hover { color: #fff; text-decoration: underline; }
  .empty-note {
    margin: 4px 6px 6px; padding: 14px; border-radius: 12px; font-size: .8rem; color: var(--muted);
    background: rgba(145,70,255,.08); border: 1px dashed rgba(145,70,255,.35); line-height: 1.5;
  }
  .empty-note a { color: var(--twitch-hi); }

  .layout.collapsed .txt { display: none; }
  .layout.collapsed .sidebar { padding: 10px 6px; }
  .layout.collapsed .row { justify-content: center; padding: 6px 0; }
  .layout.collapsed .row:hover { transform: none; }
  .layout.collapsed .more, .layout.collapsed .empty-note { display: none; }
  .layout.collapsed .side-top { justify-content: center; }
  .layout.collapsed .sec-head { justify-content: center; padding: 0 0 6px; }

  /* ---------- Main ---------- */
  .main { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .player-frame {
    position: relative; aspect-ratio: 16 / 9; width: 100%;
    border-radius: 20px; overflow: hidden; background: #000;
    border: 1px solid var(--line);
    box-shadow: 0 0 0 1px rgba(145,70,255,.15), 0 26px 60px rgba(0,0,0,.55);
    transition: box-shadow .4s var(--ease), border-color .4s;
  }
  .player-frame:hover { border-color: rgba(145,70,255,.45); box-shadow: 0 0 0 1px rgba(145,70,255,.3), 0 26px 70px rgba(145,70,255,.15); }
  #twitch-player { width: 100%; height: 100%; }
  #twitch-player iframe { width: 100%; height: 100%; border: 0; }
  .live-badge {
    position: absolute; top: 14px; left: 14px; z-index: 2;
    padding: 5px 10px; border-radius: 6px; font-size: .72rem; font-weight: 800; letter-spacing: .1em;
    background: var(--red); color: #fff; box-shadow: 0 0 14px rgba(235,4,0,.5);
    animation: ping 1.6s infinite;
    pointer-events: none;
  }

  .info {
    display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
    padding: 16px 18px; border-radius: var(--radius);
    background: var(--glass); border: 1px solid var(--line);
  }
  .ring {
    width: 60px; height: 60px; border-radius: 50%; padding: 2px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--twitch), #00a8ff);
    box-shadow: 0 6px 20px rgba(145,70,255,.35);
  }
  .ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; background: #15131d; }
  .info-main { flex: 1; min-width: 200px; }
  .info-main h1 { margin: 0; font-size: 1.15rem; font-weight: 800; }
  .info-title { margin: 4px 0 8px; color: #e4e4ea; font-size: .92rem; overflow-wrap: anywhere; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
    font-size: .76rem; font-weight: 600; color: var(--twitch-hi); background: rgba(145,70,255,.12); border: 1px solid rgba(145,70,255,.3);
  }
  .stats { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: 999px; font-size: .84rem; font-weight: 600;
    background: rgba(0,0,0,.35); border: 1px solid var(--line);
  }
  .pill.off { color: var(--muted); }
  .pill.on { color: #ffd6d6; border-color: rgba(235,4,0,.5); }
  .pill.on .d { background: var(--red); box-shadow: 0 0 8px var(--red); animation: ping 1.6s infinite; }
  .pill .d { width: 8px; height: 8px; border-radius: 50%; background: #555; }
  .btn-follow {
    display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; text-decoration: none;
    color: #fff; font-weight: 700; font-size: .86rem; background: var(--twitch);
    box-shadow: 0 8px 22px rgba(145,70,255,.35); transition: transform .2s var(--ease), box-shadow .2s;
  }
  .btn-follow:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(145,70,255,.5); }

  .glass { background: var(--glass); border: 1px solid var(--line); border-radius: var(--radius); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .about { padding: 18px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
  .about h3, .clips-head h3 { margin: 0 0 8px; font-size: .82rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; }
  .about p { margin: 0; line-height: 1.6; color: #d9d9e0; overflow-wrap: anywhere; }
  .followers { font-family: "Orbitron", sans-serif; font-size: 1.3rem; font-weight: 800; color: #fff; margin-bottom: 8px; display: block; }
  .links { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; align-content: start; }
  .link {
    display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-radius: 12px; text-decoration: none;
    color: var(--ink); font-size: .86rem; font-weight: 600; background: rgba(255,255,255,.04); border: 1px solid var(--line);
    transition: transform .2s var(--ease), border-color .2s, color .2s, background .2s;
  }
  .link:hover { transform: translateY(-2px); background: rgba(255,255,255,.08); }
  .link.tw:hover { color: #a970ff; border-color: rgba(169,112,255,.6); }
  .link.yt:hover { color: #ff4d4d; border-color: rgba(255,77,77,.6); }
  .link.th:hover { color: #fcf484; border-color: rgba(252,244,132,.6); }
  .link.ig:hover { color: #f06292; border-color: rgba(240,98,146,.6); }
  .link.kf:hover { color: #59d5ff; border-color: rgba(89,213,255,.6); }

  .clips { padding: 18px; }
  .clips-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .clips-head h3 { margin: 0; }
  .toggle {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; cursor: pointer; font: inherit; font-size: .84rem; font-weight: 600;
    color: var(--ink); background: rgba(255,255,255,.04); border: 1px solid var(--line); transition: background .2s, border-color .2s;
  }
  .toggle:hover { background: rgba(255,255,255,.09); border-color: rgba(145,70,255,.5); }
  .toggle svg { width: 14px; height: 14px; transition: transform .3s var(--ease); }
  .toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
  .clips-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-top: 16px; }
  .clip { aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #000; border: 1px solid var(--line); transition: transform .3s var(--ease), border-color .3s; }
  .clip:hover { transform: translateY(-3px); border-color: rgba(145,70,255,.5); }
  .clip iframe { width: 100%; height: 100%; border: 0; display: block; }

  /* ---------- Chat ---------- */
  .chat-col {
    position: sticky; top: calc(var(--top) + 18px);
    height: calc(100vh - var(--top) - 42px);
    display: flex; flex-direction: column; overflow: hidden;
    border-radius: var(--radius); border: 1px solid var(--line); background: #000;
    box-shadow: 0 20px 50px rgba(0,0,0,.4);
  }
  .chat-head {
    display: flex; align-items: center; justify-content: space-between; padding: 12px 14px;
    background: var(--glass-strong); border-bottom: 1px solid var(--line);
    font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted);
  }
  .chat-head .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--twitch); margin-right: 8px; box-shadow: 0 0 8px var(--twitch); }
  #twitch-chat { flex: 1; width: 100%; border: 0; background: #000; }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); z-index: 300;
    padding: 11px 18px; border-radius: 12px; font-size: .9rem; color: #fff;
    background: rgba(12,10,22,.92); border: 1px solid rgba(145,70,255,.5); box-shadow: 0 10px 30px rgba(0,0,0,.4);
    opacity: 0; pointer-events: none; transition: opacity .3s, transform .35s var(--ease);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Responsive ---------- */
  @media (max-width: 1280px) {
    .layout { grid-template-columns: 240px minmax(0, 1fr); }
    .layout.collapsed { grid-template-columns: 64px minmax(0, 1fr); }
    .chat-col { grid-column: 2; position: static; height: 460px; }
    .sidebar { grid-row: 1 / span 2; }
  }
  @media (max-width: 1000px) {
    .about { grid-template-columns: 1fr; }
  }
  @media (max-width: 860px) {
    :root { --top: 110px; }
    .topbar { grid-template-columns: 1fr auto; grid-template-rows: auto auto; padding: 10px 14px; row-gap: 8px; height: auto; }
    .brand { grid-column: 1; }
    .login-wrap { grid-column: 2; grid-row: 1; }
    .nav { grid-column: 1 / -1; grid-row: 2; justify-self: center; }
    .layout { grid-template-columns: 1fr; padding-top: calc(var(--top) + 12px); }
    .layout.collapsed { grid-template-columns: 1fr; }
    .sidebar { position: static; height: auto; grid-row: auto; }
    .chat-col { grid-column: 1; position: static; height: 480px; }
  }
  @media (max-width: 520px) {
    .brand .name { display: none; }
    .login .u { display: none; }
    .login { padding: 0 6px 0 5px; }
    .nav a { width: 38px; height: 38px; }
    .info { padding: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<!-- ========== Top bar ========== -->
<header class="topbar">
  <a class="brand" href="twitch.html" aria-label="FallenOneArt Twitch Lounge home">
    <span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 2 2 6v15h5v3h3l3-3h4l5-5V2zm16 11-3 3h-5l-3 3v-3H6V4h14z" fill="#fff"/><path d="M15 7h2v5h-2zM10 7h2v5h-2z" fill="#fff"/></svg></span>
    <span class="name">FallenOne<em>Art</em></span>
  </a>

  <nav class="nav" aria-label="Site navigation">
    <a href="schedule.html" data-s="schedule" title="Schedule" aria-label="Schedule">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </a>
    <a href="stream-commands.html" data-s="commands" title="Commands" aria-label="Commands">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v11l-5 5H4z M15 20v-5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    </a>
    <a href="twitch.html" data-s="twitch" title="Twitch" aria-label="Twitch" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 2 2 6v15h5v3h3l3-3h4l5-5V2zm16 11-3 3h-5l-3 3v-3H6V4h14z" fill="currentColor"/><path d="M15 7h2v5h-2zM10 7h2v5h-2z" fill="currentColor"/></svg>
    </a>
    <a href="youtube.html" data-s="youtube" title="YouTube" aria-label="YouTube">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4" fill="currentColor"/><path d="M10 9v6l5-3z" fill="#0b0b12"/></svg>
    </a>
  </nav>

  <div class="login-wrap">
    <button id="loginBtn" class="login" type="button">
      <span id="avatar" class="avatar-sm"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" id="userIcon"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6" fill="currentColor"/></svg></span>
      <span class="u" id="username">Log in</span>
    </button>
  </div>
</header>

<div class="layout" id="layout">

  <!-- ========== Sidebar ========== -->
  <aside class="sidebar" id="sidebar" aria-label="Channels and categories">
    <div class="side-top">
      <span class="side-title txt">Browse</span>
      <button class="icon-btn" id="sidebarToggle" type="button" aria-label="Collapse sidebar">‹</button>
    </div>

    <section class="sec">
      <div class="sec-head"><h3 class="txt">Followed</h3><small class="txt" id="followedCount"></small></div>
      <div id="followingList"></div>
      <div class="more txt">
        <button type="button" data-more="followed" hidden>Show more</button>
        <button type="button" data-less="followed" hidden>Show less</button>
      </div>
    </section>

    <section class="sec">
      <div class="sec-head"><h3 class="txt">Live now</h3><small class="txt" id="liveCount"></small></div>
      <div id="liveList"></div>
      <div class="more txt">
        <button type="button" data-more="live" hidden>Show more</button>
        <button type="button" data-less="live" hidden>Show less</button>
      </div>
    </section>

    <section class="sec">
      <div class="sec-head"><h3 class="txt">Categories</h3></div>
      <div id="catList"></div>
      <div class="more txt">
        <button type="button" data-more="cats" hidden>Show more</button>
        <button type="button" data-less="cats" hidden>Show less</button>
      </div>
    </section>
  </aside>

  <!-- ========== Main ========== -->
  <main class="main">
    <div class="player-frame">
      <span class="live-badge" id="liveBadge" hidden>LIVE</span>
      <div id="twitch-player"></div>
    </div>

    <section class="info">
      <div class="ring"><img id="streamerAvatar" alt="FallenOneArt profile picture" src="https://static-cdn.jtvnw.net/jtv_user_pictures/bb91b174-8cb2-4bf8-8416-67c645b333f3-profile_image-70x70.png" /></div>
      <div class="info-main">
        <h1>FallenOneArt</h1>
        <p class="info-title" id="streamTitle">Loading stream…</p>
        <span class="chip" id="streamGame">—</span>
      </div>
      <div class="stats">
        <span class="pill off" id="statusPill"><span class="d"></span><span id="statusText">Checking…</span></span>
        <span class="pill off" id="viewerCount" hidden>👤 <span id="viewerNum">0</span></span>
        <span class="pill off" id="streamTimer" hidden>00:00:00</span>
        <a class="btn-follow" href="https://www.twitch.tv/fallenoneart" target="_blank" rel="noopener noreferrer">
          <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 2 2 6v15h5v3h3l3-3h4l5-5V2zm16 11-3 3h-5l-3 3v-3H6V4h14z" fill="currentColor"/></svg>
          Follow on Twitch
        </a>
      </div>
    </section>

    <section class="about glass">
      <div>
        <h3>About</h3>
        <span class="followers"><span id="followerCount">0</span> followers</span>
        <p id="bioText">Loading bio…</p>
      </div>
      <div>
        <h3>Links</h3>
        <div class="links">
          <a class="link tw" href="https://www.twitch.tv/fallenpool_bot" target="_blank" rel="noopener noreferrer"><i class="fab fa-twitch"></i> Bot account</a>
          <a class="link yt" href="https://www.youtube.com/@caitlinakafallen" target="_blank" rel="noopener noreferrer"><i class="fab fa-youtube"></i> YouTube</a>
          <a class="link th" href="https://throne.com/caitlinakafallen" target="_blank" rel="noopener noreferrer"><i class="fas fa-scroll"></i> Throne</a>
          <a class="link ig" href="https://www.instagram.com/caitlinakafallen/" target="_blank" rel="noopener noreferrer"><i class="fab fa-instagram"></i> Instagram</a>
          <a class="link kf" href="https://ko-fi.com/caitlinakafallen" target="_blank" rel="noopener noreferrer"><i class="fas fa-mug-hot"></i> Ko-fi</a>
        </div>
      </div>
    </section>

    <section class="clips glass">
      <div class="clips-head">
        <h3>Recent clips</h3>
        <button class="toggle" id="clipsToggle" type="button" aria-expanded="false" aria-controls="clipsBody">
          <span>Show clips</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div id="clipsBody" class="clips-grid" hidden></div>
    </section>
  </main>

  <!-- ========== Chat ========== -->
  <aside class="chat-col" aria-label="Live chat">
    <div class="chat-head"><span><span class="dot"></span>Live chat</span></div>
    <iframe id="twitch-chat" title="Twitch chat"></iframe>
  </aside>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://player.twitch.tv/js/embed/v1.js"></script>
<script>
(() => {
  "use strict";

  /* =========================================================
     CONFIG — paste your app credentials here.
     - loginClientId is the public client ID used for "Log in with Twitch".
     - appClientId / appToken power the public data (live list, categories,
       stream info). Rotate the old token; keys in public JS are visible.
     ========================================================= */
  const CONFIG = {
    channel: "fallenoneart",
    loginClientId: "iv3dicfghd1hflqzzysljadc8mw1sa",
    redirectUri: "https://caitlinscreativespace.xyz/twitch.html",
    scope: "user:read:email user:read:follows",
    appClientId: "gp762nuuoqcoxypju8c569th9wz7q5",
    appToken: "0s89vmye9hk95jiifrpion53n6cy9p",
    pageSize: 12,
    streamRefreshMs: 30_000,
    listRefreshMs: 60_000
  };

  const CLIPS = [
    "ArbitraryFrigidDiscBabyRage-Y5h_dBp0jr3J373d",
    "EndearingInspiringStinkbugYouWHY-7-ukExW7FN-dX_dk",
    "ThirstyOptimisticTrollFeelsBadMan-VCPPKHW3DaUw9xtT",
    "SlipperySquareKumquatPoooound-gFEPFF5mTYtRKa-i",
    "CalmGleamingFriseeBatChest-yQy2hvT4qq9Nca6c"
  ];

  const DEFAULT_AVATAR = "https://static-cdn.jtvnw.net/user-default-pictures-uv/ce577150-75ef-4ed3-b3d3-f6f4df39455d-profile_image-70x70.png";
  const PARENT = (location.hostname && location.hostname !== "127.0.0.1") ? location.hostname : "localhost";
  const TWITCH = "https://api.twitch.tv/helix/";

  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const isSet = v => !!v && !String(v).startsWith("PASTE");
  const fmtViewers = n => n >= 1000 ? (n / 1000).toFixed(1) + "K" : String(n);
  const hms = total => [Math.floor(total / 3600), Math.floor((total % 3600) / 60), total % 60].map(n => String(n).padStart(2, "0")).join(":");

  const state = {
    user: null, selfId: null, followedIds: new Set(),
    followed: [], live: [], cats: [], avatars: {},
    shown: { followed: CONFIG.pageSize, live: CONFIG.pageSize, cats: CONFIG.pageSize },
    startedAt: null, clipsBuilt: false
  };

  /* ---------- Toast ---------- */
  let toastTimer;
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
  }

  /* ---------- API helpers ---------- */
  async function api(url, clientId, token) {
    const r = await fetch(url, { headers: { "Client-ID": clientId, "Authorization": "Bearer " + token } });
    if (!r.ok) throw new Error(String(r.status));
    return r.json();
  }
  async function fetchAll(url, clientId, token) {
    let out = [], cursor = null;
    do {
      const sep = url.includes("?") ? "&" : "?";
      const data = await api(url + (cursor ? `${sep}after=${cursor}` : ""), clientId, token);
      out = out.concat(data.data || []);
      cursor = data.pagination?.cursor || null;
    } while (cursor);
    return out;
  }
  /* Public data uses app creds when set, otherwise the logged-in user's token */
  function publicAuth() {
    if (isSet(CONFIG.appClientId) && isSet(CONFIG.appToken)) return [CONFIG.appClientId, CONFIG.appToken];
    if (state.user?.token) return [CONFIG.loginClientId, state.user.token];
    return null;
  }

  /* ---------- Login ---------- */
  function loadUser() {
    try { return JSON.parse(localStorage.getItem("twitchUser")); } catch { return null; }
  }
  function renderUser(u) {
    const av = $("#avatar"), nm = $("#username"), ic = $("#userIcon");
    if (u) {
      av.style.backgroundImage = `url("${u.avatar}")`;
      av.classList.add("has-img");
      ic.style.display = "none";
      nm.textContent = u.username;
    } else {
      av.style.backgroundImage = "";
      av.classList.remove("has-img");
      ic.style.display = "";
      nm.textContent = "Log in";
    }
  }
  function startLogin() {
    location.href = "https://id.twitch.tv/oauth2/authorize?response_type=token" +
      `&client_id=${CONFIG.loginClientId}` +
      `&redirect_uri=${encodeURIComponent(CONFIG.redirectUri)}` +
      `&scope=${encodeURIComponent(CONFIG.scope)}`;
  }
  function logout(message) {
    localStorage.removeItem("twitchUser");
    state.user = null; state.selfId = null; state.followedIds = new Set(); state.followed = [];
    renderUser(null);
    renderFollowed();
    loadPublic();
    if (message) toast(message);
  }
  async function saveUserFromToken(token) {
    try {
      const r = await api(TWITCH + "users", CONFIG.loginClientId, token);
      const u = r.data?.[0];
      if (!u) throw new Error("no user");
      const saved = { username: u.display_name, avatar: u.profile_image_url, id: u.id, token };
      localStorage.setItem("twitchUser", JSON.stringify(saved));
      state.user = saved;
      renderUser(saved);
      await loadFollowing();
      await loadPublic();
      toast(`Logged in as ${saved.username}`);
    } catch (e) {
      console.error("Login failed:", e);
      toast("Login failed. Please try again.");
    }
  }
  function handleHashToken() {
    const token = new URLSearchParams(location.hash.slice(1)).get("access_token");
    if (!token) return false;
    history.replaceState({}, document.title, location.pathname + location.search);
    saveUserFromToken(token);
    return true;
  }

  $("#loginBtn").addEventListener("click", () => {
    if (state.user) logout("Logged out");
    else startLogin();
  });

  /* ---------- Followed channels (needs login) ---------- */
  async function loadFollowing() {
    if (!state.user?.token) { renderFollowed(); return; }
    const { id, token } = state.user;
    state.selfId = id;
    try {
      const [live, follows] = await Promise.all([
        fetchAll(`${TWITCH}streams/followed?user_id=${id}&first=100`, CONFIG.loginClientId, token),
        fetchAll(`${TWITCH}channels/followed?user_id=${id}&first=100`, CONFIG.loginClientId, token)
      ]);
      const liveMap = new Map(live.map(s => [s.user_id, s]));
      state.followed = follows.map(f => ({
        id: f.broadcaster_id, name: f.broadcaster_name, login: f.broadcaster_login,
        live: liveMap.get(f.broadcaster_id) || null
      })).sort((a, b) =>
        (b.live ? 1 : 0) - (a.live ? 1 : 0) ||
        (b.live?.viewer_count || 0) - (a.live?.viewer_count || 0) ||
        a.name.localeCompare(b.name));
      state.followedIds = new Set(state.followed.map(f => f.id));
      await hydrateAvatars(state.followed.map(f => f.id));
      renderFollowed();
    } catch (e) {
      if (e.message === "401") logout("Session expired. Please log in again.");
      else console.error("Followed list error:", e);
    }
  }

  /* ---------- Public lists: live channels + categories ---------- */
  async function loadPublic() {
    const auth = publicAuth();
    if (!auth) {
      state.live = []; state.cats = [];
      renderLive(); renderCats();
      return;
    }
    try {
      const r = await api(`${TWITCH}streams?first=50`, ...auth);
      const streams = r.data || [];
      state.live = streams
        .filter(s => !state.followedIds.has(s.user_id) && s.user_id !== state.selfId)
        .slice(0, 30)
        .map(s => ({ id: s.user_id, name: s.user_name, login: s.user_login, live: s }));

      const gameIds = [...new Set(streams.map(s => s.game_id).filter(Boolean))].slice(0, 30);
      if (gameIds.length) {
        const g = await api(`${TWITCH}games?${gameIds.map(id => "id=" + id).join("&")}`, ...auth);
        state.cats = (g.data || []).map(x => ({
          name: x.name,
          img: x.box_art_url.replace("{width}", "188").replace("{height}", "250"),
          viewers: streams.filter(s => s.game_id === x.id).reduce((n, s) => n + s.viewer_count, 0)
        })).sort((a, b) => b.viewers - a.viewers);
      } else {
        state.cats = [];
      }
      await hydrateAvatars(state.live.map(x => x.id));
    } catch (e) {
      console.error("Public data error:", e);
      if (e.message === "401") toast("App token expired. Update CONFIG.appToken.");
    }
    renderLive();
    renderCats();
  }

  async function hydrateAvatars(ids) {
    const auth = publicAuth();
    if (!auth) return;
    const need = [...new Set(ids)].filter(id => !state.avatars[id]);
    for (let i = 0; i < need.length; i += 100) {
      const batch = need.slice(i, i + 100);
      try {
        const r = await api(`${TWITCH}users?${batch.map(id => "id=" + id).join("&")}`, ...auth);
        (r.data || []).forEach(u => { state.avatars[u.id] = u.profile_image_url; });
      } catch (e) { console.warn("Avatar batch failed:", e); }
    }
  }

  /* ---------- Rendering: sidebar lists ---------- */
  function channelRow(item) {
    const live = item.live;
    const av = state.avatars[item.id] || DEFAULT_AVATAR;
    return `
      <a class="row" href="https://twitch.tv/${esc(item.login)}" target="_blank" rel="noopener noreferrer" title="${esc(item.name)}">
        <span class="av-wrap">
          <img class="av" src="${esc(av)}" alt="" loading="lazy" onerror="this.src='${DEFAULT_AVATAR}'" />
          ${live ? '<span class="live-tick"></span>' : ""}
        </span>
        <span class="meta txt">
          <span class="nm">${esc(item.name)}</span>
          <span class="gm">${live ? esc(live.game_name || "Live") : "Offline"}</span>
        </span>
        ${live ? `<span class="vc txt">${fmtViewers(live.viewer_count)}</span>` : ""}
      </a>`;
  }

  function renderList(sec, items, elId, moreKey, emptyHTML) {
    const el = $(elId);
    const n = state.shown[sec];
    if (!items.length) {
      el.innerHTML = emptyHTML || "";
    } else {
      el.innerHTML = items.slice(0, n).map(channelRow).join("");
    }
    const more = document.querySelector(`[data-more="${moreKey}"]`);
    const less = document.querySelector(`[data-less="${moreKey}"]`);
    if (more) more.hidden = items.length <= n;
    if (less) less.hidden = n <= CONFIG.pageSize;
  }

  function renderFollowed() {
    const loggedIn = !!state.user;
    $("#followedCount").textContent = loggedIn ? `${state.followed.length}` : "";
    renderList("followed", state.followed, "#followingList", "followed",
      loggedIn
        ? `<p class="empty-note">None of the channels you follow are live right now.</p>`
        : `<p class="empty-note">Log in with Twitch to see your followed channels.</p>`);
  }

  function renderLive() {
    $("#liveCount").textContent = state.live.length ? `${state.live.length}` : "";
    renderList("live", state.live, "#liveList", "live",
      isSet(CONFIG.appClientId) || state.user
        ? `<p class="empty-note">No recommended channels are live right now.</p>`
        : `<p class="empty-note">Add app credentials in CONFIG to see live channels.</p>`);
  }

  function renderCats() {
    const el = $("#catList");
    const n = state.shown.cats;
    if (!state.cats.length) {
      el.innerHTML = `<p class="empty-note">Categories appear once channels are live.</p>`;
    } else {
      el.innerHTML = state.cats.slice(0, n).map(c => `
        <a class="row cat" href="https://twitch.tv/directory/category/${encodeURIComponent(c.name.toLowerCase().replace(/\s+/g, "-"))}" target="_blank" rel="noopener noreferrer" title="${esc(c.name)}">
          <img class="av" src="${esc(c.img)}" alt="" loading="lazy" onerror="this.src='https://static-cdn.jtvnw.net/ttv-static/404_boxart-30x40.jpg'" />
          <span class="meta txt">
            <span class="nm">${esc(c.name)}</span>
            <span class="gm">${fmtViewers(c.viewers)} viewers</span>
          </span>
        </a>`).join("");
    }
    const more = document.querySelector('[data-more="cats"]');
    const less = document.querySelector('[data-less="cats"]');
    if (more) more.hidden = state.cats.length <= n;
    if (less) less.hidden = n <= CONFIG.pageSize;
  }

  /* Show more / less */
  document.addEventListener("click", e => {
    const more = e.target.closest("[data-more]");
    const less = e.target.closest("[data-less]");
    if (more) {
      const k = more.dataset.more;
      state.shown[k === "cats" ? "cats" : k] += CONFIG.pageSize;
      k === "followed" ? renderFollowed() : k === "live" ? renderLive() : renderCats();
    }
    if (less) {
      const k = less.dataset.less;
      state.shown[k] = CONFIG.pageSize;
      k === "followed" ? renderFollowed() : k === "live" ? renderLive() : renderCats();
    }
  });

  /* ---------- Sidebar toggle ---------- */
  $("#sidebarToggle").addEventListener("click", () => {
    const layout = $("#layout");
    const collapsed = layout.classList.toggle("collapsed");
    const btn = $("#sidebarToggle");
    btn.textContent = collapsed ? "›" : "‹";
    btn.setAttribute("aria-label", collapsed ? "Expand sidebar" : "Collapse sidebar");
    setTimeout(() => window.dispatchEvent(new Event("resize")), 360);
  });

  /* ---------- Clips ---------- */
  $("#clipsToggle").addEventListener("click", () => {
    const body = $("#clipsBody");
    const open = body.hidden;
    body.hidden = !open;
    $("#clipsToggle").setAttribute("aria-expanded", String(open));
    $("#clipsToggle").querySelector("span").textContent = open ? "Hide clips" : "Show clips";
    if (open && !state.clipsBuilt) {
      body.innerHTML = CLIPS.map((slug, i) => `
        <div class="clip">
          <iframe loading="lazy" src="https://clips.twitch.tv/embed?clip=${encodeURIComponent(slug)}&parent=${PARENT}"
                  title="Twitch clip ${i + 1}" allowfullscreen></iframe>
        </div>`).join("");
      state.clipsBuilt = true;
    }
  });

  /* ---------- Main stream: player, chat, stream info ---------- */
  function initPlayerAndChat() {
    try {
      const player = new Twitch.Player("twitch-player", {
        channel: CONFIG.channel,
        parent: [PARENT],
        width: "100%",
        height: "100%",
        autoplay: false
      });
      player.setVolume(0.5);
    } catch (e) { console.warn("Player init failed:", e); }
    $("#twitch-chat").src = `https://www.twitch.tv/embed/${CONFIG.channel}/chat?parent=${PARENT}&darkpopout&theme=dark`;
  }

  async function loadStream() {
    const auth = publicAuth();
    if (!auth) {
      $("#statusText").textContent = "Add app credentials";
      return;
    }
    try {
      const u = (await api(`${TWITCH}users?login=${CONFIG.channel}`, ...auth)).data?.[0];
      if (!u) return;
      $("#bioText").textContent = u.description || "No bio yet.";
      $("#streamerAvatar").src = u.profile_image_url || $("#streamerAvatar").src;

      const [chRes, stRes, flRes] = await Promise.allSettled([
        api(`${TWITCH}channels?broadcaster_id=${u.id}`, ...auth),
        api(`${TWITCH}streams?user_id=${u.id}`, ...auth),
        api(`${TWITCH}channels/followers?broadcaster_id=${u.id}`, ...auth)
      ]);

      const ch = chRes.status === "fulfilled" ? chRes.value.data?.[0] : null;
      if (ch) {
        $("#streamTitle").textContent = ch.title || "";
        $("#streamGame").textContent = ch.game_name || "—";
      }
      if (flRes.status === "fulfilled" && flRes.value.total != null) {
        $("#followerCount").textContent = Number(flRes.value.total).toLocaleString();
      }

      const stream = stRes.status === "fulfilled" ? stRes.value.data?.[0] : null;
      const live = !!stream;
      $("#liveBadge").hidden = !live;
      $("#statusPill").classList.toggle("on", live);
      $("#statusPill").classList.toggle("off", !live);
      $("#statusText").textContent = live ? "LIVE" : "Offline";
      $("#viewerCount").hidden = !live;
      $("#streamTimer").hidden = !live;
      if (live) {
        $("#viewerNum").textContent = Number(stream.viewer_count).toLocaleString();
        if (stream.game_name) $("#streamGame").textContent = stream.game_name;
        if (stream.title) $("#streamTitle").textContent = stream.title;
        state.startedAt = new Date(stream.started_at).getTime();
      } else {
        state.startedAt = null;
      }
    } catch (e) {
      console.error("Stream info error:", e);
    }
  }

  function tickTimer() {
    const el = $("#streamTimer");
    if (!state.startedAt) { el.textContent = "00:00:00"; return; }
    el.textContent = hms(Math.max(0, Math.floor((Date.now() - state.startedAt) / 1000)));
  }

  /* ---------- Init ---------- */
  initPlayerAndChat();
  renderFollowed();
  renderLive();
  renderCats();

  const hadToken = handleHashToken();
  if (!hadToken) {
    state.user = loadUser();
    renderUser(state.user);
    loadFollowing();
  }
  loadPublic();
  loadStream();
  tickTimer();

  setInterval(loadStream, CONFIG.streamRefreshMs);
  setInterval(() => { loadFollowing(); loadPublic(); }, CONFIG.listRefreshMs);
  setInterval(tickTimer, 1000);
})();
</script>
</body>
