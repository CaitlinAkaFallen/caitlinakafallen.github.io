<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FallenOneArt — Now Playing Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Share+Tech+Mono&family=Poppins:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Bebas+Neue&family=VT323&family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
 <!-- Icons -->
<link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon" />
<link rel="icon" href="images/favicon.ico" type="image/x-icon" />
<style>

:root{
  --accent-primary:#7de8c8;
  --accent-secondary:#c8a2ff;
  --glass-bg:rgba(15,14,24,0.45);
  --glass-border:rgba(255,255,255,0.14);
  --corner-radius:22px;
  --glow-intensity:0.6;
  --pulse-speed:6s;
  --text-scale:1;
  --card-width:420px;
  --card-height:480px;
  --time-color:#7de8c8;
  --title-color:#f3f1f8;
  --artist-color:#a39fb5;
  --album-color:#a39fb5;
  --reveal-anim-name:art-roll-in;
  --font-display:'Orbitron', sans-serif;
  --font-mono:'Share Tech Mono', monospace;
  --text-primary:#f3f1f8;
  --text-secondary:#a39fb5;
  --metadata-opacity:1;
  --art-shape-radius:calc(var(--corner-radius) * 0.6);
  --compact-art-size:120px;
  --compact-right-gap:12px;
  --compact-title-size:16px;
  --compact-artist-size:11px;
  --compact-eq-bars-height:16px;
  --compact-eq-bar-width:2px;
  --compact-progress-height:6px;
  --vinyl-rotation:0deg;
}

*{box-sizing:border-box; margin:0; padding:0;}

html,body{
  width:100%; height:100%;
  background:transparent;
  overflow:hidden;
  font-family:var(--font-mono);
  display:flex;
  align-items:center;
  justify-content:center;
}

.stage{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:100%;
}

.player-card{
  position:relative;
  width:var(--card-width);
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  border-radius:var(--corner-radius);
  -webkit-backdrop-filter:blur(var(--blur-strength,18px));
  backdrop-filter:blur(var(--blur-strength,18px));
  box-shadow:
    0 0 calc(28px * var(--glow-intensity)) rgba(125,232,200,calc(var(--glow-intensity) * 0.35)),
    0 0 calc(48px * var(--glow-intensity)) rgba(200,162,255,calc(var(--glow-intensity) * 0.25)),
    inset 0 1px 0 rgba(255,255,255,0.06);
  padding:18px 20px 20px;
  transition:opacity 0.5s ease, transform 0.5s ease;
  opacity:0;
  transform:translateY(6px);
  display:grid;
  grid-template-rows:auto 1fr auto;
  gap:0;
  grid-auto-flow:row;
}

.player-card.visible{ opacity:1; transform:translateY(0); }

.player-card:has(#layoutStacked:not(.hidden)) {
  height:auto;
}

.player-card:has(#layoutMinimal:not(.hidden)) {
  height:auto;
  --card-height:80px;
}

.player-card:has(#layoutSpectrum:not(.hidden)) {
  height:auto;
  --card-height:120px;
}

.player-card:has(#layoutFullVinyl:not(.hidden)) {
  height:auto;
}

.player-card:not(:has(#layoutStacked:not(.hidden))):not(:has(#layoutMinimal:not(.hidden))):not(:has(#layoutSpectrum:not(.hidden))):not(:has(#layoutFullVinyl:not(.hidden))) {
  height:var(--card-height);
}

.hud-corner{
  position:absolute;
  width:16px; height:16px;
  border-color:var(--accent-primary);
  opacity:0.85;
  pointer-events:none;
  filter:drop-shadow(0 0 4px var(--accent-primary));
}
.hud-corner.tl{ top:6px; left:6px; border-top:2px solid; border-left:2px solid; border-top-left-radius:6px; }
.hud-corner.tr{ top:6px; right:6px; border-top:2px solid; border-right:2px solid; border-top-right-radius:6px; border-color:var(--accent-secondary); filter:drop-shadow(0 0 4px var(--accent-secondary)); }
.hud-corner.bl{ bottom:6px; left:6px; border-bottom:2px solid; border-left:2px solid; border-bottom-left-radius:6px; border-color:var(--accent-secondary); filter:drop-shadow(0 0 4px var(--accent-secondary)); }
.hud-corner.br{ bottom:6px; right:6px; border-bottom:2px solid; border-right:2px solid; border-bottom-right-radius:6px; }

.header-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
  grid-column:1;
  grid-row:1;
}
.logo-mark{
  width:26px; height:26px;
  flex:0 0 auto;
  display:flex; align-items:center; justify-content:center;
}
.logo-mark svg{ width:100%; height:100%; }
.logo-mark .bar{
  fill:var(--accent-primary);
  animation:eq-pulse var(--pulse-speed) ease-in-out infinite;
}
.logo-mark .bar:nth-child(2){ animation-delay:calc(var(--pulse-speed) / -4); fill:var(--accent-secondary); }
.logo-mark .bar:nth-child(3){ animation-delay:calc(var(--pulse-speed) / -2); }

.eyebrow{
  font-family:var(--font-mono);
  font-size:calc(11px * var(--text-scale));
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--text-secondary);
}
.eyebrow span{ color:var(--accent-primary); }

.status-dot{
  margin-left:auto;
  width:7px; height:7px;
  border-radius:50%;
  background:var(--accent-primary);
  box-shadow:0 0 8px var(--accent-primary);
  animation:dot-pulse var(--pulse-speed) ease-in-out infinite;
}
.status-dot.paused{ background:#6f6c80; box-shadow:none; animation:none; }

.layout-wrapper{
  grid-column:1;
  grid-row:2;
  display:flex;
  flex-direction:column;
  min-height:0;
  gap:8px;
  overflow:hidden;
}

.art-shapeable{
  border-radius:var(--art-shape-radius);
}
.art-shapeable.shape-circle{ border-radius:50%; }
.art-shapeable.shape-square{ border-radius:0; }
.art-shapeable.shape-rounded-rect{ border-radius:calc(var(--art-shape-radius) * 1.2); }
.art-shapeable.shape-hexagon{ clip-path:polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); }
.art-shapeable.shape-octagon{ clip-path:polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%); }
.art-shapeable.shape-diamond{ clip-path:polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); }
.art-shapeable.shape-shield{ clip-path:polygon(50% 0%, 100% 0%, 100% 50%, 85% 100%, 50% 95%, 15% 100%, 0% 50%, 0% 0%); }

.progress-container{
  grid-column:1;
  grid-row:3;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--glass-border);
  border-radius:14px;
  padding:8px 12px;
  transition:background 0.3s ease, border-color 0.3s ease;
  flex:0 0 auto;
}

.progress-container.bare-progress{
  background:transparent;
  border:none;
  padding:4px 0;
}

.progress-row{
  display:flex;
  align-items:center;
  gap:10px;
}

.time-stamp{
  font-family:var(--font-mono);
  font-size:calc(10px * var(--text-scale));
  color:var(--time-color);
  font-weight:600;
  flex:0 0 auto;
  min-width:36px;
}

.time-stamp.remaining{
  text-align:right;
}

.progress-track{
  flex:1 1 auto;
  height:5px;
  border-radius:8px;
  background:rgba(255,255,255,0.08);
  overflow:visible;
  position:relative;
}

.progress-fill{
  position:relative;
  height:100%;
  border-radius:8px;
  background:linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
  box-shadow:0 0 8px var(--accent-primary);
  width:0%;
  transition:width 0.5s linear;
}

.progress-track.style-segmented{
  -webkit-mask-image:repeating-linear-gradient(to right, #000 0 3px, transparent 3px 6px);
  mask-image:repeating-linear-gradient(to right, #000 0 3px, transparent 3px 6px);
}
.progress-track.style-segmented .progress-fill{
  -webkit-mask-image:repeating-linear-gradient(to right, #000 0 3px, transparent 3px 6px);
  mask-image:repeating-linear-gradient(to right, #000 0 3px, transparent 3px 6px);
}

.progress-scrubber{
  display:none;
  position:absolute;
  right:-4px;
  top:50%;
  width:9px;
  height:9px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 6px rgba(0,0,0,0.5), 0 0 4px var(--accent-primary);
  transform:translateY(-50%);
}
.progress-track.show-scrubber .progress-scrubber{ display:block; }

/* ============================================================
   SPECTRUM LAYOUT — Horizontal EQ Bars
   ============================================================ */
.layout-spectrum{
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:flex-start;
  gap:12px;
  flex:1;
  min-height:0;
  width:100%;
  padding:0;
}

.spectrum-art-wrap{
  width:80px;
  height:80px;
  flex:0 0 auto;
  border-radius:calc(var(--corner-radius) * 0.5);
  overflow:hidden;
  background:#1a1825;
  box-shadow:0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
  animation-name:var(--reveal-anim-name, art-roll-in);
  animation-duration:0.8s;
  animation-timing-function:cubic-bezier(0.34, 1.56, 0.64, 1);
  animation-fill-mode:both;
  position:relative;
}

.spectrum-art-wrap img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.spectrum-art-wrap::after{
  content:'';
  position:absolute;
  inset:0;
  border-radius:inherit;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,0.1);
}

.spectrum-meta{
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:2px;
  min-width:100px;
  flex:0 0 auto;
  opacity:var(--metadata-opacity);
  transition:opacity 0.3s ease;
}

.spectrum-eyebrow{
  font-family:var(--font-mono);
  font-size:calc(9px * var(--text-scale));
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--accent-primary);
  font-weight:700;
  line-height:1;
}

.spectrum-title{
  font-family:var(--font-display);
  font-weight:700;
  font-size:calc(15px * var(--text-scale));
  color:var(--title-color);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  line-height:1.2;
  min-width:0;
}

.spectrum-artist{
  font-family:var(--font-mono);
  font-size:calc(11px * var(--text-scale));
  color:var(--artist-color);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  min-width:0;
}

.spectrum-artist.italic{ font-style:italic; }

.spectrum-eq-bars-container{
  display:flex;
  align-items:flex-end;
  justify-content:flex-end;
  gap:2px;
  height:60px;
  flex:1 1 auto;
  min-width:0;
}

.spectrum-eq-bars{
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:2px;
  height:100%;
  flex:1;
}

.spectrum-eq-bars .bar{
  width:3px;
  border-radius:2px;
  background:linear-gradient(to top, var(--accent-primary), var(--accent-secondary));
  height:25%;
  animation:eq-bounce 0.9s ease-in-out infinite;
  will-change:height;
  box-shadow:0 0 4px var(--accent-primary);
  flex:1;
  max-width:8px;
}

.spectrum-eq-bars .bar:nth-child(1){ animation-delay:-0.7s; }
.spectrum-eq-bars .bar:nth-child(2){ animation-delay:-0.4s; }
.spectrum-eq-bars .bar:nth-child(3){ animation-delay:-0.9s; }
.spectrum-eq-bars .bar:nth-child(4){ animation-delay:-0.1s; }
.spectrum-eq-bars .bar:nth-child(5){ animation-delay:-0.6s; }
.spectrum-eq-bars .bar:nth-child(6){ animation-delay:-0.3s; }
.spectrum-eq-bars .bar:nth-child(7){ animation-delay:-0.8s; }
.spectrum-eq-bars .bar:nth-child(8){ animation-delay:-0.2s; }
.spectrum-eq-bars .bar:nth-child(9){ animation-delay:-0.5s; }
.spectrum-eq-bars .bar:nth-child(10){ animation-delay:-0.7s; }
.spectrum-eq-bars .bar:nth-child(11){ animation-delay:-0.4s; }
.spectrum-eq-bars .bar:nth-child(12){ animation-delay:-0.9s; }
.spectrum-eq-bars .bar:nth-child(13){ animation-delay:-0.1s; }
.spectrum-eq-bars .bar:nth-child(14){ animation-delay:-0.6s; }
.spectrum-eq-bars .bar:nth-child(15){ animation-delay:-0.3s; }
.spectrum-eq-bars .bar:nth-child(16){ animation-delay:-0.8s; }

.spectrum-eq-bars.paused .bar{
  animation-play-state:paused;
  height:15%;
}

/* ============================================================
   COMPACT LAYOUT
   ============================================================ */
.layout-compact{
  display:grid;
  grid-template-columns:var(--compact-art-size) 1fr;
  gap:var(--compact-right-gap);
  flex:1;
  min-height:0;
  align-items:flex-start;
}

.art-wrap-square{
  width:var(--compact-art-size);
  height:var(--compact-art-size);
  border-radius:calc(var(--corner-radius) * 0.55);
  overflow:hidden;
  background:#1a1825;
  box-shadow:0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
  animation-name:var(--reveal-anim-name, art-roll-in);
  animation-duration:0.8s;
  animation-timing-function:cubic-bezier(0.34, 1.56, 0.64, 1);
  animation-fill-mode:both;
  position:relative;
  flex:0 0 auto;
  margin-top:0;
}
.art-wrap-square img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.art-wrap-square::after{
  content:'';
  position:absolute;
  inset:0;
  border-radius:inherit;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,0.1);
}

.metadata-container{
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  gap:3px;
  min-width:0;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--glass-border);
  border-radius:12px;
  padding:10px 12px;
  opacity:var(--metadata-opacity);
  transition:opacity 0.3s ease;
}

.metadata-container.no-background{
  background:transparent;
  border:none;
}

#layoutCompact .metadata-container{
  background:transparent;
  border:none;
  padding:0;
  gap:6px;
  flex-direction:column;
}

.compact-right-column{
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  gap:var(--compact-right-gap);
  min-width:0;
  min-height:0;
}

.compact-title-section{
  flex:0 0 auto;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:2px;
}

.compact-title-section .pill-title{
  font-size:var(--compact-title-size);
  font-weight:700;
  line-height:1.3;
  letter-spacing:-0.4px;
  color:var(--title-color);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  min-width:0;
}

.compact-title-section .pill-artist{
  font-size:var(--compact-artist-size);
  color:var(--artist-color);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  min-width:0;
  font-family:var(--font-mono);
}

.compact-middle-section{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:6px;
  min-width:0;
}

.compact-middle-section .time-stamp{
  font-size:calc(9px * var(--text-scale));
  color:var(--time-color);
  font-weight:600;
  flex:0 0 auto;
  min-width:28px;
  font-family:var(--font-mono);
}

.compact-middle-section .eq-bars{
  display:flex;
  align-items:flex-end;
  gap:2px;
  height:var(--compact-eq-bars-height);
  flex:0 0 auto;
}

.compact-middle-section .eq-bars .bar{
  width:var(--compact-eq-bar-width);
  border-radius:2px;
  background:linear-gradient(to top, var(--accent-primary), var(--accent-secondary));
  height:30%;
  animation:eq-bounce 1.1s ease-in-out infinite;
  will-change:height;
}

.compact-middle-section .eq-bars .bar:nth-child(1){ animation-delay:-0.9s; }
.compact-middle-section .eq-bars .bar:nth-child(2){ animation-delay:-0.5s; }
.compact-middle-section .eq-bars .bar:nth-child(3){ animation-delay:-1.1s; }
.compact-middle-section .eq-bars .bar:nth-child(4){ animation-delay:-0.2s; }

.compact-middle-section .eq-bars.paused .bar{ animation-play-state:paused; height:18%; }

.compact-progress-section{
  flex:0 0 auto;
  min-width:0;
  width:100%;
}

.compact-progress-section .progress-track{
  width:100%;
  height:var(--compact-progress-height);
  border-radius:6px;
  background:rgba(255,255,255,0.08);
  overflow:visible;
  position:relative;
}

.pill-title{
  font-family:var(--font-display);
  font-weight:700;
  font-size:calc(13px * var(--text-scale));
  color:var(--title-color);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  min-width:0;
  line-height:1.2;
}

.pill-title .scroll-inner{ display:inline-block; white-space:nowrap; }

.pill-title.marquee{ text-overflow:unset; }
.pill-title.marquee .scroll-inner{ animation:marquee-scroll 10s linear infinite; padding-right:50px; }

#layoutCompact .pill-title{
  font-size:var(--compact-title-size);
  font-weight:700;
  line-height:1.3;
  letter-spacing:-0.4px;
  color:var(--title-color);
}

.pill-artist{
  font-family:var(--font-mono);
  font-size:calc(10px * var(--text-scale));
  color:var(--artist-color);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  min-width:0;
}

.pill-artist.italic{ font-style:italic; }

.pill-album{
  font-family:var(--font-mono);
  font-size:calc(9px * var(--text-scale));
  color:var(--album-color);
  opacity:0.7;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  min-width:0;
}

#layoutCompact .pill-album{
  display:none;
}

.eq-bars{
  display:flex;
  align-items:flex-end;
  gap:2px;
  height:12px;
  flex:0 0 auto;
}

.eq-bars .bar{
  width:3px;
  border-radius:2px;
  background:linear-gradient(to top, var(--accent-primary), var(--accent-secondary));
  height:30%;
  animation:eq-bounce 1.1s ease-in-out infinite;
  will-change:height;
}

.eq-bars .bar:nth-child(1){ animation-delay:-0.9s; }
.eq-bars .bar:nth-child(2){ animation-delay:-0.5s; }
.eq-bars .bar:nth-child(3){ animation-delay:-1.1s; }
.eq-bars .bar:nth-child(4){ animation-delay:-0.2s; }

.eq-bars.paused .bar{ animation-play-state:paused; height:18%; }

.art-badge{
  position:absolute;
  bottom:-2px;
  right:-2px;
  width:24px;
  height:24px;
  border-radius:50%;
  background:rgba(10,9,21,0.85);
  border:1px solid rgba(255,255,255,0.18);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  z-index:2;
}

.art-badge svg{
  width:12px;
  height:12px;
  fill:var(--text-primary);
}

.art-badge.paused .icon-play{ display:block; }
.art-badge.paused .icon-pause{ display:none; }
.art-badge:not(.paused) .icon-play{ display:none; }
.art-badge:not(.paused) .icon-pause{ display:block; }

/* ============================================================
   MINIMAL LAYOUT
   ============================================================ */
.layout-minimal{ 
  display:flex;
  flex-direction:row;
  align-items:center;
  gap:8px;
  flex:1;
  width:100%;
  min-height:0;
  background:rgba(25, 22, 20, 0.85);
  border-radius:50px;
  padding:6px 12px 6px 6px;
  box-shadow:inset 0 1px 1px rgba(255,255,255,0.05), 0 4px 16px rgba(0,0,0,0.3);
  border:1px solid rgba(255,255,255,0.06);
  -webkit-backdrop-filter:blur(16px);
  backdrop-filter:blur(16px);
}

.minimal-art-wrap{
  width:32px;
  height:32px;
  overflow:hidden;
  background:#1a1825;
  position:relative;
  border-radius:8px;
  animation-name:var(--reveal-anim-name, art-roll-in);
  animation-duration:0.8s;
  animation-timing-function:cubic-bezier(0.34, 1.56, 0.64, 1);
  animation-fill-mode:both;
  flex:0 0 auto;
  box-shadow:0 4px 10px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
}
.minimal-art-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
.minimal-art-wrap::after{
  content:'';
  position:absolute;
  inset:0;
  border-radius:inherit;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,0.15);
}

.minimal-meta{ 
  display:flex; 
  flex-direction:row;
  align-items:center;
  gap:5px;
  min-width:0;
  flex:1 1 auto;
  opacity:var(--metadata-opacity);
  transition:opacity 0.3s ease;
}

.minimal-title{
  font-family:var(--font-display);
  font-weight:700;
  font-size:calc(13px * var(--text-scale));
  color:#f3f1f8;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  position:relative;
  flex:0 0 auto;
  min-width:0;
}
.minimal-title .scroll-inner{ display:inline-block; white-space:nowrap; }
.minimal-title.marquee{ text-overflow:unset; }
.minimal-title.marquee .scroll-inner{ animation:marquee-scroll linear infinite; padding-right:30px; }

.minimal-separator {
  color:var(--artist-color);
  font-family:var(--font-mono);
  font-size:calc(11px * var(--text-scale));

}

.minimal-artist{

  overflow:hidden;
  text-overflow:ellipsis;

}
.minimal-artist.italic{ font-style:italic; }

.minimal-album{ display:none; }

.minimal-progress-wrap{

}

.minimal-progress-wrap .time-stamp{

}

.minimal-progress-wrap .progress-track{

.minimal-progress-wrap .progress-fill{

/* ============================================================
   STACKED LAYOUT
   ============================================================ */
.layout-stacked{ 
  display:grid;
  grid-template-rows:1fr auto auto;
  gap:0;
  flex:1;
  min-height:0;
  width:100%;
}

.stacked-art-wrap{
  width:100%;
  flex:1;
  overflow:hidden;
  background:#1a1825;
  position:relative;
  border-radius:calc(var(--corner-radius) * 0.6);
  animation-name:var(--reveal-anim-name, art-roll-in);
  animation-duration:0.8s;
  animation-timing-function:cubic-bezier(0.34, 1.56, 0.64, 1);
  animation-fill-mode:both;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.08);
  min-height:0;
}

.stacked-art-wrap img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.stacked-art-wrap::after{
  content:'';
  position:absolute;
  inset:0;
  border-radius:inherit;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,0.1);
}

.stacked-meta{
  background:rgba(15,14,24,0.85);
  border-top:1px solid var(--glass-border);
  padding:12px 14px;
  display:flex;
  flex-direction:column;
  gap:4px;
  opacity:var(--metadata-opacity);
  transition:opacity 0.3s ease;
  -webkit-backdrop-filter:blur(18px);
  backdrop-filter:blur(18px);
  flex:0 0 auto;
}

.stacked-meta.no-background{
  background:transparent;
  border:none;
  -webkit-backdrop-filter:none;
  backdrop-filter:none;
  padding:8px 0;
}

.stacked-title{
  font-family:var(--font-display);
  font-weight:700;
  font-size:calc(16px * var(--text-scale));
  color:var(--title-color);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  position:relative;
  min-width:0;
  display:block;
}

.stacked-title .scroll-inner{ display:inline-block; white-space:nowrap; }
.stacked-title.marquee{ text-overflow:unset; }
.stacked-title.marquee .scroll-inner{ animation:marquee-scroll linear infinite; padding-right:50px; }

.stacked-artist-row{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:calc(12px * var(--text-scale));
  min-width:0;
}

.stacked-artist{
  color:var(--artist-color);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  min-width:0;
}

.stacked-artist.italic{ font-style:italic; }

.stacked-album{
  color:var(--album-color);
  opacity:0.7;
  font-size:calc(10.5px * var(--text-scale));
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

}

.stacked-progress-wrap{
  flex:0 0 auto;
  background:rgba(15,14,24,0.85);
  border-top:1px solid var(--glass-border);
  padding:8px 12px;
  -webkit-backdrop-filter:blur(18px);
  backdrop-filter:blur(18px);
}

.stacked-progress-wrap.bare{
  background:transparent;
  border:none;
  -webkit-backdrop-filter:none;
  backdrop-filter:none;
  padding:4px 0;
}

/* ============================================================
   SQUARE LAYOUT
   ============================================================ */
.layout-square {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
  min-height: 0;
  width: 100%;
}

.square-art-frame {
  width: 320px;
  height: 320px;
  border-radius: 36px;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
}

/* The reveal-animation retrigger (on new track) targets .art-wrap-square
   elements. In every other layout that class wraps ONLY the album art
   image, so retriggering the animation only replays the art's own
   fade/roll-in. Square used to size/position .art-wrap-square as the
   whole 320x320 card — with the title, artist, and progress bar nested
   INSIDE it — so retriggering the animation blanked and replayed the
   entire card, not just the art. Now .square-art-frame owns the box and
   clipping, and .art-wrap-square is just an absolutely-positioned layer
   inside it holding the image, matching the pattern every other layout
   already uses. */
#layoutSquare .art-wrap-square {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  border-radius: inherit;
}

.art-gradient-overlay {
  position: absolute;
  inset: 0;
  background: transparent;
  pointer-events: none;
  z-index: 1;
}

#layoutSquare .metadata-container {
  position: absolute;
  bottom: 24px;
  left: 26px;
  right: 26px;
  background: transparent;
  border: none;
  padding: 0;
  justify-content: flex-end;
  z-index: 2;
}

#layoutSquare .pill-title {
  font-size: calc(24px * var(--text-scale));
  color: #ffffff;
  letter-spacing: -0.5px;
}

#layoutSquare .pill-artist {
  font-size: calc(16px * var(--text-scale));
  color: rgba(255, 255, 255, 0.75);
}

/* ============================================================
   VINTAGE LAYOUT — Rotating Vinyl Record
   ============================================================ */
.layout-vintage{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  flex:1;
  min-height:0;
  width:100%;
  position:relative;
  gap: 16px;
}

.vintage-title-container {
  width: 100%;
  text-align: center;
  padding: 0 10px;
  z-index: 5;
}

.vinyl-title{
  font-family:var(--font-display);
  font-weight:800;
  font-size:calc(20px * var(--text-scale));
  color:var(--title-color);
  letter-spacing:-0.5px;
  line-height:1.2;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow: none; /* No shadow */
}

.vinyl-title .scroll-inner{ display:inline-block; white-space:nowrap; }
.vinyl-title.marquee{ text-overflow:unset; }
.vinyl-title.marquee .scroll-inner{ animation:marquee-scroll 10s linear infinite; padding-right:50px; }

.vintage-container{
  position:relative;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.vinyl-record{
  position:relative;
  width:280px;
  height:280px;
  flex:0 0 auto;
  z-index:2;
}

.vinyl-surface{
  position:absolute;
  inset:0;
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #1a1620, #0f0d15);
  box-shadow:inset -6px -6px 16px rgba(0,0,0,0.4), inset 2px 2px 8px rgba(255,255,255,0.05), 0 0 48px rgba(125,232,200,calc(var(--glow-intensity) * 0.3));
  overflow:hidden;
  transform:rotate(var(--vinyl-rotation)); /* Applies rotation ONLY to the art and grooves */
  transition:none;
  will-change: transform;
}

.vinyl-surface img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  opacity:0.85;
}

.vinyl-groove{
  position:absolute;
  inset:0;
  border-radius:50%;
  background:none;
  pointer-events:none;
}

.vinyl-groove-1{ inset:calc(100% * 0.15); border:2px solid rgba(255,255,255,0.04); }
.vinyl-groove-2{ inset:calc(100% * 0.30); border:1px solid rgba(255,255,255,0.03); }
.vinyl-groove-3{ inset:calc(100% * 0.45); border:1px solid rgba(255,255,255,0.02); }
.vinyl-groove-4{ inset:calc(100% * 0.60); border:1px solid rgba(255,255,255,0.02); }
.vinyl-groove-5{ inset:calc(100% * 0.75); border:1px solid rgba(255,255,255,0.02); }

.vinyl-label{
  position:absolute;
  inset:50%;
  transform:translate(-50%, -50%);
  width:70px;
  height:70px;
  background:radial-gradient(circle at 35% 35%, #2a1f3d, #1a0e2a);
  border-radius:50%;
  z-index:3;
  box-shadow:0 12px 32px rgba(0,0,0,0.85), 0 4px 12px rgba(0,0,0,0.6), inset -3px -3px 12px rgba(0,0,0,0.6), inset 2px 2px 6px rgba(125,232,200,0.2), 0 0 24px rgba(125,232,200,calc(var(--glow-intensity) * 0.4));
  border:2px solid rgba(125,232,200,0.5);
  display:flex;
  align-items:center;
  justify-content:center;
}

.vinyl-label-inner{
  width:100%;
  height:100%;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid rgba(125,232,200,0.5);
}

.vinyl-label-dot{
  width:12px;
  height:12px;
  background:radial-gradient(circle at 30% 30%, #3d2a5a, #1a0e2a);
  border-radius:50%;
  box-shadow:inset -1px -1px 3px rgba(0,0,0,0.7), 0 0 6px rgba(125,232,200,0.4);
}

/* EQ Container - Decoupled from rotation, positioned dead center */
.vinyl-eq-container{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:4;
  pointer-events:none;
}

.vinyl-eq-bars{
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:4px;
  height:30px;
}

.vinyl-eq-bars .bar{
  width:4px;
  border-radius:2px;
  background:linear-gradient(to top, var(--accent-primary), var(--accent-secondary));
  height:15%;
  animation:eq-bounce 0.9s ease-in-out infinite;
  will-change:height;
  box-shadow: none; /* No shadow */
  opacity:1;
}

.vinyl-eq-bars .bar:nth-child(1){ animation-delay:-0.7s; }
.vinyl-eq-bars .bar:nth-child(2){ animation-delay:-0.4s; }
.vinyl-eq-bars .bar:nth-child(3){ animation-delay:-0.9s; }
.vinyl-eq-bars .bar:nth-child(4){ animation-delay:-0.1s; }

.vinyl-eq-bars.paused .bar{ animation-play-state:paused; height:12%; }

/* Vinyl metadata overlay - Decoupled from rotation, overlays the vinyl surface */
.vinyl-metadata-overlay{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:5;
}

.vinyl-bottom-section{
  position:absolute;
  top:50%;
  left:0;
  right:0;
  transform:translateY(-50%);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
}

.vinyl-side-left,
.vinyl-side-right{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
}

.vinyl-artist-label,
.vinyl-time-label{
  font-family:var(--font-mono);
  font-size:calc(7.5px * var(--text-scale));
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--accent-secondary);
  opacity:0.9;
  font-weight:700;
}

.vinyl-artist,
.vinyl-time-display{
  font-family:var(--font-mono);
  font-size:calc(11px * var(--text-scale));
  font-weight:700;
  color:#ffffff;
  text-shadow: none; /* No shadow */
}

.vinyl-artist{
  max-width:80px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.vinyl-artist.italic{ font-style:italic; }

.vinyl-time-display{
  color:var(--time-color);
}

.vinyl-status-section{
  position:absolute;
  bottom:24px;
  left:0;
  right:0;
  text-align:center;
}

.vinyl-status{
  font-family:var(--font-mono);
  font-size:calc(10px * var(--text-scale));
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--accent-primary);
  font-weight:700;
  text-shadow: none; /* No shadow */
}

/* ============================================================
   FULL VINYL LAYOUT — Frameless, realistic turntable
   No card container ever, regardless of the Container Background
   toggle (enforced again below at the .player-card rule so it
   can never flash a frame). Progress bar is fully replaced by
   the equalizer bar row beneath the title/artist text.

   Realism notes:
   - The vinyl body + label rotate together (a real label is
     glued to the disc and spins with it).
   - The glossy reflective sheen is a SEPARATE, non-rotating
     layer sitting above the disc — reflections don't spin with
     a record, they shift with the viewer/light instead.
   - A smooth ungrooved "runout" ring sits between the grooves
     and the label, matching real pressed vinyl.
   ============================================================ */
.layout-fullvinyl{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  flex:1;
  min-height:0;
  width:100%;
  padding:10px 0 4px;
}

.fv-turntable-wrap{
  position:relative;
  width:300px;
  height:300px;
  flex:0 0 auto;
}

/* Soft grounding shadow beneath the disc for depth */
.fv-turntable-wrap::before{
  content:'';
  position:absolute;
  left:6px;
  top:300px;
  width:264px;
  height:26px;
  transform:translateY(-30px);
  background:radial-gradient(ellipse at center, rgba(0,0,0,0.5) 0%, transparent 72%);
  pointer-events:none;
  z-index:0;
}

/* The rotating disc itself. Sits slightly left/down within the
   wrap so the tonearm pivot has room in the top-right corner. */
.fv-vinyl-disc{
  position:absolute;
  left:6px;
  top:36px;
  width:264px;
  height:264px;
  border-radius:50%;
  background:radial-gradient(circle at 50% 50%, #232028 0%, #15131a 55%, #060506 100%);
  box-shadow:
    0 20px 46px rgba(0,0,0,0.55),
    inset 0 0 0 1px rgba(255,255,255,0.07),
    inset 0 0 18px rgba(0,0,0,0.6);
  transform:rotate(var(--vinyl-rotation));
  will-change:transform;
  z-index:1;
}

/* Outer smooth rim (real pressings have a narrow flat lip before
   the grooves start) */
.fv-vinyl-disc::before{
  content:'';
  position:absolute;
  inset:0;
  border-radius:50%;
  box-shadow:
    inset 0 0 0 3px rgba(255,255,255,0.035),
    inset 0 0 0 4px rgba(0,0,0,0.4);
  pointer-events:none;
}

/* Fine concentric grooves — tighter pitch, alternating light/dark
   hairlines for a real pressed-vinyl look. Faded out toward the
   center (runout + label) and right at the outer rim via mask. */
.fv-vinyl-disc::after{
  content:'';
  position:absolute;
  inset:0;
  border-radius:50%;
  background:repeating-radial-gradient(circle at 50% 50%,
    rgba(255,255,255,0.09) 0px,
    rgba(255,255,255,0.09) 0.6px,
    rgba(0,0,0,0.22) 0.6px,
    rgba(0,0,0,0.22) 2.2px);
  -webkit-mask-image:radial-gradient(circle at 50% 50%,
    transparent 0%, transparent 34%,
    black 37%, black 94%,
    transparent 97%);
  mask-image:radial-gradient(circle at 50% 50%,
    transparent 0%, transparent 34%,
    black 37%, black 94%,
    transparent 97%);
  pointer-events:none;
}

/* Static, non-rotating glossy reflection. Lives in the wrap, not
   inside the spinning disc, so the highlight stays put while the
   record spins underneath it — matches how light behaves on a
   real glossy vinyl surface. */
.fv-vinyl-gloss{
  position:absolute;
  left:6px;
  top:36px;
  width:264px;
  height:264px;
  border-radius:50%;
  background:conic-gradient(from 205deg at 42% 38%,
    transparent 0deg,
    rgba(255,255,255,0.16) 26deg,
    rgba(255,255,255,0.03) 60deg,
    transparent 100deg,
    transparent 360deg);
  mix-blend-mode:screen;
  pointer-events:none;
  z-index:2;
}

/* Smooth ungrooved runout ring, just outside the label — plain
   dark plastic with no groove texture, as on a real record. */
.fv-vinyl-runout{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  width:39%;
  height:39%;
  border-radius:50%;
  background:radial-gradient(circle at 45% 40%, #1c1a20, #0c0b0e 75%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,0.05);
  z-index:1;
}

/* Label at the center of the disc, holds the album artwork.
   Styled like a printed paper label: matte ring border, subtle
   drop shadow, slightly recessed look. Rotates with the disc. */
.fv-vinyl-label{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  width:33%;
  height:33%;
  border-radius:50%;
  overflow:hidden;
  background:linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
  box-shadow:
    0 3px 10px rgba(0,0,0,0.6),
    inset 0 0 0 3px rgba(245,243,250,0.85),
    inset 0 0 0 4px rgba(0,0,0,0.25);
  z-index:2;
}
.fv-vinyl-label img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
/* Spindle hole, drawn above the artwork so it always reads clearly */
.fv-vinyl-spindle{
  position:absolute;
  top:50%;
  left:50%;
  width:8px;
  height:8px;
  transform:translate(-50%, -50%);
  background:#0b0a10;
  border-radius:50%;
  box-shadow:0 0 0 2px rgba(255,255,255,0.22) inset, 0 1px 2px rgba(0,0,0,0.6);
  z-index:3;
}

/* Tonearm — rendered as SVG for clean, precise geometry.
   Pivot anchored in the top-right corner of the wrap, resting
   the headshell/needle down onto the groove field of the disc
   (never on the label — a real needle tracks the grooves). */
.fv-tonearm-svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:4;
  pointer-events:none;
  overflow:visible;
}

/* Title / artist beneath the turntable */
.fv-meta{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  text-align:center;
  max-width:300px;
  opacity:var(--metadata-opacity);
  transition:opacity 0.3s ease;
}

.fv-title{
  font-family:var(--font-display);
  font-weight:800;
  font-size:calc(19px * var(--text-scale));
  color:var(--title-color);
  letter-spacing:-0.3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:300px;
}
.fv-title .scroll-inner{ display:inline-block; white-space:nowrap; }
.fv-title.marquee{ text-overflow:unset; }
.fv-title.marquee .scroll-inner{ animation:marquee-scroll linear infinite; padding-right:40px; }

.fv-artist{
  font-family:var(--font-mono);
  font-size:calc(12.5px * var(--text-scale));
  color:var(--accent-primary);
  letter-spacing:0.5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:300px;
}
.fv-artist.italic{ font-style:italic; }

/* Progress row — replaces the progress bar entirely for this
   layout. Elapsed / remaining timestamps flank a row of
   equalizer bars that pulse in place of a scrubber track. */
.fv-progress-row{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  max-width:280px;
}
.fv-progress-row .time-stamp{
  flex:0 0 auto;
}

.fv-eq-bars{
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:3px;
  height:32px;
  flex:1 1 auto;
  min-width:0;
}
.fv-eq-bars .bar{
  width:3.5px;
  border-radius:2px;
  background:linear-gradient(to top, var(--accent-primary), var(--accent-secondary));
  height:20%;
  animation:eq-bounce 0.9s ease-in-out infinite;
  will-change:height;
  box-shadow:0 0 4px rgba(125,232,200,0.35);
  flex:1;
  max-width:6px;
}
.fv-eq-bars .bar:nth-child(1){ animation-delay:-0.7s; }
.fv-eq-bars .bar:nth-child(2){ animation-delay:-0.4s; }
.fv-eq-bars .bar:nth-child(3){ animation-delay:-0.9s; }
.fv-eq-bars .bar:nth-child(4){ animation-delay:-0.1s; }
.fv-eq-bars .bar:nth-child(5){ animation-delay:-0.6s; }
.fv-eq-bars .bar:nth-child(6){ animation-delay:-0.3s; }
.fv-eq-bars .bar:nth-child(7){ animation-delay:-0.8s; }
.fv-eq-bars .bar:nth-child(8){ animation-delay:-0.2s; }
.fv-eq-bars .bar:nth-child(9){ animation-delay:-0.5s; }
.fv-eq-bars .bar:nth-child(10){ animation-delay:-0.7s; }
.fv-eq-bars .bar:nth-child(11){ animation-delay:-0.4s; }
.fv-eq-bars .bar:nth-child(12){ animation-delay:-0.9s; }
.fv-eq-bars .bar:nth-child(13){ animation-delay:-0.1s; }
.fv-eq-bars .bar:nth-child(14){ animation-delay:-0.6s; }
.fv-eq-bars .bar:nth-child(15){ animation-delay:-0.3s; }
.fv-eq-bars .bar:nth-child(16){ animation-delay:-0.8s; }
.fv-eq-bars .bar:nth-child(17){ animation-delay:-0.5s; }
.fv-eq-bars .bar:nth-child(18){ animation-delay:-0.2s; }
.fv-eq-bars .bar:nth-child(19){ animation-delay:-0.9s; }
.fv-eq-bars .bar:nth-child(20){ animation-delay:-0.6s; }

.fv-eq-bars.paused .bar{
  animation-play-state:paused;
  height:12%;
}

/* Hard rule: Full Vinyl is ALWAYS frameless. This is enforced in
   CSS directly (not just via JS toggling inline styles) so there
   is never a flash of the card background/border/HUD corners
   before the config script runs, and it can't be re-enabled by
   the Container Background toggle. */
.player-card:has(#layoutFullVinyl:not(.hidden)){
  background:transparent !important;
  border:none !important;
  box-shadow:none !important;
  -webkit-backdrop-filter:none !important;
  backdrop-filter:none !important;
}
.player-card:has(#layoutFullVinyl:not(.hidden)) .hud-corner{
  display:none !important;
}

/* ============================================================
   IDLE / OFFLINE STATE
   ============================================================ */
.idle-state{
  display:flex;
  align-items:center;
  gap:14px;
  padding:6px 2px;
}

.idle-icon{
  width:48px;
  height:48px;
  flex:0 0 auto;
  border-radius:50%;
  border:2px solid var(--glass-border);
  display:flex;
  align-items:center;
  justify-content:center;
  animation:idle-breathe var(--pulse-speed) ease-in-out infinite;
}

.idle-icon svg{
  width:22px;
  height:22px;
  fill:var(--text-secondary);
}

.idle-text{
  font-family:var(--font-mono);
  font-size:calc(12px * var(--text-scale));
  letter-spacing:1.5px;
  color:var(--text-secondary);
  text-transform:uppercase;
  min-width:0;
}

/* ============================================================
   ANIMATIONS
   ============================================================ */
@keyframes eq-pulse{
  0%,100%{ opacity:0.5; }
  50%{ opacity:1; }
}

@keyframes eq-bounce{
  0%,100%{ height:15%; }
  25%{ height:45%; }
  50%{ height:65%; }
  75%{ height:35%; }
}

@keyframes dot-pulse{
  0%,100%{ opacity:0.5; transform:scale(0.85); }
  50%{ opacity:1; transform:scale(1); }
}

@keyframes idle-breathe{
  0%,100%{ box-shadow:0 0 0 0 rgba(255,255,255,0.0); }
  50%{ box-shadow:0 0 16px 3px rgba(255,255,255,0.08); }
}

@keyframes art-roll-in{
  from{ opacity:0; transform:scale(0.75) rotateY(45deg); }
  to{ opacity:1; transform:scale(1) rotateY(0deg); }
}

@keyframes art-fade-in{
  from{ opacity:0; }
  to{ opacity:1; }
}

@keyframes art-slide-left-in{
  from{ opacity:0; transform:translateX(-26px); }
  to{ opacity:1; transform:translateX(0); }
}

@keyframes art-slide-up-in{
  from{ opacity:0; transform:translateY(22px); }
  to{ opacity:1; transform:translateY(0); }
}

@keyframes art-swing-in{
  0%{ opacity:0; transform:rotate(-14deg) scale(0.9); }
  60%{ opacity:1; transform:rotate(4deg) scale(1.02); }
  100%{ opacity:1; transform:rotate(0deg) scale(1); }
}

@keyframes marquee-scroll{
  0%{ transform:translateX(0); }
  100%{ transform:translateX(-100%); }
}

@media (prefers-reduced-motion: reduce){
  .logo-mark .bar, .status-dot, .idle-icon, .art-wrap-square, .minimal-art-wrap, .stacked-art-wrap, .spectrum-art-wrap, .vinyl-surface, .fv-vinyl-disc,

  .vinyl-eq-bars .bar, .spectrum-eq-bars .bar, .fv-eq-bars .bar{
    animation:none !important;
  }
}

.hidden{ display:none !important; }

</style>

      <!-- FULL VINYL LAYOUT — Frameless realistic turntable.

          <!-- Static gloss reflection — deliberately NOT inside the

<script>
const LS_CONFIG_KEY = 'fallenoneart_music_player_config';
const LS_AUTH_KEY = 'fallenoneart_spotify_auth';
const BROADCAST_NAME = 'fallenoneart-music-player-sync';
const SPOTIFY_TOKEN_URL = 'https://accounts.spotify.com/api/token';
const SPOTIFY_NOW_PLAYING_URL = 'https://api.spotify.com/v1/me/player/currently-playing';
const TOKEN_REFRESH_BUFFER_MS = 60000;
const MIN_POLL_SECONDS = 3;

const FONT_PAIRINGS = {
  signature:{ display:"'Orbitron', sans-serif", mono:"'Share Tech Mono', monospace" },
  modern:{ display:"'Poppins', sans-serif", mono:"'Poppins', sans-serif" },
  tech:{ display:"'Rajdhani', sans-serif", mono:"'JetBrains Mono', monospace" },
  retro:{ display:"'Bebas Neue', sans-serif", mono:"'VT323', monospace" },
  elegant:{ display:"'Playfair Display', serif", mono:"'Inter', sans-serif" }
};

const REVEAL_ANIM_MAP = {
  roll:'art-roll-in', fade:'art-fade-in', 'slide-left':'art-slide-left-in', 'slide-up':'art-slide-up-in', swing:'art-swing-in'
};

const SHAPE_OPTIONS = ['rounded', 'circle', 'square', 'rounded-rect', 'hexagon', 'octagon', 'diamond', 'shield'];
const LAYOUT_IDS = [
  { mode:'spectrum', id:'layoutSpectrum' },
  { mode:'compact', id:'layoutCompact' },
  { mode:'minimal', id:'layoutMinimal' },
  { mode:'stacked', id:'layoutStacked' },
  { mode:'square', id:'layoutSquare' },
  { mode:'vintage', id:'layoutVintage' },
  { mode:'fullvinyl', id:'layoutFullVinyl' }
];

const DEFAULT_CONFIG = {
  layoutMode:'compact', accentPrimary:'#7de8c8', accentSecondary:'#c8a2ff', glassOpacity:0.45,
  blurStrength:18, cornerRadius:22, albumArtShape:'rounded', showProgressBar:true, showArtist:true,
  showAlbum:false, showTimecode:true, showEqualizer:true, showBranding:true, showContainerBackground:true,
  idleBehavior:'message', idleMessage:'NOTHING PLAYING', pollInterval:5, glowIntensity:0.6, pulseSpeed:6,
  fontPairing:'signature', textScale:1, cardWidth:420, cardHeight:480, timeColor:'#7de8c8',
  titleColor:'#f3f1f8', artistColor:'#a39fb5', albumColor:'#a39fb5', artRevealStyle:'roll',
  marqueeEnabled:true, marqueeSpeed:36, progressBarStyle:'solid', showScrubberDot:false,
  showArtBadge:false, artistItalic:false, showMetadataPill:true, metadataBackground:true,
  metadataOpacity:1, progressBackground:true, showStartTime:false,
  compactArtSize:120, compactRightGap:12, compactTitleSize:16, compactArtistSize:11,
  compactEqBarsHeight:16, compactEqBarWidth:2, compactProgressHeight:6
};

let currentConfig = { ...DEFAULT_CONFIG };
let pollTimer = null;
let lastTrackId = null;
let playbackState = { progressMs:0, durationMs:0, isPlaying:false, lastSyncTime:0 };
let tickTimer = null;
let vinylRotationDeg = 0;
let vinylStartTime = 0;
let emptyPollStreak = 0;
const IDLE_CONFIRM_STREAK = 2; // require this many consecutive "nothing playing" polls before actually going idle — Spotify can briefly report an empty player state during the gap between two tracks, and treating that instantly as idle is what caused the overlay to flash out and back in on every track change

function updateVinylRotation(){
  if(!playbackState.isPlaying) return;
  
  const now = performance.now();
  if(vinylStartTime === 0) vinylStartTime = now;
  
  const elapsedMs = now - vinylStartTime;
  const rotationsPerSecond = 1 / 12; // 1 rotation every 12 seconds
  const totalRotations = (elapsedMs / 1000) * rotationsPerSecond;
  vinylRotationDeg = (totalRotations * 360) % 360;
  
  // Targets both the CD-style vinyl surface AND the Full Vinyl disc,
  // keeping overlays (metadata, tonearm, eq bars) strictly stationary.
  const vinylEls = document.querySelectorAll('#vinylSurface, #fvVinylDisc');
  vinylEls.forEach(el => el.style.setProperty('--vinyl-rotation', vinylRotationDeg + 'deg'));
}

function tick() {
  if (!playbackState.durationMs) return;
  const wallElapsed = performance.now() - playbackState.lastSyncTime;
  const currentMs = playbackState.isPlaying 
    ? Math.min(playbackState.progressMs + wallElapsed, playbackState.durationMs)
    : playbackState.progressMs;
  
  const elapsedStr = formatTime(currentMs);
  const remainingStr = formatTime(playbackState.durationMs - currentMs);
  
  document.querySelectorAll('[data-role="time-elapsed"]').forEach(el => el.textContent = elapsedStr);
  document.querySelectorAll('[data-role="time-remaining"]').forEach(el => el.textContent = '-' + remainingStr);
  
  const pct = (currentMs / playbackState.durationMs) * 100;
  document.querySelectorAll('[data-role="progress-fill"]').forEach(el => el.style.width = pct + '%');
  
  updateVinylRotation();
  
  if (playbackState.isPlaying && currentMs >= playbackState.durationMs) { 
    playbackState.isPlaying = false; 
    // Add a 2.5-second delay to let Spotify transition to the next track
    setTimeout(pollNowPlaying, 2500); 
  }
}

function startTick() { if (tickTimer) clearInterval(tickTimer); tick(); tickTimer = setInterval(tick, 16); }
function stopTick() { if (tickTimer) { clearInterval(tickTimer); tickTimer = null; } }

function loadConfig(){
  try{
    const raw = localStorage.getItem(LS_CONFIG_KEY);
    if(raw) currentConfig = { ...DEFAULT_CONFIG, ...JSON.parse(raw) };
  }catch(e){}
  applyConfig(currentConfig);
}

function applyConfig(cfg){
  const root = document.documentElement.style;
  root.setProperty('--accent-primary', cfg.accentPrimary);
  root.setProperty('--accent-secondary', cfg.accentSecondary);
  root.setProperty('--glass-bg', `rgba(15,14,24,${cfg.glassOpacity})`);
  root.setProperty('--blur-strength', `${cfg.blurStrength}px`);
  root.setProperty('--corner-radius', `${cfg.cornerRadius}px`);
  root.setProperty('--glow-intensity', cfg.glowIntensity);
  root.setProperty('--pulse-speed', `${Math.max(4, cfg.pulseSpeed)}s`);
  root.setProperty('--text-scale', cfg.textScale);
  root.setProperty('--card-width', `${cfg.cardWidth}px`);
  root.setProperty('--card-height', `${cfg.cardHeight}px`);
  root.setProperty('--time-color', cfg.timeColor || '#7de8c8');
  root.setProperty('--title-color', cfg.titleColor || '#f3f1f8');
  root.setProperty('--artist-color', cfg.artistColor || '#a39fb5');
  root.setProperty('--album-color', cfg.albumColor || '#a39fb5');
  root.setProperty('--reveal-anim-name', REVEAL_ANIM_MAP[cfg.artRevealStyle] || 'art-roll-in');
  root.setProperty('--metadata-opacity', cfg.showMetadataPill ? cfg.metadataOpacity : '0');
  root.setProperty('--compact-art-size', `${cfg.compactArtSize}px`);
  root.setProperty('--compact-right-gap', `${cfg.compactRightGap}px`);
  root.setProperty('--compact-title-size', `calc(${cfg.compactTitleSize}px * var(--text-scale))`);
  root.setProperty('--compact-artist-size', `calc(${cfg.compactArtistSize}px * var(--text-scale))`);
  root.setProperty('--compact-eq-bars-height', `${cfg.compactEqBarsHeight}px`);
  root.setProperty('--compact-eq-bar-width', `${cfg.compactEqBarWidth}px`);
  root.setProperty('--compact-progress-height', `${cfg.compactProgressHeight}px`);

  const fonts = FONT_PAIRINGS[cfg.fontPairing] || FONT_PAIRINGS.signature;
  root.setProperty('--font-display', fonts.display);
  root.setProperty('--font-mono', fonts.mono);

  LAYOUT_IDS.forEach(({mode, id})=> document.getElementById(id).classList.toggle('hidden', cfg.layoutMode !== mode));

  const card = document.getElementById('playerCard');
  // Full Vinyl is always frameless by design, regardless of the
  // Container Background toggle — matches Stacked's own-layering rule.
  const showBg = cfg.showContainerBackground !== false && cfg.layoutMode !== 'fullvinyl';
  card.style.background = showBg ? '' : 'transparent';
  card.style.border = showBg ? '' : 'none';
  card.style.backdropFilter = showBg ? '' : 'none';
  card.style.webkitBackdropFilter = showBg ? '' : 'none';
  card.style.boxShadow = showBg ? '' : 'none';
  document.querySelectorAll('.hud-corner').forEach(el => el.style.display = showBg ? '' : 'none');

  applyArtShape(cfg.albumArtShape);

  document.querySelectorAll('[data-role="artist"]').forEach(el=>{
    el.classList.toggle('hidden', !cfg.showArtist);
    el.classList.toggle('italic', !!cfg.artistItalic);
  });
  document.querySelectorAll('[data-role="album"]').forEach(el=> el.classList.toggle('hidden', !cfg.showAlbum));
  document.querySelectorAll('[data-role="time-elapsed"], [data-role="time-remaining"]').forEach(el=> el.classList.toggle('hidden', !cfg.showTimecode));

  const showProgressInContainer = cfg.showProgressBar && cfg.layoutMode !== 'stacked' && cfg.layoutMode !== 'square' && cfg.layoutMode !== 'compact' && cfg.layoutMode !== 'minimal' && cfg.layoutMode !== 'spectrum' && cfg.layoutMode !== 'fullvinyl';
  document.getElementById('progressContainer').classList.toggle('hidden', !showProgressInContainer);

  document.querySelectorAll('.eq-bars').forEach(el => el.classList.toggle('hidden', !cfg.showEqualizer));
  document.querySelectorAll('.spectrum-eq-bars').forEach(el => el.classList.toggle('hidden', !cfg.showEqualizer));
  document.querySelectorAll('.fv-eq-bars').forEach(el => el.classList.toggle('hidden', !cfg.showEqualizer));
  document.getElementById('headerRow').classList.toggle('hidden', !cfg.showBranding || cfg.layoutMode === 'fullvinyl');

  document.querySelectorAll('.progress-track').forEach(track=>{
    track.classList.toggle('style-segmented', cfg.progressBarStyle === 'segmented');
    track.classList.toggle('show-scrubber', !!cfg.showScrubberDot);
  });
  document.querySelectorAll('[data-role="art-badge"]').forEach(el=> el.classList.toggle('hidden', !cfg.showArtBadge));

  document.getElementById('progressContainer').classList.toggle('bare-progress', !cfg.progressBackground);
  document.getElementById('stackedProgressWrap').classList.toggle('bare', !cfg.progressBackground);

  document.getElementById('idleText').textContent = cfg.idleMessage || 'NOTHING PLAYING';
  restartPolling();
}

function applyArtShape(shape){
  const shapeClass = 'shape-' + shape;
  document.querySelectorAll('.art-shapeable').forEach(el => {
    SHAPE_OPTIONS.forEach(opt => el.classList.remove('shape-' + opt));
    el.classList.add(shapeClass);
  });
}

window.addEventListener('storage', (e)=>{ if(e.key === LS_CONFIG_KEY && e.newValue){ try{ currentConfig = { ...DEFAULT_CONFIG, ...JSON.parse(e.newValue) }; applyConfig(currentConfig); }catch(err){} } });

let bc = null;
try{ bc = new BroadcastChannel(BROADCAST_NAME); bc.onmessage = (e)=>{ if(e.data && e.data.type === 'config-update'){ currentConfig = { ...DEFAULT_CONFIG, ...e.data.config }; applyConfig(currentConfig); } }; }catch(e){}

window.addEventListener('message', (e)=>{ if(e.data && e.data.type === 'config-update'){ currentConfig = { ...DEFAULT_CONFIG, ...e.data.config }; applyConfig(currentConfig); } });

function getAuth(){ try{ return JSON.parse(localStorage.getItem(LS_AUTH_KEY) || 'null'); }catch(e){ return null; } }
function saveAuth(auth){ localStorage.setItem(LS_AUTH_KEY, JSON.stringify(auth)); }

async function refreshAccessToken(auth){
  const body = new URLSearchParams({client_id:auth.clientId, grant_type:'refresh_token', refresh_token:auth.refreshToken});
  const res = await fetch(SPOTIFY_TOKEN_URL, {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body});
  if(!res.ok) throw new Error('Refresh failed');
  const data = await res.json();
  const updated = {...auth, accessToken:data.access_token, refreshToken:data.refresh_token || auth.refreshToken, expiresAt:Date.now() + (data.expires_in * 1000)};
  saveAuth(updated);
  return updated;
}

async function getValidAccessToken(){
  let auth = getAuth();
  if(!auth || !auth.refreshToken || !auth.clientId) return null;
  if(!auth.expiresAt || Date.now() > (auth.expiresAt - TOKEN_REFRESH_BUFFER_MS)){
    try{ auth = await refreshAccessToken(auth); }catch(e){ return null; }
  }
  return auth.accessToken;
}

function showIdle(message){
  stopTick();
  vinylStartTime = 0;
  const cfg = currentConfig;
  if(cfg.idleBehavior === 'hide'){ document.getElementById('playerCard').classList.remove('visible'); return; }
  LAYOUT_IDS.forEach(({id})=> document.getElementById(id).classList.add('hidden'));
  document.getElementById('idleState').classList.remove('hidden');
  if(message) document.getElementById('idleText').textContent = message;
  document.getElementById('playerCard').classList.add('visible');
}

function showTrack(){
  const cfg = currentConfig;
  document.getElementById('idleState').classList.add('hidden');
  LAYOUT_IDS.forEach(({mode, id})=> document.getElementById(id).classList.toggle('hidden', cfg.layoutMode !== mode));
  document.getElementById('playerCard').classList.add('visible');
}

function formatTime(ms){
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function setupMarquee(el){
  const inner = el.querySelector('.scroll-inner');
  if(!inner) return;
  el.classList.remove('marquee');
  inner.style.animation = 'none';
  if(!currentConfig.marqueeEnabled) return;
  requestAnimationFrame(()=>{
    if(inner.scrollWidth > el.clientWidth + 4){
      const distance = inner.scrollWidth + 50;
      const speed = Math.max(10, currentConfig.marqueeSpeed || 36);
      const duration = distance / speed;
      inner.style.animation = '';
      el.classList.add('marquee');
      inner.style.animationDuration = `${duration}s`;
    }
  });
}

function retriggerRevealAnimation(el){
  if(!el) return;
  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = '';
}

function renderTrack(data){
  const item = data.item;
  const isPlaying = !!data.is_playing;
  const artUrl = (item.album && item.album.images && item.album.images[0]) ? item.album.images[0].url : '';
  const artists = (item.artists || []).map(a => a.name).join(', ');
  const albumName = (item.album && item.album.name) || '—';
  const isNewTrack = item.id !== lastTrackId;

  document.querySelectorAll('[data-role="title"]').forEach(el=>{
    if(el.querySelector('.scroll-inner')){
      el.querySelector('.scroll-inner').textContent = item.name || '—';
      setupMarquee(el);
    }else{
      el.textContent = item.name || '—';
    }
  });
  document.querySelectorAll('[data-role="artist"]').forEach(el => el.textContent = artists || '—');
  document.querySelectorAll('[data-role="album"]').forEach(el => el.textContent = albumName);
  document.querySelectorAll('[data-role="art-img"]').forEach(img => { if(img.src !== artUrl) img.src = artUrl; });

  if(isNewTrack){
    document.querySelectorAll('.art-wrap-square, .minimal-art-wrap, .stacked-art-wrap, .spectrum-art-wrap').forEach(retriggerRevealAnimation);
    vinylStartTime = 0; // Reset vinyl rotation for new track
    lastTrackId = item.id;
  }

  document.getElementById('statusDot').classList.toggle('paused', !isPlaying);
  document.querySelectorAll('[data-role="art-badge"]').forEach(el => el.classList.toggle('paused', !isPlaying));
  document.querySelectorAll('[data-role="eq-bars"]').forEach(el => el.classList.toggle('paused', !isPlaying));

  playbackState = { progressMs:data.progress_ms, durationMs:item.duration_ms, isPlaying:isPlaying, lastSyncTime:performance.now() };
  startTick();
  showTrack();
}

async function pollNowPlaying(){
  const token = await getValidAccessToken();
  if(!token){ showIdle('CONNECT SPOTIFY IN DASHBOARD'); return; }
  try{
    const res = await fetch(SPOTIFY_NOW_PLAYING_URL, {headers:{'Authorization':`Bearer ${token}`}});
    if(res.status === 204){ handleEmptyPoll(); return; }
    if(res.status === 401){ showIdle('TOKEN EXPIRED — RECONNECT'); return; }
    if(!res.ok){ showIdle('SPOTIFY UNAVAILABLE'); return; }
    const data = await res.json();
    if(!data || !data.item){ handleEmptyPoll(); return; }
    emptyPollStreak = 0;
    renderTrack(data);
  }catch(e){ showIdle('CONNECTION ERROR'); }
}

// Spotify's currently-playing endpoint can briefly report nothing
// playing (204, or a response with no item) for a single poll right
// as one track ends and the next begins. Reacting to that instantly
// caused the overlay to flash to the idle state and back on every
// track change. Requiring a couple of consecutive empty polls before
// actually switching to idle rides out that gap.
function handleEmptyPoll(){
  emptyPollStreak++;
  if(emptyPollStreak >= IDLE_CONFIRM_STREAK){
    showIdle(currentConfig.idleMessage);
    lastTrackId = null;
  }
}

function restartPolling(){
  if(pollTimer) clearInterval(pollTimer);
  const seconds = Math.max(MIN_POLL_SECONDS, currentConfig.pollInterval || DEFAULT_CONFIG.pollInterval);
  pollNowPlaying();
  pollTimer = setInterval(pollNowPlaying, seconds * 1000);
}

loadConfig();
</script>
