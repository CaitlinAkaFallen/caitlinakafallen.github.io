<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Wheel Dashboard Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Advanced Cyberpunk Glassmorphism Theme ── */
    *, *::before, *::after { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    body {
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f111a 70%);
      color: #f8fafc;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      padding: 40px 20px;
      overflow-x: hidden;
    }

    /* Subtle background grid pattern overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 30px 30px;
      pointer-events: none;
      z-index: 0;
    }

    .dashboard-container {
      position: relative;
      max-width: 1100px;
      margin: 0 auto;
      z-index: 1;
    }

    /* ── Header Styling ── */
    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 54px;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #a78bfa 0%, #a855f7 50%, #06b6d4 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.3));
      display: inline-block;
    }

    .subtitle {
      font-size: 14px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 4px;
      font-weight: 700;
    }

    /* ── Floating Action Bar ── */
    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 16px 24px;
      border-radius: 16px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .btn {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-add { 
      background: transparent; 
      color: #2dd4bf;
      border: 2px solid rgba(45, 212, 191, 0.4);
    }
    .btn-add:hover { 
      background: rgba(45, 212, 191, 0.1);
      border-color: #2dd4bf;
      box-shadow: 0 0 15px rgba(45, 212, 191, 0.2);
    }

    .btn-save { 
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); 
      color: white; 
      box-shadow: 0 0 20px rgba(124, 58, 237, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-save:hover { 
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(124, 58, 237, 0.6);
    }
    .btn-save:active {
      transform: translateY(0);
    }

    /* ── Card/Grid Layout System ── */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .segment-card {
      background: rgba(30, 41, 59, 0.4);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 20px;
      position: relative;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Dynamic left border highlight colored by the segment's custom color choice */
    .segment-card::before {
      content: '';
      position: absolute;
      left: 0; top: 20px; bottom: 20px;
      width: 4px;
      border-radius: 0 4px 4px 0;
      background-color: var(--card-accent, #7c3aed);
      box-shadow: 0 0 10px var(--card-accent, #7c3aed);
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .segment-card:hover {
      border-color: rgba(255, 255, 255, 0.15);
      box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.6);
      transform: translateY(-2px);
    }

    .card-header-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-left: 6px;
    }

    .index-badge {
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-delete {
      background: transparent;
      color: #f43f5e;
      border: 1px solid rgba(244, 63, 94, 0.2);
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 6px;
    }
    .btn-delete:hover {
      background: rgba(244, 63, 94, 0.1);
      border-color: #f43f5e;
    }

    /* ── Inputs Layout inside Cards ── */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      font-weight: 600;
    }

    input[type="text"] {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      padding: 10px 12px;
      border-radius: 8px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 16px;
      font-weight: 600;
      width: 100%;
      transition: border-color 0.2s, background 0.2s;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #a855f7;
      background: rgba(15, 23, 42, 0.9);
    }

    .color-pickers-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .color-input-wrapper {
      display: flex;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 6px 10px;
      gap: 10px;
    }

    .color-input-wrapper:focus-within {
      border-color: #a855f7;
    }

    input[type="color"] {
      -webkit-appearance: none;
      appearance: none;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; }
    
    .color-value-text {
      font-size: 14px;
      font-family: monospace;
      color: #cbd5e1;
      text-transform: uppercase;
    }

    /* ── Advanced Animated Toast Notification ── */
    .toast-notification {
      position: fixed;
      bottom: -100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid #22c55e;
      box-shadow: 0 10px 40px rgba(34, 197, 94, 0.2), inset 0 0 15px rgba(34, 197, 94, 0.1);
      color: #ffffff;
      padding: 16px 32px;
      border-radius: 50px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      z-index: 1000;
      transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .toast-notification.show {
      bottom: 40px;
    }
    .toast-icon {
      width: 20px;
      height: 20px;
      background: #22c55e;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <header>
      <h1>Wheel Configurator</h1>
      <div class="subtitle">Broadcast Control Interface</div>
    </header>

    <div class="actions-bar">
      <button class="btn btn-add" onclick="addNewRow()">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/></svg>
        Add New Segment
      </button>
      <button class="btn btn-save" onclick="saveSegments()">
        Save to System
      </button>
    </div>

    <div class="grid-container" id="segments-container">
      </div>
  </div>

  <div id="status-toast" class="toast-notification">
    <span class="toast-icon">✓</span> Configuration Synced to Matrix Screen
  </div>

<script>
  // Dynamic fallback mapping arrays
  const DEFAULT_SEGMENTS = [
    { key:'WCG',            label:'Winner\nChoose Game', color:'#7c3aed', text:'#ffffff', emoji:'' },
    { key:'SF',             label:'Shitface',            color:'#0d9488', text:'#ffffff', emoji:'' },
    { key:'Hydrate',        label:'Hydrate',             color:'#9333ea', text:'#ffffff', emoji:'' },
    { key:'ViewersChoice',  label:"Viewer's\nChoice",    color:'#0891b2', text:'#ffffff', emoji:'' },
    { key:'fallgreement',   label:'Fallgreement',        color:'#6d28d9', text:'#ffffff', emoji:'' },
    { key:'VI',             label:'Voice Impression',    color:'#14b8a6', text:'#ffffff', emoji:'' },
    { key:'Cosplay',        label:'CC Cosplay',          color:'#5b21b6', text:'#ffffff', emoji:'' },
    { key:'Nothing',        label:'Nothing',             color:'#1e293b', text:'#ffffff', emoji:'' },
    { key:'No Swear',       label:'No Swearing',         color:'#4f46e5', text:'#ffffff', emoji:'' },
    { key:'DF',             label:'Diabolical Foods',    color:'#0e7490', text:'#ffffff', emoji:'' },
  ];

  let segments = [];

  function loadSegments() {
    const stored = localStorage.getItem('stream_wheel_segments');
    if (stored) {
      try {
        segments = JSON.parse(stored);
      } catch (e) {
        segments = DEFAULT_SEGMENTS;
      }
    } else {
      segments = DEFAULT_SEGMENTS;
    }
    renderGrid();
  }

  function renderGrid() {
    const container = document.getElementById('segments-container');
    container.innerHTML = '';

    segments.forEach((seg, index) => {
      const card = document.createElement('div');
      card.className = 'segment-card';
      card.style.setProperty('--card-accent', seg.color);

      card.innerHTML = `
        <div class="card-header-actions">
          <span class="index-badge">Slice #${index + 1}</span>
          <button class="btn-delete" onclick="deleteRow(${index})">Delete</button>
        </div>

        <div class="form-group">
          <label>Unique Key ID</label>
          <input type="text" class="input-key" value="${escapeHtml(seg.key)}" placeholder="e.g. UniqueID">
        </div>

        <div class="form-group">
          <label>Slice Label text (use \\n for wrap)</label>
          <input type="text" class="input-label" value="${escapeHtml(seg.label)}" placeholder="e.g. Line 1\\nLine 2">
        </div>

        <div class="color-pickers-row">
          <div class="form-group">
            <label>Slice Tint</label>
            <div class="color-input-wrapper">
              <input type="color" class="input-color" value="${normalizeColor(seg.color)}" oninput="updateCardAccent(this)">
              <span class="color-value-text">${normalizeColor(seg.color)}</span>
            </div>
          </div>
          
          <div class="form-group">
            <label>Font Tint</label>
            <div class="color-input-wrapper">
              <input type="color" class="input-text" value="${normalizeColor(seg.text || '#ffffff')}" oninput="updateColorText(this)">
              <span class="color-value-text">${normalizeColor(seg.text || '#ffffff')}</span>
            </div>
          </div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  // Live update accent indicators inline without full redraw cycles
  function updateCardAccent(picker) {
    const hex = picker.value;
    picker.nextElementSibling.textContent = hex;
    picker.closest('.segment-card').style.setProperty('--card-accent', hex);
  }

  function updateColorText(picker) {
    picker.nextElementSibling.textContent = picker.value;
  }

  function addNewRow() {
    readCurrentInputs();
    segments.push({ key: 'NEW_PRIZE', label: 'Custom\\nPrize', color: '#7c3aed', text: '#ffffff', emoji: '' });
    renderGrid();
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }

  function deleteRow(index) {
    readCurrentInputs();
    segments.splice(index, 1);
    renderGrid();
  }

  function readCurrentInputs() {
    const cards = document.querySelectorAll('.segment-card');
    const updatedSegments = [];

    cards.forEach(card => {
      const key = card.querySelector('.input-key').value;
      const label = card.querySelector('.input-label').value;
      const color = card.querySelector('.input-color').value;
      const text = card.querySelector('.input-text').value;

      updatedSegments.push({ key, label, color, text, emoji: '' });
    });

    segments = updatedSegments;
  }

  function saveSegments() {
    readCurrentInputs();
    if(segments.length === 0) {
       alert("Operation aborted! Keep at least 1 functional segment available for the rendering wheel engine.");
       return;
    }
    localStorage.setItem('stream_wheel_segments', JSON.stringify(segments));
    
    // Smooth custom Toast action notification flash
    const toast = document.getElementById('status-toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3500);
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  function normalizeColor(colorStr) {
    if (!colorStr.startsWith('#')) return '#ffffff';
    if (colorStr.length === 4) {
      return '#' + colorStr[1] + colorStr[1] + colorStr[2] + colorStr[2] + colorStr[3] + colorStr[3];
    }
    return colorStr.substring(0, 7);
  }

  loadSegments();
</script>
</body>
</html>
