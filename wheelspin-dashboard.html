<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wheel Admin — FallenOneArt</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:        #080b12;
      --surface:   #0f1623;
      --panel:     #161e2e;
      --border:    rgba(255,255,255,.07);
      --purple:    #7c3aed;
      --purple-lt: #a78bfa;
      --teal:      #2dd4bf;
      --teal-dk:   #0d9488;
      --cyan:      #06b6d4;
      --rose:      #f43f5e;
      --green:     #22c55e;
      --dim:       #475569;
      --mid:       #94a3b8;
      --bright:    #e2e8f0;
    }

    html { scroll-behavior: smooth; }
    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--bright);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* scrollbar hidden */
    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }

    /* ambient bg */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 15% 0%,   rgba(124,58,237,.14) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 90% 100%,  rgba(6,182,212,.10) 0%, transparent 55%);
      pointer-events: none; z-index: 0;
    }

    /* grid overlay */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.011) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.011) 1px, transparent 1px);
      background-size: 36px 36px;
      pointer-events: none; z-index: 0;
    }

    .page {
      position: relative;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 28px 80px;
      z-index: 1;
    }

    /* ── Header ──────────────────────────────────────── */
    .site-header {
      padding: 48px 0 32px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0;
    }

    .eyebrow {
      font-family: 'Space Mono', monospace;
      font-size: 10px; letter-spacing: 5px;
      color: var(--teal); text-transform: uppercase;
      opacity: .7; margin-bottom: 10px;
    }

    .site-header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 56px; letter-spacing: 4px;
      background: linear-gradient(125deg, #c4b5fd 0%, #a855f7 40%, #22d3ee 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 28px rgba(168,85,247,.3));
      line-height: 1;
    }

    .site-header p {
      font-family: 'Space Mono', monospace;
      font-size: 11px; color: var(--dim);
      letter-spacing: 2px; margin-top: 8px;
      text-transform: uppercase;
    }

    /* ── Sticky toolbar ──────────────────────────────── */
    .toolbar {
      position: sticky; top: 0; z-index: 200;
      display: flex; align-items: center;
      justify-content: space-between; gap: 12px;
      background: rgba(8,11,18,.82);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 13px 28px;
      margin: 0 -28px 36px;
    }

    .toolbar::after {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg,
        transparent, rgba(124,58,237,.5) 30%, rgba(45,212,191,.5) 70%, transparent);
    }

    .toolbar-left { display: flex; align-items: center; gap: 10px; }

    .pill {
      font-family: 'Space Mono', monospace;
      font-size: 10px; letter-spacing: 1.5px;
      color: var(--purple-lt);
      background: rgba(124,58,237,.12);
      border: 1px solid rgba(124,58,237,.25);
      border-radius: 100px;
      padding: 4px 13px;
    }

    /* ── Buttons ─────────────────────────────────────── */
    .btn {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700; font-size: 14px;
      letter-spacing: 1.5px; text-transform: uppercase;
      padding: 9px 22px; border-radius: 9px;
      cursor: pointer; border: none;
      display: inline-flex; align-items: center; gap: 7px;
      white-space: nowrap;
      transition: all .2s ease;
    }

    .btn-ghost {
      background: transparent;
      color: var(--teal);
      border: 1px solid rgba(45,212,191,.3);
    }
    .btn-ghost:hover {
      background: rgba(45,212,191,.08);
      border-color: rgba(45,212,191,.6);
      box-shadow: 0 0 16px rgba(45,212,191,.15);
    }

    .btn-primary {
      position: relative; overflow: hidden;
      background: rgba(124,58,237,.15);
      color: var(--purple-lt);
      border: 1px solid rgba(167,139,250,.35);
      padding: 9px 28px;
    }
    .btn-primary::before {
      content: '';
      position: absolute; top: 0; left: -120%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(167,139,250,.12), transparent);
      transition: left .55s;
    }
    .btn-primary:hover {
      background: rgba(124,58,237,.28);
      border-color: rgba(167,139,250,.6);
      color: #e9d5ff;
      box-shadow: 0 0 22px rgba(124,58,237,.25), inset 0 0 20px rgba(167,139,250,.05);
      transform: translateY(-1px);
    }
    .btn-primary:hover::before { left: 160%; }
    .btn-primary:active { transform: translateY(0); }

    .btn-danger {
      background: transparent;
      color: rgba(244,63,94,.6);
      border: 1px solid rgba(244,63,94,.18);
      padding: 4px 11px; font-size: 11px;
      border-radius: 6px;
    }
    .btn-danger:hover {
      background: rgba(244,63,94,.08);
      border-color: rgba(244,63,94,.5);
      color: var(--rose);
    }

    /* ── Section header ──────────────────────────────── */
    .section-head {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 18px;
    }

    .section-label {
      font-family: 'Space Mono', monospace;
      font-size: 10px; letter-spacing: 4px;
      color: var(--dim); text-transform: uppercase;
    }

    .section-line {
      flex: 1; height: 1px;
      background: linear-gradient(90deg, rgba(255,255,255,.07), transparent);
    }

    /* ── Hub image panel ─────────────────────────────── */
    .hub-panel {
      background: rgba(15,22,35,.6);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 28px;
    }

    .hub-accent {
      height: 2px;
      background: linear-gradient(90deg, var(--cyan), var(--purple-lt) 60%, transparent);
      box-shadow: 0 0 10px rgba(6,182,212,.4);
    }

    .hub-body {
      padding: 22px 26px;
      display: flex; align-items: center; gap: 28px; flex-wrap: wrap;
    }

    /* Circle dropzone */
    .hub-drop {
      position: relative;
      flex-shrink: 0;
      width: 110px; height: 110px;
      border-radius: 50%;
      border: 2px dashed rgba(6,182,212,.3);
      background: rgba(6,182,212,.04);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      cursor: pointer; overflow: hidden;
      transition: all .25s;
    }
    .hub-drop:hover, .hub-drop.drag-over {
      border-color: rgba(6,182,212,.7);
      background: rgba(6,182,212,.1);
      box-shadow: 0 0 22px rgba(6,182,212,.2);
    }
    .hub-drop input[type="file"] {
      position: absolute; inset: 0; opacity: 0;
      cursor: pointer; width: 100%; height: 100%;
    }
    .hub-drop-icon {
      font-size: 26px; pointer-events: none; margin-bottom: 5px;
    }
    .hub-drop-hint {
      font-family: 'Space Mono', monospace;
      font-size: 8px; color: var(--dim);
      text-align: center; line-height: 1.5;
      pointer-events: none;
    }
    #hub-preview {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover; border-radius: 50%;
      display: none;
    }
    #hub-preview.visible { display: block; }

    .hub-info { flex: 1; min-width: 180px; }
    .hub-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px; letter-spacing: 2px; color: var(--cyan);
      margin-bottom: 4px;
    }
    .hub-desc {
      font-family: 'Space Mono', monospace;
      font-size: 9px; color: var(--dim);
      line-height: 1.65; letter-spacing: .5px;
    }

    .hub-actions { display: flex; flex-direction: column; gap: 8px; }

    .btn-hub {
      font-family: 'Space Mono', monospace;
      font-size: 9px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      padding: 8px 18px; border-radius: 8px;
      cursor: pointer; white-space: nowrap;
      transition: all .2s;
    }
    .btn-hub-save {
      background: rgba(6,182,212,.1);
      border: 1px solid rgba(6,182,212,.3);
      color: var(--cyan);
    }
    .btn-hub-save:hover {
      background: rgba(6,182,212,.2);
      border-color: rgba(6,182,212,.6);
      box-shadow: 0 0 14px rgba(6,182,212,.2);
    }
    .btn-hub-save:disabled { opacity: .3; cursor: not-allowed; }

    .btn-hub-clear {
      background: transparent;
      border: 1px solid rgba(244,63,94,.2);
      color: rgba(244,63,94,.6);
    }
    .btn-hub-clear:hover {
      background: rgba(244,63,94,.08);
      border-color: rgba(244,63,94,.5);
      color: var(--rose);
    }
    .btn-hub-clear:disabled { opacity: .25; cursor: not-allowed; }

    #hub-status {
      font-family: 'Space Mono', monospace;
      font-size: 9px; letter-spacing: 1px;
      text-transform: uppercase; color: var(--dim);
    }
    #hub-status.saved   { color: var(--green); }
    #hub-status.cleared { color: var(--rose); }

    /* ── Segment grid ────────────────────────────────── */
    .seg-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }

    .seg-card {
      background: rgba(15,22,35,.55);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: transform .2s, border-color .2s, box-shadow .2s;
      display: flex; flex-direction: column;
    }
    .seg-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255,255,255,.11);
      box-shadow: 0 14px 30px -12px rgba(0,0,0,.7);
    }

    .seg-strip {
      height: 3px;
      background: linear-gradient(90deg, var(--card-col, #7c3aed), transparent 80%);
      box-shadow: 0 0 10px var(--card-col, #7c3aed);
    }

    .seg-body {
      padding: 16px 18px 18px;
      display: flex; flex-direction: column; gap: 12px;
      flex: 1;
    }

    .seg-row-top {
      display: flex; justify-content: space-between; align-items: center;
    }

    .seg-index {
      font-family: 'Space Mono', monospace;
      font-size: 9px; letter-spacing: 2px;
      color: var(--dim); text-transform: uppercase;
    }

    /* Form elements */
    .field { display: flex; flex-direction: column; gap: 4px; }

    .field label {
      font-family: 'Space Mono', monospace;
      font-size: 9px; letter-spacing: 1.5px;
      color: var(--dim); text-transform: uppercase;
    }

    .input-text {
      background: rgba(15,22,35,.75);
      border: 1px solid rgba(255,255,255,.07);
      color: var(--bright);
      padding: 8px 11px; border-radius: 7px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px; font-weight: 600;
      width: 100%;
      transition: border-color .2s, box-shadow .2s;
    }
    .input-text:focus {
      outline: none;
      border-color: rgba(167,139,250,.5);
      box-shadow: 0 0 0 3px rgba(167,139,250,.07);
      background: rgba(15,22,35,.95);
    }

    .color-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .color-wrap {
      display: flex; align-items: center; gap: 8px;
      background: rgba(15,22,35,.75);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 7px; padding: 5px 9px;
      transition: border-color .2s;
    }
    .color-wrap:focus-within { border-color: rgba(167,139,250,.4); }

    input[type="color"] {
      -webkit-appearance: none; appearance: none;
      border: none; width: 26px; height: 26px;
      border-radius: 5px; cursor: pointer;
      background: transparent; flex-shrink: 0;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch {
      border: 1px solid rgba(255,255,255,.15); border-radius: 4px;
    }

    .hex-field {
      font-family: 'Space Mono', monospace;
      font-size: 11px; color: var(--bright);
      text-transform: uppercase; letter-spacing: .5px;
      background: transparent; border: none; outline: none;
      width: 68px; caret-color: var(--purple-lt);
    }
    .hex-field.bad { color: var(--rose); }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, rgba(255,255,255,.05), transparent);
      margin: 0 -2px;
    }

    /* ── Toast ───────────────────────────────────────── */
    #toast {
      position: fixed; bottom: -100px; left: 50%;
      transform: translateX(-50%);
      background: rgba(8,11,18,.95);
      border: 1px solid rgba(34,197,94,.35);
      box-shadow: 0 8px 30px rgba(0,0,0,.5), 0 0 18px rgba(34,197,94,.12);
      color: #fff; padding: 13px 28px; border-radius: 50px;
      font-family: 'Space Mono', monospace;
      font-size: 11px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      display: flex; align-items: center; gap: 10px;
      white-space: nowrap; z-index: 9999;
      transition: bottom .45s cubic-bezier(.175,.885,.32,1.275);
    }
    #toast.show { bottom: 32px; }
    .toast-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: blink 1.4s ease infinite;
    }
    @keyframes blink {
      0%,100% { opacity:.4; transform:scale(1); }
      50%      { opacity:1;  transform:scale(1.35); }
    }
  </style>
</head>
<body>
<div class="page">

  <!-- Header -->
  <header class="site-header">
    <div class="eyebrow">// fallenoneart.stream</div>
    <h1>Wheel Admin</h1>
    <p>Configure segments · hub image · save to overlay</p>
  </header>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="toolbar-left">
      <button class="btn btn-ghost" onclick="addSegment()">
        <svg width="13" height="13" fill="currentColor" viewBox="0 0 16 16">
          <path d="M8 4a.5.5 0 01.5.5v3h3a.5.5 0 010 1h-3v3a.5.5 0 01-1 0v-3h-3a.5.5 0 010-1h3v-3A.5.5 0 018 4z"/>
        </svg>
        Add Slice
      </button>
      <div class="pill" id="count-pill">10 slices</div>
    </div>
    <button class="btn btn-primary" onclick="saveAll()">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/>
      </svg>
      Save to Overlay
    </button>
  </div>

  <!-- Hub Image -->
  <div class="section-head">
    <span class="section-label">Hub Image</span>
    <div class="section-line"></div>
  </div>

  <div class="hub-panel">
    <div class="hub-accent"></div>
    <div class="hub-body">
      <div class="hub-drop" id="hub-drop">
        <input type="file" id="hub-file" accept="image/*" onchange="onHubFile(this)" title="Upload hub image" aria-label="Upload hub image">
        <img id="hub-preview" alt="">
        <div class="hub-drop-icon" id="hub-drop-icon">🎡</div>
        <div class="hub-drop-hint" id="hub-drop-hint">Drop or<br>click</div>
      </div>

      <div class="hub-info">
        <div class="hub-title">Center Circle</div>
        <div class="hub-desc">
          Upload any image — it auto-crops to fill<br>
          the wheel hub. PNG with transparency works best.<br>
          Keep file under ~2 MB for localStorage.
        </div>
      </div>

      <div class="hub-actions">
        <button class="btn-hub btn-hub-save" id="btn-hub-save" onclick="saveHub()" disabled>
          ↑ Save Image
        </button>
        <button class="btn-hub btn-hub-clear" id="btn-hub-clear" onclick="clearHub()" disabled>
          × Clear
        </button>
        <span id="hub-status"></span>
      </div>
    </div>
  </div>

  <!-- Segments -->
  <div class="section-head">
    <span class="section-label">Wheel Slices</span>
    <div class="section-line"></div>
  </div>

  <div class="seg-grid" id="seg-grid"></div>

</div><!-- /page -->

<div id="toast"><span class="toast-dot"></span> Saved to overlay</div>

<script>
/* ════════════════════════════════════════════════════
   DATA
════════════════════════════════════════════════════ */
const LS_SEGS = 'sw_segments';
const LS_HUB  = 'sw_hub_image';

const DEFAULTS = [
  { key:'WCG',           label:'Winner\nChoose Game', color:'#7c3aed', text:'#ffffff' },
  { key:'SF',            label:'Shitface',            color:'#0d9488', text:'#ffffff' },
  { key:'Hydrate',       label:'Hydrate',             color:'#9333ea', text:'#ffffff' },
  { key:'ViewersChoice', label:"Viewer's\nChoice",    color:'#0891b2', text:'#ffffff' },
  { key:'fallgreement',  label:'Fallgreement',        color:'#6d28d9', text:'#ffffff' },
  { key:'VI',            label:'Voice Impression',    color:'#14b8a6', text:'#ffffff' },
  { key:'Cosplay',       label:'CC Cosplay',          color:'#5b21b6', text:'#ffffff' },
  { key:'Nothing',       label:'Nothing',             color:'#1e293b', text:'#ffffff' },
  { key:'No Swear',      label:'No Swearing',         color:'#4f46e5', text:'#ffffff' },
  { key:'DF',            label:'Diabolical Foods',    color:'#0e7490', text:'#ffffff' },
];

let segments = [];

function load() {
  try {
    const s = localStorage.getItem(LS_SEGS);
    segments = s ? JSON.parse(s) : JSON.parse(JSON.stringify(DEFAULTS));
  } catch(e) {
    segments = JSON.parse(JSON.stringify(DEFAULTS));
  }
  render();
  initHub();
}

/* ════════════════════════════════════════════════════
   HUB IMAGE
════════════════════════════════════════════════════ */
let pendingHub = null;

function initHub() {
  const stored = localStorage.getItem(LS_HUB);
  if (stored) { showHubPreview(stored); setHubStatus('saved', '● Saved'); document.getElementById('btn-hub-clear').disabled = false; }

  const zone = document.getElementById('hub-drop');
  zone.addEventListener('dragover',  e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', ()  => zone.classList.remove('drag-over'));
  zone.addEventListener('drop',      e => {
    e.preventDefault(); zone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) readHubFile(f);
  });
}

function onHubFile(input) {
  if (input.files[0]) readHubFile(input.files[0]);
}

function readHubFile(file) {
  const r = new FileReader();
  r.onload = e => {
    pendingHub = e.target.result;
    showHubPreview(pendingHub);
    document.getElementById('btn-hub-save').disabled  = false;
    document.getElementById('btn-hub-clear').disabled = false;
    setHubStatus('', 'Unsaved');
  };
  r.readAsDataURL(file);
}

function showHubPreview(src) {
  const img  = document.getElementById('hub-preview');
  const icon = document.getElementById('hub-drop-icon');
  const hint = document.getElementById('hub-drop-hint');
  img.src = src; img.classList.add('visible');
  icon.style.display = hint.style.display = 'none';
}

function clearHubPreview() {
  const img  = document.getElementById('hub-preview');
  const icon = document.getElementById('hub-drop-icon');
  const hint = document.getElementById('hub-drop-hint');
  img.classList.remove('visible'); img.src = '';
  icon.style.display = hint.style.display = '';
}

function saveHub() {
  if (!pendingHub) return;
  try {
    localStorage.setItem(LS_HUB, pendingHub);
    pendingHub = null;
    document.getElementById('btn-hub-save').disabled = true;
    setHubStatus('saved', '● Saved');
    showToast();
  } catch(e) {
    alert('Image too large for storage. Please use a smaller image (under ~2 MB).');
  }
}

function clearHub() {
  localStorage.removeItem(LS_HUB);
  pendingHub = null;
  clearHubPreview();
  document.getElementById('btn-hub-save').disabled  = true;
  document.getElementById('btn-hub-clear').disabled = true;
  document.getElementById('hub-file').value = '';
  setHubStatus('cleared', '○ Cleared');
  setTimeout(() => setHubStatus('', ''), 2200);
}

function setHubStatus(cls, txt) {
  const el = document.getElementById('hub-status');
  el.className = cls; el.textContent = txt;
}

/* ════════════════════════════════════════════════════
   SEGMENT RENDER
════════════════════════════════════════════════════ */
function render() {
  const grid = document.getElementById('seg-grid');
  grid.innerHTML = '';

  segments.forEach((seg, i) => {
    const card = document.createElement('div');
    card.className = 'seg-card';
    card.style.setProperty('--card-col', seg.color);

    card.innerHTML = `
      <div class="seg-strip"></div>
      <div class="seg-body">
        <div class="seg-row-top">
          <span class="seg-index">Slice ${i + 1}</span>
          <button class="btn btn-danger" onclick="removeSegment(${i})">× Remove</button>
        </div>

        <div class="field">
          <label>Key ID</label>
          <input class="input-text inp-key" type="text"
            value="${esc(seg.key)}" placeholder="UniqueKey">
        </div>

        <div class="divider"></div>

        <div class="field">
          <label>Label — use \\n for line wrap</label>
          <input class="input-text inp-label" type="text"
            value="${esc(seg.label)}" placeholder="Line 1\\nLine 2">
        </div>

        <div class="color-row">
          <div class="field">
            <label>Slice color</label>
            <div class="color-wrap">
              <input type="color" class="inp-color" value="${norm(seg.color)}"
                oninput="syncPicker(this)">
              <input type="text" class="hex-field inp-color-hex"
                value="${norm(seg.color)}" maxlength="7" spellcheck="false"
                oninput="syncHex(this)">
            </div>
          </div>
          <div class="field">
            <label>Text color</label>
            <div class="color-wrap">
              <input type="color" class="inp-text" value="${norm(seg.text||'#ffffff')}"
                oninput="syncPicker(this)">
              <input type="text" class="hex-field inp-text-hex"
                value="${norm(seg.text||'#ffffff')}" maxlength="7" spellcheck="false"
                oninput="syncHex(this)">
            </div>
          </div>
        </div>
      </div>`;

    grid.appendChild(card);
  });

  document.getElementById('count-pill').textContent =
    `${segments.length} slice${segments.length !== 1 ? 's' : ''}`;
}

/* ════════════════════════════════════════════════════
   COLOR SYNC
════════════════════════════════════════════════════ */
function syncPicker(picker) {
  const hex = picker.value;
  picker.nextElementSibling.value = hex;
  picker.nextElementSibling.classList.remove('bad');
  if (picker.classList.contains('inp-color'))
    picker.closest('.seg-card').style.setProperty('--card-col', hex);
}

function syncHex(field) {
  let v = field.value.trim();
  if (!v.startsWith('#')) v = '#' + v;
  field.value = v.toUpperCase();
  const ok = /^#[0-9A-Fa-f]{6}$/.test(v);
  field.classList.toggle('bad', !ok);
  if (ok) {
    field.previousElementSibling.value = v.toLowerCase();
    if (field.classList.contains('inp-color-hex'))
      field.closest('.seg-card').style.setProperty('--card-col', v);
  }
}

/* ════════════════════════════════════════════════════
   CRUD
════════════════════════════════════════════════════ */
function readCards() {
  document.querySelectorAll('.seg-card').forEach((card, i) => {
    segments[i] = {
      key:   card.querySelector('.inp-key').value,
      label: card.querySelector('.inp-label').value,
      color: validHex(card.querySelector('.inp-color-hex')) || card.querySelector('.inp-color').value,
      text:  validHex(card.querySelector('.inp-text-hex'))  || card.querySelector('.inp-text').value,
    };
  });
}

function validHex(field) {
  return /^#[0-9A-Fa-f]{6}$/.test(field.value) ? field.value : null;
}

function addSegment() {
  readCards();
  segments.push({ key: 'NEW', label: 'New Slice', color: '#7c3aed', text: '#ffffff' });
  render();
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function removeSegment(i) {
  readCards();
  segments.splice(i, 1);
  render();
}

function saveAll() {
  readCards();
  if (segments.length === 0) {
    alert('Keep at least one slice!');
    return;
  }
  localStorage.setItem(LS_SEGS, JSON.stringify(segments));
  showToast();
}

/* ════════════════════════════════════════════════════
   UTILS
════════════════════════════════════════════════════ */
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function norm(c) {
  if (!c || !c.startsWith('#')) return '#ffffff';
  if (c.length === 4) return '#' + c[1]+c[1]+c[2]+c[2]+c[3]+c[3];
  return c.slice(0, 7);
}

let toastTimer;
function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

load();
</script>
</body>
</html>
