<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic Burp Counter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Teko:wght@700&display=swap');

        body { 
            margin: 0; 
            padding: 40px; 
            background: transparent; 
            overflow: hidden; 
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            align-items: center;
        }

        #burp-container {
            display: flex; 
            flex-direction: column;
            align-items: center; 
            background: rgba(5, 15, 20, 0.75);
            -webkit-backdrop-filter: blur(15px);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 242, 255, 0.2); 
            border-top: 1px solid rgba(0, 242, 255, 0.5);
            border-right: 1px solid rgba(0, 242, 255, 0.3);
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 
                        inset 0 0 20px rgba(0, 242, 255, 0.05);
            padding: 20px 50px; 
            width: fit-content; 
            position: relative;

            /* --- TRANSITION LOGIC --- */
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            /* Default: transition OUT (15 seconds) */
            transition: opacity 15s ease-out, transform 15s ease-out;
        }

        /* APPEARANCE LOGIC (Smooth In - 5s) */
        #burp-container.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
            transition: opacity 5s ease-in, transform 5s ease-out;
        }

        #burp-container::before {
            content: 'AUDIO_INPUT: CAPTURED';
            position: absolute;
            top: -10px;
            right: 20px;
            background: #00f2ff;
            color: #000;
            font-size: 9px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 2px;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.6);
        }

        .stat-group { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            color: white; 
            margin: 10px 0;
            z-index: 2;
        }

        .label { 
            font-size: 0.8rem; 
            letter-spacing: 6px; 
            color: #00f2ff; 
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.6); 
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .count { 
            font-family: 'Teko', sans-serif;
            font-size: 5.5rem; 
            font-weight: 700; 
            line-height: 0.85;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(0, 242, 255, 0.8),
                         0 0 30px rgba(0, 242, 255, 0.4);
            margin: 0;
        }

        .ripple {
            position: absolute;
            border: 2px solid rgba(0, 242, 255, 0.5);
            border-radius: 12px;
            pointer-events: none;
            z-index: 1;
        }

        .shockwave { 
            animation: sonic-boom 0.5s cubic-bezier(0.16, 1, 0.3, 1); 
        }

        @keyframes sonic-boom {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.05); filter: brightness(1.8) drop-shadow(0 0 15px #00f2ff); }
            100% { transform: scale(1); }
        }

        .sonic-bar {
            width: 100%;
            height: 2px;
            background: rgba(0, 242, 255, 0.2);
            margin-top: 15px;
            position: relative;
            overflow: hidden;
        }

        .sonic-bar::after {
            content: '';
            position: absolute;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #00f2ff, transparent);
            animation: sweep 3s infinite linear;
        }

        @keyframes sweep {
            100% { left: 100%; }
        }
    </style>
</head>
<body>

<div id="burp-container">
    <div class="stat-group" id="burp-group">
        <div class="label">Burp Count</div>
        <div id="burp-count" class="count">0</div>
    </div>
    <div class="sonic-bar"></div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);
    
    let hideTimeout; // This was missing in your draft

    function triggerRipple() {
        const container = document.getElementById('burp-container');
        const ripple = document.createElement('div');
        ripple.className = 'ripple';
        const rect = container.getBoundingClientRect();
        ripple.style.width = rect.width + 'px';
        ripple.style.height = rect.height + 'px';
        ripple.style.left = '0px';
        ripple.style.top = '0px';
        container.appendChild(ripple);

        ripple.animate([
            { transform: 'scale(1)', opacity: 0.8 },
            { transform: 'scale(1.5)', opacity: 0 }
        ], { duration: 600, easing: 'ease-out' }).onfinish = () => ripple.remove();
    }

    ws.onopen = () => {
        ws.send(JSON.stringify({ request: "Subscribe", events: { general: ["Custom"] }, id: "BurpStats" }));
    };

    ws.onmessage = (event) => {
        const response = JSON.parse(event.data);
        const d = response.data || response;

        if (d.eventName === "updateBurps") {
            const countEl = document.getElementById('burp-count');
            const groupEl = document.getElementById('burp-group');
            const container = document.getElementById('burp-container');

            if (parseInt(d.count) > parseInt(countEl.innerText)) {
                triggerRipple();
            }

            countEl.innerText = d.count;

            groupEl.classList.remove('shockwave');
            void groupEl.offsetWidth; 
            groupEl.classList.add('shockwave');

            // --- FADE IN / OUT LOGIC ---
            container.classList.add('active'); // Start 5s Fade In
            
            clearTimeout(hideTimeout); // Reset timer if another burp happens

            // Wait 5 seconds (the length of the "In" animation) before starting the "Out" fade
            hideTimeout = setTimeout(() => {
                container.classList.remove('active');
            }, 5000); 
        }
    };
</script>
</body>
</html>
