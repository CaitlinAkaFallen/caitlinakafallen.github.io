<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek Adv. Kill Counter</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Teko:wght@700&display=swap');

body { 
    margin: 0; 
    padding: 20px; 
    background: transparent; 
    overflow: hidden; 
    font-family: 'Share Tech Mono', monospace;
    display: flex;
    align-items: center;
}

/* ADVANCED GLASS CONTAINER */
#kill-container {
    display: flex; 
    flex-direction: column;
    align-items: center; 
    background: rgba(10, 5, 5, 0.7); 
    
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    
    border: 1px solid rgba(255, 20, 20, 0.2); 
    border-top: 1px solid rgba(255, 20, 20, 0.5);
    border-left: 1px solid rgba(255, 20, 20, 0.3);
    border-radius: 8px; 
    
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 
                inset 0 0 15px rgba(255, 20, 20, 0.05),
                0 0 15px rgba(255, 20, 20, 0.1);

    padding: 15px 40px 25px 40px; 
    width: fit-content; 
    position: relative;
    
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s;
    visibility: hidden;
    pointer-events: none;
}

#kill-container::after {
    content: '';
    position: absolute;
    bottom: -6px; left: 15%;
    width: 70%; height: 2px;
    background: rgba(255, 20, 20, 0.4);
    box-shadow: 0 0 12px 1px rgba(255, 20, 20, 0.6);
}

#kill-container.active {
    opacity: 1;
    transform: translateY(0);
    visibility: visible;
    pointer-events: auto;
}

.stat-group { 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    color: white; 
    position: relative; 
    margin: 15px 0;
}

.label { 
    font-size: 0.85rem; 
    letter-spacing: 5px; 
    color: #ff4444; 
    text-shadow: 0 0 10px rgba(255, 20, 20, 0.6); 
    text-transform: uppercase;
    margin-bottom: 8px;
}

.count { 
    font-family: 'Teko', sans-serif;
    font-size: 5.5rem; 
    font-weight: 700; 
    line-height: 0.9;
    margin-top: 5px;
    z-index: 2; 
    color: #ffffff;
    text-shadow: 0 0 15px rgba(255, 0, 0, 0.8),
                 0 0 30px rgba(255, 0, 0, 0.5),
                 0 0 50px rgba(255, 0, 0, 0.3);
}

.footer-log {
    font-size: 10px;
    color: rgba(255, 255, 255, 0.5); 
    text-transform: uppercase;
    letter-spacing: 2.5px;
    font-weight: bold;
    margin-top: 15px;
}

.footer-log:first-child {
    margin-top: 0;
    margin-bottom: 5px;
}

#threat-level {
    color: #ff2222;
    transition: color 0.3s ease, text-shadow 0.3s ease;
    text-shadow: 0 0 8px rgba(255, 34, 34, 0.4);
}

.shatter { 
    animation: skull-shatter 0.4s cubic-bezier(0.19, 1, 0.22, 1); 
}

@keyframes skull-shatter {
    0% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.1); filter: brightness(1.5); }
    100% { transform: scale(1); }
}
    </style>
</head>
<body>

<div id="kill-container">
    <div class="footer-log">FILE_LOG: REQUEM_ACTIVE</div>
    
    <div class="stat-group" id="kill-group">
        <div class="label">Kills</div>
        <div id="kill-count" class="count">0</div>
    </div>
    
    <div class="footer-log threat-log">
        THREAT_LEVEL: <span id="threat-level">VERIFIED</span>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);

    let hideTimeout;

    ws.onopen = () => {
        ws.send(JSON.stringify({ request: "Subscribe", events: { general: ["Custom"] }, id: "KillStats" }));
        console.log("Connected to Streamer.bot");
    };

    function updateThreatLevel(kills) {
        const levelEl = document.getElementById('threat-level');
        if (kills < 5) {
            levelEl.innerText = "VERIFIED"; levelEl.style.color = "#ffddaa"; levelEl.style.textShadow = "none";
        } else if (kills < 10) {
            levelEl.innerText = "ELEVATED"; levelEl.style.color = "#ff8800"; levelEl.style.textShadow = "0 0 10px rgba(255,136,0,0.5)";
        } else {
            levelEl.innerText = "CATASTROPHIC"; levelEl.style.color = "#ff0000"; levelEl.style.textShadow = "0 0 15px rgba(255,0,0,0.8)";
        }
    }

    ws.onmessage = (event) => {
        const response = JSON.parse(event.data);
        const d = response.data || response;

        if (d.eventName === "updateKills") {
            const countEl = document.getElementById('kill-count');
            const groupEl = document.getElementById('kill-group');
            const posterEl = document.getElementById('kill-container');

            // 1. Update text and internal logic
            countEl.innerText = d.count;
            updateThreatLevel(parseInt(d.count));

            // 2. Trigger Entrance and Pulse
            posterEl.classList.add('active');
            groupEl.classList.remove('shatter');
            void groupEl.offsetWidth; // Reflow for animation restart
            groupEl.classList.add('shatter');

            // 3. Clear existing timer and set new 10-second exit timer
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => {
                posterEl.classList.remove('active');
            }, 10000); // 10000ms = 10 seconds
        }
    };
</script>
</body>
</html>
