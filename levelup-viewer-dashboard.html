<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FallenOneArt - My Level</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --accent-primary:#7de8c8;
    --accent-secondary:#c8a2ff;
    --accent-tertiary:#ff6b9d;
    --gold:#ffd27d;
    --bg-deep:#0a0915;
    --bg-panel:rgba(22,20,34,0.55);
    --bg-panel-elevated:rgba(30,25,50,0.7);
    --border-soft:rgba(255,255,255,0.1);
    --border-medium:rgba(255,255,255,0.15);
    --text-primary:#f3f1f8;
    --text-secondary:#9a97ab;
    --text-tertiary:#6f6c80;
    --font-display:'Orbitron', sans-serif;
    --font-mono:'Share Tech Mono', monospace;
    --shadow-md:0 8px 24px rgba(0,0,0,0.4);
    --glow-primary:0 0 20px rgba(125,232,200,0.3);
    --glow-secondary:0 0 20px rgba(200,162,255,0.3);
    --corner-radius:14px;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; min-height:100%;
    font-family:var(--font-mono);
    color:var(--text-primary);
    letter-spacing:0.3px;
    background:
      radial-gradient(ellipse at 15% -10%, rgba(125,232,200,0.14), transparent 50%),
      radial-gradient(ellipse at 110% 20%, rgba(200,162,255,0.12), transparent 50%),
      radial-gradient(ellipse at 50% 100%, rgba(255,107,157,0.05), transparent 60%),
      var(--bg-deep);
  }
  a{ color:var(--accent-primary); }
  h2{ font-family:var(--font-display); font-size:12px; letter-spacing:1.8px; color:var(--accent-primary); text-transform:uppercase; margin:0 0 4px; font-weight:700; }
  .wrap{ max-width:640px; margin:0 auto; padding:22px 18px 60px; }

  /* ---- Brand header ---- */
  .brand-bar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:linear-gradient(135deg, rgba(125,232,200,0.06), rgba(200,162,255,0.04));
    border:1px solid var(--border-medium);
    border-radius:var(--corner-radius);
    padding:14px 18px;
    margin-bottom:18px;
  }
  .brand{
    font-family:var(--font-display); font-weight:900; font-size:14px; letter-spacing:2px;
    color:var(--text-primary); display:flex; align-items:center; gap:12px;
  }
  .brand .dot{
    width:10px; height:10px; border-radius:50%;
    background:linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
    box-shadow:var(--glow-primary), inset 0 0 8px rgba(125,232,200,0.4);
    animation:pulse-dot 2s ease-in-out infinite;
    flex:0 0 auto;
  }
  @keyframes pulse-dot{0%,100%{opacity:1;}50%{opacity:0.65;}}
  .brand small{
    display:block; font-family:var(--font-mono); font-size:9px; color:var(--text-tertiary);
    letter-spacing:2px; font-weight:500; margin-top:3px;
  }

  input{
    font-family:inherit; background:linear-gradient(135deg, rgba(30,25,50,0.6), rgba(25,22,40,0.6));
    border:1px solid var(--border-medium); color:var(--text-primary); border-radius:10px;
    padding:10px 12px; font-size:13px; flex:1; transition:all .25s ease;
  }
  input:focus{ outline:none; border-color:var(--accent-primary); box-shadow:0 0 0 2px rgba(125,232,200,0.2), var(--glow-primary); }

  button{
    font-family:var(--font-display); font-size:11px; letter-spacing:1px; text-transform:uppercase;
    cursor:pointer; border:none; border-radius:10px; padding:10px 18px; color:#0a0915; font-weight:700;
    background:linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
    transition:all .25s ease; box-shadow:0 4px 14px rgba(125,232,200,0.15);
  }
  button:hover{ transform:translateY(-1px); box-shadow:var(--glow-primary), 0 4px 14px rgba(125,232,200,0.2); }
  button:active{ transform:translateY(0) scale(0.98); }
  button.secondary{
    background:transparent; color:var(--text-secondary); border:1.5px solid var(--border-medium); box-shadow:none;
  }
  button.secondary:hover{ color:var(--text-primary); border-color:var(--accent-primary); background:rgba(125,232,200,0.08); box-shadow:0 0 14px rgba(125,232,200,0.2); }
  button.small{ padding:7px 12px; font-size:9.5px; }

  /* ---- Login with Twitch — Text + Underline Sweep style ---- */
  .twitch-login-btn{
    background:transparent;
    color:var(--accent-primary);
    border:none;
    box-shadow:none;
    padding:8px 2px;
    display:inline-flex;
    align-items:center;
    gap:10px;
    position:relative;
    font-family:var(--font-display);
    font-size:13px;
    font-weight:700;
    letter-spacing:1.5px;
    text-transform:uppercase;
    transition:color .25s ease;
  }
  .twitch-login-btn svg{
    width:20px; height:20px; flex:0 0 auto;
    filter:drop-shadow(0 0 6px rgba(125,232,200,0.35));
    transition:filter .25s ease;
  }
  .twitch-login-btn::after{
    content:'';
    position:absolute;
    left:0; right:100%; bottom:2px;
    height:2px;
    background:linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
    box-shadow:0 0 8px rgba(125,232,200,0.6);
    transition:right .35s cubic-bezier(.4,0,.2,1);
  }
  .twitch-login-btn:hover{
    color:var(--text-primary);
    transform:none;
    box-shadow:none;
  }
  .twitch-login-btn:hover svg{ filter:drop-shadow(0 0 10px rgba(125,232,200,0.6)); }
  .twitch-login-btn:hover::after{ right:0; }
  .twitch-login-btn:active{ transform:none; }

  .auth-bar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .auth-chip{
    display:flex; align-items:center; gap:9px;
    background:linear-gradient(135deg, rgba(30,25,50,0.6), rgba(25,22,40,0.6));
    border:1px solid var(--border-medium); border-radius:22px; padding:5px 14px 5px 5px; font-size:12px;
  }
  .auth-chip img{ width:28px; height:28px; border-radius:50%; object-fit:cover; border:1.5px solid rgba(125,232,200,0.4); }

  /* ---- Settings details/summary ---- */
  #twitchSettingsPanel{ padding:0; overflow:hidden; }
  #twitchSettingsPanel summary{
    list-style:none; cursor:pointer; padding:14px 18px;
    font-family:var(--font-mono); font-size:11.5px; color:var(--text-secondary);
    letter-spacing:.5px; display:flex; align-items:center; gap:8px;
    transition:background .2s ease, color .2s ease;
  }
  #twitchSettingsPanel summary::-webkit-details-marker{ display:none; }
  #twitchSettingsPanel summary::before{ content:'⚙'; color:var(--accent-primary); font-size:13px; }
  #twitchSettingsPanel summary:hover{ background:rgba(125,232,200,0.06); color:var(--text-primary); }
  #twitchSettingsPanel[open] summary{ border-bottom:1px solid var(--border-soft); }
  #twitchSettingsPanel > .field,
  #twitchSettingsPanel > .hint,
  #twitchSettingsPanel > button{ margin-left:18px; margin-right:18px; }
  #twitchSettingsPanel .field{ display:flex; flex-direction:column; gap:6px; margin-top:16px; margin-bottom:10px; }
  #twitchSettingsPanel .hint{ margin-bottom:14px; font-size:11px; color:var(--text-tertiary); line-height:1.6; }
  #twitchSettingsPanel label{ font-size:10.5px; color:var(--text-secondary); letter-spacing:1px; text-transform:uppercase; font-weight:600; }
  #twitchSettingsPanel button{ margin-bottom:16px; }
  code{ background:rgba(255,255,255,0.06); padding:2px 6px; border-radius:6px; word-break:break-all; color:var(--accent-primary); font-family:var(--font-mono); }

  .input-with-toggle{ display:flex; gap:8px; }
  .input-with-toggle input{ flex:1; }
  .reveal-btn{
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:0; font-weight:400; padding:0 14px;
    background:rgba(255,255,255,0.06); color:var(--text-secondary); border:1px solid var(--border-medium);
    border-radius:9px; white-space:nowrap; box-shadow:none; text-transform:none;
  }
  .reveal-btn:hover{ color:var(--text-primary); border-color:var(--accent-primary); box-shadow:none; }

  /* ---- HUD glass panel with corner brackets ---- */
  .panel{
    position:relative;
    background:linear-gradient(135deg, rgba(30,25,50,0.55), rgba(20,17,32,0.6));
    border:1px solid var(--border-medium);
    border-radius:var(--corner-radius);
    padding:20px 22px;
    -webkit-backdrop-filter:blur(12px) saturate(140%);
    backdrop-filter:blur(12px) saturate(140%);
    box-shadow:var(--shadow-md);
    margin-bottom:16px;
  }
  .panel::before, .panel::after{
    content:''; position:absolute; width:14px; height:14px; pointer-events:none;
    border-color:var(--accent-primary); opacity:.55;
  }
  .panel::before{ top:-1px; left:-1px; border-top:2px solid; border-left:2px solid; border-top-left-radius:4px; }
  .panel::after{ bottom:-1px; right:-1px; border-bottom:2px solid; border-right:2px solid; border-bottom-right-radius:4px; }

  .profile-head{ display:flex; align-items:center; gap:14px; margin-bottom:6px; }
  .avatar-lg{
    width:56px; height:56px; border-radius:50%;
    background:linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:900; color:#0a0915; font-size:20px;
    flex:0 0 auto; overflow:hidden; box-shadow:var(--glow-primary);
  }
  .avatar-lg img{ width:100%; height:100%; object-fit:cover; object-position:center; border-radius:50%; }
  .profile-name{ font-family:var(--font-display); font-weight:700; font-size:18px; letter-spacing:1px; }
  .profile-sub{ font-size:11px; color:var(--text-secondary); margin-top:2px; }

  .xp-row{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-secondary); margin-top:16px; margin-bottom:6px; letter-spacing:.5px; }
  .xp-track{ height:12px; border-radius:6px; overflow:hidden; background:rgba(255,255,255,0.08); border:1px solid var(--border-soft); }
  .xp-fill{ height:100%; border-radius:6px; background:linear-gradient(90deg, var(--accent-primary), var(--accent-secondary)); box-shadow:0 0 10px var(--accent-primary); transition:width .8s ease; }

  .toggle-group{ display:flex; gap:8px; }
  .toggle-btn{
    flex:1; padding:10px; border-radius:var(--corner-radius); border:1.5px solid var(--border-medium);
    background:linear-gradient(135deg, rgba(30,25,50,0.5), rgba(25,22,40,0.6));
    color:var(--text-secondary); text-align:center; font-family:var(--font-display);
    font-size:11px; letter-spacing:.5px; cursor:pointer; transition:all .25s ease;
  }
  .toggle-btn:hover{ border-color:rgba(125,232,200,0.4); transform:translateY(-1px); }
  .toggle-btn.active{
    background:linear-gradient(135deg, rgba(125,232,200,0.18), rgba(200,162,255,0.1));
    color:var(--text-primary); font-weight:700; border-color:var(--accent-primary); box-shadow:var(--glow-primary);
  }

  .reward-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(120px,1fr)); gap:10px; margin-top:6px; }
  .reward-item{
    position:relative;
    background:linear-gradient(135deg, rgba(30,25,50,0.5), rgba(25,22,40,0.6));
    border:1.5px solid var(--border-medium); border-radius:12px; padding:14px 10px; text-align:center;
    transition:all .25s ease;
  }
  .reward-item .badge{ font-size:24px; filter:drop-shadow(0 0 6px var(--accent-secondary)); }
  .reward-item .title{ font-family:var(--font-display); font-size:10.5px; color:var(--gold); margin-top:6px; letter-spacing:.5px; }
  .reward-item .lvl{ font-size:10px; color:var(--text-tertiary); margin-top:2px; }
  .reward-item.locked{ opacity:.35; }
  .reward-item.ready{ border-color:rgba(125,232,200,.55); box-shadow:0 0 16px rgba(125,232,200,.18); }
  .claim-btn{ margin-top:9px; padding:6px 14px; font-size:9.5px; }

  .history-item{ display:flex; justify-content:space-between; font-size:12px; padding:7px 2px; border-bottom:1px solid var(--border-soft); }
  .history-item:last-child{ border-bottom:none; }
  .history-item .lvl{ color:var(--accent-primary); font-family:var(--font-display); font-size:11px; }
  .history-item .date{ color:var(--text-tertiary); font-size:10.5px; }

  .empty{ color:var(--text-tertiary); font-size:12.5px; padding:6px 2px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="brand-bar">
    <div class="brand"><span class="dot"></span>FALLENONEART<small>MY LEVEL</small></div>
  </div>

  <div class="auth-bar">
    <div id="twitchAuthBar"></div>
  </div>

  <details class="panel" id="twitchSettingsPanel">
    <summary class="settings-toggle">Twitch app settings</summary>
    <div class="field">
      <label>Client ID</label>
      <div class="input-with-toggle">
        <input type="password" id="twitchClientId" placeholder="Your Twitch application's Client ID">
        <button type="button" class="reveal-btn" id="toggleClientIdVisibility">Show</button>
      </div>
    </div>
    <div class="hint">
      Register a free app at <code>dev.twitch.tv/console/apps</code> and set its OAuth Redirect URL to exactly:<br>
      <code id="redirectUriHint"></code><br>
      Category: "Website Integration". No client secret is needed — this uses Twitch's browser-only Implicit Grant flow, so the token never leaves this page.
    </div>
    <button id="saveTwitchCfgBtn">Save</button>
  </details>

  <div id="content"></div>
</div>

<script>
const LS_DISPLAY = "fallenoneart_levelup_display";
const LS_REWARDS = "fallenoneart_levelup_rewards";
const LS_USERS   = "fallenoneart_levelup_users";
const LS_CURVE   = "fallenoneart_levelup_curve";
const LS_TWITCH_CFG   = "fallenoneart_levelup_twitch_cfg";   // { clientId }
const LS_TWITCH_TOKEN = "fallenoneart_levelup_twitch_token"; // { accessToken, login, displayName, avatar }
const CHANNEL    = "fallenoneart_levelup_channel";
let bc = null;
try{ if ("BroadcastChannel" in window) bc = new BroadcastChannel(CHANNEL); }catch(e){ bc = null; }

function load(key, fallback){ try{ const r = localStorage.getItem(key); return r ? JSON.parse(r) : fallback; }catch(e){ return fallback; } }
function save(key, val){ localStorage.setItem(key, JSON.stringify(val)); }
function escapeHtml(str){ const d = document.createElement("div"); d.textContent = str ?? ""; return d.innerHTML; }

/* Simple chat-bubble glyph for the Login with Twitch button */
const TWITCH_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5h16v10.2a1.8 1.8 0 0 1-1.8 1.8H10l-3.6 3.6v-3.6H5.8A1.8 1.8 0 0 1 4 14.7V4.5z"/><line x1="9" y1="8.5" x2="9" y2="12"/><line x1="14.5" y1="8.5" x2="14.5" y2="12"/></svg>`;

const params = new URLSearchParams(window.location.search);
const storedTwitchToken = load(LS_TWITCH_TOKEN, null);
let currentUser = (params.get("user") || (storedTwitchToken && storedTwitchToken.login) || "").trim().toLowerCase();

/* ============================================================
   TWITCH LOGIN (Implicit Grant — no backend, token stays in this page)
   ============================================================ */
function twitchCfg(){ return load(LS_TWITCH_CFG, { clientId:"" }); }
function redirectUri(){ return window.location.origin + window.location.pathname; }
document.getElementById("redirectUriHint").textContent = redirectUri();
document.getElementById("twitchClientId").value = twitchCfg().clientId;
document.getElementById("toggleClientIdVisibility").onclick = () => {
  const input = document.getElementById("twitchClientId");
  const btn = document.getElementById("toggleClientIdVisibility");
  const showing = input.type === "text";
  input.type = showing ? "password" : "text";
  btn.textContent = showing ? "Show" : "Hide";
};
document.getElementById("twitchSettingsPanel").addEventListener("toggle", (e) => {
  document.getElementById("twitchClientId").value = twitchCfg().clientId;
  if (e.target.open){
    document.getElementById("twitchClientId").type = "password";
    document.getElementById("toggleClientIdVisibility").textContent = "Show";
  }
});
document.getElementById("saveTwitchCfgBtn").onclick = () => {
  save(LS_TWITCH_CFG, { clientId: document.getElementById("twitchClientId").value.trim() });
  document.getElementById("twitchSettingsPanel").removeAttribute("open");
};

function startTwitchLogin(){
  const cfg = twitchCfg();
  if (!cfg.clientId){
    alert("Add your Twitch app's Client ID under \"Twitch app settings\" first.");
    document.getElementById("twitchSettingsPanel").setAttribute("open", "");
    return;
  }
  const p = new URLSearchParams({ client_id: cfg.clientId, redirect_uri: redirectUri(), response_type:"token", scope:"", force_verify:"true" });
  window.location.href = `https://id.twitch.tv/oauth2/authorize?${p.toString()}`;
}
function logoutTwitch(){
  localStorage.removeItem(LS_TWITCH_TOKEN);
  renderAuthBar();
}

async function handleTwitchRedirect(){
  if (!window.location.hash.includes("access_token")) return;
  const hash = new URLSearchParams(window.location.hash.slice(1));
  const accessToken = hash.get("access_token");
  history.replaceState(null, "", window.location.pathname + window.location.search);
  if (accessToken) await fetchTwitchIdentity(accessToken);
}

async function fetchTwitchIdentity(accessToken){
  const cfg = twitchCfg();
  try{
    const res = await fetch("https://api.twitch.tv/helix/users", {
      headers: { "Authorization": `Bearer ${accessToken}`, "Client-Id": cfg.clientId }
    });
    if (!res.ok) throw new Error("identity check failed");
    const json = await res.json();
    const u = json.data && json.data[0];
    if (!u) throw new Error("no user in response");
    save(LS_TWITCH_TOKEN, { accessToken, login: u.login, displayName: u.display_name, avatar: u.profile_image_url });

    const users = load(LS_USERS, {});
    const rec = users[u.login] || { xp:0, level:1, unlockedLevels:[], history:[] };
    rec.avatar = u.profile_image_url;
    users[u.login] = rec;
    save(LS_USERS, users);
    bc && bc.postMessage({ type:"user_update", user: u.login, data: rec });

    currentUser = u.login;
  }catch(e){
    console.warn("Twitch login failed:", e);
    localStorage.removeItem(LS_TWITCH_TOKEN);
  }
  renderAuthBar();
  render();
}

function renderAuthBar(){
  const bar = document.getElementById("twitchAuthBar");
  const t = load(LS_TWITCH_TOKEN, null);
  if (t){
    bar.innerHTML = `<div class="auth-chip"><img src="${escapeHtml(t.avatar)}" alt=""><span>Logged in as <b>${escapeHtml(t.displayName)}</b></span><button class="secondary small" id="twitchLogoutBtn">Log out</button></div>`;
    document.getElementById("twitchLogoutBtn").onclick = logoutTwitch;
  } else {
    bar.innerHTML = `<button id="twitchLoginBtn" class="twitch-login-btn">${TWITCH_ICON_SVG}<span>Login with Twitch</span></button>`;
    document.getElementById("twitchLoginBtn").onclick = startTwitchLogin;
  }
}
renderAuthBar();

function computeXpForNext(level){
  const c = load(LS_CURVE, { base:100, growth:1.15 });
  return Math.round(c.base * Math.pow(c.growth, Math.max(0, level-1)));
}

function render(){
  const content = document.getElementById("content");
  if (!currentUser){
    content.innerHTML = `<div class="panel"><div class="empty">Login with Twitch above to see your level, XP, and unlocked rewards live as you earn them.</div></div>`;
    return;
  }
  const users = load(LS_USERS, {});
  const rec = users[currentUser] || { xp:0, level:1, unlockedLevels:[], history:[] };
  const rewards = load(LS_REWARDS, []).sort((a,b) => a.level - b.level);
  const xpForNext = computeXpForNext(rec.level);
  const pct = Math.max(0, Math.min(100, (rec.xp % xpForNext) / xpForNext * 100));
  const display = load(LS_DISPLAY, { layout:"horizontal", style:"glass" });
  const layoutPref = rec.layoutPref || display.layout;
  const stylePref = rec.stylePref || display.style;

  const rewardCards = rewards.map(r => {
    const unlocked = (rec.unlockedLevels||[]).includes(r.level);
    const claimed = (rec.claimedLevels||[]).includes(r.level);
    let stateClass = "locked", stateLabel = `Lv ${r.level} · locked`, actionHtml = "";
    if (unlocked && claimed){ stateClass = ""; stateLabel = `Lv ${r.level} · claimed`; }
    else if (unlocked && !claimed){ stateClass = "ready"; stateLabel = `Lv ${r.level} · ready to claim!`; actionHtml = `<button class="claim-btn" data-claim-level="${r.level}">Claim</button>`; }
    return `<div class="reward-item ${stateClass}">
      <div class="badge">${escapeHtml(r.badge || "★")}</div>
      <div class="title">${escapeHtml(r.title)}</div>
      <div class="lvl">${stateLabel}</div>
      ${actionHtml}
    </div>`;
  }).join("");

  const historyItems = (rec.history || []).slice().reverse().map(h => `
    <div class="history-item"><span class="lvl">Reached Level ${h.level}</span><span class="date">${new Date(h.ts).toLocaleDateString()}</span></div>
  `).join("") || `<div class="empty">No milestones reached yet — keep engaging in stream!</div>`;

  content.innerHTML = `
    <div class="panel">
      <div class="profile-head">
        <div class="avatar-lg">${rec.avatar ? `<img src="${escapeHtml(rec.avatar)}" alt="" onerror="this.remove()">` : escapeHtml(currentUser[0]?.toUpperCase() || "?")}</div>
        <div>
          <div class="profile-name">${escapeHtml(currentUser)}</div>
          <div class="profile-sub">Level ${rec.level} &middot; ${rec.xp} total XP</div>
        </div>
      </div>
      <div class="xp-row"><span>Progress to Lv ${rec.level+1}</span><span>${Math.round(rec.xp % xpForNext)} / ${xpForNext} XP</span></div>
      <div class="xp-track"><div class="xp-fill" style="width:${pct}%"></div></div>
    </div>

    <div class="panel">
      <h2>My Card Preference</h2>
      <div style="display:flex; flex-direction:column; gap:10px; margin-top:8px;">
        <div class="toggle-group" id="layoutToggle">
          <div class="toggle-btn" data-val="horizontal">Horizontal</div>
          <div class="toggle-btn" data-val="vertical">Vertical</div>
        </div>
        <div class="toggle-group" id="styleToggle">
          <div class="toggle-btn" data-val="glass">Neon Glass</div>
          <div class="toggle-btn" data-val="minimal">Minimal Flat</div>
          <div class="toggle-btn" data-val="crt">CRT Scanline</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>Rewards Inventory</h2>
      <div class="reward-grid">${rewardCards || `<div class="empty">No milestones configured yet.</div>`}</div>
    </div>

    <div class="panel">
      <h2>Milestone History</h2>
      ${historyItems}
    </div>
  `;

  document.querySelectorAll("#layoutToggle .toggle-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.val === layoutPref);
    b.onclick = () => setPref("layoutPref", b.dataset.val);
  });
  document.querySelectorAll("#styleToggle .toggle-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.val === stylePref);
    b.onclick = () => setPref("stylePref", b.dataset.val);
  });
  document.querySelectorAll(".claim-btn").forEach(b => {
    b.onclick = () => claimReward(Number(b.dataset.claimLevel));
  });

  if (!rec.avatar && !avatarFetchAttempted.has(currentUser)){
    avatarFetchAttempted.add(currentUser);
    fetchAvatar(currentUser);
  }
}

/* Claiming from this dashboard is the same action as typing $redeem/$claim
   in chat (see the admin dashboard's Twitch Chat Integration panel) — it
   just marks the oldest unlocked-but-unclaimed reward as claimed locally. */
function claimReward(level){
  const users = load(LS_USERS, {});
  const rec = users[currentUser] || { xp:0, level:1, unlockedLevels:[], claimedLevels:[], history:[] };
  rec.claimedLevels = rec.claimedLevels || [];
  if (!rec.claimedLevels.includes(level)) rec.claimedLevels.push(level);
  users[currentUser] = rec;
  save(LS_USERS, users);
  bc && bc.postMessage({ type:"user_update", user: currentUser, data: rec });
  render();
}

/* Twitch doesn't expose profile images without an authenticated API call,
   so — same as the Tally Board scoreboard — fall back to decapi.me, which
   returns the avatar URL as plain text. Cached onto the user record once
   fetched so this only runs once per viewer. */
const avatarFetchAttempted = new Set();
async function fetchAvatar(username){
  try{
    const res = await fetch(`https://decapi.me/twitch/avatar/${encodeURIComponent(username)}`);
    if (!res.ok) return;
    const url = (await res.text()).trim();
    if (!url || !url.startsWith("http")) return; // decapi returns an error string for unknown users
    const users = load(LS_USERS, {});
    const r = users[username] || { xp:0, level:1, unlockedLevels:[], history:[] };
    r.avatar = url;
    users[username] = r;
    save(LS_USERS, users);
    bc && bc.postMessage({ type:"user_update", user: username, data: r });
    if (username === currentUser) render();
  }catch(e){ /* offline or blocked — keep the letter avatar */ }
}

function setPref(key, val){
  const users = load(LS_USERS, {});
  const rec = users[currentUser] || { xp:0, level:1, unlockedLevels:[], history:[] };
  rec[key] = val;
  users[currentUser] = rec;
  save(LS_USERS, users);
  bc && bc.postMessage({ type:"user_update", user: currentUser, data: rec });
  render();
}

bc && (bc.onmessage = (e) => { const m = e.data||{}; if (m.type === "user_update" && m.user === currentUser) render(); });
window.addEventListener("storage", (e) => { if ([LS_USERS, LS_REWARDS, LS_DISPLAY, LS_CURVE].includes(e.key)) render(); });

render();
handleTwitchRedirect();
</script>
</body>
