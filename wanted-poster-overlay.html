<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanted Poster Overlay</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Special+Elite&display=swap');

body { 
    overflow: hidden; 
    font-family: 'Special Elite', serif; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    height: 100vh; 
    margin: 0; 
    background: transparent;
}

/* SLEEK CONCRETE / GLASS CONTAINER */
.wanted-container {
    width: 650px; 
    background: rgba(15, 15, 15, 0.95);
    border: 3px solid rgba(255, 255, 255, 0.2);
    position: relative;
    padding: 40px;
    text-align: left;
    color: #fff;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9), inset 0 0 50px rgba(255, 255, 255, 0.05);
    
    -webkit-backdrop-filter: blur(15px);
    backdrop-filter: blur(15px);
    
    /* SMOOTH HIDING LOGIC: Using opacity and visibility instead of display:none */
    opacity: 0;
    visibility: hidden;
    transform: translateX(-50px);
    transition: opacity 0.8s ease, transform 0.8s ease, visibility 0.8s;
}

/* White Vertical Stripe from reference image */
.wanted-container::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 10px;
    height: 100%;
    background: #fff;
    border-right: 1px solid rgba(0, 0, 0, 0.5);
}

.main-content {
    display: flex;
    align-items: center;
    gap: 25px;
    margin-bottom: 25px;
}

.avatar-box {
    width: 150px;
    height: 150px;
    border: 3px solid #fff;
    background-size: cover;
    background-position: center;
    flex-shrink: 0; 
    filter: grayscale(0.8) contrast(1.4) brightness(0.9);
}

.data-fields {
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.name { 
    font-size: 48px; 
    letter-spacing: 2px;
    color: #fff;
    text-transform: uppercase;
    font-weight: bold;
    text-shadow: 
        -2px 0 1px rgba(0, 255, 0, 0.3), 
        2px 0 1px rgba(0, 0, 255, 0.3),
        3px 3px 0px black;
    animation: monitor-flicker 0.3s infinite alternate;
}

.wanted-tag {
    background: #fff;
    color: #000;
    font-size: 28px;
    padding: 5px 20px;
    display: inline-block;
    width: fit-content;
    font-weight: 900;
    margin: 10px 0;
    transform: rotate(-1.5deg);
    clip-path: polygon(1% 10%, 99% 2%, 100% 90%, 97% 98%, 3% 95%, 0% 85%);
}

.status { 
    font-size: 18px; 
    color: rgba(255, 255, 255, 0.8);
    text-transform: uppercase;
    letter-spacing: 1px;
}

.reward-box {
    border-top: 1px solid rgba(255, 255, 255, 0.2);
    padding-top: 20px;
    margin-top: 10px;
    display: flex;
    flex-direction: column; 
    gap: 15px; 
}

.reward-label { 
    font-size: 14px; 
    opacity: 0.7; 
    letter-spacing: 2px; 
    text-transform: uppercase;
    align-self: flex-start;
}

.reward-amount { 
    font-size: 65px; 
    color: rgba(139, 0, 0, 1); 
    font-weight: 900;
    text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.8);
    display: block;
    line-height: 1;
    align-self: flex-start;
    padding-left: 5px;
}

/* ACTIVE STATE */
.wanted-container.active {
    opacity: 1;
    visibility: visible;
    transform: translateX(0);
}

@keyframes monitor-flicker {
    0% { opacity: 0.95; transform: skew(0.1deg); }
    100% { opacity: 1; transform: skew(0deg); }
}
</style>
</head>
<body>

 <div class="wanted-container" id="poster">
    <div class="main-content">
        <div class="avatar-box" id="avatar"></div>
        <div class="data-fields">
            <div class="name" id="userName">PLAYER</div>
            <div class="wanted-tag">WANTED</div>
            <div class="status">FILE_LOG: <span id="statusText">VERIFIED</span></div>
        </div>
    </div>
    <div class="reward-box">
        <div class="reward-label">BOUNTY REWARD // UN-TAXED</div>
        <div class="reward-amount">$<span id="amount">0</span></div>
    </div>
</div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);

        let hideTimer = null;

        ws.onopen = () => {
            ws.send(JSON.stringify({ request: "Subscribe", events: { general: ["Custom"] }, id: "WantedAlert" }));
        };

        ws.onmessage = (event) => {
            const response = JSON.parse(event.data);
            if (response.data && response.data.eventName === "WantedPoster") {
                updateUI(response.data);
            }
        };

        function updateUI(data) {
            document.getElementById('avatar').style.backgroundImage = `url('${data.avatar}')`;
            document.getElementById('userName').innerText = data.user;
            document.getElementById('statusText').innerText = data.status;
            document.getElementById('amount').innerText = data.amount;
            
            const poster = document.getElementById('poster');
            poster.classList.add('active');

            if (hideTimer) clearTimeout(hideTimer);
            hideTimer = setTimeout(() => { 
                poster.classList.remove('active'); 
            }, 9000); 
        }
    </script>
</body>
</html>
