<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Breaking Cookie</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace; /* Pixel feel */
            background-color: transparent;
        }

        #alert-wrapper {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s ease-in;
        }

        #alert-wrapper.active {
            opacity: 1;
        }

        /* --- THE AVATAR (Hidden Behind) --- */
        #avatar-container {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            overflow: hidden;
            border: 6px solid #f1c40f; /* Gold ring */
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            z-index: 1; /* Lowest z-index *;
            
            /* Hidden initially, pops forward */
            transform: scale(0.6);
            opacity: 0;
            transition: all 0.5s 0.3s ease-out;
        }

        #alert-wrapper.active #avatar-container {
            transform: scale(1);
            opacity: 1;
        }

        #avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* --- THE CSS COOKIE (Left & Right Halves) --- */
        .cookie-half {
            position: absolute;
            width: 200px;
            height: 400px;
            background-color: #d2691e; /* Light chocolate */
            background-image: 
                radial-gradient(circle at 50px 100px, #8e44ad 15px, transparent 16px), /* Purple chip */
                radial-gradient(circle at 120px 250px, #3d2610 20px, transparent 21px), /* Dark chip */
                radial-gradient(circle at 160px 50px, #8e44ad 12px, transparent 13px); /* Purple chip */
            z-index: 5;
            transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }

        /* Left Half Base (Rounded edge on left) */
        #cookie-left {
            left: 0;
            border-radius: 200px 0 0 200px;
            border-right: 4px solid #3d2610; /* Darker line for crack */
            background-position: left center;
        }

        /* Right Half Base (Rounded edge on right) */
        #cookie-right {
            right: 0;
            border-radius: 0 200px 200px 0;
            border-left: 4px solid #3d2610; /* Darker line for crack */
            background-position: right center;
        }

        /* --- THE BREAKING ANIMATION --- */
        #alert-wrapper.active #cookie-left {
            transform: translateX(-150px) rotate(-15deg);
        }

        #alert-wrapper.active #cookie-right {
            transform: translateX(150px) rotate(15deg);
        }

        /* --- INFO BANNER --- */
        #ui-wrap {
            position: absolute;
            bottom: -80px;
            background: rgba(61, 38, 16, 0.9);
            color: #fff;
            padding: 10px 30px;
            border-radius: 50px;
            border: 4px solid #e67e22;
            text-align: center;
            z-index: 10;
            transition: all 0.6s 0.6s ease-out;
            opacity: 0;
        }

        #alert-wrapper.active #ui-wrap {
            bottom: 20px;
            opacity: 1;
        }

        .user-name {
            font-size: 26px;
            font-weight: 900;
            color: #f1c40f;
            margin: 0;
        }

        .total-count {
            font-size: 18px;
            font-weight: bold;
            margin: 0;
        }
    </style>
</head>
<body>

    <div id="alert-wrapper">
        <div id="avatar-container">
            <img id="avatar-img" src="">
        </div>

        <div id="cookie-left" class="cookie-half"></div>
        <div id="cookie-right" class="cookie-half"></div>

        <div id="ui-wrap">
            <p id="user-display" class="user-name">NAME</p>
            <p class="total-count">Total: <span id="count-display">0</span> 🍪</p>
        </div>
    </div>

    <script>
        // WebSocket setup with dynamic Port parameter
        const params = new URLSearchParams(window.location.search);
        const ws = new WebSocket(`ws://${params.get("address") || "localhost"}:${params.get("port") || "8080"}/`);

        const wrapper = document.getElementById('alert-wrapper');
        const avatarImg = document.getElementById('avatar-img');
        const userDisplay = document.getElementById('user-display');
        const countDisplay = document.getElementById('count-display');
        
        let hideTimer = null;

        // Subscribe to Streamer.bot Custom Events
        ws.onopen = () => {
            console.log("Connected to Streamer.bot");
            ws.send(JSON.stringify({
                request: "Subscribe",
                events: { general: ["Custom"] },
                id: "CookieRedeem"
            }));
        };

        // Handle incoming data
        ws.onmessage = (event) => {
            const response = JSON.parse(event.data);
            if (response.event && response.event.type === "Custom") {
                const data = response.data;
                if (data.eventName === "CookieRedeem") {
                    triggerBreakingAlert(data);
                }
            }
        };

        function triggerBreakingAlert(data) {
            // Cancel any pending hide action
            if (hideTimer) clearTimeout(hideTimer);

            // 1. Update Content
            userDisplay.innerText = data.user;
            countDisplay.innerText = data.count;
            avatarImg.src = data.avatar || 'https://static-cdn.jtvnw.net/user-default-pictures-uv/cdd517ae-def4-11e9-948e-784f43822e80-profile_image-300x300.png';

            // 2. Play Animation
            wrapper.classList.add('active');

            // 3. Reset after 8 seconds
            hideTimer = setTimeout(() => {
                wrapper.classList.remove('active');
            }, 8000);
        }
    </script>
</body>
</html>
